<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>抽獎核銷系統 | 門市 POS 兌換平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" />
<style>
:root{
  --background:oklch(0.17 0.024 259);
  --foreground:oklch(0.97 0.006 250);
  --card:oklch(0.225 0.028 260);
  --primary:oklch(0.78 0.17 68);
  --primary-foreground:oklch(0.2 0.03 60);
  --secondary:oklch(0.29 0.03 260);
  --secondary-foreground:oklch(0.96 0.006 250);
  --muted:oklch(0.27 0.028 260);
  --muted-foreground:oklch(0.7 0.025 258);
  --accent:oklch(0.78 0.14 195);
  --destructive:oklch(0.63 0.22 25);
  --success:oklch(0.75 0.17 156);
  --border:oklch(1 0 0 / 10%);
  --input:oklch(1 0 0 / 14%);
  --surface-glow:0 0 0 1px oklch(1 0 0 / 6%), 0 24px 60px -20px oklch(0 0 0 / 60%);
  --gradient-tech:linear-gradient(135deg, oklch(0.78 0.17 68), oklch(0.72 0.16 40));
  --gradient-panel:linear-gradient(160deg, oklch(0.24 0.03 262), oklch(0.2 0.026 258));
  --radius:1.25rem;
}
*{box-sizing:border-box;margin:0;padding:0;border-color:var(--border)}

html { overflow-x: hidden; }
body {
  height: 100%;
  width: 100%;
  overflow-x: hidden;
  position: relative;
  background: var(--background);
  color: var(--foreground);
  font-family: "Space Grotesk","Noto Sans TC",system-ui,sans-serif;
  -webkit-font-smoothing: antialiased;
}

main {
  min-height: 100vh;
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
  background-image:
    radial-gradient(circle at 15% 10%, oklch(0.78 0.17 68 / 12%), transparent 45%),
    radial-gradient(circle at 85% 0%, oklch(0.78 0.14 195 / 12%), transparent 40%),
    linear-gradient(oklch(1 0 0 / 3%) 1px, transparent 1px),
    linear-gradient(90deg, oklch(1 0 0 / 3%) 1px, transparent 1px);
  background-size: auto,auto,44px 44px,44px 44px;
}

.wrap { max-width: 1400px; margin: 0 auto; width: 100%; padding: 20px 16px; }
@media(min-width:768px){.wrap{padding:32px}}

header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:16px}
.logo{width:56px;height:56px;display:flex;align-items:center;justify-content:center;border-radius:18px;font-size:26px;
  background-image:var(--gradient-tech);color:var(--primary-foreground);box-shadow:0 12px 30px -12px oklch(0 0 0/.8);
  transition:transform .3s}
.logo:hover{transform:scale(1.05)}
h1{font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-.02em}
.sub{font-size:14px;color:var(--muted-foreground)}
.panel{background-image:var(--gradient-panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--surface-glow); width: 100%;}
.status{display:flex;align-items:center;gap:12px;padding:10px 16px;font-size:14px}
.dot{position:relative;display:inline-flex;width:10px;height:10px;flex-shrink:0;}
.dot i{position:absolute;inset:0;border-radius:999px;background:var(--success)}
.dot i:first-child{opacity:.7;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}

.grid { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); width: 100%; }
@media(min-width:1024px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}}

section.panel{padding:20px}
@media(min-width:768px){section.panel{padding:24px}}
.rise{animation:rise .45s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.block+.block{margin-top:24px}
.label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.2em;color:var(--muted-foreground);margin-bottom:12px}
.stores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px; width: 100%;}
@media(min-width:640px){.stores{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* 門市下拉選單樣式 */
.custom-dropdown { position: relative; width: 100%; }
.custom-dropdown summary {
  list-style: none; width: 100%; min-height: 64px; border-radius: 14px; border: 1px solid var(--border);
  background: var(--secondary); color: var(--foreground); font-size: 18px; font-weight: 700;
  display: flex; align-items: center; justify-content: space-between; padding: 0 20px; cursor: pointer;
  outline: none; transition: all 0.2s;
}
.custom-dropdown summary:hover { background: var(--muted); }
.custom-dropdown summary::-webkit-details-marker { display: none; }
.custom-dropdown summary::after { content: "▼"; font-size: 14px; color: var(--muted-foreground); }
.custom-dropdown[open] summary::after { content: "▲"; }
.custom-dropdown[open] summary { border-color: var(--primary); box-shadow: 0 0 0 2px oklch(0.78 0.17 68/.2); }
.dropdown-content {
  margin-top: 12px; padding: 16px; border-radius: 14px; border: 1px solid var(--border);
  background: var(--card); box-shadow: 0 10px 40px -10px rgba(0,0,0,0.6);
}

button{font-family:inherit;cursor:pointer;}
.store-btn{width:100%;min-height:56px;border-radius:12px;border:1px solid var(--border);background:var(--secondary);color:var(--secondary-foreground);
  font-size:16px;font-weight:600;transition:all .2s; padding: 0 8px;}
.store-btn:hover{background:var(--muted);border-color:oklch(0.78 0.17 68/.6)}
.store-btn:active{transform:scale(.97)}
.store-btn.on{background-image:var(--gradient-tech);color:var(--primary-foreground);border-color:var(--primary);box-shadow:0 12px 26px -14px oklch(0 0 0/.9)}

.acts{display:flex;flex-direction:column;gap:10px; width:100%;}
.act-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:0 20px;text-align:left;
  border-radius:14px;border:1px solid var(--border);background:var(--secondary);color:var(--foreground);transition:all .2s;}
.act-btn:hover{background:var(--muted);border-color:oklch(0.78 0.14 195/.5)}
.act-btn:active{transform:scale(.99)}
.act-btn.on{border-color:var(--accent);background:oklch(0.78 0.14 195/.15)}
.act-name{display:block;font-size:18px;font-weight:600}
.radio{width:16px;height:16px;border-radius:999px;border:2px solid var(--muted-foreground);flex:none; transition: .2s;}
.act-btn.on .radio{border-color:var(--accent);background:var(--accent); box-shadow: 0 0 0 4px oklch(0.78 0.14 195/.2);}
.empty{border:1px dashed var(--border);border-radius:14px;padding:24px;text-align:center;font-size:14px;color:var(--muted-foreground)}

.searchbar{display:flex;flex-direction:column;gap:10px; width: 100%;}
.searchbar > button { width: 100%; }
@media(min-width:640px){
  .searchbar { flex-direction: row; }
  .searchbar > button { width: auto; flex-shrink: 0; }
  #btn-scan { width: 80px; }
  #btn-check { min-width: 120px; }
}

#phone{flex:1;min-height:64px;border-radius:14px;border:1px solid var(--input);background:oklch(0.17 0.024 259/.6);
  color:var(--foreground);padding:0 16px;font-size:20px;font-weight:600;letter-spacing:.08em;outline:none;transition:all .2s; width: 100%; min-width: 0;}
#phone::placeholder{font-size:15px;font-weight:400;letter-spacing:normal;color:var(--muted-foreground)}
#phone:focus{border-color:var(--primary);box-shadow:0 0 0 4px oklch(0.78 0.17 68/.25)}
.icon-btn{min-height:64px;padding:0 20px;font-size:24px;border-radius:14px;border:1px solid var(--border);background:var(--secondary);color:var(--foreground);transition:all .2s}
.icon-btn:hover{background:var(--muted)}
.icon-btn:active{transform:scale(.95)}
.primary-btn{min-height:64px;padding:0 28px;font-size:18px;font-weight:700;border:none;border-radius:14px;
  background-image:var(--gradient-tech);color:var(--primary-foreground);box-shadow:0 14px 30px -16px oklch(0 0 0/.9);transition:all .2s}
.primary-btn:hover{filter:brightness(1.1)}
.primary-btn:active{transform:scale(.95)}
button:disabled{opacity:.5;cursor:not-allowed}

/* 全螢幕掃描器樣式 */
#scan-area{
  position: fixed; inset: 0; z-index: 9999; 
  background: rgba(10, 12, 16, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
  display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px;
}
#scan-area.hidden{display:none !important}
.reader-wrap{
  width: 100%; max-width: 450px; border-radius: 24px; border: 2px solid var(--primary);
  overflow: hidden; position: relative; box-shadow: 0 0 50px rgba(255, 107, 53, 0.25);
}
#reader{width:100%}
.scanline{position:absolute;left:0;right:0;top:0;height:4px;background:var(--primary);pointer-events:none;animation:scan 2s linear infinite; box-shadow: 0 0 10px var(--primary);}
@keyframes scan{0%{top:0}100%{top:100%}}
.close-cam{
  margin-top: 32px; width: 100%; max-width: 450px; min-height: 72px; border-radius: 999px;
  font-size: 18px; font-weight: 700; color: #fff; border: none;
  background: var(--destructive); box-shadow: 0 10px 25px -10px rgba(255, 0, 0, 0.6);
  transition: transform .2s, filter .2s;
}
.close-cam:active{transform:scale(.95)}

.right{display:flex;flex-direction:column}
.placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:80px 0}
.placeholder .emoji{font-size:60px;opacity:.4}
.placeholder p{color:var(--muted-foreground)}
.placeholder .p1{font-size:18px;font-weight:600}
.placeholder .p2{font-size:14px;max-width:22rem;opacity:.7; padding: 0 10px;}
.detail{flex:1;display:flex;flex-direction:column;gap:20px}
.banner{border-radius:18px;padding:16px 20px;font-size:18px;font-weight:700;border:1px solid; word-break: break-all;}
.banner.ok{border-color:oklch(0.75 0.17 156/.5);background:oklch(0.75 0.17 156/.15);color:var(--success)}
.banner.bad{border-color:oklch(0.63 0.22 25/.5);background:oklch(0.63 0.22 25/.15);color:var(--destructive)}
.banner small{display:block;font-size:14px;font-weight:500;opacity:.8;margin-top:4px}
.cards{display:grid;gap:12px; grid-template-columns: minmax(0, 1fr);}
@media(min-width:640px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.info{border:1px solid var(--border);background:oklch(0.29 0.03 260/.6);border-radius:18px;padding:14px 16px;transition:transform .2s; width: 100%;}
.info:hover{transform:translateY(-2px)}
.info.hl{border-color:oklch(0.78 0.17 68/.5);background:oklch(0.78 0.17 68/.1)}
.info .k{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.12em;color:var(--muted-foreground)}
.info .v{margin-top:4px;font-size:20px;font-weight:700; word-break: break-all;}
.info .v.mono{letter-spacing:.08em}
.actions{margin-top:auto;padding-top:8px;display:flex;flex-direction:column;gap:12px; width: 100%;}
.redeem{min-height:96px;width:100%;border:none;border-radius:18px;font-size:28px;font-weight:900;letter-spacing:.04em;
  background-image:var(--gradient-tech);color:var(--primary-foreground);box-shadow:0 26px 50px -22px oklch(0 0 0/1);transition:all .2s}
.redeem:hover{transform:translateY(-2px);filter:brightness(1.1)}
.redeem:active{transform:scale(.98)}
.undo{min-height:64px;width:100%;border-radius:18px;font-size:20px;font-weight:700;color:var(--accent);
  border:1px solid oklch(0.78 0.14 195/.5);background:oklch(0.78 0.14 195/.15);transition:background .2s}
.undo:hover{background:oklch(0.78 0.14 195/.25)}
.next{min-height:64px;width:100%;border-radius:18px;font-size:18px;font-weight:600;color:var(--foreground);
  border:1px solid var(--border);background:var(--secondary);transition:all .2s}
.next:hover{background:var(--muted)}
.next:active{transform:scale(.98)}
.hidden{display:none !important}
</style>
</head>
<body>
<main>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">⚡</div>
        <div>
          <h1>抽獎核銷系統</h1>
          <p class="sub">Redemption POS · 內部測試區</p>
        </div>
      </div>
      <div class="panel status">
        <span class="dot"><i></i><i></i></span>
        <span style="color:var(--muted-foreground)">今日值班門市</span>
        <span id="duty" style="font-weight:600">尚未選擇</span>
      </div>
    </header>

    <div class="grid">
      <!-- LEFT -->
      <section class="panel rise">
        
        <!-- 門市下拉選單 -->
        <div class="block">
          <h2 class="label">● 選擇門市</h2>
          <details id="store-dropdown" class="custom-dropdown">
            <summary id="store-summary">請選擇門市...</summary>
            <div class="dropdown-content">
              <div class="stores" id="stores"></div>
            </div>
          </details>
        </div>

        <div class="block">
          <h2 class="label">● 活動選單</h2>
          <div id="acts"><p class="empty">正在從雲端載入活動...</p></div>
        </div>

        <div class="block">
          <h2 class="label">● 掃描 / 查詢</h2>
          <div class="searchbar">
            <input id="phone" type="tel" placeholder="輸入手機或市話 (例:02-1234567)" oninput="this.value=this.value.replace(/[^\d\-]/g,'').slice(0,15)" />
            <button class="icon-btn" id="btn-scan" aria-label="掃描 QR Code">📷</button>
            <button class="primary-btn" id="btn-check">查詢</button>
          </div>
        </div>
      </section>

      <!-- RIGHT -->
      <section class="panel rise right">
        <div id="placeholder" class="placeholder">
          <div class="emoji">🎟️</div>
          <p class="p1">等待掃描顧客憑證</p>
          <p class="p2">選擇門市與活動後，掃描 QR Code 或輸入手機號碼即可帶出顧客資訊。</p>
        </div>
        <div id="detail" class="detail hidden">
          <div id="banner" class="banner ok rise"></div>
          <div class="cards">
            <div class="info"><div class="k">📱 兌換手機</div><div class="v mono" id="v-phone">—</div></div>
            <div class="info"><div class="k">👤 顧客姓名</div><div class="v" id="v-name">—</div></div>
            <div class="info"><div class="k">🔗 社群帳號</div><div class="v" id="v-social">—</div></div>
            <div class="info hl"><div class="k">🎁 兌換餐點</div><div class="v" id="v-gift">—</div></div>
          </div>
          <div class="actions">
            <button class="redeem" id="btn-redeem">✔ 確認核銷優惠</button>
            <button class="undo hidden" id="btn-undo">⚡ 撤銷 (5s)</button>
            <button class="next" id="btn-next">🧹 清除／服務下一位</button>
          </div>
        </div>
      </section>
    </div>
  </div>
  
  <!-- 全螢幕掃描區 -->
  <div id="scan-area" class="hidden">
    <div class="reader-wrap">
      <div id="reader"></div>
      <div class="scanline"></div>
    </div>
    <button class="close-cam" id="btn-stop">✖ 關閉相機</button>
  </div>
</main>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBINQuYtYZA8RLfwm51AfGLTYj1TX_UcFo",
    authDomain: "texas-chick-event.firebaseapp.com",
    projectId: "texas-chick-event",
    storageBucket: "texas-chick-event.firebasestorage.app",
    messagingSenderId: "281248037440",
    appId: "1:281248037440:web:20c32ba4136ea7c57ffda5",
    measurementId: "G-HZ6334WB3B"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let STORE_LIST = [];
  let POS_CONFIG = {};
  let evMap = {};
  let giftMap = {};

  const $ = (id) => document.getElementById(id);
  let store = "", act = "", shownPhone = "", shownAct = "", record = null;
  let scanner = null, uTimer = null, busy = false;

  // 🔥 初始化：從雲端抓取系統設定（取代 config.js）
  async function initPOS() {
    try {
      const configSnap = await getDoc(doc(db, "system", "config"));
      if (configSnap.exists()) {
        const data = configSnap.data();
        STORE_LIST = data.STORE_LIST || [];
        POS_CONFIG = data.POS_CONFIG || {};
      } else {
        alert("⚠️ 雲端尚未建立系統設定，請先至總部後台儲存設定！");
        return;
      }

      // 建立對應對照表
      evMap = {};
      STORE_LIST.forEach(s => {
        evMap[s] = [];
        for (const a in POS_CONFIG) {
          const cfg = POS_CONFIG[a];
          if (cfg.stores === "ALL" || (Array.isArray(cfg.stores) && cfg.stores.includes(s))) {
            evMap[s].push(a);
          }
        }
      });

      giftMap = {};
      for (const a in POS_CONFIG) {
        giftMap[a] = POS_CONFIG[a].gift;
      }

      const saved = localStorage.getItem("p_store");
      if (saved && evMap[saved]) { 
        store = saved; 
        act = (evMap[saved] || [])[0] || ""; 
      } else if (STORE_LIST.length > 0) {
        store = STORE_LIST[0];
        act = (evMap[store] || [])[0] || "";
      }

      renderStores(); 
      renderActs(); 
      renderRight();

    } catch (e) {
      console.error("載入雲端設定失敗:", e);
      alert("無法連線至雲端讀取 POS 設定！");
    }
  }

  initPOS();

  function setBusy(b){
    busy = b;
    $("btn-check").disabled = b;
    $("btn-redeem").disabled = b;
    $("btn-check").innerText = b ? "查詢中…" : "查詢";
  }

  function renderStores(){
    const box = $("stores"); box.innerHTML = "";
    STORE_LIST.forEach((s) => {
      const b = document.createElement("button");
      b.className = "store-btn" + (store === s ? " on" : "");
      b.innerText = s;
      b.onclick = () => selectStore(s);
      box.appendChild(b);
    });
    $("duty").innerText = store || "尚未選擇";
    $("store-summary").innerText = store ? `已選擇：${store}` : "請選擇門市...";
  }

  function renderActs(){
    const box = $("acts"); box.innerHTML = "";
    if (!store){
      box.innerHTML = '<p class="empty">請先選擇門市</p>';
      return;
    }
    const currentEvs = evMap[store] || [];
    if(currentEvs.length === 0) {
      box.innerHTML = '<p class="empty">此門市目前無開放活動</p>';
      return;
    }

    const list = document.createElement("div");
    list.className = "acts";
    currentEvs.forEach((a) => {
      const b = document.createElement("button");
      b.className = "act-btn" + (act === a ? " on" : "");
      b.innerHTML = '<span><span class="act-name"></span></span><span class="radio"></span>';
      b.querySelector(".act-name").innerText = a;
      
      b.onclick = () => { 
        act = a; 
        renderActs(); 
        setTimeout(() => $("phone").focus(), 100); 
      };
      list.appendChild(b);
    });
    box.appendChild(list);
  }

  function selectStore(s){
    store = s;
    localStorage.setItem("p_store", s);
    act = (evMap[s] || [])[0] || "";
    record = null;
    $("store-dropdown").removeAttribute("open");
    renderStores(); renderActs(); renderRight();
    setTimeout(() => $("phone").focus(), 100);
  }

  function renderRight(){
    if (!record){
      $("placeholder").classList.remove("hidden");
      $("detail").classList.add("hidden");
      return;
    }
    $("placeholder").classList.add("hidden");
    $("detail").classList.remove("hidden");
    
    const isClaimed = record.status === "已兌換";
    const isExpired = record.status === "已過期";
    const isInvalid = isClaimed || isExpired; 

    const banner = $("banner");
    banner.className = "banner rise " + (isInvalid ? "bad" : "ok");
    
    if (isClaimed) {
      banner.innerHTML = "❌ 券已失效 / 已領取<small>📌 於 " + (record.store || "—") + " 兌換</small><small>🕒 " + (record.redeemTime || "—") + "</small>";
    } else if (isExpired) {
      banner.innerHTML = "⚠️ 券已逾期失效<small>🕒 系統已結算過期</small>";
    } else {
      banner.innerHTML = "✅ 有效優惠券";
    }

    $("v-phone").innerText = shownPhone;
    $("v-name").innerText = record.name || "—";
    $("v-social").innerText = record.social_id || "未提供";
    $("v-gift").innerText = record.gift || giftMap[shownAct] || "專屬活動贈品";
    $("btn-redeem").classList.toggle("hidden", isInvalid);
  }

  function renderContent(data, ph, ac){
    shownPhone = ph; shownAct = ac; record = data;
    hideUndo();
    renderRight();
  }
  function hideUndo(){
    if (uTimer) clearInterval(uTimer);
    $("btn-undo").classList.add("hidden");
  }

  let audioCtx = null;
  function playAlert(type){
    if (navigator.vibrate){
      if (type === "scan") navigator.vibrate([150]);
      if (type === "error") navigator.vibrate([300]);
      if (type === "success") navigator.vibrate([100,50,100,50,200]);
    }
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (!audioCtx) return;
    if (audioCtx.state === "suspended") audioCtx.resume();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === "scan"){
      osc.frequency.value = 1200; osc.type = "sine";
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === "error"){
      osc.frequency.value = 300; osc.type = "square";
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    } else {
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
      osc.type = "sine";
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
  }

  async function startScan(){
    $("scan-area").classList.remove("hidden");
    if (!scanner) scanner = new Html5Qrcode("reader");
    scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      (txt) => {
        const digits = txt.replace(/[^\d\-]/g, "");
        $("phone").value = digits;
        stopScan();
        check(digits);
      },
      () => {}
    ).catch(() => alert("無相機權限或裝置不支援相機！"));
  }
  function stopScan(){
    if (scanner && scanner.isScanning) scanner.stop();
    $("scan-area").classList.add("hidden");
  }

  async function check(overridePhone){
    const ph = overridePhone || $("phone").value;
    const st = store, ac = act;
    if (!st || !ac || !ph) return alert("⚠️ 資料未齊！");

    record = null; renderRight();
    setBusy(true);
    try {
      const snap = await getDoc(doc(db, ac, ph));
      if (snap.exists()){
        playAlert("scan");
        renderContent(snap.data(), ph, ac);
        return;
      }
      const otherActs = (evMap[st] || []).filter((a) => a !== ac);
      let foundOtherData = null, foundOtherActName = "";
      for (const otherAct of otherActs){
        const otherSnap = await getDoc(doc(db, otherAct, ph));
        if (otherSnap.exists()){
          const data = otherSnap.data();
          if (data.status !== "已兌換"){ foundOtherData = data; foundOtherActName = otherAct; break; }
        }
      }
      if (foundOtherData){
        playAlert("error");
        if (confirm("❌ 找不到「" + ac + "」的紀錄。\n\n💡 但發現客人有未兌換的「" + foundOtherActName + "」，是否要自動切換過去？")){
          act = foundOtherActName;
          renderActs();
          renderContent(foundOtherData, ph, foundOtherActName);
        } else {
          $("phone").value = "";
        }
      } else {
        playAlert("error");
        alert("❌ 查無號碼，或該客人的所有活動皆已兌換完畢！");
        $("phone").value = "";
      }
    } finally {
      setBusy(false);
    }
  }

  async function redeem(){
    if (!confirm("確定核銷？憑證將失效！")) return;
    const ph = shownPhone, st = store, ac = act;
    const d = new Date(), pad = (n) => (n < 10 ? "0" + n : String(n));
    const nowStr = d.getFullYear() + "/" + pad(d.getMonth()+1) + "/" + pad(d.getDate()) + " " +
                   pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    setBusy(true);
    try {
      await updateDoc(doc(db, ac, ph), { status: "已兌換", store: st, redeemTime: nowStr });
    } finally {
      setBusy(false);
    }
    record = Object.assign({}, record || {}, { status: "已兌換", store: st, redeemTime: nowStr });
    renderRight();
    playAlert("success");
    if (window.confetti) confetti({ particleCount: 80, spread: 70 });

    const btn = $("btn-undo");
    btn.classList.remove("hidden");
    let left = 5;
    btn.innerText = "⚡ 撤銷 (" + left + "s)";
    if (uTimer) clearInterval(uTimer);
    uTimer = setInterval(() => {
      left -= 1;
      if (left <= 0){ clearInterval(uTimer); btn.classList.add("hidden"); }
      else btn.innerText = "⚡ 撤銷 (" + left + "s)";
    }, 1000);
  }

  async function undo(){
    if (uTimer) clearInterval(uTimer);
    const ph = shownPhone, ac = act;
    setBusy(true);
    try {
      await updateDoc(doc(db, ac, ph), { status: "", store: "", redeemTime: "" });
    } finally {
      setBusy(false);
    }
    $("btn-undo").classList.add("hidden");
    alert("✅ 已撤銷！");
    check(ph);
  }

  function nextCust(){
    $("phone").value = "";
    record = null;
    hideUndo();
    renderRight();
    setTimeout(() => $("phone").focus(), 100);
  }

  $("btn-scan").onclick = startScan;
  $("btn-stop").onclick = stopScan;
  $("btn-check").onclick = () => check();
  $("btn-redeem").onclick = redeem;
  $("btn-undo").onclick = undo;
  $("btn-next").onclick = nextCust;
  $("phone").addEventListener("keydown", (e) => { if (e.key === "Enter") check(); });
</script>
</body>
</html>
