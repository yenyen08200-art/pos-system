<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>德州小騎士 | 門市 POS 核銷與點數系統</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700;900&display=swap" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --background:oklch(0.17 0.024 259); --foreground:oklch(0.97 0.006 250);
  --card:oklch(0.225 0.028 260); --primary:oklch(0.78 0.17 68);
  --secondary:oklch(0.29 0.03 260); --muted:oklch(0.27 0.028 260);
  --muted-foreground:oklch(0.7 0.025 258); --accent-digital: #00C6FF;
  --gradient-digital: linear-gradient(135deg, #00C6FF, #0072FF);
  --accent-physical: #FF6B35; --gradient-physical: linear-gradient(135deg, #FF6B35, #F04323);
  --accent-counter: #3FBF8F; --gradient-counter: linear-gradient(135deg, #3FBF8F, #2A8C66);
  --accent-member: #F2A900; --gradient-member: linear-gradient(135deg, #F2A900, #FFC72C);
  --success:oklch(0.75 0.17 156); --border:oklch(1 0 0 / 10%); --radius:1.25rem;
}
*{box-sizing:border-box;margin:0;padding:0;border-color:var(--border)}
body { background: var(--background); color: var(--foreground); font-family: "Space Grotesk","Noto Sans TC",sans-serif; -webkit-font-smoothing: antialiased; }

main { min-height: 100vh; background-image: radial-gradient(circle at 15% 10%, rgba(242,169,0,0.1), transparent 45%); }
body.mode-physical-active main { background-image: radial-gradient(circle at 15% 10%, rgba(255,107,53,0.12), transparent 45%); }
body.mode-counter-active main { background-image: radial-gradient(circle at 15% 10%, rgba(63,191,143,0.12), transparent 45%); }

.wrap { max-width: 1400px; margin: 0 auto; width: 100%; padding: 20px 16px; }
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:16px}
.logo{width:56px;height:56px;display:flex;align-items:center;justify-content:center;border-radius:18px;font-size:26px; background-image:var(--gradient-member);color:#1E293B;}
body.mode-physical-active .logo { background-image: var(--gradient-physical); color: #fff; }
body.mode-counter-active .logo { background-image: var(--gradient-counter); color: #fff;}
h1{font-size:24px;font-weight:700;}
.panel{background:linear-gradient(160deg, oklch(0.24 0.03 262), oklch(0.2 0.026 258));border:1px solid var(--border);border-radius:var(--radius); width: 100%; padding:20px;}

.grid { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); width: 100%; }
@media(min-width:1024px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}}

.label{font-size:12px;font-weight:600;letter-spacing:.2em;color:var(--muted-foreground);margin-bottom:12px; display: block;}
.custom-dropdown summary { width: 100%; min-height: 56px; border-radius: 14px; background: var(--secondary); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; cursor: pointer; border: 1px solid var(--border); font-weight: bold;}
.dropdown-content { margin-top: 10px; padding: 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); position: absolute; z-index: 50; width: calc(100% - 32px); max-width: 400px;}
.stores{display:grid;grid-template-columns:repeat(2, 1fr);gap:10px;}
.store-btn{min-height:48px;border-radius:12px;background:var(--secondary);color:#fff;border:1px solid var(--border);font-weight:600; cursor: pointer;}
.store-btn.on{background:var(--gradient-digital); border-color:var(--accent-digital);}

.mode-switch { display: flex; gap: 8px; padding: 6px; background: var(--secondary); border-radius: 16px; margin-bottom: 20px;}
.mode-btn { flex: 1; padding: 14px 0; border-radius: 12px; border: none; background: transparent; color: var(--muted-foreground); font-weight: 700; font-size: 15px; transition: 0.2s; cursor: pointer;}
#mode-member.active { background: var(--gradient-member); color: #1E293B; }
#mode-physical.active { background: var(--gradient-physical); color: #fff; }
#mode-counter.active { background: var(--gradient-counter); color: #fff; }

.acts{display:flex;flex-direction:column;gap:10px; margin-bottom: 20px;}
.act-btn{width:100%;text-align:left;padding:16px 20px;border-radius:14px;border:1px solid var(--border);background:var(--secondary);color:#fff;font-size:16px;font-weight:600; cursor: pointer;}
.act-btn.on{border-color:var(--accent-physical);background:rgba(255,107,53,0.15);}
body.mode-counter-active .act-btn.on { border-color: var(--accent-counter); background: rgba(63,191,143,0.15); }

#phone{width:100%;min-height:56px;border-radius:14px;border:1px solid var(--border);background:rgba(0,0,0,0.2);color:#fff;padding:0 16px;font-size:18px;font-weight:bold; outline:none;}
#phone:focus{border-color:var(--accent-member);}
body.mode-physical-active #phone:focus{border-color:var(--accent-physical);}

.searchbar{display:flex; gap:10px;}
.icon-btn{width:64px; border-radius:14px;background:var(--secondary);color:#fff;border:1px solid var(--border);font-size:20px;cursor:pointer;}
.primary-btn{flex:1; border-radius:14px;background:var(--gradient-member);color:#1E293B;border:none;font-weight:bold;font-size:16px;cursor:pointer;}
body.mode-physical-active .primary-btn { background: var(--gradient-physical); color: #fff; }

#employee-name{width:100%; min-height:56px; border-radius:12px; border:1px solid var(--border); background:var(--secondary); color:#fff; padding:0 16px; font-size:16px; margin-bottom: 20px; outline:none;}

/* 🔥 右側畫面設計 */
.right { display:flex;flex-direction:column; justify-content:center; align-items:center; text-align:center;}
.hidden { display: none !important; }

/* 會員模式專區 (合併優惠券) */
.member-area { width: 100%; text-align: left; }
.member-card { background: linear-gradient(145deg, rgba(242,169,0,0.1), rgba(255,199,44,0.05)); border: 1px solid var(--accent-member); border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 20px;}
.member-pts { font-size: 56px; font-weight: 900; color: var(--accent-member); margin: 10px 0;}
.pts-input-group { display: flex; gap: 10px; margin-top: 15px;}
.pts-input-group input { flex: 1; background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: #fff; font-size: 18px; padding: 0 16px; border-radius: 12px; text-align: right; outline: none;}
.pts-btn { background: var(--gradient-member); color: #1E293B; font-weight: bold; border: none; padding: 0 20px; border-radius: 12px; cursor: pointer;}

.section-title { font-size: 16px; color: var(--accent-member); margin-bottom: 10px; font-weight: bold; display: flex; align-items: center; gap: 8px;}
.coupon-item { background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 12px 16px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;}
.coupon-btn { background: var(--gradient-member); color: #1E293B; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer;}

.reward-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 16px; border-radius: 12px; margin-bottom: 10px; transition: 0.2s;}
.reward-item.can-redeem { cursor: pointer; }
.reward-item.can-redeem:hover { border-color: var(--accent-member); background: rgba(242,169,0,0.1);}
.reward-item.disabled { opacity: 0.4; filter: grayscale(1); }

.next{min-height:56px;width:100%;border-radius:14px;font-size:16px;font-weight:600;color:#fff; background:var(--secondary); border:none; margin-top: 20px; cursor: pointer;}

/* 實體券核銷畫面 */
.banner{border-radius:18px;padding:16px 20px;font-size:18px;font-weight:700;border:1px solid; margin-bottom: 20px;}
.banner.ok{border-color:var(--success); background:rgba(63,191,143,0.1); color:var(--success)}
.banner.bad{border-color:var(--destructive); background:rgba(255,50,50,0.1); color:var(--destructive)}
.info-box { background: var(--secondary); border: 1px solid var(--border); padding: 16px; border-radius: 16px; margin-bottom: 20px; text-align: left;}

/* 計數器模式 */
.giant-count { font-size: 80px; font-weight: 900; color: var(--success); margin: 20px 0; font-family: monospace;}
.giant-btn { width: 100%; min-height: 120px; border-radius: 20px; font-size: 28px; font-weight: 900; border: none; background: var(--gradient-counter); color: #fff; cursor: pointer; }
.giant-btn:disabled { background: var(--secondary); color: var(--muted-foreground); cursor: not-allowed; }

#toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10000; padding: 16px 24px; border-radius: 999px; font-weight: bold; background: rgba(0,0,0,0.8); border: 1px solid var(--border); display: none;}
#scan-area{ position: fixed; inset: 0; z-index: 9999; background: rgba(10, 12, 16, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; }
#reader{width:100%; max-width: 450px; border-radius: 12px; overflow: hidden; }
.close-cam{ margin-top: 40px; width: 100%; max-width: 450px; min-height: 64px; border-radius: 999px; font-size: 16px; font-weight: 700; color: #fff; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); cursor: pointer;}
</style>
</head>
<body>

<div id="toast-container"><span id="toast-msg">系統訊息</span></div>

<main>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">⚡</div>
        <div>
          <h1>店員核銷端</h1>
          <p class="sub">Point of Sale</p>
        </div>
      </div>
      <div style="background: rgba(255,255,255,0.05); padding: 8px 16px; border-radius: 12px; font-size: 14px;">
        門市：<span id="duty" style="font-weight:bold; color:var(--accent-member);">尚未選擇</span>
      </div>
    </header>

    <div class="grid">
      <!-- LEFT -->
      <section class="panel rise">
        <details id="store-dropdown" class="custom-dropdown" style="margin-bottom: 20px;">
          <summary id="store-summary">選擇門市...</summary>
          <div class="dropdown-content"><div class="stores" id="stores"></div></div>
        </details>

        <span class="label">值班人員 (必填)</span>
        <input id="employee-name" type="text" placeholder="輸入姓名或代號">

        <span class="label">系統模式 (精簡版)</span>
        <div class="mode-switch">
          <button id="mode-member" class="mode-btn active" onclick="setMode('member')">👤 會員 / 優惠</button>
          <button id="mode-physical" class="mode-btn" onclick="setMode('physical')">🎫 實體券</button>
          <button id="mode-counter" class="mode-btn" onclick="setMode('counter')">🎁 限量品</button>
        </div>

        <div id="act-block" class="hidden">
          <span class="label">選擇活動 / 贈品</span>
          <div id="acts"></div>
        </div>

        <div id="scan-block">
          <span class="label" id="scan-label">掃描會員</span>
          <div class="searchbar">
            <input id="phone" type="tel" placeholder="輸入手機號碼" autocomplete="off" />
            <button class="icon-btn" id="btn-scan" aria-label="掃描 QR Code">📷</button>
            <button class="primary-btn" id="btn-check" onclick="check()">查詢</button>
          </div>
        </div>
      </section>

      <!-- RIGHT -->
      <section class="panel rise right">
        <!-- 預設畫面 -->
        <div id="placeholder">
          <h2 style="color: var(--muted-foreground); margin-top: 40px;">等待掃描...</h2>
          <p style="color: var(--muted-foreground); font-size: 14px; margin-top: 10px;">請先選擇門市與人員，再輸入號碼。</p>
        </div>

        <!-- 載入中 -->
        <div id="loading-area" class="hidden">
          <h2 style="color: var(--accent-member); margin-top: 40px;"><i class="fa-solid fa-spinner fa-spin"></i> 雲端讀取中...</h2>
        </div>
        
        <!-- 會員模式畫面 (包含點數 & 優惠券) -->
        <div id="member-area" class="member-area hidden">
          <div class="member-card">
            <div style="font-size: 12px; color: var(--muted-foreground); font-weight: bold;">MEMBER POINTS</div>
            <div class="member-pts" id="m-pts">0</div>
            <div style="font-size: 18px; font-weight: bold; color: #fff;">👤 <span id="m-name"></span></div>
            <div style="font-family: monospace; color: var(--muted-foreground); margin-top: 4px;" id="m-phone"></div>
            
            <div style="border-top: 1px dashed rgba(255,255,255,0.1); margin-top: 20px; padding-top: 15px;">
              <div style="font-size: 13px; color: var(--muted-foreground); margin-bottom: 5px; text-align: left;">💰 輸入消費總額給點 (<span id="rate-hint">100</span>元/點)</div>
              <div class="pts-input-group">
                <input type="number" id="consume-amount" placeholder="NT$ 0" oninput="calcPoints()">
                <button class="pts-btn" id="btn-add-pts" onclick="addPoints()">送出 <span id="pts-preview"></span></button>
              </div>
            </div>
          </div>

          <h3 class="section-title"><i class="fa-solid fa-ticket"></i> 客人擁有的活動票券</h3>
          <div id="user-coupons-list" style="margin-bottom: 20px;"></div>

          <h3 class="section-title"><i class="fa-solid fa-gift"></i> 點數兌換商品區</h3>
          <div id="reward-list"></div>

          <button class="next" onclick="nextCust()">🧹 完成／服務下一位</button>
        </div>

        <!-- 實體券畫面 -->
        <div id="detail" class="member-area hidden">
          <div id="banner" class="banner ok"></div>
          <div class="info-box">
            <div style="font-size: 12px; color: var(--muted-foreground);">實體流水號</div>
            <div style="font-size: 20px; font-weight: bold; margin-bottom: 10px;" id="v-phone"></div>
            <div style="font-size: 12px; color: var(--muted-foreground);">兌換品項 (請核對紙本)</div>
            <div style="font-size: 22px; font-weight: 900; color: var(--accent-physical);" id="v-gift"></div>
          </div>
          <button class="primary-btn" id="btn-redeem" style="width: 100%; min-height: 80px; font-size: 24px;" onclick="redeemPhysical()">確認核銷實體券</button>
          <button class="next" onclick="nextCust()">🧹 清除／下一位</button>
        </div>

        <!-- 限量品畫面 -->
        <div id="counter-area" class="hidden" style="width: 100%;">
          <div style="font-weight:bold; color:var(--muted-foreground);">門市專屬配額剩餘</div>
          <div class="giant-count" id="c-count">--</div>
          <button id="btn-tally" class="giant-btn" onclick="deductTally()">🎁 發出 1 件</button>
        </div>

      </section>
    </div>
  </div>
  
  <div id="scan-area" class="hidden">
    <div id="reader"></div>
    <button class="close-cam" id="btn-stop">✖ 關閉相機</button>
  </div>
</main>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBINQuYtYZA8RLfwm51AfGLTYj1TX_UcFo",
    authDomain: "texas-chick-event.firebaseapp.com",
    projectId: "texas-chick-event",
    storageBucket: "texas-chick-event.firebasestorage.app"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const $ = (id) => document.getElementById(id);
  
  let STORE_LIST = [], EVENT_ORDER = [], REWARDS_LIST = [], GIFT_LIST = [];
  let POINT_RATE = 100;
  let POS_CONFIG = {};
  
  let store = "", act = "", shownPhone = "", memberRecord = null;
  let currentMode = 'member', currentCount = 0, unsubCounter = null;
  let physicalRecord = null;
  let scanner = null;

  window.showToast = function(msg) {
      $('toast-msg').innerText = msg;
      $('toast-container').style.display = 'block';
      setTimeout(() => $('toast-container').style.display = 'none', 3000);
  };

  $("employee-name").addEventListener("change", e => localStorage.setItem("p_employee", e.target.value.trim()));

  async function initPOS() {
    try {
      const snap = await getDoc(doc(db, "system", "config"));
      if (snap.exists()) {
        const data = snap.data();
        STORE_LIST = data.STORE_LIST || [];
        POS_CONFIG = data.POS_CONFIG || {};
        EVENT_ORDER = data.EVENT_ORDER || [];
        REWARDS_LIST = data.REWARDS_LIST || [];
        GIFT_LIST = data.GIFT_LIST || [];
        POINT_RATE = data.POINT_RATE || 100;
        $('rate-hint').innerText = POINT_RATE;
      }

      const savedStore = localStorage.getItem("p_store");
      if (savedStore && STORE_LIST.includes(savedStore)) store = savedStore;
      else if (STORE_LIST.length > 0) store = STORE_LIST[0];

      const savedEmp = localStorage.getItem("p_employee");
      if(savedEmp) $("employee-name").value = savedEmp;

      renderStores();
      setMode('member'); 
    } catch (e) { showToast("無法連線至雲端讀取設定！"); }
  }

  function renderStores(){
    const box = $("stores"); box.innerHTML = "";
    STORE_LIST.forEach((s) => {
      const b = document.createElement("button");
      b.className = "store-btn" + (store === s ? " on" : "");
      b.innerText = s;
      b.onclick = () => selectStore(s);
      box.appendChild(b);
    });
    $("duty").innerText = store || "尚未選擇";
    $("store-summary").innerText = store ? `已選擇：${store}` : "請選擇門市...";
  }

  function selectStore(s){
    store = s; localStorage.setItem("p_store", s);
    $("store-dropdown").removeAttribute("open");
    renderStores(); setMode(currentMode);
  }

  window.setMode = function(m) {
    currentMode = m;
    ['member', 'physical', 'counter'].forEach(type => {
      $(`mode-${type}`).classList.toggle('active', m === type);
      document.body.classList.toggle(`mode-${type}-active`, m === type);
    });
    
    $('phone').value = '';
    nextCust(); // 重置畫面與變數，解決殘影 Bug

    if (m === 'member') {
      $('act-block').classList.add('hidden');
      $('scan-block').classList.remove('hidden');
      $('phone').placeholder = '輸入手機號碼 (限10碼)';
      $('scan-label').innerText = "● 掃描 / 查詢會員";
    } else if (m === 'physical') {
      $('act-block').classList.remove('hidden');
      $('scan-block').classList.remove('hidden');
      $('phone').placeholder = '輸入流水號';
      $('scan-label').innerText = "● 輸入實體券號";
      renderActs();
    } else if (m === 'counter') {
      $('act-block').classList.remove('hidden');
      $('scan-block').classList.add('hidden');
      renderActs();
    }
  };

  function renderActs() {
    const box = $("acts"); box.innerHTML = "";
    if (!store) { box.innerHTML = '<p style="color:var(--muted-foreground)">請先選擇門市</p>'; return; }
    
    let list = [];
    if (currentMode === 'physical') {
      list = EVENT_ORDER.filter(a => (a.includes('【實體】') || a.includes('實體券')) && POS_CONFIG[a]?.active !== false);
    } else if (currentMode === 'counter') {
      list = GIFT_LIST;
    }

    if(list.length === 0) { box.innerHTML = '<p style="color:var(--muted-foreground)">無可用項目</p>'; act = ""; return; }
    if(!list.includes(act)) act = list[0];

    list.forEach(a => {
      const b = document.createElement("button");
      b.className = "act-btn" + (act === a ? " on" : "");
      b.innerText = a;
      b.onclick = () => { act = a; renderActs(); if(currentMode === 'counter') loadCounter(); };
      box.appendChild(b);
    });

    if(currentMode === 'counter') loadCounter();
  }

  function loadCounter() {
    if(!store || !act) return;
    if(unsubCounter) unsubCounter();
    $('c-count').innerText = "...";
    $('btn-tally').disabled = true;
    
    unsubCounter = onSnapshot(doc(db, "inventory", `${store}_${act}`), (d) => {
      if(d.exists()) {
        currentCount = d.data().count;
        $('c-count').innerText = currentCount;
        $('btn-tally').disabled = currentCount <= 0;
        $('btn-tally').innerText = currentCount <= 0 ? "庫存已用盡" : "🎁 發出 1 件";
      } else {
        $('c-count').innerText = "未設配額"; 
        $('btn-tally').disabled = true;
      }
    });
  }

  window.deductTally = async function() {
    if(currentCount <= 0) return;
    const empName = $("employee-name").value.trim();
    if(!empName) return showToast("請先填寫值班人員姓名！");

    $('btn-tally').disabled = true;
    try {
      await updateDoc(doc(db, "inventory", `${store}_${act}`), { count: increment(-1), usedCount: increment(1) });
      showToast("✅ 已成功發放！");
      setTimeout(() => { if(currentCount > 0) $('btn-tally').disabled = false; }, 1000);
    } catch(e) { showToast("扣除失敗！"); $('btn-tally').disabled = false; }
  };

  window.calcPoints = function() {
    const amount = parseInt($('consume-amount').value, 10);
    if(isNaN(amount) || amount <= 0) $('pts-preview').innerText = "";
    else $('pts-preview').innerText = `(+ ${Math.floor(amount / POINT_RATE)} 點)`;
  }

  window.addPoints = async function() {
    if(!memberRecord) return;
    const amount = parseInt($('consume-amount').value, 10);
    if(isNaN(amount) || amount < POINT_RATE) return showToast(`消費需達 ${POINT_RATE} 元以上！`);
    const empName = $("employee-name").value.trim();
    if(!empName) return showToast("請先填寫值班人員姓名！");

    const getPts = Math.floor(amount / POINT_RATE);
    $('btn-add-pts').disabled = true;

    try {
      await updateDoc(doc(db, "members", shownPhone), { points: increment(getPts) });
      memberRecord.points += getPts;
      $('m-pts').innerText = memberRecord.points;
      $('consume-amount').value = ''; $('pts-preview').innerText = '';
      showToast(`✅ 成功加入 ${getPts} 點！`);
      renderRewardsList();
    } catch(e) { showToast("連線失敗"); }
    finally { $('btn-add-pts').disabled = false; }
  }

  window.redeemReward = async function(giftName, reqPts) {
    if(memberRecord.points < reqPts) return;
    const empName = $("employee-name").value.trim();
    if(!empName) return showToast("請先填寫值班人員！");
    if(!confirm(`確定扣除 ${reqPts} 點兌換「${giftName}」？`)) return;

    try {
      await updateDoc(doc(db, "members", shownPhone), { points: increment(-reqPts) });
      
      await setDoc(doc(db, "point_transactions", new Date().getTime().toString()), {
        phone: shownPhone, type: "redeem", gift: giftName, points_spent: reqPts, store: store, empName: empName, time: new Date().toLocaleString()
      });

      memberRecord.points -= reqPts;
      $('m-pts').innerText = memberRecord.points;
      showToast(`✅ 已扣除 ${reqPts} 點`);
      renderRewardsList();
    } catch(e) { showToast("扣點失敗"); }
  }

  window.check = async function() {
    const ph = $("phone").value.trim().toUpperCase();
    if (!store) return showToast("請選擇門市！");
    if (!ph) return;

    $('placeholder').classList.add('hidden');
    $('member-area').classList.add('hidden');
    $('detail').classList.add('hidden');
    $('counter-area').classList.add('hidden');
    $('loading-area').classList.remove('hidden');

    if (currentMode === 'member') {
      try {
        const memSnap = await getDoc(doc(db, "members", ph));
        memberRecord = memSnap.exists() ? memSnap.data() : { points: 0, name: "非註冊會員" };
        shownPhone = ph;
        
        $('m-pts').innerText = memberRecord.points || 0;
        $('m-name').innerText = memberRecord.name || "非註冊會員";
        $('m-phone').innerText = ph;

        let digitalActs = EVENT_ORDER.filter(a => !a.includes('【實體】') && !a.includes('實體券') && POS_CONFIG[a]?.active !== false);
        let userCoupons = [];
        
        await Promise.all(digitalActs.map(async (a) => {
            const cSnap = await getDoc(doc(db, a, ph));
            if(cSnap.exists()) { let data = cSnap.data(); data.act_source = a; userCoupons.push(data); }
        }));

        renderMemberCoupons(userCoupons);
        renderRewardsList();
        
        $('loading-area').classList.add('hidden');
        $('member-area').classList.remove('hidden');
      } catch(e) { showToast("查詢失敗"); $('loading-area').classList.add('hidden'); $('placeholder').classList.remove('hidden'); }
      
    } else if (currentMode === 'physical') {
      if(!act) return showToast("請選擇活動！");
      try {
        const snap = await getDoc(doc(db, act, ph));
        $('loading-area').classList.add('hidden');
        
        if (snap.exists()){
          physicalRecord = snap.data(); shownPhone = ph;
          
          if(physicalRecord.status === '已兌換') {
             $('banner').className = 'banner bad'; $('banner').innerHTML = '❌ 券已核銷';
             $('btn-redeem').disabled = true; $('btn-redeem').innerText = '已核銷';
          } else {
             $('banner').className = 'banner ok'; $('banner').innerHTML = '✅ 有效實體券';
             $('btn-redeem').disabled = false; $('btn-redeem').innerText = '確認核銷實體券';
          }
          
          $('v-phone').innerText = ph;
          $('v-gift').innerText = physicalRecord.gift || "依紙本標示";
          $('detail').classList.remove('hidden');
        } else {
          showToast("查無此流水號！");
          $("phone").value = "";
          $('placeholder').classList.remove('hidden');
        }
      } catch(e) { showToast("查詢失敗"); }
    }
  }

  function renderMemberCoupons(coupons) {
     let html = '';
     if(coupons.length === 0) {
         html = '<p style="color:var(--muted-foreground); font-size:14px; padding:10px;">目前無可用優惠券</p>';
     } else {
         coupons.forEach(c => {
             const isRedeemed = c.status === '已兌換';
             const isExpired = c.status === '已過期';
             const gift = c.gift || POS_CONFIG[c.act_source]?.gift || '未設定';
             
             let btnHtml = '';
             if(isRedeemed) btnHtml = '<button disabled style="opacity:0.5; padding:8px 16px; border-radius:8px;">已核銷</button>';
             else if(isExpired) btnHtml = '<button disabled style="opacity:0.5; padding:8px 16px; border-radius:8px; background:red; color:white;">已過期</button>';
             else btnHtml = `<button class="coupon-btn" onclick="redeemCoupon('${c.act_source}', '${shownPhone}')">核銷</button>`;

             html += `<div class="coupon-item">
                <div>
                  <div style="font-size:12px; color:var(--accent-digital);">${c.act_source}</div>
                  <div style="font-weight:bold; font-size:15px; color:#fff;">${gift}</div>
                </div>
                <div>${btnHtml}</div>
             </div>`;
         });
     }
     $('user-coupons-list').innerHTML = html;
  }

  window.redeemCoupon = async function(actSource, phone) {
    const empName = $("employee-name").value.trim();
    if(!empName) return showToast("請填寫值班人員！");
    if(!confirm("確定核銷此張優惠券嗎？")) return;

    try {
      const nowStr = new Date().toLocaleString();
      await updateDoc(doc(db, actSource, phone), { status: "已兌換", store: store, redeemTime: nowStr, redeemBy: empName });
      showToast("✅ 優惠券核銷成功！");
      check(phone); // 重新整理畫面
    } catch(e) { showToast("核銷失敗"); }
  }

  window.redeemPhysical = async function() {
    const empName = $("employee-name").value.trim();
    if(!empName) return showToast("請填寫值班人員！");
    if(!confirm("確定核銷實體券？")) return;

    try {
      const nowStr = new Date().toLocaleString();
      await updateDoc(doc(db, act, shownPhone), { status: "已兌換", store: store, redeemTime: nowStr, redeemBy: empName });
      showToast("✅ 實體券核銷成功！");
      check(shownPhone);
    } catch(e) { showToast("核銷失敗"); }
  }

  function renderRewardsList() {
    const list = $('reward-list');
    list.innerHTML = "";
    if(!memberRecord) return;

    REWARDS_LIST.forEach(item => {
      const canRedeem = memberRecord.points >= item.points;
      const classStr = canRedeem ? "reward-item can-redeem" : "reward-item disabled";
      const clickEvt = canRedeem ? `onclick="redeemReward('${item.name}', ${item.points})"` : "";

      list.innerHTML += `
        <div class="${classStr}" ${clickEvt}>
          <div>
            <div style="font-weight: 700; font-size: 15px; margin-bottom: 4px; color:#fff;">${item.name}</div>
            <div style="font-size: 12px; color: var(--muted-foreground);">扣抵 <span style="font-weight:bold; color:var(--accent-member);">${item.points}</span> 點</div>
          </div>
          <div class="req-pts" style="background:${canRedeem ? 'var(--gradient-member)' : 'rgba(255,255,255,0.2)'};">${canRedeem ? '點擊兌換' : '點數不足'}</div>
        </div>
      `;
    });
  }

  window.nextCust = function() {
    $("phone").value = ""; memberRecord = null; physicalRecord = null;
    $('placeholder').classList.remove('hidden');
    $('member-area').classList.add('hidden');
    $('detail').classList.add('hidden');
    $('loading-area').classList.add('hidden');
  }

  // 掃描功能
  window.startScan = async function(){
    $("scan-area").classList.remove("hidden");
    if (!scanner) scanner = new Html5Qrcode("reader");
    scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (txt) => {
        let result = txt;
        if (currentMode === 'physical') result = txt.replace(/[^a-zA-Z0-9]/g, "").toUpperCase().slice(0,20); 
        else result = txt.replace(/[^\d]/g, "").slice(0,10); 
        $("phone").value = result;
        stopScan(); check(result);
      }, () => {}
    ).catch(() => { showToast("無法啟動相機！"); stopScan(); });
  }
  window.stopScan = function(){
    if (scanner && scanner.isScanning) scanner.stop();
    $("scan-area").classList.add("hidden");
  }

  $("btn-scan").onclick = startScan;
  $("btn-stop").onclick = stopScan;

  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && document.activeElement === $("phone")) {
        e.preventDefault(); check();
    } 
  });

  initPOS();
</script>
</body>
</html>
