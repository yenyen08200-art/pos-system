<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>抽獎核銷系統 | 門市 POS 兌換平台</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Square_logo.svg/512px-Square_logo.svg.png">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700;900&display=swap" />
<style>
:root{
  --background:oklch(0.17 0.024 259);
  --foreground:oklch(0.97 0.006 250);
  --card:oklch(0.225 0.028 260);
  --primary:oklch(0.78 0.17 68);
  --primary-foreground:oklch(0.2 0.03 60);
  --secondary:oklch(0.29 0.03 260);
  --secondary-foreground:oklch(0.96 0.006 250);
  --muted:oklch(0.27 0.028 260);
  --muted-foreground:oklch(0.7 0.025 258);
  --accent:oklch(0.78 0.14 195);
  --destructive:oklch(0.63 0.22 25);
  --success:oklch(0.75 0.17 156);
  --border:oklch(1 0 0 / 10%);
  --input:oklch(1 0 0 / 14%);
  --surface-glow:0 0 0 1px oklch(1 0 0 / 6%), 0 24px 60px -20px oklch(0 0 0 / 60%);
  --gradient-panel:linear-gradient(160deg, oklch(0.24 0.03 262), oklch(0.2 0.026 258));
  
  --accent-digital: #00C6FF;
  --gradient-digital: linear-gradient(135deg, #00C6FF, #0072FF);
  --accent-physical: #FF6B35;
  --gradient-physical: linear-gradient(135deg, #FF6B35, #F04323);
  --accent-counter: #3FBF8F;
  --gradient-counter: linear-gradient(135deg, #3FBF8F, #2A8C66);
  --accent-member: #00C6FF; 
  --gradient-member: linear-gradient(135deg, #00C6FF, #0072FF);
  --radius:1.25rem;
}
*{box-sizing:border-box;margin:0;padding:0;border-color:var(--border)}

html { overflow-x: hidden; }
body {
  height: 100%; width: 100%; overflow-x: hidden; position: relative;
  background: var(--background); color: var(--foreground);
  font-family: "Space Grotesk","Noto Sans TC",system-ui,sans-serif;
  -webkit-font-smoothing: antialiased;
}

main {
  min-height: 100vh; width: 100%; max-width: 100vw; overflow-x: hidden;
  background-image:
    radial-gradient(circle at 15% 10%, rgba(0,198,255,0.1), transparent 45%),
    radial-gradient(circle at 85% 0%, rgba(0,114,255,0.1), transparent 40%),
    linear-gradient(oklch(1 0 0 / 3%) 1px, transparent 1px),
    linear-gradient(90deg, oklch(1 0 0 / 3%) 1px, transparent 1px);
  background-size: auto,auto,44px 44px,44px 44px;
}

body.mode-physical-active main {
  background-image:
    radial-gradient(circle at 15% 10%, rgba(255,107,53,0.12), transparent 45%),
    radial-gradient(circle at 85% 0%, rgba(240,67,35,0.12), transparent 40%),
    linear-gradient(oklch(1 0 0 / 3%) 1px, transparent 1px),
    linear-gradient(90deg, oklch(1 0 0 / 3%) 1px, transparent 1px);
}

body.mode-counter-active main {
  background-image:
    radial-gradient(circle at 15% 10%, rgba(63,191,143,0.12), transparent 45%),
    radial-gradient(circle at 85% 0%, rgba(42,140,102,0.12), transparent 40%),
    linear-gradient(oklch(1 0 0 / 3%) 1px, transparent 1px),
    linear-gradient(90deg, oklch(1 0 0 / 3%) 1px, transparent 1px);
}

body.mode-member-active main {
  background-image:
    radial-gradient(circle at 15% 10%, rgba(0,198,255,0.1), transparent 45%),
    radial-gradient(circle at 85% 0%, rgba(0,114,255,0.1), transparent 40%),
    linear-gradient(oklch(1 0 0 / 3%) 1px, transparent 1px),
    linear-gradient(90deg, oklch(1 0 0 / 3%) 1px, transparent 1px);
}

.wrap { max-width: 1400px; margin: 0 auto; width: 100%; padding: 20px 16px; }
@media(min-width:768px){.wrap{padding:32px}}

header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:16px}
.logo{width:56px;height:56px;display:flex;align-items:center;justify-content:center;border-radius:18px;font-size:26px;
  background-image:var(--gradient-digital);color:#fff;box-shadow:0 12px 30px -12px rgba(0,198,255,0.8); transition:transform .3s}
body.mode-physical-active .logo { background-image: var(--gradient-physical); box-shadow:0 12px 30px -12px rgba(255,107,53,0.8); }
body.mode-counter-active .logo { background-image: var(--gradient-counter); box-shadow:0 12px 30px -12px rgba(63,191,143,0.8); }
body.mode-member-active .logo { background-image: var(--gradient-member); box-shadow:0 12px 30px -12px rgba(0,198,255,0.8); color:#fff;}
.logo:hover{transform:scale(1.05)}
h1{font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-.02em}
.sub{font-size:14px;color:var(--muted-foreground); display:flex; align-items:center; gap:8px;}

.ping-monitor { font-family: monospace; font-size: 11px; color: var(--success); background: rgba(63,191,143,0.1); padding: 4px 8px; border-radius: 6px; letter-spacing: 0.05em; display:flex; align-items:center; gap:6px; border: 1px solid rgba(63,191,143,0.3);}
.ping-dot { width: 6px; height: 6px; background: var(--success); border-radius: 50%; animation: pulse-ping 1s infinite; }
@keyframes pulse-ping { 0% { opacity: 1; box-shadow: 0 0 0 0 rgba(63,191,143,0.7); } 70% { opacity: 0.5; box-shadow: 0 0 0 4px rgba(63,191,143,0); } 100% { opacity: 1; } }

.panel{background-image:var(--gradient-panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--surface-glow); width: 100%;}
.status{display:flex;align-items:center;gap:12px;padding:10px 16px;font-size:14px}
.dot{position:relative;display:inline-flex;width:10px;height:10px;flex-shrink:0;}
.dot i{position:absolute;inset:0;border-radius:999px;background:var(--success)}
.dot i:first-child{opacity:.7;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}

.grid { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); width: 100%; }
@media(min-width:1024px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}}

section.panel{padding:20px}
@media(min-width:768px){section.panel{padding:24px}}
.rise{animation:rise .45s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.block+.block{margin-top:24px}
.label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.2em;color:var(--muted-foreground);margin-bottom:12px;display:block;}

.custom-dropdown { position: relative; width: 100%; }
.custom-dropdown summary {
  list-style: none; width: 100%; min-height: 64px; border-radius: 14px; border: 1px solid var(--border);
  background: var(--secondary); color: var(--foreground); font-size: 18px; font-weight: 700;
  display: flex; align-items: center; justify-content: space-between; padding: 0 20px; cursor: pointer;
  outline: none; transition: all 0.2s;
}
.custom-dropdown summary:hover { background: var(--muted); }
.custom-dropdown summary::-webkit-details-marker { display: none; }
.custom-dropdown summary::after { content: "▼"; font-size: 14px; color: var(--muted-foreground); }
.custom-dropdown[open] summary::after { content: "▲"; }
.custom-dropdown[open] summary { border-color: var(--primary); box-shadow: 0 0 0 2px oklch(0.78 0.17 68/.2); }
.dropdown-content {
  margin-top: 12px; padding: 16px; border-radius: 14px; border: 1px solid var(--border);
  background: var(--card); box-shadow: 0 10px 40px -10px rgba(0,0,0,0.6); z-index: 50; position: absolute; width: 100%;
}

.stores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px; width: 100%;}
@media(min-width:640px){.stores{grid-template-columns:repeat(3,minmax(0,1fr))}}
button{font-family:inherit;cursor:pointer;}
.store-btn{width:100%;min-height:56px;border-radius:12px;border:1px solid var(--border);background:var(--secondary);color:var(--secondary-foreground);
  font-size:16px;font-weight:600;transition:all .2s; padding: 0 8px;}
.store-btn:hover{background:var(--muted);border-color:var(--accent-digital)}
.store-btn:active{transform:scale(.97)}
.store-btn.on{background-image:var(--gradient-digital);color:#fff;border-color:var(--accent-digital);box-shadow:0 12px 26px -14px rgba(0,198,255,0.9)}

.mode-switch { display: flex; gap: 8px; padding: 6px; background: var(--secondary); border-radius: 16px; flex-wrap: wrap;}
.mode-btn { flex: 1; padding: 14px 12px; border-radius: 12px; border: none; background: transparent; color: var(--muted-foreground); font-weight: 700; font-size: 15px; transition: 0.2s; min-width: 100px;}
#mode-member.active { background: var(--gradient-digital); color: #fff; box-shadow: 0 8px 20px -6px rgba(0,198,255,0.6); border: none; }
#mode-physical.active { background: var(--gradient-physical); color: #fff; box-shadow: 0 8px 20px -6px rgba(255,107,53,0.6); border: none; }
#mode-counter.active { background: var(--gradient-counter); color: #fff; box-shadow: 0 8px 20px -6px rgba(63,191,143,0.6); border: none; }

.acts{display:flex;flex-direction:column;gap:10px; width:100%;}
.act-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:0 20px;text-align:left;
  border-radius:14px;border:1px solid var(--border);background:var(--secondary);color:var(--foreground);transition:all .2s;}
.act-btn:active{transform:scale(.99)}
.act-name{display:block;font-size:16px;font-weight:600}
.radio{width:16px;height:16px;border-radius:999px;border:2px solid var(--muted-foreground);flex:none; transition: .2s;}

.act-btn:hover{background:var(--muted);border-color:rgba(0,198,255,0.5)}
.act-btn.on{border-color:var(--accent-digital);background:rgba(0,198,255,0.15)}
.act-btn.on .radio{border-color:var(--accent-digital);background:var(--accent-digital); box-shadow: 0 0 0 4px rgba(0,198,255,0.2);}

body.mode-physical-active .act-btn:hover { border-color: rgba(255,107,53,0.5); }
body.mode-physical-active .act-btn.on { border-color: var(--accent-physical); background: rgba(255, 107, 53, 0.15); }
body.mode-physical-active .act-btn.on .radio { border-color: var(--accent-physical); background: var(--accent-physical); box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.2); }

body.mode-counter-active .act-btn:hover { border-color: rgba(63,191,143,0.5); }
body.mode-counter-active .act-btn.on { border-color: var(--accent-counter); background: rgba(63,191,143,0.15); }
body.mode-counter-active .act-btn.on .radio { border-color: var(--accent-counter); background: var(--accent-counter); box-shadow: 0 0 0 4px rgba(63,191,143,0.2); }

.empty{border:1px dashed var(--border);border-radius:14px;padding:24px;text-align:center;font-size:14px;color:var(--muted-foreground)}

.searchbar { display: flex; flex-direction: column; gap: 12px; width: 100%; }
.search-actions { display: flex; gap: 10px; width: 100%; }
.input-group { 
  display: flex; flex: 1; border-radius: 14px; border: 1px solid var(--input); 
  background: oklch(0.17 0.024 259/.6); overflow: hidden; transition: all 0.2s;
  min-height: 56px;
}
.input-group:focus-within { border-color: var(--accent-digital); box-shadow: 0 0 0 4px rgba(0,198,255,0.25); }
body.mode-physical-active .input-group:focus-within { border-color: var(--accent-physical); box-shadow: 0 0 0 4px rgba(255,107,53,0.25); }

#phone { 
  flex: 1; width: 100%; background: transparent; border: none; 
  color: var(--foreground); padding: 0 16px; font-size: 18px; font-weight: 600; 
  letter-spacing: 0.08em; outline: none; 
}
#phone::placeholder{font-size:15px;font-weight:400;letter-spacing:normal;color:var(--muted-foreground)}

.primary-btn{min-height:56px;padding:0 24px;font-size:16px;font-weight:700;border:none;border-radius:14px;
  background-image:var(--gradient-digital);color:#fff;box-shadow:0 14px 30px -16px rgba(0,198,255,0.9);transition:all .2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;}
.primary-btn:hover{filter:brightness(1.1)}
.primary-btn:active{transform:scale(.95)}
body.mode-physical-active .primary-btn { background-image: var(--gradient-physical); box-shadow: 0 14px 30px -16px rgba(255,107,53,0.9); }

/* 只有圖示的按鈕（掃描）：固定成正方形，圖示放大到 30px。
   之前用 flex:1 / flex:2.5 分配寬度，手機窄螢幕時「掃描」兩個字會把圖示擠掉，
   改成固定寬度就不會再受螢幕寬度影響。*/
.search-actions #btn-check { flex: 1; min-width: 0; }
.icon-btn {
  flex: 0 0 68px;
  width: 68px;
  padding: 0;
  gap: 0;
}
.icon-btn svg { width: 30px; height: 30px; }

@media (max-width: 380px) {
  .icon-btn { flex-basis: 60px; width: 60px; }
  .icon-btn svg { width: 27px; height: 27px; }
}
button:disabled{opacity:.5;cursor:not-allowed}

#toast-container {
  position: fixed; top: -100px; left: 50%; transform: translateX(-50%); z-index: 10000;
  display: flex; align-items: center; gap: 12px; padding: 16px 24px; border-radius: 999px;
  font-weight: 700; font-size: 15px; letter-spacing: 0.05em; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow: 0 20px 40px rgba(0,0,0,0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1);
}
#toast-container.show { top: 24px; }
#toast-container.error { background: rgba(255,50,50,0.15); color: #ff6b6b; border-color: rgba(255,50,50,0.3); }
#toast-container.success { background: rgba(63,191,143,0.15); color: var(--green); border-color: rgba(63,191,143,0.3); }
.toast-icon { font-size: 20px; }

/* 手機版修正：
   舊版是 padding:24px + 置中 + 關閉鈕 margin-top:40px/高 64px，
   在螢幕比較矮的手機（尤其 Safari 還會佔掉上下工具列）上，
   相機畫面 + 間距 + 按鈕的總高度會超過可視範圍，
   而 position:fixed 又不能捲動 → 「✖ 關閉」被擠出畫面，關不掉相機。
   這裡改成：可捲動 + 用 dvh 算真實可視高度 + 相機寬度同時受螢幕高度限制。*/
#scan-area{
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(10, 12, 16, 0.95);
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  gap: 20px;
  overflow-y: auto;
  padding: 16px calc(16px + env(safe-area-inset-right))
           calc(20px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
}
#scan-area.hidden{display:none !important}
/* 62dvh 這個上限是關鍵：相機是直式的，寬度限制住高度才不會爆版 */
.reader-wrap{ width: 100%; max-width: min(450px, 88vw, 62dvh); position: relative; flex: 0 0 auto; }
/* html5-qrcode 會對 video 塞 inline 樣式，這裡強制讓它照容器寬度等比縮放 */
#reader video{ display:block; width:100% !important; height:auto !important; }
.reader-wrap::before, .reader-wrap::after, .reader-wrap .corner-bl, .reader-wrap .corner-br {
  content: ''; position: absolute; width: 40px; height: 40px; border-color: var(--accent-digital); border-style: solid; z-index: 10; pointer-events: none;
}
body.mode-physical-active .reader-wrap::before, body.mode-physical-active .reader-wrap::after, 
body.mode-physical-active .reader-wrap .corner-bl, body.mode-physical-active .reader-wrap .corner-br {
  border-color: var(--accent-physical);
}
.reader-wrap::before { top: -2px; left: -2px; border-width: 4px 0 0 4px; }
.reader-wrap::after { top: -2px; right: -2px; border-width: 4px 4px 0 0; }
.reader-wrap .corner-bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; }
.reader-wrap .corner-br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; }
#reader{width:100%; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 9999px rgba(0,0,0,0.5); }
.scanline{position:absolute;left:0;right:0;top:0;height:3px;background:var(--accent-digital);pointer-events:none;animation:scan 2.5s ease-in-out infinite alternate; box-shadow: 0 0 15px 2px var(--accent-digital); z-index: 11;}
body.mode-physical-active .scanline { background: var(--accent-physical); box-shadow: 0 0 15px 2px var(--accent-physical); }
@keyframes scan{0%{top:0%}100%{top:100%}}
.close-cam{ flex: 0 0 auto; width: 100%; max-width: min(450px, 88vw); min-height: 58px; border-radius: 999px; font-size: 16px; font-weight: 700; color: #fff; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); transition: .2s; cursor: pointer; }
.close-cam:active{transform:scale(.95)}

.right{display:flex;flex-direction:column}
.placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:80px 0}
#placeholder-emoji { display: flex; justify-content: center; align-items: center; margin-bottom: 10px; }
.ticket-icon { width: 76px; height: 76px; color: var(--accent-digital); filter: drop-shadow(0 0 20px rgba(0,198,255,0.4)); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
body.mode-physical-active .ticket-icon { color: var(--accent-physical); filter: drop-shadow(0 0 20px rgba(255,107,53,0.4)); }

.placeholder p{color:var(--muted-foreground)}
.placeholder .p1{font-size:18px;font-weight:600}
.placeholder .p2{font-size:14px;max-width:22rem;opacity:.7; padding: 0 10px;}
.detail{flex:1;display:flex;flex-direction:column;gap:20px}
.banner{border-radius:18px;padding:16px 20px;font-size:18px;font-weight:700;border:1px solid; word-break: break-all;}
.banner.ok{border-color:oklch(0.75 0.17 156/.5);background:oklch(0.75 0.17 156/.15);color:var(--success)}
.banner.bad{border-color:oklch(0.63 0.22 25/.5);background:oklch(0.63 0.22 25/.15);color:var(--destructive)}
.banner small{display:block;font-size:14px;font-weight:500;opacity:.8;margin-top:4px}
.cards{display:grid;gap:12px; grid-template-columns: minmax(0, 1fr);}
@media(min-width:640px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.info{border:1px solid var(--border);background:oklch(0.29 0.03 260/.6);border-radius:18px;padding:14px 16px;transition:transform .2s; width: 100%;}
.info:hover{transform:translateY(-2px)}
.info.hl{border-color:oklch(0.78 0.17 68/.5);background:oklch(0.78 0.17 68/.1)}
.info .k{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.12em;color:var(--muted-foreground)}
.info .v{margin-top:4px;font-size:20px;font-weight:700; word-break: break-all;}
.info .v.mono{letter-spacing:.08em}
.actions{margin-top:auto;padding-top:8px;display:flex;flex-direction:column;gap:12px; width: 100%;}

.redeem{min-height:96px;width:100%;border:none;border-radius:18px;font-size:28px;font-weight:900;letter-spacing:.04em;
  background-image:var(--gradient-digital);color:#fff;box-shadow:0 26px 50px -22px rgba(0,198,255,0.8);transition:all .2s;
  display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer;}
body.mode-physical-active .redeem { background-image: var(--gradient-physical); box-shadow: 0 26px 50px -22px rgba(255,107,53,1); }
.redeem:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.1)}
.redeem:active:not(:disabled){transform:scale(.98)}

.redeem.is-claimed { background: var(--muted) !important; box-shadow: none !important; color: var(--muted-foreground) !important; cursor: not-allowed !important; pointer-events: none !important; opacity: 1 !important; transform: none !important; }
.redeem.is-expired { background: var(--destructive) !important; box-shadow: 0 10px 20px -10px rgba(255,0,0,0.5) !important; color: #fff !important; cursor: not-allowed !important; pointer-events: none !important; opacity: 1 !important; transform: none !important; }

.undo{min-height:64px;width:100%;border-radius:18px;font-size:20px;font-weight:700;color:var(--accent-digital);
  border:1px solid rgba(0,198,255,0.5);background:rgba(0,198,255,0.15);transition:background .2s}
body.mode-physical-active .undo { color:var(--accent-physical); border-color: rgba(255,107,53,0.5); background:rgba(255,107,53,0.15); }
.undo:hover{background:rgba(0,198,255,0.25)}

.next{min-height:64px;width:100%;border-radius:18px;font-size:18px;font-weight:600;color:var(--foreground);
  border:1px solid var(--border);background:var(--secondary);transition:all .2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;}
.next:hover{background:var(--muted)}
.next:active{transform:scale(.98)}
.hidden{display:none !important}

#success-overlay {
  position: fixed; inset: 0; pointer-events: none; z-index: 99999;
  opacity: 0; box-shadow: inset 0 0 0px 0px transparent;
}
#success-overlay.flash {
  animation: success-glow-anim 0.6s ease-out forwards;
}
@keyframes success-glow-anim {
  0% { opacity: 1; box-shadow: inset 0 0 60px 15px rgba(255, 190, 0, 0.8), inset 0 0 150px 20px rgba(255, 107, 53, 0.4); }
  100% { opacity: 0; box-shadow: inset 0 0 0px 0px transparent; }
}

.counter-area { text-align: center; padding: 60px 20px; }
.giant-count { font-size: 100px; font-weight: 900; line-height: 1; margin: 30px 0; color: var(--success); font-family: monospace; }
.giant-btn { width: 100%; min-height: 140px; border-radius: 24px; font-size: 32px; font-weight: 900; border: none; background: var(--gradient-counter); color: #fff; cursor: pointer; box-shadow: 0 26px 50px -22px rgba(63,191,143,0.8); transition: .2s; }
.giant-btn:active:not(:disabled) { transform: scale(0.96); }
.giant-btn:disabled { background: var(--muted); box-shadow: none; color: var(--muted-foreground); cursor: not-allowed; }

#pwa-prompt {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); width: calc(100% - 32px); max-width: 400px;
  background: #fff; color: #000; padding: 16px 20px; border-radius: 16px; display: none; align-items: center; justify-content: space-between; z-index: 100000; box-shadow: 0 20px 40px rgba(0,0,0,0.4); font-weight:bold;
}

.member-list-item {
  display: flex; justify-content: space-between; align-items: center;
  background: oklch(0.29 0.03 260 / .6); border: 1px solid var(--border);
  padding: 16px; border-radius: 14px; transition: transform 0.2s; margin-bottom: 10px; cursor: pointer;
}
.member-list-item:hover { transform: translateY(-2px); border-color: var(--accent-digital); background: rgba(0,198,255,0.1); }

#pos-login-screen {
  position: fixed; inset: 0; z-index: 100000;
  background: radial-gradient(circle at 50% 50%, rgba(0,198,255,0.1), var(--background) 80%);
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  overflow: hidden;   /* 背景光暈有 560px，比手機還寬，不裁掉會撐出橫向捲軸 */
}
.login-panel {
  background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
  border: 1px solid rgba(255,255,255,0.1); border-radius: 32px;
  padding: 30px; width: 100%; max-width: 360px;
  box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  text-align: center;
}
.login-logo {
  width: 70px; height: 70px; border-radius: 20px; font-size: 36px;
  background: var(--gradient-digital); color: #fff; margin: 0 auto 15px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 25px -5px rgba(0,198,255,0.6);
}
.login-title { font-size: 20px; font-weight: 700; margin-bottom: 24px; letter-spacing: 0.1em; color: var(--foreground); transition: color 0.3s; }

#login-store-select {
  width: 100%; padding: 14px 16px; border-radius: 12px; background: rgba(0,0,0,0.3); color: #fff; 
  border: 1px solid rgba(255,255,255,0.2); font-size: 16px; outline: none; font-weight: bold; 
  appearance: none; text-align: center; cursor: pointer; margin-bottom: 20px; transition: 0.2s;
}
#login-store-select:focus { border-color: var(--accent-digital); background: rgba(0,0,0,0.5); }
#login-store-select option { background: var(--secondary); color: var(--foreground); }

.pin-display-box {
  background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px; height: 64px; margin-bottom: 24px;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; font-family: monospace; font-weight: 900; letter-spacing: 0.2em; color: var(--accent-digital);
  box-shadow: inset 0 4px 10px rgba(0,0,0,0.5); text-shadow: 0 0 10px rgba(0,198,255,0.5);
}
.pin-display-box.error { color: #ff4757; text-shadow: 0 0 10px rgba(255,71,87,0.5); animation: shake 0.4s; }
@keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
.keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.keypad-btn {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px; height: 64px; font-size: 24px; font-weight: 700; color: #fff;
  cursor: pointer; transition: 0.1s; display: flex; align-items: center; justify-content: center; font-family: "Space Grotesk", sans-serif;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.keypad-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.15); }
.keypad-btn.btn-clear { background: rgba(255,71,87,0.1); color: #ff4757; border-color: rgba(255,71,87,0.3); }
.keypad-btn.btn-clear:active { background: rgba(255,71,87,0.3); }
.keypad-btn.btn-submit { background: var(--gradient-digital); color: #fff; border: none; box-shadow: 0 8px 20px -5px rgba(0,198,255,0.6); }
.keypad-btn.btn-submit:active { box-shadow: 0 4px 10px -5px rgba(0,198,255,0.6); }

/* ================= 🎬 POS 登入畫面動效 ================= */
/* 呼吸：待機時 logo 輕微起伏，讓店員一眼看得出系統是活的 */
.login-logo { animation: pos-logo-breathe 3.4s ease-in-out infinite; }
@keyframes pos-logo-breathe {
  0%, 100% { transform: scale(1);    box-shadow: 0 10px 25px -5px rgba(0,198,255,.55); }
  50%      { transform: scale(1.07); box-shadow: 0 16px 38px -5px rgba(0,198,255,.95); }
}
#pos-login-screen::before {
  content: ""; position: absolute; width: 560px; height: 560px; border-radius: 50%;
  background: radial-gradient(circle, rgba(0,198,255,.12), transparent 70%);
  animation: pos-halo 6s ease-in-out infinite; pointer-events: none;
}
@keyframes pos-halo {
  0%, 100% { transform: scale(.9);  opacity: .5; }
  50%      { transform: scale(1.12); opacity: .95; }
}
.login-panel { position: relative; animation: pos-panel-in .75s cubic-bezier(.2,.8,.2,1) both; }
@keyframes pos-panel-in { from { opacity: 0; transform: translateY(28px) scale(.95); } to { opacity: 1; transform: none; } }
/* 面板內元素依序浮現，比整塊一起跳出來有層次 */
.login-panel > * { animation: pos-item-in .55s cubic-bezier(.2,.8,.2,1) both; }
.login-panel > *:nth-child(1) { animation-delay: .12s; }
.login-panel > *:nth-child(2) { animation-delay: .18s; }
.login-panel > *:nth-child(3) { animation-delay: .24s; }
.login-panel > *:nth-child(4) { animation-delay: .30s; }
.login-panel > *:nth-child(5) { animation-delay: .36s; }
.login-panel > *:nth-child(6) { animation-delay: .42s; }
@keyframes pos-item-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* 登入成功：面板放大淡出，同時 logo 彈一下，收得乾脆有回饋感 */
#pos-login-screen.success .login-panel { animation: pos-panel-out .55s cubic-bezier(.4,0,.2,1) both; }
#pos-login-screen.success .login-logo  { animation: pos-logo-pop .55s cubic-bezier(.2,.8,.2,1) both; }
#pos-login-screen.success { animation: pos-screen-out .55s .1s ease both; }
@keyframes pos-panel-out { to { opacity: 0; transform: scale(1.1); filter: blur(6px); } }
@keyframes pos-logo-pop { 0% { transform: scale(1); } 45% { transform: scale(1.35); } 100% { transform: scale(1.15); } }
@keyframes pos-screen-out { to { opacity: 0; } }
/* 成功瞬間標題轉綠，比只靠 toast 更直覺 */
#pos-login-screen.success .login-title { color: var(--accent-physical, #3FBF8F) !important; }

/* ================= 🔽 自訂下拉選單 ================= */
.cs { position: relative; width: 100%; }
/* .login-panel 的子元素有進場動畫（動到 transform），會各自形成堆疊脈絡，
   選單的 z-index 因此被關在自己那一格裡，後面的數字鍵盤就畫到選單上面
   ——看起來就像選單變透明了。把「展開中的那一格」整格提上來才蓋得住。 */
.login-panel > *:has(.cs.open) { position: relative; z-index: 50; }
/* 原生 select 留著（仍是唯一的真實狀態），只是視覺上藏起來 */
.cs-native { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; }
.cs-trigger {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 16px; border-radius: 12px; background: rgba(0,0,0,.3); color: #fff;
  border: 1px solid rgba(255,255,255,.2); font-size: 16px; font-weight: bold;
  font-family: inherit; cursor: pointer; outline: none; transition: .2s;
}
.cs.open .cs-trigger { border-color: var(--accent-digital); background: rgba(0,0,0,.5); }
.cs-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cs-caret { font-size: 12px; opacity: .6; flex: 0 0 auto; transition: transform .28s cubic-bezier(.2,.8,.2,1); }
.cs.open .cs-caret { transform: rotate(180deg); }

.cs-panel {
  position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 100001;
  background: #1b1f2a; border: 1px solid rgba(255,255,255,.14); border-radius: 14px;
  box-shadow: 0 22px 50px rgba(0,0,0,.6); padding: 6px;
  max-height: 260px; overflow-y: auto;
  opacity: 0; transform: translateY(-10px) scale(.97); transform-origin: top center;
  pointer-events: none; transition: opacity .2s ease, transform .28s cubic-bezier(.2,.8,.2,1);
}
.cs.open .cs-panel { opacity: 1; transform: none; pointer-events: auto; }
.cs-opt {
  padding: 13px 14px; border-radius: 10px; font-size: 15px; font-weight: 600; color: #E8ECF4;
  cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  opacity: 0; transform: translateY(-6px);
  transition: background .15s, color .15s, opacity .26s ease, transform .26s cubic-bezier(.2,.8,.2,1);
}
.cs.open .cs-opt { opacity: 1; transform: none; }
.cs-opt:hover { background: rgba(255,255,255,.08); }
.cs-opt.selected { background: rgba(0,198,255,.16); color: var(--accent-digital); }

/* 動效會讓部分使用者不適，系統設定要求減少動態時全部關掉 */
@media (prefers-reduced-motion: reduce) {
  .login-logo, #pos-login-screen::before, .login-panel, .login-panel > * { animation: none !important; }
  .cs-panel, .cs-opt, .cs-caret { transition: none !important; }
}

/* ================= ✔️ 核銷成功：打勾一筆畫出來 =================
   原理是 SVG 的 stroke-dasharray / stroke-dashoffset：
   把虛線的「線段長度」設成跟路徑總長一樣，再讓 dashoffset 從全長變到 0，
   線就會像被筆一路描出來。長度不寫死，交給 JS 用 getTotalLength() 量，
   之後改路徑形狀也不用回來改數字。 */
#success-check {
  position: fixed; inset: 0; z-index: 100000; pointer-events: none;
  display: flex; align-items: center; justify-content: center; opacity: 0;
}
#success-check.play { opacity: 1; }
#success-check svg { width: 168px; height: 168px; overflow: visible; }
.sc-ring { fill: none; stroke: rgba(63,191,143,.9); stroke-width: 5; }
.sc-tick { fill: none; stroke: #3FBF8F; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round;
           filter: drop-shadow(0 0 10px rgba(63,191,143,.65)); }
/* 實體券模式是橘色系，打勾跟著換色才不會跟整體風格打架 */
body.mode-physical-active .sc-ring { stroke: rgba(255,107,53,.9); }
body.mode-physical-active .sc-tick { stroke: #FF6B35; filter: drop-shadow(0 0 10px rgba(255,107,53,.65)); }

#success-check.play .sc-ring { animation: sc-ring-draw .42s cubic-bezier(.2,.8,.2,1) forwards; }
#success-check.play .sc-tick { animation: sc-tick-draw .36s .3s cubic-bezier(.2,.8,.2,1) forwards; }
#success-check.play svg     { animation: sc-pop .95s ease forwards; }
@keyframes sc-ring-draw { to { stroke-dashoffset: 0; } }
@keyframes sc-tick-draw { to { stroke-dashoffset: 0; } }
@keyframes sc-pop {
  0%   { transform: scale(.82); opacity: 0; }
  14%  { opacity: 1; }
  72%  { transform: scale(1);   opacity: 1; }
  100% { transform: scale(1.1); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  #success-check { display: none !important; }
}
</style>
</head>
<body>

<div id="pwa-prompt">
  <span>📲 點擊安裝 App，核銷速度更快！</span>
  <button id="pwa-install-btn" style="background:#000; color:#fff; padding:8px 16px; border-radius:8px; border:none; font-weight:bold; cursor:pointer;">安裝</button>
</div>

</div>

<div id="pos-login-screen">
  <div class="login-panel">
    <div class="login-logo">⚡</div>
    <div class="login-title" id="login-status-text">核銷系統登入</div>
    
    <div style="margin-bottom: 12px;">
      <input type="text" id="login-emp-name" placeholder="請輸入您的稱呼 (例: 小編)" style="width: 100%; padding: 14px 16px; border-radius: 12px; background: rgba(0,0,0,0.3); color: #fff; border: 1px solid rgba(255,255,255,0.2); font-size: 16px; outline: none; font-weight: bold; text-align: center; transition: 0.2s;">
    </div>
    
    <div style="margin-bottom: 20px;">
      <select id="login-store-select">
        <option value="">⏳ 載入門市中...</option>
      </select>
    </div>

    <div class="pin-display-box" id="pin-display"></div>
    
    <div class="keypad-grid">
      <button class="keypad-btn" ontouchstart="" onclick="addPin('7')">7</button>

      <button class="keypad-btn" ontouchstart="" onclick="addPin('9')">9</button>
      <button class="keypad-btn" ontouchstart="" onclick="addPin('4')">4</button>
      <button class="keypad-btn" ontouchstart="" onclick="addPin('5')">5</button>
      <button class="keypad-btn" ontouchstart="" onclick="addPin('6')">6</button>

      <button class="keypad-btn" ontouchstart="" onclick="addPin('2')">2</button>
      <button class="keypad-btn" ontouchstart="" onclick="addPin('3')">3</button>
      <button class="keypad-btn btn-clear" ontouchstart="" onclick="clearPin()">✖</button>
      <button class="keypad-btn" ontouchstart="" onclick="addPin('0')">0</button>
      <button class="keypad-btn btn-submit" ontouchstart="" onclick="submitPin()">✔</button>
    </div>
  </div>
</div>

<main id="main-app" style="filter: blur(10px); pointer-events: none; transition: 0.4s;">
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">⚡</div>
        <div>
          <h1>店員核銷端</h1>
          <p class="sub">Point of Sale</p>
        </div>
      </div>
      <div class="status" style="background: rgba(255,255,255,0.05); padding: 8px 16px; border-radius: 12px; font-size: 14px;">
        門市：<span id="duty" style="font-weight:bold; color:#00C6FF;">尚未選擇</span> 
        <span style="color:var(--muted-foreground); margin: 0 8px;">|</span>
        人員：<span id="duty-emp" style="font-weight:bold; color:#fff;">未登入</span>
        <button onclick="showLoginScreen()" style="background:transparent; border:1px solid rgba(255,255,255,0.2); color:#fff; padding:4px 8px; border-radius:6px; font-size:12px; margin-left:10px; cursor:pointer;">交班登出</button>
      </div>
    </header>

    <div class="grid">
      <section class="panel rise">
        <input id="employee-name" type="hidden" value="001">

        <span class="label">系統模式</span>
        <div class="mode-switch">
          <button id="mode-member" class="mode-btn active" onclick="setMode('member')">👤 會員 / 電子券</button>
          <button id="mode-physical" class="mode-btn" onclick="setMode('physical')">🎫 實體券</button>
          <button id="mode-counter" class="mode-btn" onclick="setMode('counter')">🎁 活動贈品</button>
        </div>

        <div id="act-block" class="hidden">
          <span class="label">選擇活動 / 贈品</span>
          <div id="acts"></div>
        </div>

        <div id="scan-block">
          <span class="label" id="scan-label">● 掃描 / 查詢會員</span>
          <div class="searchbar">
            <div class="input-group">
              <input id="phone" type="tel" placeholder="輸入手機號碼" autocomplete="off" />
            </div>
            <div class="search-actions">
              <!-- 只留相機圖示：手機上文字＋圖示會擠在一起，拿掉字之後圖示才放得大、也比較好按 -->
              <button id="btn-scan" class="primary-btn icon-btn" onclick="startScan()" aria-label="掃描 QR Code" title="掃描 QR Code">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.4"/></svg>
              </button>
              <button class="primary-btn" id="btn-check" onclick="check()">查詢</button>

              <path d="M9 7v10"></path>
              <path stroke-width="2" d="M15 9h.01 M15 12h.01 M15 15h.01"></path>
            </svg>
          </div>
          <p class="p1" id="placeholder-title">等待掃描會員 / 憑證</p>
          <p class="p2" id="placeholder-desc">掃描 QR Code 即可帶出會員點數與所有優惠券資訊。</p>
        </div>
        
        <div id="member-area" class="member-area hidden">
           <div id="member-points-card" class="info" style="margin-bottom: 16px; border-color:var(--accent-digital); background:rgba(0,198,255,0.1);">
             <div class="k" style="color:var(--accent-digital)">MEMBER POINTS</div>

             <div style="font-size: 16px; font-weight: bold; margin-top:8px;">👤 <span id="m-name"></span> <span id="m-phone" style="font-size:12px; opacity:0.7;"></span></div>

               <input type="number" id="consume-amount" placeholder="輸入消費總額 (自動換算)" style="flex:1; border-radius:12px; border:1px solid var(--border); background:rgba(0,0,0,0.2); color:#fff; padding:0 16px; font-size:16px; outline:none;" oninput="calcPoints()">

        <div id="detail" class="detail hidden">
          <div id="banner" class="banner ok rise"></div>
          
          <div class="cards">

            <div class="info"><div class="k">👤 顧客姓名</div><div class="v" id="v-name">—</div></div>

            <div class="info hl" style="grid-column: 1 / -1;"><div class="k">🎁 兌換餐點</div><div class="v" id="v-gift">—</div></div>

        <div id="counter-area" class="counter-area hidden">
          <div style="font-weight:700; font-size:18px; color:var(--muted-foreground); letter-spacing: 0.1em;">門市專屬配額剩餘</div>

  /* 🔥 前端雙重判斷：就算雲端排程掛掉，POS 端也會自己依上下架時間過濾活動 */
  function parseScheduleTime(str, endOfDayIfNoTime) {
    if (!str || typeof str !== 'string') return null;
    const m = str.trim().match(/(\d{4})[/-](\d{1,2})[/-](\d{1,2})(?:[T\s](\d{1,2}):(\d{2}))?/);
    if (!m) return null;
    const h  = m[4] !== undefined ? Number(m[4]) : (endOfDayIfNoTime ? 23 : 0);
    const mi = m[5] !== undefined ? Number(m[5]) : (endOfDayIfNoTime ? 59 : 0);
    return Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]), h, mi, 0) - 8 * 3600 * 1000;
  }

  function isEventOnShelf(cfg) {
    if (!cfg) return false;
    const now = Date.now();
    const s = parseScheduleTime(cfg.startAt, false);
    const e = parseScheduleTime(cfg.endAt, true);
    const hasSchedule = s !== null || e !== null;

    // 🔥 有排程 → 一律以「時間」為準，不看 active。
    //    因為 active 是雲端排程每小時整點才同步的結果，如果這裡跟它做 AND，
    //    在「時間已到、但還沒到下一個整點」的空窗期，活動會該上架卻上不了。
    if (hasSchedule) {
      if (s !== null && now < s) return false;
      if (e !== null && now > e) return false;
      return true;
    }

    // 沒排程 → 完全由後台的手動開關決定
    return cfg.active !== false;
  }

  async function initPOS() {
    try {
      const configSnap = await getDoc(doc(db, "system", "config"));
      const savedStore = localStorage.getItem("p_store");

      if (configSnap.exists()) {
        const data = configSnap.data();
        STORE_LIST = data.STORE_LIST || [];
        POS_CONFIG = data.POS_CONFIG || {};
        EVENT_ORDER = data.EVENT_ORDER || Object.keys(POS_CONFIG);
        EVENT_ORDER = EVENT_ORDER.filter(a => POS_CONFIG[a]);

        REWARDS_LIST = data.REWARDS_LIST || [];
        GIFT_LIST = data.GIFT_LIST || [];
        POINT_RATE = data.POINT_RATE || 100;
        
        isMemberSystemActive = data.MEMBER_SYSTEM_ACTIVE !== undefined ? data.MEMBER_SYSTEM_ACTIVE : true;

        const loginStoreSelect = $('login-store-select');
        let optionsHtml = '<option value="">請先選擇值班門市</option>';
        STORE_LIST.forEach(s => {
          let selected = (savedStore === s) ? "selected" : "";
          optionsHtml += `<option value="${s}" ${selected}>${s}</option>`;
        });
        loginStoreSelect.innerHTML = optionsHtml;
      }

      $('mode-member').innerHTML = isMemberSystemActive ? '👤 會員 / 電子券' : '📱 電子券';
      $('member-points-card').style.display = isMemberSystemActive ? 'block' : 'none';
      $('reward-title').style.display = isMemberSystemActive ? 'block' : 'none';
      $('reward-list').style.display = isMemberSystemActive ? 'grid' : 'none';

      evMap = {};
      STORE_LIST.forEach(s => {
        evMap[s] = [];
        EVENT_ORDER.forEach(a => {
          const cfg = POS_CONFIG[a];
          if (!isEventOnShelf(cfg)) return; // 🔥 含手動下架 + 上下架排程時間判斷
          if (cfg.stores === "ALL" || (Array.isArray(cfg.stores) && cfg.stores.includes(s))) { evMap[s].push(a); }
        });
      });

      giftMap = {};
      for (const a in POS_CONFIG) { giftMap[a] = POS_CONFIG[a].gift; }

      onSnapshot(collection(db, "inventory"), (snap) => {
        storeGiftMap = {};
        snap.forEach(docSnap => {
          let d = docSnap.data();
          if (!storeGiftMap[d.store]) storeGiftMap[d.store] = [];
          if (GIFT_LIST.includes(d.act) && !storeGiftMap[d.store].includes(d.act)) {
              storeGiftMap[d.store].push(d.act);
          }
        });
        
        if (currentMode === 'counter' && store) {
           renderActs();
        }
      });

      if (savedStore && STORE_LIST.includes(savedStore)) {
          store = savedStore; 
      } else if (STORE_LIST.length > 0) {
          store = STORE_LIST[0];
      }

      $("duty").innerText = store || "尚未選擇";
      setMode(currentMode); 

      checkAutoLogin(); 
    } catch (e) { 
      if(e.code !== 'permission-denied') {
        showToast("無法連線至雲端讀取 POS 設定！", "error"); 
      }
    }
  }

    $("btn-check").disabled = b;
    if(b) { $("btn-check").innerText = "處理中…"; } 
    else { $("btn-check").innerText = currentMode === 'physical' ? '核銷' : '查詢'; }

  function renderStores(){
    const box = $("stores"); box.innerHTML = "";
    STORE_LIST.forEach((s) => {
      const b = document.createElement("button");
      b.className = "store-btn" + (store === s ? " on" : "");

    });

  function renderActs(){
    /* 修正「贈品發出後撤銷鈕瞬間消失」：
       庫存的 onSnapshot 只要一變動就會呼叫 renderActs()，
       而「發出 1 件」本身就會改動庫存 —— 舊版在這裡無條件隱藏撤銷鈕，
       等於按鈕才剛出現就被自己觸發的 snapshot 蓋掉。
       現在只有「沒有待撤銷的發放」或「已經切到別的門市 / 活動」才收掉。 */
    if (!lastTallyLogId || lastTallyStore !== store || lastTallyAct !== act) {
      hideTallyUndo();
    }

    const box = $("acts"); box.innerHTML = "";
    if (!store){ box.innerHTML = '<p class="empty">請先選擇門市</p>'; return; }
    
    let currentList = [];
    if (currentMode === 'counter') {
      currentList = storeGiftMap[store] || [];
    } else {
      return; 
    }

    if(currentList.length === 0) { 
      box.innerHTML = `<p class="empty">此門市目前無開放的活動贈品項目</p>`; 
      act = ""; 
      return; 
    }

    if (!currentList.includes(act)) {
       act = currentList[0];
       // 活動被自動換掉 = 等同切走，待撤銷的那筆已不屬於現在這個活動
       if (lastTallyLogId && (lastTallyStore !== store || lastTallyAct !== act)) hideTallyUndo();
       if (currentMode === 'counter') loadCounter(); 
    }

    const list = document.createElement("div");
    list.className = "acts";
    currentList.forEach((a) => {
      const b = document.createElement("button");
      b.className = "act-btn" + (act === a ? " on" : "");
      
      b.innerHTML = '<span><span class="act-name"></span></span><span class="radio"></span>';
      b.querySelector(".act-name").innerText = a;
      b.onclick = () => { 
        act = a; 
        renderActs(); 
        if(currentMode === 'counter') { loadCounter(); } 
        setTimeout(() => $("phone").focus(), 100); 
      };
      list.appendChild(b);
    });
    box.appendChild(list);
  }

  function selectStore(s){
    hideTallyUndo();

    store = s; localStorage.setItem("p_store", s);
    act = (evMap[s] || [])[0] || ""; record = null;
    $("duty").innerText = store || "尚未選擇";
    
    setMode(currentMode);
    if(currentMode === 'counter') { loadCounter(); } 
    setTimeout(() => $("phone").focus(), 100);
  }

  function loadCounter() {
    if(currentMode !== 'counter' || !store || !act) return;
    if(unsubCounter) unsubCounter();
    $('c-count').innerText = "載入中";
    $('btn-tally').disabled = true;
    
    unsubCounter = onSnapshot(doc(db, "inventory", `${store}_${act}`), (d) => {
      if(d.exists()) {
        currentCount = d.data().count;
        $('c-count').innerText = currentCount;
        $('btn-tally').disabled = currentCount <= 0;
        $('btn-tally').innerText = currentCount <= 0 ? "贈品庫存已空" : "🎁 發出 1 件";
      } else {
        $('c-count').innerText = "未設配額"; 
        $('btn-tally').disabled = true;
        $('btn-tally').innerText = "請總部設定配額";
      }
    });
  }

  window.deductTally = async function() {
    if(currentCount <= 0) return;
    const empName = $("employee-name").value.trim() || '001';

    $('btn-tally').disabled = true;
    try {
      const logId = new Date().getTime().toString();

      /* 🔧 修正：舊版是「先 increment(-1) 扣庫存，再另外寫一筆 gift_logs」兩段獨立寫入。
         兩個問題：
           1) increment 沒有「不得小於 0」的約束——兩台裝置畫面都顯示剩 1 件時各按一次，
              庫存會變成 -1，等於實體贈品多發了一件。
           2) 庫存扣掉了但 gift_logs 寫入失敗時，會跳「扣除失敗」讓店員再按一次，
              結果庫存被扣兩次、發放明細卻只有一筆，帳實對不起來。
         改用 transaction：讀庫存 → 確認 > 0 → 扣 1 → 寫 log，四件事同生共死。*/
      await runTransaction(db, async (tx) => {
        const invRef = doc(db, "inventory", `${store}_${act}`);
        const invSnap = await tx.get(invRef);
        if (!invSnap.exists()) throw new Error("NO_QUOTA");

        const left = Number(invSnap.data().count) || 0;
        if (left <= 0) throw new Error("OUT_OF_STOCK");

        tx.update(invRef, { count: increment(-1), usedCount: increment(1) });
        tx.set(doc(db, "gift_logs", logId), {
          act: act,
          store: store,
          empName: empName,
          time: fmtStamp(),
          timestamp: Date.now()
        });
      });

      lastTallyLogId = logId;
      lastTallyStore = store;   // 記住發在哪個門市 / 活動，撤銷時才還得回正確的格子
      lastTallyAct = act;

      const overlay = $("success-overlay");
      overlay.classList.remove("flash");
      void overlay.offsetWidth;
      overlay.classList.add("flash");
      playSuccessCheck();
      if (window.confetti) {
          confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 }, colors: ['#FFD700', '#FFA500', '#FF6B35', '#FFFFFF'], disableForReducedMotion: true });
      }
      showToast("✅ 已成功發放 1 件！", "success");
      
      const btnUndoTally = $("btn-undo-tally");
      btnUndoTally.classList.remove("hidden");
      let left = 5;
      btnUndoTally.innerText = `⚡ 撤銷 (${left}s)`;
      
      if (tallyUndoTimer) clearInterval(tallyUndoTimer);
      tallyUndoTimer = setInterval(() => {
        left -= 1;
        if (left <= 0) {
          clearInterval(tallyUndoTimer);
          btnUndoTally.classList.add("hidden");
        } else {
          btnUndoTally.innerText = `⚡ 撤銷 (${left}s)`;
        }
      }, 1000);

      setTimeout(() => { 
        if(currentCount > 0) $('btn-tally').disabled = false; 
      }, 1000);
      
    } catch(e) {
      console.error(e);
      if (e.message === "OUT_OF_STOCK") {
        showToast("庫存已經發完了（可能是其他裝置剛剛發出）", "error");
      } else if (e.message === "NO_QUOTA") {
        showToast("這個門市尚未設定配額，請通知總部", "error");
      } else {
        showToast("扣除失敗，請檢查網路連線", "error");
      }
      $('btn-tally').disabled = false;
    }
  };

  window.undoTally = async function() {
    hideTallyUndo();

    if (!lastTallyLogId) return;
    const logId = lastTallyLogId;
    /* 用「發放當下」記起來的門市 / 活動，而不是現在畫面上的，
       否則使用者若在 5 秒內切換活動，庫存會被加回到錯的那一格。 */
    const undoStore = lastTallyStore || store;
    const undoAct = lastTallyAct || act;
    lastTallyLogId = null;      // 先清掉，避免連點兩次撤銷兩次庫存

    $('btn-tally').disabled = true;
    $('btn-tally').innerText = "撤銷中...";

    try {
      /* 🔧 修正：舊版是「先標記 log 已撤銷，再加回庫存」兩段獨立寫入，
         第二段失敗的話，明細寫著已撤銷但庫存沒回來。改成 transaction 一起做。
         另外在交易裡確認這筆 log 還沒被撤銷過，防止重複加回庫存。*/
      await runTransaction(db, async (tx) => {
        const logRef = doc(db, "gift_logs", logId);
        const invRef = doc(db, "inventory", `${undoStore}_${undoAct}`);
        const logSnap = await tx.get(logRef);

        if (!logSnap.exists()) throw new Error("LOG_GONE");
        if (String(logSnap.data().empName || "").includes("已撤銷")) throw new Error("ALREADY_UNDONE");

        // 🔥 用 updateDoc 而非 deleteDoc：避開刪除權限限制，也在後台留下撤銷紀錄
        tx.update(logRef, {
          empName: ($("employee-name").value.trim() || '001') + " ↩️(已撤銷)",
          time: fmtStamp()
        });
        tx.update(invRef, { count: increment(1), usedCount: increment(-1) });
      });

      showToast("✅ 已成功撤銷發放！庫存已復原。", "success");
    } catch(e) {
      console.error(e);
      if (e.message === "ALREADY_UNDONE") showToast("這筆已經撤銷過了。", "error");
      else if (e.message === "LOG_GONE") showToast("找不到這筆發放紀錄。", "error");
      else showToast("撤銷失敗，請檢查網路！", "error");
    } finally {
      lastTallyLogId = null;
      lastTallyStore = null;
      lastTallyAct = null;
      $('btn-tally').disabled = currentCount <= 0;
      $('btn-tally').innerText = currentCount <= 0 ? "贈品庫存已空" : "🎁 發出 1 件";
    }
  };

  window.calcPoints = function() {
    const amount = parseInt($('consume-amount').value, 10);
    const ptsPreview = $('pts-preview');
    if(isNaN(amount) || amount <= 0) {
      ptsPreview.innerText = "";
    } else {
      const getPts = Math.floor(amount / POINT_RATE);
      ptsPreview.innerText = getPts > 0 ? `(+ ${getPts} 點)` : "";
    }
  }

  window.addPoints = async function() {
    if(!memberRecord) return;
    const amount = parseInt($('consume-amount').value, 10);
    if(isNaN(amount) || amount < POINT_RATE) return showToast(`消費需達 ${POINT_RATE} 元以上！`, "error");
    
    const empName = $("employee-name").value.trim() || '001';
    const getPts = Math.floor(amount / POINT_RATE);
    
    try {
      $('btn-add-pts').disabled = true;
      $('btn-add-pts').innerText = "處理中...";

      await updateDoc(doc(db, "members", shownPhone), {
        points: increment(getPts)
      });
      
      await setDoc(doc(db, "point_transactions", new Date().getTime().toString()), {
        phone: shownPhone,
        type: "earn",
        amount: amount,
        points_earned: getPts,
        store: store,
        empName: empName,
        time: fmtStamp()
      });

      // 🔧 舊資料若沒有 points 欄位，undefined + 數字 = NaN，畫面會顯示 NaN
      //    而且之後所有「點數足夠嗎」的比較都會變 false，兌換清單全部卡在「點數不足」
      memberRecord.points = (Number(memberRecord.points) || 0) + getPts;
      $('m-pts').innerText = memberRecord.points;
      $('consume-amount').value = '';
      $('pts-preview').innerText = '';
      
      showToast(`✅ 成功加入 ${getPts} 點！`, "success");
      playAlert("success");
      renderRewardsList(); 
    } catch(e) {
      showToast("連線失敗，請重試", "error");
    } finally {
      $('btn-add-pts').disabled = false;
      $('btn-add-pts').innerHTML = `給點 <span id="pts-preview"></span>`;
    }
  }

  window.redeemPoints = async function(giftName, reqPts) {
    if(!memberRecord) return;
    reqPts = Number(reqPts) || 0;
    if((Number(memberRecord.points) || 0) < reqPts) return;
    if(memberRecord.name === "非註冊會員") {
      return showToast("這位顧客還不是會員，請先完成註冊。", "error");
    }

    const empName = $("employee-name").value.trim() || '001';

    if(!confirm(`確定要扣除 ${reqPts} 點兌換「${giftName}」嗎？`)) return;

    try {
      /* 🔧 舊版是「先 increment(-reqPts)，再寫交易紀錄」兩段獨立寫入，
         而且只用本地快照擋點數，同時在兩台機器操作會把點數扣成負的。
         改成 transaction：在交易裡重讀點數確認夠扣，再一次寫入扣點與紀錄。*/
      await runTransaction(db, async (tx) => {
        const memRef = doc(db, "members", shownPhone);
        const snap = await tx.get(memRef);
        if (!snap.exists()) throw new Error("NO_MEMBER");

        const cur = Number(snap.data().points) || 0;
        if (cur < reqPts) throw new Error("NOT_ENOUGH::" + cur);

        tx.update(memRef, { points: increment(-reqPts) });
        tx.set(doc(db, "point_transactions", Date.now().toString()), {
          phone: shownPhone,
          type: "redeem",
          gift: giftName,
          points_spent: reqPts,
          store: store,
          empName: empName,
          time: fmtStamp()
        });
      });

      memberRecord.points = (Number(memberRecord.points) || 0) - reqPts;
      $('m-pts').innerText = memberRecord.points;
      renderRewardsList();

      showToast(`✅ 兌換成功！已扣除 ${reqPts} 點`, "success");
      
      const overlay = $("success-overlay");
      overlay.classList.remove("flash");
      void overlay.offsetWidth;
      overlay.classList.add("flash");
      playSuccessCheck();
      if (window.confetti) confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 }, colors: ['#FFD700', '#FFA500'] });

      renderRewardsList();
    } catch(e) {
      console.error("扣點失敗:", e);
      if (String(e.message).startsWith("NOT_ENOUGH::")) {
        showToast(`點數不足（目前只有 ${e.message.split("::")[1]} 點），畫面已更新。`, "error");
        check(shownPhone);
      } else if (e.message === "NO_MEMBER") {
        showToast("查無此會員資料，無法扣點。", "error");
      } else {
        showToast("扣點失敗，請檢查網路！", "error");
      }
    }
  }

  function renderRight(){
    if (!record){
      $("placeholder").classList.remove("hidden");
      $("detail").classList.add("hidden");
      return;
    }
    $("placeholder").classList.add("hidden");
    $("member-area").classList.add("hidden");
    $("detail").classList.remove("hidden");
    
    const defaultExpire = (POS_CONFIG[shownAct] && POS_CONFIG[shownAct].expireDate) ? POS_CONFIG[shownAct].expireDate : "無特別限制";
    const expireStr = record.expireDate || defaultExpire;

    let autoExpired = false;
    if (record.status !== "已過期" && record.status !== "已兌換" && expireStr && expireStr !== "無特別限制" && !expireStr.includes("依紙本券面")) {
        const today = new Date(); today.setHours(0,0,0,0);
        const regex = /(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/g;
        let match; let lastDate = null;
        while ((match = regex.exec(expireStr)) !== null) { lastDate = new Date(match[1], parseInt(match[2])-1, match[3]); }
        if (lastDate && lastDate < today) {
            autoExpired = true; record.status = "已過期";
            // 這是「順手標記」的背景寫入，不擋畫面。但一定要接 catch：
            // 舊版沒有的話，門市網路一斷就會產生 unhandled rejection，
            // 而且畫面已經先顯示成「已過期」，跟資料庫不一致也沒人知道。
            updateDoc(doc(db, shownAct, shownPhone), { status: "已過期", redeemTime: "逾期未換 (前台自動攔截)" })
              .catch(e => console.warn("自動標記過期寫入失敗（畫面已顯示為過期，雲端排程半夜會再補標一次）:", e));
        }
    }

    const isClaimed = record.status === "已兌換";
    const isExpired = record.status === "已過期" || autoExpired;
    const banner = $("banner");
    
    if (isClaimed) {
      banner.className = "banner bad rise";
      banner.innerHTML = `❌ 券已失效 / 已領取<small style="margin-top:8px;">📍 於 ${record.store || "未知門市"} 兌換</small><small>🕒 ${record.redeemTime || "未知時間"}</small>`;
    } else if (isExpired) {
      banner.className = "banner bad rise";
      banner.innerHTML = `⚠️ 券已逾期失效<small>🕒 系統檢測已過期 (${expireStr})</small>`;
    } else {
      banner.className = "banner ok rise";
      banner.innerHTML = "✅ 有效憑證";
    }

    const displayGift = record.gift || giftMap[shownAct] || "未設定餐點";
    $("v-phone").innerText = shownPhone;
    $("v-name").innerText = record.name || "—";
    $("v-expire").innerText = expireStr;
    
    if (currentMode === 'physical') {
        $("v-social").innerText = record.social_id || "實體紙本憑證";
        $("v-gift").innerHTML = `<span style="color:var(--primary);font-weight:900;font-size:22px;">${displayGift}</span> <span style="font-size:12px;color:var(--muted-foreground);display:block;margin-top:4px;">⚠️ 貼心防偽提示：請確認系統帶出之品項與紙本標示相符</span>`;
    } else {
        $("v-social").innerText = record.social_id || "未提供";
        $("v-gift").innerText = displayGift;
    }
    
    const redeemBtn = $("btn-redeem");
    redeemBtn.className = "redeem"; 
    redeemBtn.disabled = false;

    if (isClaimed) {
        redeemBtn.innerText = "已兌換完畢";
        redeemBtn.disabled = true;
        redeemBtn.classList.add("is-claimed");
    } else if (isExpired) {
        redeemBtn.innerText = "已過期無法核銷";
        redeemBtn.disabled = true;
        redeemBtn.classList.add("is-expired");
    } else {
        redeemBtn.innerText = "✔ 確認核銷優惠";
    }
    
    if (currentMode === 'physical') {
        $("btn-back").style.display = 'none';
    } else {
        $("btn-back").style.display = 'flex';
    }
  }

  window.backToList = function() {
    record = null; 
    shownAct = "";

    $("detail").classList.add("hidden");

  let audioCtx = null;
  function playAlert(type){
    if (navigator.vibrate){
      if (type === "scan") navigator.vibrate([150]);
      if (type === "error") navigator.vibrate([300]);
      if (type === "success") navigator.vibrate([100,50,100,50,200]);
    }
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (!audioCtx) return;
    if (audioCtx.state === "suspended") audioCtx.resume();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === "scan"){
      osc.frequency.value = 1200; osc.type = "sine";
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === "error"){
      osc.frequency.value = 300; osc.type = "square";
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    } else {
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
      osc.type = "sine";
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
  }

  // 防止連點兩下「掃描」時重複 start（html5-qrcode 會直接丟錯，相機就卡住不動了）
  let scanBusy = false;

  async function startScan(){
    if (scanBusy || (scanner && scanner.isScanning)) return;
    scanBusy = true;

    $("scan-area").classList.remove("hidden");
    if (!scanner) scanner = new Html5Qrcode("reader");

    try {
      await scanner.start(
        { facingMode: "environment" },
        {
          fps: 15,
          // 舊版寫死 qrbox:250，在窄螢幕上會大於相機畫面寬度而報錯。
          // 改成依實際畫面尺寸取 70%，並限制在 160~320 之間。
          qrbox: (vw, vh) => {
            const m = Math.max(160, Math.min(320, Math.floor(Math.min(vw, vh) * 0.7)));
            return { width: m, height: m };
          },
          aspectRatio: 1.0,
        },
        (txt) => {
          let result = txt;
          if (currentMode === 'physical') result = txt.replace(/[^a-zA-Z0-9]/g, "").toUpperCase().slice(0,20);
          else result = txt.replace(/[^\d]/g, "").slice(0,10);

          $("phone").value = result;
          stopScan().then(() => check(result));
        },
        () => {}
      );
    } catch (e) {
      console.error("啟動相機失敗:", e);
      $("scan-area").classList.add("hidden");
      showToast("無相機權限或裝置不支援相機！", "error");
    } finally {
      scanBusy = false;
    }
  }

  // 一定要 await stop()，否則相機還沒真的關掉就又被 start，會噴錯而且鏡頭燈不會熄
  async function stopScan(){
    try {
      if (scanner && scanner.isScanning) await scanner.stop();
    } catch (e) {
      console.warn("關閉相機時發生問題:", e);
    }
    $("scan-area").classList.add("hidden");
  }

  async function check(overridePhone){
    const ph = overridePhone || $("phone").value.trim();
    if (!store) return showToast("請確認已選擇門市。", "error");
    if (!ph) return;

    record = null; memberRecord = null; userCouponsData = {};
    $("placeholder").classList.add("hidden");
    $("detail").classList.add("hidden");
    $("member-area").classList.add("hidden");
    
    setBusy(true);

    try {
      if (currentMode === 'physical') {
        // 🔥 核銷查詢不受「下架」影響：活動下架只是停止發券，已發出的券仍要能核銷到期限為止
        const physicalActs = EVENT_ORDER.filter(a => {
          if (!(a.includes('【實體】') || a.includes('實體券'))) return false;
          const cfg = POS_CONFIG[a];
          if (!cfg) return false;
          return cfg.stores === "ALL" || (Array.isArray(cfg.stores) && cfg.stores.includes(store));
        });
        let foundData = null;
        let foundActName = "";

        for (const pAct of physicalActs){
          const pSnap = await getDoc(doc(db, pAct, ph));
          if (pSnap.exists()){
            foundData = pSnap.data();
            foundActName = pAct;
            break; 
          }
        }

        if (foundData){
          playAlert("scan");
          shownPhone = ph;
          shownAct = foundActName;
          record = foundData;
          hideUndo();
          renderRight();
        } else {
          showToast("查無此實體流水號，或該券尚未建檔！", "error");
          $("phone").value = "";
          $("placeholder").classList.remove("hidden");
        }
        return;
      } 
      else if (currentMode === 'member') {
        let hasData = false; 
        if (isMemberSystemActive) {
            const memSnap = await getDoc(doc(db, "members", ph));
            if(memSnap.exists()) {
                hasData = true;
                memberRecord = memSnap.data();
            } else {
                memberRecord = { points: 0, name: "非註冊會員" };
            }
            $('m-pts').innerText = memberRecord.points || 0;
            $('m-name').innerText = memberRecord.name || "非註冊顧客";
            $('m-phone').innerText = ph;
            $('consume-amount').value = ''; $('pts-preview').innerText = '';
            renderRewardsList();
        }
        
        shownPhone = ph;
        
        // 🔥 同上：不過濾 active，避免活動排程自動下架後，顧客手上「還沒到期」的券查不到
        let digitalActs = EVENT_ORDER.filter(a => !a.includes('【實體】') && !a.includes('實體券') && POS_CONFIG[a]);
        await Promise.all(digitalActs.map(async (a) => {
            const cSnap = await getDoc(doc(db, a, ph));
            if(cSnap.exists()) {
                hasData = true; 
                let data = cSnap.data(); data.act_source = a;
                userCouponsData[a] = data;
            }
        }));

        if (!hasData) {
            showToast(isMemberSystemActive ? "查無此人的會員或優惠券紀錄！" : "查無此號碼的優惠券紀錄！", "error");
            $("phone").value = "";
            $("placeholder").classList.remove("hidden");
            return;
        }

        playAlert("scan");
        renderUserCoupons();
        $("member-area").classList.remove("hidden");
      }
    } catch (e) {
      /* 🔧 舊版只有 finally 沒有 catch。上面 1409-1411 已經把 placeholder、detail、
         member-area 全部藏起來了，所以只要任何一個 getDoc 失敗（門市 Wi-Fi 不穩、
         權限錯誤），右半邊就會變成一整片空白、而且完全沒有錯誤提示，
         店員只會覺得「機器壞了」。這裡補上還原畫面 + 明確提示。*/
      console.error("查詢失敗:", e);
      playAlert("error");
      showToast("查詢失敗，請確認網路連線後再試一次。", "error");
      $("placeholder").classList.remove("hidden");
    } finally { setBusy(false); }
  }

  function renderUserCoupons() {
     let html = '';
     const acts = Object.keys(userCouponsData);
     if(acts.length === 0) {
         html = '<div style="color:var(--muted-foreground); font-size:14px; text-align:center; padding:10px;">目前無可用的活動優惠券</div>';
     } else {
         acts.forEach(actName => {
             const c = userCouponsData[actName];
             const isRedeemed = c.status === '已兌換';
             const isExpired = c.status === '已過期';
             const gift = c.gift || POS_CONFIG[actName]?.gift || '未設定';
             
             const classStr = (isRedeemed || isExpired) ? "member-list-item disabled" : "member-list-item";
             const clickEvt = (isRedeemed || isExpired) ? "" : `onclick="prepRedeemCoupon('${actName}')"`;

             let rightSide = '';
             if (isRedeemed) {
                 rightSide = `
                 <div style="text-align:right;">
                   <div style="background:transparent; color:var(--muted-foreground); font-weight:bold; font-size:14px; margin-bottom:2px;">已核銷</div>
                   <div style="font-size:12px; color:var(--muted-foreground);">📍 ${c.store || '未知門市'}</div>
                   <div style="font-size:11px; color:var(--muted-foreground); opacity:0.8; margin-top:2px;">🕒 ${c.redeemTime || ''}</div>
                 </div>`;
             } else if (isExpired) {
                 rightSide = `<div style="background:transparent; color:var(--muted-foreground); font-weight:bold; font-size:14px;">已過期</div>`;
             } else {
                 rightSide = `<div style="background:var(--gradient-digital); color:#fff; padding:6px 12px; border-radius:8px; font-weight:bold; font-size:14px;">點擊核銷</div>`;
             }

             html += `
             <div class="${classStr}" ${clickEvt}>
                <div style="flex:1; padding-right: 10px;">
                  <div style="font-size:12px; color:var(--accent-digital); font-weight:bold; margin-bottom:4px;">${actName}</div>
                  <div style="font-weight:bold; font-size:16px; color:#fff; line-height: 1.3;">🎁 ${gift}</div>
                </div>
                ${rightSide}
             </div>`;
         });
     }
     $('user-coupons-list').innerHTML = html;
  }

  function renderRewardsList() {
    let html = '';
    if(REWARDS_LIST.length === 0) {
       html = '<div style="color:var(--muted-foreground); font-size:14px; text-align:center; padding:10px;">尚未設定點數商品</div>';
    } else {
       REWARDS_LIST.forEach(item => {
         const myPts = Number(memberRecord && memberRecord.points) || 0;
         const canRedeem = (memberRecord && myPts >= item.points);
         const classStr = canRedeem ? "member-list-item" : "member-list-item disabled";
         // 🔧 修正：舊版呼叫的是 redeemReward()，但全專案只有 redeemPoints()，
         //    店員按「點擊兌換」只會得到 ReferenceError，畫面毫無反應 —— 這個功能其實一直是壞的。
         //    另外商品名稱要跳脫單引號，否則名稱含 ' 會把 onclick 字串拆斷。
         const safeName = String(item.name).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
         const clickEvt = canRedeem ? `onclick="redeemPoints('${safeName}', ${Number(item.points) || 0})"` : "";

         html += `
           <div class="${classStr}" ${clickEvt}>
             <div>
               <div style="font-weight:bold; font-size:16px; color:#fff; margin-bottom:4px;">🍔 ${item.name}</div>
               <div style="font-size:12px; color:var(--muted-foreground);">扣抵 <span style="font-weight:bold; color:var(--accent-digital);">${item.points}</span> 點</div>
             </div>
             <div style="background:${canRedeem ? 'var(--gradient-digital)' : 'transparent'}; color:${canRedeem ? '#fff' : 'var(--muted-foreground)'}; padding:6px 12px; border-radius:8px; font-weight:bold; font-size:14px;">${canRedeem ? '點擊兌換' : '點數不足'}</div>
           </div>
         `;
       });
    }
    $('reward-list').innerHTML = html;
  }

  window.prepRedeemCoupon = function(actName) {
      shownAct = actName;
      record = userCouponsData[actName];
      
      $("member-area").classList.add("hidden");
      renderRight(); 
  }

  /* 播一次「一筆畫出打勾」。
     dash 長度用 getTotalLength() 現場量，不寫死數字——
     之後若調整打勾的形狀，這裡不用跟著改。 */
  window.playSuccessCheck = function () {
    const box = $("success-check");
    if (!box) return;
    box.querySelectorAll(".sc-ring, .sc-tick").forEach((p) => {
      const len = p.getTotalLength();
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
    });
    box.classList.remove("play");
    void box.offsetWidth;              // 強制重排，動畫才會從頭播（連續核銷時很重要）
    box.classList.add("play");
    clearTimeout(box._scTimer);
    box._scTimer = setTimeout(() => box.classList.remove("play"), 1000);
  };

  window.redeem = async function() {
    const empName = $("employee-name").value.trim() || '001';

    if (record && (record.status === "已兌換" || record.status === "已過期")) {
        playAlert("error"); 
        return showToast("此憑證已失效，無法執行核銷！", "error");
    }

    if (!confirm("確定核銷優惠券？憑證將失效！")) return;
    
    const ph = shownPhone, st = store, ac = shownAct;
    const nowStr = fmtStamp();

    setBusy(true);
    try {
      /* 🔧 修正：舊版直接 updateDoc，只憑「查詢當下抓回來的本地快照」判斷是否已核銷。
         A 店員 10:00 查詢、10:03 才按核銷，這中間 B 店員已經核銷完的話，
         A 這次寫入會直接蓋掉 B 的紀錄，兩邊都顯示成功 → 餐點發了兩份。
         改用 transaction，在交易裡重新讀一次狀態，已被核銷就中止。*/
      await runTransaction(db, async (tx) => {
        const ref = doc(db, ac, ph);
        const snap = await tx.get(ref);
        if (!snap.exists()) throw new Error("NOT_FOUND");

        const cur = snap.data();
        if (cur.status === "已兌換") {
          const who = cur.store ? `${cur.store} ` : "";
          throw new Error(`ALREADY::${who}${cur.redeemTime || ""}`);
        }
        if (cur.status === "已過期") throw new Error("EXPIRED");

        tx.update(ref, { status: "已兌換", store: st, redeemTime: nowStr, redeemBy: empName });
      });

      record = Object.assign({}, record || {}, { status: "已兌換", store: st, redeemTime: nowStr, redeemBy: empName });
    } catch (e) {
      console.error("核銷失敗:", e);
      playAlert("error");
      if (String(e.message).startsWith("ALREADY::")) {
        showToast("⚠️ 這張券剛剛已經被核銷了！" + e.message.slice(9), "error");
        check(ph);                       // 重新查一次，把畫面更新成最新狀態
      } else if (e.message === "EXPIRED") {
        showToast("此憑證已過期，無法核銷。", "error");
      } else if (e.message === "NOT_FOUND") {
        showToast("查無此憑證，可能已被刪除。", "error");
      } else {
        showToast("核銷失敗，請確認網路連線後再試一次。", "error");
      }
      return;
    } finally { setBusy(false); }

    renderRight();
    showToast("✅ 核銷成功！", "success");

    const overlay = $("success-overlay");
    overlay.classList.remove("flash");
    void overlay.offsetWidth;
    overlay.classList.add("flash");
    playSuccessCheck();

    if (window.confetti) {
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 }, colors: ['#FFD700', '#FFA500', '#FF6B35', '#FFFFFF'], disableForReducedMotion: true });
    }

    const btn = $("btn-undo"); btn.classList.remove("hidden");
    let left = 5; btn.innerText = "⚡ 撤銷 (" + left + "s)";
    if (uTimer) clearInterval(uTimer);
    uTimer = setInterval(() => {
      left -= 1;
      if (left <= 0){ clearInterval(uTimer); btn.classList.add("hidden"); }
      else btn.innerText = "⚡ 撤銷 (" + left + "s)";
    }, 1000);
  }

  window.undo = async function() {
    if (uTimer) clearInterval(uTimer);
    const ph = shownPhone, ac = shownAct;
    setBusy(true);
    try {
      await updateDoc(doc(db, ac, ph), { status: "未兌換", store: "", redeemTime: "", redeemBy: "" });
    } catch (e) {
      // 🔧 舊版只有 finally 沒有 catch，撤銷失敗時例外會直接往外拋，
      //    店員只看到按鈕消失、以為撤銷成功了，實際上資料庫沒動。
      console.error("撤銷失敗:", e);
      showToast("撤銷失敗，請確認網路連線後再試一次。", "error");
      return;
    } finally { setBusy(false); }

    $("btn-undo").classList.add("hidden");
    showToast("已撤銷復原", "success");
    check(ph);
  }

  window.nextCust = function() {
    $("phone").value = ""; record = null; memberRecord = null; userCouponsData = {}; hideUndo(); 
    $("member-area").classList.add("hidden");
    $("detail").classList.add("hidden");
    if(currentMode !== 'counter') $("placeholder").classList.remove("hidden");
    setTimeout(() => $("phone").focus(), 100);
  }

  document.addEventListener("keydown", (e) => {
    if (document.activeElement.tagName === 'INPUT' && e.key !== 'Enter') return;
    if (e.key === "Enter") {
        e.preventDefault();
        if (!record || record.status === '已兌換' || record.status === '已過期') {
            if($("phone").value.trim().length > 0) check();
        } 
    } 
    else if (e.code === "Space" || e.key === " ") {
        if (record && record.status === "未兌換" && document.activeElement.tagName !== 'INPUT' && !$("detail").classList.contains("hidden")) {
            e.preventDefault(); window.redeem();
        }
    }
    else if (e.key === "Escape") { e.preventDefault(); nextCust(); }
  });

  $("btn-scan").onclick = startScan;
  $("btn-stop").onclick = stopScan;
  $("btn-check").onclick = () => check();
</script>
<!-- ============================================================
     自訂下拉選單：把原生 <select> 包一層，做出可以動畫的展開效果
     ------------------------------------------------------------
     為什麼不直接拿掉 <select> 自己刻一個？
       原生 select 彈出來的清單是「瀏覽器自己畫」的，網頁 CSS 完全碰不到，
       所以想要滑順展開只能自己做一份。但整組換掉風險很高——現有程式碼
       到處都在讀寫 select.value、直接塞 innerHTML 換選項、綁 onchange。

     所以這裡採「包一層」而不是「換掉」：
       · 原生 select 留在 DOM 裡（只是視覺上藏起來），仍然是唯一的真實狀態
       · 所有 .value 讀寫、innerHTML 換選項、onchange 全部照舊運作
       · 額外攔截 value 的 setter 跟選項變動，讓外觀跟著同步
     這樣就算動畫層有問題，底下的資料流也不會受影響。
     ============================================================ -->
<script>
(function () {
  var OPEN = 'open';
  var opened = null;
  var nativeValue = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');

  function sync(cs, sel) {
    var lab = cs.querySelector('.cs-label');
    var o = sel.options[sel.selectedIndex];
    if (lab) lab.textContent = o ? o.textContent : '';
  }

  function build(cs, sel) {
    var panel = cs.querySelector('.cs-panel');
    panel.innerHTML = '';
    Array.prototype.forEach.call(sel.options, function (opt, i) {
      var d = document.createElement('div');
      d.className = 'cs-opt' + (opt.value === sel.value ? ' selected' : '');
      d.textContent = opt.textContent;
      // 依序滑出；超過 12 項就不再累加，免得長清單要等很久才展開完
      d.style.transitionDelay = Math.min(i, 12) * 22 + 'ms';
      d.addEventListener('click', function (e) {
        e.stopPropagation();
        if (sel.value !== opt.value) {
          sel.value = opt.value;
          sel.dispatchEvent(new Event('change', { bubbles: true }));
        }
        sync(cs, sel);
        close(cs);
      });
      panel.appendChild(d);
    });
  }

  function open(cs, sel) {
    if (opened && opened !== cs) close(opened);
    build(cs, sel);          // 每次展開都重建，確保選項永遠是最新的
    sync(cs, sel);
    cs.classList.add(OPEN);
    opened = cs;
  }

  function close(cs) {
    // 收合時把 delay 清掉，否則會反過來一項一項慢慢消失，看起來拖泥帶水
    cs.querySelectorAll('.cs-opt').forEach(function (d) { d.style.transitionDelay = '0ms'; });
    cs.classList.remove(OPEN);
    if (opened === cs) opened = null;
  }

  function enhance(sel) {
    if (!sel || sel.getAttribute('data-cs') === '1') return;
    sel.setAttribute('data-cs', '1');

    var cls = sel.className;                       // 原本的 class 給觸發鈕沿用，外觀才不會跑掉
    var cs = document.createElement('div');
    cs.className = 'cs';
    sel.parentNode.insertBefore(cs, sel);
    cs.appendChild(sel);
    sel.classList.add('cs-native');

    var trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'cs-trigger ' + cls;
    trigger.innerHTML = '<span class="cs-label"></span><span class="cs-caret">▾</span>';
    cs.appendChild(trigger);

    var panel = document.createElement('div');
    panel.className = 'cs-panel';
    cs.appendChild(panel);

    trigger.addEventListener('click', function (e) {
      e.stopPropagation();
      if (sel.disabled) return;
      if (cs.classList.contains(OPEN)) { close(cs); } else { open(cs, sel); }
    });

    /* 程式碼用 sel.value = 'x' 直接指定時，原生不會發 change 事件，
       這裡攔下 setter 補一次同步，否則畫面上的文字會停在舊的值。 */
    Object.defineProperty(sel, 'value', {
      configurable: true,
      get: function () { return nativeValue.get.call(this); },
      set: function (v) { nativeValue.set.call(this, v); sync(cs, sel); }
    });

    // 選項被整批換掉（innerHTML = ...）時，顯示的文字也要跟著更新
    new MutationObserver(function () { sync(cs, sel); }).observe(sel, { childList: true });

    sel.addEventListener('change', function () { sync(cs, sel); });
    sync(cs, sel);
  }

  function enhanceAll() {
    document.querySelectorAll('select:not([data-cs])').forEach(enhance);
  }
  window.enhanceAllSelects = enhanceAll;   // 之後動態長出來的 select 可以手動再呼叫一次

  document.addEventListener('click', function () { if (opened) close(opened); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && opened) close(opened); });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', enhanceAll);
  else enhanceAll();
})();
</script>
