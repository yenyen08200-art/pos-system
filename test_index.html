<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#12141C" />
<title>抽獎核銷系統 | 門市 POS 兌換平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" />
<style>
:root{
  --bg:#12141C;
  --surface:#1A1D27;
  --surface-2:#232734;
  --surface-3:#2C3140;
  --text:#F5F7FA;
  --muted:#8B92A6;
  --border:rgba(255,255,255,.09);
  --border-strong:rgba(255,255,255,.16);
  --primary:#FF6B35;
  --primary-2:#FF8C42;
  --primary-ink:#1A0E06;
  --success:#22E08A;
  --success-ink:#052915;
  --danger:#FF4D5E;
  --gradient:linear-gradient(135deg,#FF6B35,#FF8C42);
  --radius:18px;
  --tap:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;background:var(--bg)}
body{
  min-height:100%;width:100%;overflow-x:hidden;
  background:var(--bg);color:var(--text);
  font-family:"Space Grotesk","Noto Sans TC",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
main{
  min-height:100vh;width:100%;max-width:100vw;overflow-x:hidden;
  background-image:
    radial-gradient(circle at 12% -5%, rgba(255,107,53,.14), transparent 42%),
    radial-gradient(circle at 92% 0%, rgba(34,224,138,.08), transparent 40%);
}
.wrap{max-width:720px;margin:0 auto;width:100%;padding:16px 14px 40px}
@media(min-width:1024px){.wrap{max-width:1120px;padding:28px 24px 48px}}

/* ---------- header ---------- */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:14px;font-size:24px;
  background-image:var(--gradient);color:var(--primary-ink);box-shadow:0 10px 26px -12px rgba(255,107,53,.7)}
h1{font-size:clamp(19px,5vw,26px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.status{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:12px;flex:none;max-width:48vw}
.status .lbl{color:var(--muted);white-space:nowrap}
#duty{font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{position:relative;display:inline-flex;width:9px;height:9px;flex:none}
.dot i{position:absolute;inset:0;border-radius:999px;background:var(--success)}
.dot i:first-child{opacity:.7;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}

/* ---------- layout ---------- */
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1024px){.grid{grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:22px;align-items:start}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:16px}
@media(min-width:768px){.panel{padding:20px}}
.rise{animation:rise .4s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.block+.block{margin-top:20px}
.label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.label::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--primary)}
button{font-family:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}

/* ---------- store dropdown ---------- */
.store-dd{border:1px solid var(--border);border-radius:16px;background:var(--surface-2);overflow:hidden}
.store-dd[open]{border-color:rgba(255,107,53,.4)}
.store-dd-sum{list-style:none;display:flex;align-items:center;gap:10px;min-height:60px;padding:0 16px;cursor:pointer;user-select:none}
.store-dd-sum::-webkit-details-marker{display:none}
.store-dd-sum .pin{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--surface-3);font-size:17px}
.store-dd-sum .txt{display:flex;flex-direction:column;min-width:0;flex:1}
.store-dd-sum .txt small{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
#store-dd-label{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{margin-left:auto;color:var(--muted);font-size:14px;transition:transform .25s}
.store-dd[open] .chev{transform:rotate(180deg)}
.stores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:6px 12px 14px}
@media(min-width:640px){.stores{grid-template-columns:repeat(3,minmax(0,1fr))}}
.store-btn{width:100%;min-height:52px;border-radius:12px;border:1px solid var(--border);background:var(--surface-3);color:var(--text);
  font-size:15px;font-weight:600;transition:transform .12s,background .2s,border-color .2s;padding:0 8px}
.store-btn:active{transform:scale(.96)}
.store-btn.on{background-image:var(--gradient);color:var(--primary-ink);border-color:transparent;box-shadow:0 10px 24px -12px rgba(255,107,53,.8)}

/* ---------- activity list (reversed hierarchy) ---------- */
.acts{display:flex;flex-direction:column;gap:10px;width:100%}
.act-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:78px;padding:12px 16px;text-align:left;
  border-radius:16px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);transition:transform .12s,background .2s,border-color .2s}
.act-btn:active{transform:scale(.99)}
.act-btn.on{border-color:var(--primary);background:rgba(255,107,53,.12)}
.act-btn>span:first-child{display:flex;flex-direction:column-reverse;gap:3px;min-width:0}
.act-gift{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em;color:var(--text);line-height:1.15;word-break:break-word}
.act-name{display:block;font-size:12px;font-weight:500;color:var(--muted);line-height:1.3}
.radio{width:22px;height:22px;flex:none;border-radius:999px;border:2px solid var(--muted);position:relative;transition:all .2s}
.act-btn.on .radio{border-color:var(--primary);background:var(--primary)}
.act-btn.on .radio::after{content:"";position:absolute;inset:5px;border-radius:999px;background:var(--primary-ink)}
.empty{border:1px dashed var(--border);border-radius:14px;padding:22px;text-align:center;font-size:14px;color:var(--muted)}

/* ---------- search / input ---------- */
.searchbar{display:flex;flex-wrap:wrap;gap:10px;width:100%}
#phone{flex:1 1 60%;min-width:0;min-height:var(--tap);border-radius:14px;border:1px solid var(--border-strong);background:rgba(0,0,0,.28);
  color:var(--text);padding:0 16px;font-size:22px;font-weight:700;letter-spacing:.06em;outline:none;transition:border-color .2s,box-shadow .2s}
#phone::placeholder{font-size:14px;font-weight:400;letter-spacing:normal;color:var(--muted)}
#phone:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(255,107,53,.22)}
#btn-check{flex:1 1 30%;min-width:120px;min-height:var(--tap);padding:0 22px;font-size:19px;font-weight:800;border:none;border-radius:14px;
  background-image:var(--gradient);color:var(--primary-ink);box-shadow:0 14px 30px -16px rgba(255,107,53,.9);transition:transform .12s,filter .2s}
#btn-check:active{transform:scale(.96)}
#btn-scan{flex:1 1 100%;min-height:58px;border-radius:14px;font-size:17px;font-weight:700;color:var(--text);
  border:1px dashed var(--border-strong);background:var(--surface-2);transition:transform .12s,background .2s;display:flex;align-items:center;justify-content:center;gap:8px}
#btn-scan::before{content:"📷";font-size:20px}
#btn-scan:active{transform:scale(.98);background:var(--surface-3)}

/* ---------- FULLSCREEN scanner ---------- */
#scan-area{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  animation:fade .2s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
#scan-area.hidden{display:none!important}
.reader-wrap{position:relative;overflow:hidden;border-radius:22px;width:min(88vw,420px);aspect-ratio:1/1;
  border:2px solid rgba(255,107,53,.55);box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
#reader{width:100%;height:100%}
#reader video{width:100%!important;height:100%!important;object-fit:cover}
.scanline{position:absolute;left:6%;right:6%;top:0;height:3px;border-radius:3px;background:var(--primary);
  box-shadow:0 0 14px 2px rgba(255,107,53,.8);pointer-events:none;animation:scan 2.4s linear infinite}
@keyframes scan{0%{top:4%}100%{top:96%}}
.scan-hint{position:fixed;top:calc(env(safe-area-inset-top,0px) + 28px);left:0;right:0;text-align:center;color:#fff;font-size:16px;font-weight:600;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.8)}
#btn-stop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
  width:min(88vw,420px);min-height:72px;border-radius:18px;font-size:19px;font-weight:800;color:#fff;
  border:1px solid rgba(255,77,94,.6);background:rgba(255,77,94,.22);backdrop-filter:blur(6px);transition:transform .12s,background .2s}
#btn-stop:active{transform:translateX(-50%) scale(.97);background:rgba(255,77,94,.35)}

/* ---------- result / detail ---------- */
.right{display:flex;flex-direction:column}
.placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:56px 16px;min-height:280px}
.placeholder .emoji{font-size:56px;opacity:.35}
.placeholder .p1{font-size:18px;font-weight:700}
.placeholder .p2{font-size:14px;color:var(--muted);max-width:22rem;line-height:1.55}
.detail{flex:1;display:flex;flex-direction:column;gap:16px}
.banner{border-radius:16px;padding:16px 18px;font-size:18px;font-weight:800;border:1px solid;word-break:break-word}
.banner.ok{border-color:rgba(34,224,138,.5);background:rgba(34,224,138,.12);color:var(--success)}
.banner.bad{border-color:rgba(255,77,94,.5);background:rgba(255,77,94,.12);color:var(--danger)}
.banner small{display:block;font-size:13px;font-weight:500;opacity:.85;margin-top:5px}
.cards{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media(min-width:520px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.info{border:1px solid var(--border);background:var(--surface-2);border-radius:16px;padding:14px 16px}
.info.hl{border-color:rgba(255,107,53,.5);background:rgba(255,107,53,.1)}
.info .k{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.info .v{margin-top:6px;font-size:20px;font-weight:800;word-break:break-word}
.info.hl .v{font-size:24px;color:var(--primary-2)}
.info .v.mono{letter-spacing:.06em}
.actions{margin-top:6px;display:flex;flex-direction:column;gap:12px;width:100%}
.redeem{min-height:100px;width:100%;border:none;border-radius:20px;font-size:28px;font-weight:900;letter-spacing:.03em;
  background-image:var(--gradient);color:var(--primary-ink);box-shadow:0 24px 48px -20px rgba(255,107,53,1);transition:transform .12s,filter .2s}
.redeem:active{transform:scale(.98)}
.undo{min-height:56px;width:100%;border-radius:16px;font-size:17px;font-weight:700;color:var(--success);
  border:1px solid rgba(34,224,138,.5);background:rgba(34,224,138,.12);transition:background .2s}
.undo:active{background:rgba(34,224,138,.22)}
.next{min-height:56px;width:100%;border-radius:16px;font-size:16px;font-weight:600;color:var(--muted);
  border:1px solid var(--border);background:var(--surface-2);transition:transform .12s,color .2s}
.next:active{transform:scale(.98);color:var(--text)}
.hidden{display:none!important}
</style>
</head>
<body>
<main>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">⚡</div>
        <div>
          <h1>抽獎核銷系統</h1>
          <p class="sub">Redemption POS · 內部測試區</p>
        </div>
      </div>
      <div class="status">
        <span class="dot"><i></i><i></i></span>
        <span class="lbl">值班</span>
        <span id="duty">尚未選擇</span>
      </div>
    </header>

    <div class="grid">
      <!-- LEFT -->
      <section class="panel rise">
        <div class="block">
          <h2 class="label">選擇門市</h2>
          <details id="store-dd" class="store-dd">
            <summary class="store-dd-sum">
              <span class="pin">📍</span>
              <span class="txt">
                <small>Store</small>
                <span id="store-dd-label">尚未選擇門市</span>
              </span>
              <span class="chev">▾</span>
            </summary>
            <div class="stores" id="stores"></div>
          </details>
        </div>

        <div class="block">
          <h2 class="label">活動選單</h2>
          <div id="acts"></div>
        </div>

        <div class="block">
          <h2 class="label">掃描 / 查詢</h2>
          <div class="searchbar">
            <input id="phone" type="tel" placeholder="輸入手機或市話 (例:02-1234567)" oninput="this.value=this.value.replace(/[^\d\-]/g,'').slice(0,15)" />
            <button id="btn-check">查詢</button>
            <button id="btn-scan" aria-label="掃描 QR Code">掃描 QR Code</button>
          </div>
          <div id="scan-area" class="hidden">
            <p class="scan-hint">將 QR Code 對準框內</p>
            <div class="reader-wrap">
              <div id="reader"></div>
              <div class="scanline"></div>
            </div>
            <button id="btn-stop">✖ 關閉相機</button>
          </div>
        </div>
      </section>

      <!-- RIGHT -->
      <section class="panel rise right">
        <div id="placeholder" class="placeholder">
          <div class="emoji">🎟️</div>
          <p class="p1">等待掃描顧客憑證</p>
          <p class="p2">選擇門市與活動後，掃描 QR Code 或輸入手機號碼即可帶出顧客資訊。</p>
        </div>
        <div id="detail" class="detail hidden">
          <div id="banner" class="banner ok rise"></div>
          <div class="cards">
            <div class="info"><div class="k">📱 兌換手機</div><div class="v mono" id="v-phone">—</div></div>
            <div class="info"><div class="k">👤 顧客姓名</div><div class="v" id="v-name">—</div></div>
            <div class="info"><div class="k">🔗 社群帳號</div><div class="v" id="v-social">—</div></div>
            <div class="info hl"><div class="k">🎁 兌換餐點</div><div class="v" id="v-gift">—</div></div>
          </div>
          <div class="actions">
            <button class="redeem" id="btn-redeem">✔ 確認核銷優惠</button>
            <button class="undo hidden" id="btn-undo">⚡ 撤銷 (5s)</button>
            <button class="next" id="btn-next">🧹 清除／服務下一位</button>
          </div>
        </div>
      </section>
    </div>
  </div>
</main>

<!-- UI enhancement only: auto-close the store dropdown and mirror the choice into the summary label.
     Uses event delegation so it never touches the module logic, ids, or onclick handlers below. -->
<script>
(function(){
  function syncLabel(btn){
    var lbl = document.getElementById('store-dd-label');
    if(lbl && btn) lbl.textContent = btn.textContent;
  }
  document.addEventListener('click', function(e){
    var btn = e.target.closest && e.target.closest('#stores .store-btn');
    if(!btn) return;
    syncLabel(btn);
    var dd = document.getElementById('store-dd');
    if(dd) dd.open = false;
  });
  // reflect a previously-saved store once the module has rendered its buttons
  setTimeout(function(){ syncLabel(document.querySelector('#stores .store-btn.on')); }, 400);
})();
</script>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script type="module">
// 🔥 防彈架構：動態載入 config.js 防快取
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBINQuYtYZA8RLfwm51AfGLTYj1TX_UcFo",
  authDomain: "texas-chick-event.firebaseapp.com",
  projectId: "texas-chick-event",
  storageBucket: "texas-chick-event.firebasestorage.app",
  messagingSenderId: "281248037440",
  appId: "1:281248037440:web:20c32ba4136ea7c57ffda5",
  measurementId: "G-HZ6334WB3B",
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const module = await import("./config.js?v=" + new Date().getTime());
const { STORE_LIST, POS_CONFIG } = module;

const evMap = {};
STORE_LIST.forEach(s => {
  evMap[s] = [];
  for (const act in POS_CONFIG) {
    if (POS_CONFIG[act].stores === "ALL" || POS_CONFIG[act].stores.includes(s)) {
      evMap[s].push(act);
    }
  }
});

const giftMap = {};
for (const act in POS_CONFIG) {
  giftMap[act] = POS_CONFIG[act].gift;
}

let audioCtx = null;
function playAlert(type){
  if (navigator.vibrate){
    if (type === "scan") navigator.vibrate([150]);
    if (type === "error") navigator.vibrate([300]);
    if (type === "success") navigator.vibrate([100,50,100,50,200]);
  }
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  if (!audioCtx) return;
  if (audioCtx.state === "suspended") audioCtx.resume();
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  if (type === "scan"){
    osc.frequency.value = 1200; osc.type = "sine";
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === "error"){
    osc.frequency.value = 300; osc.type = "square";
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  } else {
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
    osc.type = "sine";
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  }
}

const $ = (id) => document.getElementById(id);
let store = "", act = "", shownPhone = "", shownAct = "", record = null;
let scanner = null, uTimer = null, busy = false;

function setBusy(b){
  busy = b;
  $("btn-check").disabled = b;
  $("btn-redeem").disabled = b;
  $("btn-check").innerText = b ? "查詢中…" : "查詢";
}

function renderStores(){
  const box = $("stores"); box.innerHTML = "";
  STORE_LIST.forEach((s) => {
    const b = document.createElement("button");
    b.className = "store-btn" + (store === s ? " on" : "");
    b.innerText = s;
    b.onclick = () => selectStore(s);
    box.appendChild(b);
  });
  $("duty").innerText = store || "尚未選擇";
}

function renderActs(){
  const box = $("acts"); box.innerHTML = "";
  if (!store){
    box.innerHTML = '<p class="empty">請先選擇門市</p>';
    return;
  }
  const list = document.createElement("div");
  list.className = "acts";
  (evMap[store] || []).forEach((a) => {
    const b = document.createElement("button");
    b.className = "act-btn" + (act === a ? " on" : "");
    b.innerHTML = '<span><span class="act-name"></span><span class="act-gift"></span></span><span class="radio"></span>';
    b.querySelector(".act-name").innerText = a;
    b.querySelector(".act-gift").innerText = "🎁 " + (giftMap[a] || "專屬活動贈品");
    
    // 🔥 點擊活動後，自動把游標停在輸入框
    b.onclick = () => { 
      act = a; 
      renderActs(); 
      setTimeout(() => $("phone").focus(), 100); 
    };
    list.appendChild(b);
  });
  box.appendChild(list);
}

function selectStore(s){
  store = s;
  localStorage.setItem("p_store", s);
  act = (evMap[s] || [])[0] || "";
  record = null;
  renderStores(); renderActs(); renderRight();
  // 🔥 點擊門市後，自動把游標停在輸入框
  setTimeout(() => $("phone").focus(), 100);
}

function renderRight(){
  if (!record){
    $("placeholder").classList.remove("hidden");
    $("detail").classList.add("hidden");
    return;
  }
  $("placeholder").classList.add("hidden");
  $("detail").classList.remove("hidden");
  
  const isClaimed = record.status === "已兌換";
  const isExpired = record.status === "已過期";
  const isInvalid = isClaimed || isExpired; 

  const banner = $("banner");
  banner.className = "banner rise " + (isInvalid ? "bad" : "ok");
  
  if (isClaimed) {
    banner.innerHTML = "❌ 券已失效 / 已領取<small>📌 於 " + (record.store || "—") + " 兌換</small><small>🕒 " + (record.redeemTime || "—") + "</small>";
  } else if (isExpired) {
    banner.innerHTML = "⚠️ 券已逾期失效<small>🕒 系統已結算過期</small>";
  } else {
    banner.innerHTML = "✅ 有效優惠券";
  }

  $("v-phone").innerText = shownPhone;
  $("v-name").innerText = record.name || "—";
  $("v-social").innerText = record.social_id || "未提供";
  $("v-gift").innerText = giftMap[shownAct] || "專屬活動贈品";
  $("btn-redeem").classList.toggle("hidden", isInvalid);
}

function renderContent(data, ph, ac){
  shownPhone = ph; shownAct = ac; record = data;
  hideUndo();
  renderRight();
}
function hideUndo(){
  if (uTimer) clearInterval(uTimer);
  $("btn-undo").classList.add("hidden");
}

async function startScan(){
  $("scan-area").classList.remove("hidden");
  if (!scanner) scanner = new Html5Qrcode("reader");
  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    (txt) => {
      const digits = txt.replace(/[^\d\-]/g, "");
      $("phone").value = digits;
      stopScan();
      check(digits);
    },
    () => {}
  ).catch(() => alert("無相機權限"));
}
function stopScan(){
  if (scanner && scanner.isScanning) scanner.stop();
  $("scan-area").classList.add("hidden");
}

async function check(overridePhone){
  const ph = overridePhone || $("phone").value;
  const st = store, ac = act;
  if (!st || !ac || !ph) return alert("⚠️ 資料未齊！");

  record = null; renderRight();
  setBusy(true);
  try {
    const snap = await getDoc(doc(db, ac, ph));
    if (snap.exists()){
      playAlert("scan");
      renderContent(snap.data(), ph, ac);
      return;
    }
    const otherActs = (evMap[st] || []).filter((a) => a !== ac);
    let foundOtherData = null, foundOtherActName = "";
    for (const otherAct of otherActs){
      const otherSnap = await getDoc(doc(db, otherAct, ph));
      if (otherSnap.exists()){
        const data = otherSnap.data();
        if (data.status !== "已兌換"){ foundOtherData = data; foundOtherActName = otherAct; break; }
      }
    }
    if (foundOtherData){
      playAlert("error");
      if (confirm("❌ 找不到「" + ac + "」的紀錄。\n\n💡 但發現客人有未兌換的「" + foundOtherActName + "」，是否要自動切換過去？")){
        act = foundOtherActName;
        renderActs();
        renderContent(foundOtherData, ph, foundOtherActName);
      } else {
        $("phone").value = "";
      }
    } else {
      playAlert("error");
      alert("❌ 查無號碼，或該客人的所有活動皆已兌換完畢！");
      $("phone").value = "";
    }
  } finally {
    setBusy(false);
  }
}

async function redeem(){
  if (!confirm("確定核銷？憑證將失效！")) return;
  const ph = shownPhone, st = store, ac = act;
  const d = new Date(), pad = (n) => (n < 10 ? "0" + n : String(n));
  const nowStr = d.getFullYear() + "/" + pad(d.getMonth()+1) + "/" + pad(d.getDate()) + " " +
                 pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  setBusy(true);
  try {
    await updateDoc(doc(db, ac, ph), { status: "已兌換", store: st, redeemTime: nowStr });
  } finally {
    setBusy(false);
  }
  record = Object.assign({}, record || {}, { status: "已兌換", store: st, redeemTime: nowStr });
  renderRight();
  playAlert("success");
  if (window.confetti) confetti({ particleCount: 80, spread: 70 });

  const btn = $("btn-undo");
  btn.classList.remove("hidden");
  let left = 5;
  btn.innerText = "⚡ 撤銷 (" + left + "s)";
  if (uTimer) clearInterval(uTimer);
  uTimer = setInterval(() => {
    left -= 1;
    if (left <= 0){ clearInterval(uTimer); btn.classList.add("hidden"); }
    else btn.innerText = "⚡ 撤銷 (" + left + "s)";
  }, 1000);
}

async function undo(){
  if (uTimer) clearInterval(uTimer);
  const ph = shownPhone, ac = act;
  setBusy(true);
  try {
    await updateDoc(doc(db, ac, ph), { status: "", store: "", redeemTime: "" });
  } finally {
    setBusy(false);
  }
  $("btn-undo").classList.add("hidden");
  alert("✅ 已撤銷！");
  check(ph);
}

function nextCust(){
  $("phone").value = "";
  record = null;
  hideUndo();
  renderRight();
  // 🔥 按下服務下一位後，自動把游標停在輸入框
  setTimeout(() => $("phone").focus(), 100);
}

$("btn-scan").onclick = startScan;
$("btn-stop").onclick = stopScan;
$("btn-check").onclick = () => check();
$("btn-redeem").onclick = redeem;
$("btn-undo").onclick = undo;
$("btn-next").onclick = nextCust;
$("phone").addEventListener("keydown", (e) => { if (e.key === "Enter") check(); });

const saved = localStorage.getItem("p_store");
if (saved && evMap[saved]){ store = saved; act = evMap[saved][0] || ""; }
renderStores(); renderActs(); renderRight();
</script>
</body>
</html>
