<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>內部測試區</title>
  <link rel="apple-touch-icon" href="icon.png">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    /* 🎨 視覺風格基調：同步戰情室的暖色復古大地色系 */
    :root {
      --bg-cream: #f5f2eb;       /* 整體乳黃色背景 */
      --sidebar-bg: #8c7a5b;     /* 主視覺：深橄欖棕 */
      --card-bg: #ffffff;        /* 純白卡片背景 */
      --text-main: #3e382b;      /* 深咖啡色主文字 */
      --text-sub: #8c8270;       /* 柔和副文字 */
      --accent-orange: #d96b43;  /* 炸雞橘紅 (用於主要行動) */
      --accent-green: #6b8c6e;   /* 柔和植栽綠 (用於成功狀態) */
      --accent-gray: #8c8c8c;    /* 復古灰 (用於失效/撤銷) */
      --border-light: #e6dec5;   /* 卡片邊框色 */
    }

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-cream); color: var(--text-main); margin: 0; padding: 16px; display: flex; justify-content: center; min-height: 100vh; align-items: flex-start; }
    .container { width: 100%; max-width: 420px; margin-top: 10px; }
    
    .card { background: var(--card-bg); padding: 24px 20px; border-radius: 20px; text-align: center; border: 2px solid var(--border-light); margin-bottom: 15px; box-shadow: 0 10px 30px rgba(62,56,43,0.06); }
    h2 { margin: 0 0 15px; color: var(--text-main); font-weight: 900; letter-spacing: 1px; }
    
    select, input, button { width: 100%; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 900; outline: none; margin-bottom: 12px; box-sizing: border-box; transition: 0.2s; font-family: inherit; }
    select { background: #faf8f5; color: var(--text-main); border: 2px solid var(--border-light); cursor: pointer; }
    input { background: #faf8f5; border: 2px solid var(--border-light); color: var(--text-main); letter-spacing: 1px; }
    input:focus { border-color: var(--accent-orange); box-shadow: 0 0 10px rgba(217, 107, 67, 0.15); }
    
    button { cursor: pointer; border: none; letter-spacing: 1px; }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    
    /* 統一按鈕配色 */
    .btn-green { background: var(--sidebar-bg); color: #fff; } /* 查詢按鈕：深橄欖棕 */
    .btn-redeem { background: var(--accent-orange); color: #fff; font-size: 18px; padding: 20px; box-shadow: 0 4px 15px rgba(217, 107, 67, 0.3); } /* 核銷按鈕：橘紅 */
    .btn-undo { background: var(--accent-gray); color: white; } /* 撤銷按鈕：復古灰 */
    .btn-dark { background: var(--accent-green); color: white; } /* 掃描按鈕：植栽綠 */
    .btn-next { background: transparent; color: var(--sidebar-bg); border: 2px dashed var(--sidebar-bg); padding: 14px; margin-top: 15px; } /* 下一位按鈕 */

    .info-row { display: flex; justify-content: center; margin-bottom: 12px; font-size: 16px; border-bottom: 1px dashed var(--border-light); padding-bottom: 8px;}
    .info-row strong { color: var(--text-sub); width: 100px; text-align: left; }
    .info-row span { color: var(--text-main); width: 150px; text-align: left; font-size: 18px; font-weight: 900;}
    
    #id-text { font-family: monospace; font-size: 20px !important; }
    #social-text { color: var(--sidebar-bg); }
    #gift-text { color: var(--accent-orange); font-size: 20px !important; }
    
    .status-box { padding: 16px; border-radius: 12px; font-weight: 900; font-size: 18px; margin: 20px 0; letter-spacing: 1px; }
    .unclaimed { background: rgba(107, 140, 110, 0.12); color: var(--accent-green); border: 2px solid var(--accent-green); } /* 綠色代表可以核銷 */
    .claimed { background: rgba(140, 140, 140, 0.12); color: var(--accent-gray); border: 2px solid var(--accent-gray); } /* 灰色代表已失效 */

    /* 掃描器外觀微調 */
    #reader-container { display:none; background: #faf8f5; border-radius:16px; overflow:hidden; border:2px solid var(--border-light); margin-top:10px; }
  </style>
</head>
<body>

<div class="container">
  <div class="card" style="padding:15px 20px;">
    <label style="color:var(--text-sub); font-size:14px; font-weight:900; display:block; margin-bottom:8px; text-align:left;">📍 今日值班門市</label>
    <select id="store" onchange="loadAct()" style="margin-bottom:0;"><option value="">請選擇門市</option><option>嘉義門市</option><option>成功門市</option><option>安醫門市</option><option>三井門市</option><option>三多門市</option><option>台鋁門市</option><option>義享門市</option><option>左車門市</option><option>屏車門市</option></select>
  </div>

  <div class="card">
    <h2>⚡ 抽獎核銷系統</h2>
    <select id="act" style="background:#f5f2eb; border-color:var(--border-light); color:var(--text-main);"><option value="">請先選擇門市</option></select>
    
    <div style="display:flex; gap:8px;">
      <input type="tel" id="phone" placeholder="顧客手機" style="flex:1;" oninput="this.value=this.value.replace(/\D/g,'').slice(0,10)">
      <button class="btn-dark" onclick="startScan()" style="width:55px; font-size:22px; padding:0;" title="掃描">📷</button>
      <button class="btn-green" id="btn-search" onclick="check()" style="width:90px;">查詢</button>
    </div>
    
    <div id="reader-container"><div id="reader"></div><button onclick="stopScan()" style="background:var(--accent-gray); color:#fff; border-radius:0; margin:0;">✖ 關閉</button></div>

    <div id="content" style="display:none; background:#faf8f5; padding:25px; border-radius:18px; margin-top:20px; border:1px solid var(--border-light);">
      <div class="info-row"><strong>📱 兌換手機</strong><span id="id-text"></span></div>
      <div class="info-row"><strong>👤 顧客姓名</strong><span id="name-text"></span></div>
      <div class="info-row"><strong>🔗 社群帳號</strong><span id="social-text"></span></div> 
      <div class="info-row"><strong>🎁 兌換餐點</strong><span id="gift-text"></span></div> 
      <div id="status" class="status-box"></div>
      <div id="action-area"><button id="btn-redeem" class="btn-redeem" onclick="redeem()">✔ 確認核銷優惠</button></div>
      <div id="undo-area" style="display:none;"><button id="btn-undo" class="btn-undo" onclick="undo()">⚡ 撤銷 (<span id="t-undo">5</span>s)</button></div>
      <div id="next-area" style="display:none;"><button class="btn-next" onclick="nextCust()">🧹 清除／服務下一位</button></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBINQuYtYZA8RLfwm51AfGLTYj1TX_UcFo",
    authDomain: "texas-chick-event.firebaseapp.com",
    projectId: "texas-chick-event",
    storageBucket: "texas-chick-event.firebasestorage.app",
    messagingSenderId: "281248037440",
    appId: "1:281248037440:web:20c32ba4136ea7c57ffda5",
    measurementId: "G-HZ6334WB3B"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const evMap = { "嘉義門市":["活動測試區","活動測試區2"], "成功門市":["活動測試區","活動測試區3"], "安醫門市":["活動測試區"], "三井門市":["活動測試區"], "三多門市":["活動測試區"], "台鋁門市":["活動測試區"], "義享門市":["活動測試區"], "左車門市":["活動測試區"], "屏車門市":["活動測試區"] };
  const giftMap = { "活動測試區": "香辣小炸雞(小)", "活動測試區2": "蛋黃酥乙顆", "活動測試區3": "神杖一顆"}; 
  const $ = id => document.getElementById(id);
  let scanner, uTimer;

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playAlert(type) {
    if (navigator.vibrate) {
      if (type === 'scan') navigator.vibrate([150]); 
      if (type === 'error') navigator.vibrate([300]); 
      if (type === 'success') navigator.vibrate([100, 50, 100, 50, 200]); 
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    
    if(type === 'scan') { 
      osc.frequency.value = 1200; osc.type = 'sine';
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if(type === 'error') { 
      osc.frequency.value = 300; osc.type = 'square';
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    } else if(type === 'success') { 
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
      osc.type = 'sine'; gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
  }

  window.loadAct = loadAct;
  window.startScan = startScan;
  window.stopScan = stopScan;
  window.nextCust = nextCust;
  window.check = check;
  window.redeem = redeem;
  window.undo = undo;

  window.onload = () => { if(localStorage.getItem('p_store')) { $('store').value = localStorage.getItem('p_store'); loadAct(); } };
  function loadAct() { const s = $('store').value; localStorage.setItem('p_store', s); $('act').innerHTML = s ? evMap[s].map(a=>`<option>${a}</option>`).join('') : '<option>選擇門市</option>'; }

  function startScan() {
    $('reader-container').style.display = 'block';
    if(!scanner) scanner = new Html5Qrcode("reader");
    scanner.start({facingMode:"environment"}, {fps:10, qrbox:250}, txt => { 
      $('phone').value=txt.replace(/\D/g,''); 
      stopScan(); 
      check(); 
    }, ()=>{}).catch(e=>alert("無相機權限"));
  }
  function stopScan() { if(scanner && scanner.isScanning) scanner.stop(); $('reader-container').style.display='none'; }
  function nextCust() { $('phone').value = ""; $('content').style.display = 'none'; $('phone').focus(); }

  async function check() {
    const ph=$('phone').value, st=$('store').value, ac=$('act').value;
    if(!st || !ac || !ph) return alert("⚠️ 資料未齊！");

    $('content').style.display = 'none';

    const docRef = doc(db, ac, ph);
    const docSnap = await getDoc(docRef);

    if (docSnap.exists()) {
      const data = docSnap.data();
      playAlert('scan'); 
      renderContent(data, ph, ac);
    } else {
      const otherActs = evMap[st].filter(a => a !== ac);
      let foundOtherData = null;
      let foundOtherActName = "";

      for (const otherAct of otherActs) {
        const otherSnap = await getDoc(doc(db, otherAct, ph));
        if (otherSnap.exists()) {
          const data = otherSnap.data();
          if (data.status !== "已兌換") {
            foundOtherData = data;
            foundOtherActName = otherAct;
            break; 
          }
        }
      }

      if (foundOtherData) {
        playAlert('error'); 
        if (confirm(`❌ 找不到「${ac}」的紀錄。\n\n💡 但發現客人有未兌換的「${foundOtherActName}」，是否要自動切換過去？`)) {
          $('act').value = foundOtherActName; 
          renderContent(foundOtherData, ph, foundOtherActName);
        } else {
          $('phone').value = "";
        }
      } else {
        playAlert('error'); 
        alert("❌ 查無號碼，或該客人的所有活動皆已兌換完畢！");
        $('phone').value = "";
      }
    }
  }

  function renderContent(data, ph, ac) {
    $('content').style.display='block';
    $('id-text').innerText=ph;
    $('name-text').innerText=data.name;
    $('social-text').innerText=data.social_id || "未提供";
    $('gift-text').innerText = giftMap[ac] || "專屬活動贈品";
    setUI(data);
    $('next-area').style.display='block';
  }

  function setUI(r) {
    if(r.status === "已兌換") {
      $('status').className="status-box claimed";
      // 狀態文字的顏色也改為溫潤的復古灰
      $('status').innerHTML = `❌ 券已失效 / 已領取<br><span style="font-size:14px; color:var(--text-sub); display:block; margin-top:10px; font-weight:700;">📌 於 ${r.store} 兌換<br>🕒 ${r.redeemTime}</span>`;
      $('action-area').style.display='none';
    } else {
      $('status').className="status-box unclaimed";
      $('status').innerText="✅ 有效優惠券";
      $('action-area').style.display='block';
      $('btn-redeem').disabled=false;
    }
  }

  async function redeem() {
    if(!confirm("確定核銷？憑證將失效！")) return;
    const ph = $('id-text').innerText, st = $('store').value, ac = $('act').value;
    
    const d = new Date();
    const pad = n => n < 10 ? '0' + n : n;
    const nowStr = `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;

    const docRef = doc(db, ac, ph);
    await updateDoc(docRef, { status: "已兌換", store: st, redeemTime: nowStr });

    setUI({ status: "已兌換", store: st, redeemTime: nowStr });
    playAlert('success'); 
    confetti({particleCount:80, spread:70});

    $('undo-area').style.display='block'; $('btn-undo').disabled=false; $('btn-undo').innerHTML='⚡ 撤銷 (<span id="t-undo">5</span>s)';
    let left=5; uTimer=setInterval(()=>{ if(--left<=0) {clearInterval(uTimer); $('undo-area').style.display='none';} else $('t-undo').innerText=left; }, 1000);
  }

  async function undo() {
    clearInterval(uTimer);
    const ph = $('id-text').innerText, ac = $('act').value;
    const docRef = doc(db, ac, ph);
    await updateDoc(docRef, { status: "", store: "", redeemTime: "" });
    $('undo-area').style.display='none';
    alert("✅ 已撤銷！");
    check();
  }
</script>
</body>
</html>
