<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>德州小騎士 VIP 會員</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { navy: '#0B2B5E', navyDeep: '#071D42', gold: '#F2A900' },
        fontFamily: { tc: ['"Noto Sans TC"', 'sans-serif'] },
      },
    },
  };
</script>
<style>
  html, body { -webkit-tap-highlight-color: transparent; }
  body { font-family: "Noto Sans TC", sans-serif; }
  @keyframes floatOrb {
    0%   { transform: translate(-10%, -10%) scale(1); }
    50%  { transform: translate(15%, 10%) scale(1.18); }
    100% { transform: translate(-10%, -10%) scale(1); }
  }
  .orb {
    animation: floatOrb 26s ease-in-out infinite;
    background: radial-gradient(circle at 50% 50%, rgba(242,169,0,.85), rgba(242,169,0,.18) 55%, rgba(242,169,0,0) 72%);
    filter: blur(70px);
  }
  @media (prefers-reduced-motion: reduce) { .orb { animation: none; } }
  .glass { background: rgba(255,255,255,.12); backdrop-filter: blur(18px) saturate(140%); border: 1px solid rgba(255,255,255,.32); }
  .glass-strong { background: rgba(255,255,255,.18); backdrop-filter: blur(22px) saturate(150%); border: 1px solid rgba(255,255,255,.38); }
  .field { background: #ffffff; color: #0B2B5E; }
  .field::placeholder { color: #6B7A94; }
  .field:focus { outline: 4px solid #F2A900; outline-offset: 2px; }
  .glow-btn { box-shadow: 0 0 0 1px rgba(255,255,255,.35), 0 14px 40px rgba(242,169,0,.45); }
  select.field { appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 24 24' fill='none' stroke='%230B2B5E' stroke-width='3' stroke-linecap='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat; background-position: right 14px center; padding-right: 52px; }
</style>
</head>
<body class="bg-navy text-white font-tc antialiased">

  <!-- 背景光暈 -->
  <div class="fixed inset-0 -z-10 bg-navy overflow-hidden">
    <div class="orb absolute top-[8%] left-[-15%] h-[520px] w-[520px] rounded-full"></div>
  </div>

  <main class="mx-auto min-h-screen w-full max-w-[480px] px-5 pb-40 pt-8">

    <!-- ============ 檢視 A：會員註冊 ============ -->
    <section id="view-register">
      <header class="text-center">
        <p class="text-lg font-medium tracking-widest text-gold">德州小騎士</p>
        <h1 class="mt-2 text-4xl font-black leading-tight">加入 VIP 會員</h1>
        <p class="mt-3 text-lg text-white/90">填寫資料，立刻開始累積點數</p>
      </header>

      <form id="register-form" class="glass mt-8 rounded-3xl p-6 shadow-2xl" novalidate>
        <div>
          <label for="name" class="mb-2 block text-xl font-bold">姓名</label>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="請輸入您的姓名"
                 class="field w-full rounded-2xl border-2 border-white/60 px-5 py-4 text-xl font-medium shadow-inner" />
        </div>

        <div class="mt-6">
          <label for="phone" class="mb-2 block text-xl font-bold">手機號碼</label>
          <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="10" placeholder="09xx-xxx-xxx"
                 class="field w-full rounded-2xl border-2 border-white/60 px-5 py-4 text-xl font-medium tracking-wider shadow-inner" />
        </div>

        <div class="mt-6">
          <span class="mb-3 block text-xl font-bold">性別</span>
          <div id="gender-group" class="grid grid-cols-3 gap-3" role="group" aria-label="性別">
            <button type="button" data-gender="男" class="gender-pill rounded-2xl border-2 border-white/50 bg-white/15 px-3 py-4 text-xl font-bold text-white">男</button>
            <button type="button" data-gender="女" class="gender-pill rounded-2xl border-2 border-white/50 bg-white/15 px-3 py-4 text-xl font-bold text-white">女</button>
            <button type="button" data-gender="其他" class="gender-pill rounded-2xl border-2 border-white/50 bg-white/15 px-3 py-4 text-xl font-bold text-white">其他</button>
          </div>
        </div>

        <div class="mt-6">
          <label for="source" class="mb-2 block text-xl font-bold">消息來源</label>
          <select id="source" class="field w-full rounded-2xl border-2 border-white/60 px-5 py-4 text-xl font-medium shadow-inner">
            <option value="">請選擇</option>
            <option>親友介紹</option>
            <option>門市海報</option>
            <option>臉書 Facebook</option>
            <option>Instagram</option>
            <option>網路搜尋</option>
            <option>其他</option>
          </select>
        </div>

        <div class="mt-6">
          <label for="otp" class="mb-2 block text-xl font-bold">簡訊驗證碼</label>
          <div class="flex gap-3">
            <input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="6 位數字"
                   class="field w-full min-w-0 rounded-2xl border-2 border-white/60 px-5 py-4 text-2xl font-bold tracking-[0.3em] shadow-inner" />
            <button type="button" id="otp-btn"
                    class="shrink-0 rounded-2xl border-2 border-gold bg-white/15 px-4 py-4 text-lg font-bold text-gold">取得驗證碼</button>
          </div>
          <p id="otp-hint" class="mt-3 hidden text-lg font-medium text-gold"></p>
        </div>

        <button type="submit"
                class="glow-btn mt-8 w-full rounded-2xl bg-gold py-5 text-2xl font-black text-navy">立即開通會員</button>

        <p class="mt-4 text-center text-base leading-relaxed text-white/80">送出即表示同意會員條款與個人資料使用聲明</p>
      </form>
    </section>

    <!-- ============ 檢視 B：會員專區 ============ -->
    <section id="view-member" class="hidden">
      <header class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="grid h-14 w-14 place-items-center rounded-2xl bg-gold text-2xl font-black text-navy">騎</div>
          <div>
            <p class="text-lg font-bold leading-tight">德州小騎士</p>
            <p class="text-base text-white/80">VIP 會員專區</p>
          </div>
        </div>
        <div class="rounded-full bg-gold px-5 py-3 text-2xl font-black text-navy shadow-lg">150 點</div>
      </header>

      <!-- 會員卡 -->
      <div class="glass-strong mt-7 rounded-3xl p-6 text-center shadow-2xl">
        <p class="text-xl font-bold">王小明 的會員卡</p>
        <div class="mx-auto mt-5 w-fit rounded-2xl bg-white p-4 shadow-xl">
          <svg viewBox="0 0 100 100" class="h-52 w-52" role="img" aria-label="會員 QR Code">
            <rect width="100" height="100" fill="#fff"/>
            <g fill="#0B2B5E">
              <rect x="6" y="6" width="24" height="24"/><rect x="70" y="6" width="24" height="24"/><rect x="6" y="70" width="24" height="24"/>
              <rect x="12" y="12" width="12" height="12" fill="#fff"/><rect x="76" y="12" width="12" height="12" fill="#fff"/><rect x="12" y="76" width="12" height="12" fill="#fff"/>
              <rect x="40" y="8" width="6" height="6"/><rect x="52" y="8" width="6" height="6"/><rect x="46" y="20" width="6" height="6"/>
              <rect x="40" y="32" width="6" height="6"/><rect x="58" y="26" width="6" height="6"/><rect x="8" y="40" width="6" height="6"/>
              <rect x="20" y="46" width="6" height="6"/><rect x="32" y="40" width="6" height="6"/><rect x="44" y="46" width="6" height="6"/>
              <rect x="56" y="40" width="6" height="6"/><rect x="68" y="46" width="6" height="6"/><rect x="80" y="40" width="6" height="6"/>
              <rect x="88" y="52" width="6" height="6"/><rect x="70" y="60" width="6" height="6"/><rect x="58" y="66" width="6" height="6"/>
              <rect x="46" y="60" width="6" height="6"/><rect x="34" y="66" width="6" height="6"/><rect x="40" y="78" width="6" height="6"/>
              <rect x="52" y="86" width="6" height="6"/><rect x="64" y="78" width="6" height="6"/><rect x="76" y="86" width="6" height="6"/>
              <rect x="86" y="72" width="6" height="6"/><rect x="70" y="72" width="6" height="6"/><rect x="22" y="58" width="6" height="6"/>
            </g>
          </svg>
        </div>
        <p class="mt-5 text-3xl font-black tracking-wider">0912-345-678</p>
        <p class="mt-2 text-lg text-white/90">結帳時請出示此條碼</p>
      </div>

      <!-- 點數兌換 -->
      <h2 class="mt-9 text-2xl font-black">點數兌換</h2>
      <ul class="mt-4 space-y-3">
        <li class="glass flex items-center justify-between rounded-2xl px-5 py-5">
          <span class="text-xl font-bold">大份黃金脆薯</span>
          <span class="rounded-full bg-gold px-4 py-2 text-lg font-black text-navy">300 點</span>
        </li>
        <li class="glass flex items-center justify-between rounded-2xl px-5 py-5">
          <span class="text-xl font-bold">香辣小炸雞</span>
          <span class="rounded-full bg-gold px-4 py-2 text-lg font-black text-navy">450 點</span>
        </li>
        <li class="glass flex items-center justify-between rounded-2xl px-5 py-5">
          <span class="text-xl font-bold">冰紅茶（大）</span>
          <span class="rounded-full bg-gold px-4 py-2 text-lg font-black text-navy">200 點</span>
        </li>
        <li class="glass flex items-center justify-between rounded-2xl px-5 py-5">
          <span class="text-xl font-bold">德州招牌雞腿堡</span>
          <span class="rounded-full bg-gold px-4 py-2 text-lg font-black text-navy">600 點</span>
        </li>
      </ul>

      <button type="button" id="back-btn" class="mt-8 w-full rounded-2xl border-2 border-white/40 bg-white/10 py-4 text-lg font-bold text-white">返回註冊頁面</button>
    </section>
  </main>

  <!-- 底部導覽列 -->
  <nav class="fixed inset-x-0 bottom-0 z-20">
    <div class="mx-auto max-w-[480px] px-4 pb-4">
      <div class="glass-strong flex items-stretch justify-around rounded-3xl px-2 py-3 shadow-2xl">
        <button type="button" data-nav="coupon" class="nav-btn flex flex-1 flex-col items-center gap-1 rounded-2xl py-2 text-white/85">
          <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3a3 3 0 0 0 0 6v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a3 3 0 0 0 0-6Z"/><path d="M14 8v8"/></svg>
          <span class="text-base font-bold">領取優惠</span>
        </button>
        <button type="button" data-nav="card" class="nav-btn flex flex-1 flex-col items-center gap-1 rounded-2xl py-2 text-white/85">
          <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h5"/></svg>
          <span class="text-base font-bold">會員卡</span>
        </button>
        <button type="button" data-nav="store" class="nav-btn flex flex-1 flex-col items-center gap-1 rounded-2xl py-2 text-white/85">
          <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
          <span class="text-base font-bold">門市資訊</span>
        </button>
      </div>
    </div>
  </nav>

<script>
(function () {
  var viewRegister = document.getElementById('view-register');
  var viewMember = document.getElementById('view-member');
  var navBtns = document.querySelectorAll('.nav-btn');

  function setActiveNav(key) {
    navBtns.forEach(function (b) {
      var on = b.dataset.nav === key;
      b.classList.toggle('bg-gold', on);
      b.classList.toggle('text-navy', on);
      b.classList.toggle('text-white/85', !on);
      b.setAttribute('aria-current', on ? 'page' : 'false');
    });
  }

  function showView(name) {
    viewRegister.classList.toggle('hidden', name !== 'register');
    viewMember.classList.toggle('hidden', name !== 'member');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // 性別選擇
  var selectedGender = '';
  document.querySelectorAll('.gender-pill').forEach(function (pill) {
    pill.addEventListener('click', function () {
      selectedGender = pill.dataset.gender;
      document.querySelectorAll('.gender-pill').forEach(function (p) {
        var on = p === pill;
        p.classList.toggle('bg-gold', on);
        p.classList.toggle('text-navy', on);
        p.classList.toggle('border-gold', on);
        p.classList.toggle('bg-white/15', !on);
        p.classList.toggle('text-white', !on);
        p.classList.toggle('border-white/50', !on);
        p.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    });
  });

  // 取得驗證碼倒數
  var otpBtn = document.getElementById('otp-btn');
  var otpHint = document.getElementById('otp-hint');
  var timer = null;
  otpBtn.addEventListener('click', function () {
    var phone = document.getElementById('phone').value.replace(/\D/g, '');
    if (phone.length < 10) {
      otpHint.textContent = '請先輸入正確的 10 碼手機號碼';
      otpHint.classList.remove('hidden');
      document.getElementById('phone').focus();
      return;
    }
    if (timer) return;
    otpHint.textContent = '驗證碼已發送，請查看手機簡訊';
    otpHint.classList.remove('hidden');
    var left = 60;
    otpBtn.disabled = true;
    otpBtn.classList.add('opacity-60');
    otpBtn.textContent = left + ' 秒';
    timer = setInterval(function () {
      left -= 1;
      otpBtn.textContent = left + ' 秒';
      if (left <= 0) {
        clearInterval(timer); timer = null;
        otpBtn.disabled = false;
        otpBtn.classList.remove('opacity-60');
        otpBtn.textContent = '重新取得';
      }
    }, 1000);
  });

  // 送出註冊
  document.getElementById('register-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = document.getElementById('name').value.trim();
    var phone = document.getElementById('phone').value.replace(/\D/g, '');
    var otp = document.getElementById('otp').value.replace(/\D/g, '');
    if (!name) { otpHint.textContent = '請輸入姓名'; otpHint.classList.remove('hidden'); document.getElementById('name').focus(); return; }
    if (phone.length < 10) { otpHint.textContent = '請輸入正確的手機號碼'; otpHint.classList.remove('hidden'); document.getElementById('phone').focus(); return; }
    if (!selectedGender) { otpHint.textContent = '請選擇性別'; otpHint.classList.remove('hidden'); return; }
    if (otp.length !== 6) { otpHint.textContent = '請輸入 6 位數驗證碼'; otpHint.classList.remove('hidden'); document.getElementById('otp').focus(); return; }
    showView('member');
    setActiveNav('card');
  });

  document.getElementById('back-btn').addEventListener('click', function () {
    showView('register');
    setActiveNav('coupon');
  });

  navBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      setActiveNav(b.dataset.nav);
      showView(b.dataset.nav === 'card' ? 'member' : 'register');
    });
  });

  setActiveNav('coupon');
})();
</script>
</body>
</html>
