<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>門市終端核銷系統</title>
  <link rel="apple-touch-icon" href="icon.png">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    :root { --neon-b:#00f2fe; --neon-g:#00ff87; --bg-d:#0b0f19; --card-d:#131b2e; --txt-m:#f8fafc; --txt-s:#94a3b8; }
    body { font-family: system-ui, sans-serif; background: var(--bg-d); color: var(--txt-m); margin: 0; padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 420px; }
    .card { background: var(--card-d); padding: 24px 20px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 15px;}
    select, input, button { width: 100%; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: bold; outline: none; margin-bottom: 12px; box-sizing: border-box; }
    select { background: rgba(11,15,25,0.8); color: white; border: 1px solid rgba(255,255,255,0.15); }
    input { background: rgba(11,15,25,0.9); border: 2px solid rgba(255,255,255,0.1); color: white; }
    input:focus { border-color: var(--neon-b); box-shadow: 0 0 10px rgba(0,242,254,0.3); }
    button { cursor: pointer; border: none; }
    button:active { transform: scale(0.96); }
    button:disabled { background: #334155; color: #64748b; }
    .btn-green { background: linear-gradient(135deg, #00b09b, #96c93d); color: #000; box-shadow: 0 0 15px rgba(0,255,135,0.3); }
    .btn-dark { background: #1e293b; color: white; }
    .btn-redeem { background: linear-gradient(135deg, var(--neon-b), #4facfe); padding: 18px; color: #000; font-size: 18px; }
    .btn-undo { background: linear-gradient(135deg, #ff0844, #ffb199); color: white; }
    .btn-next { background: #334155; color: white; padding: 14px; border: 1px solid rgba(255,255,255,0.2); }
    .info-row { display: flex; justify-content: center; margin-bottom: 10px; font-size: 15px; }
    .info-row strong { color: var(--txt-s); width: 90px; text-align: left; }
    .info-row span { color: white; width: 140px; text-align: left; font-size: 17px; }
    #id-text { color: var(--neon-b); font-family: monospace; font-size: 19px; }
    .status-box { padding: 15px; border-radius: 12px; font-weight: 900; margin: 15px 0; }
    .unclaimed { background: rgba(0,255,135,0.1); color: var(--neon-g); border: 2px solid var(--neon-g); }
    .claimed { background: rgba(255,8,68,0.1); color: #ff4b72; border: 2px solid #ff4b72; }
    #loading { display: none; margin: 20px 0; color: var(--neon-b); font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <label style="color:var(--neon-b); font-size:13px; display:block; margin-bottom:5px;">● 今日值班門市</label>
    <select id="store" onchange="loadAct()"><option value="">請選擇門市</option><option>嘉義門市</option><option>成功門市</option><option>安醫門市</option><option>三井門市</option><option>三多門市</option><option>台鋁門市</option><option>義享門市</option><option>左車門市</option><option>屏車門市</option></select>
  </div>

  <div class="card">
    <h2 style="margin:0 0 15px 0; color:#fff;">⚡ 核銷系統</h2>
    <select id="act"><option value="">請先選擇門市</option></select>
    <div style="display:flex; gap:8px;">
      <input type="tel" id="phone" placeholder="顧客手機" style="flex:1;" oninput="this.value=this.value.replace(/\D/g,'').slice(0,10)">
      <button class="btn-dark" onclick="scan()" style="width:50px;" title="掃描">📷</button>
      <button class="btn-green" id="btn-search" onclick="check()" style="width:80px;">查詢</button>
    </div>
    
    <div id="reader-container" style="display:none; background:#000; border-radius:10px; overflow:hidden;"><div id="reader"></div><button onclick="stopScan()" style="background:#ff0844; color:#fff; border-radius:0; margin:0;">✖ 關閉</button></div>
    
    <div id="loading">⏳ 系統光速查詢中...</div>

    <div id="content" style="display:none; background:rgba(255,255,255,0.05); padding:20px; border-radius:15px; margin-top:15px;">
      <div class="info-row"><strong>📱 兌換手機</strong><span id="id-text"></span></div>
      <div class="info-row"><strong>👤 顧客姓名</strong><span id="name-text"></span></div>
      <div id="status" class="status-box"></div>
      <div id="action-area"><button id="btn-redeem" class="btn-redeem" onclick="redeem()">✔ 確認核銷</button></div>
      <div id="undo-area" style="display:none;"><button id="btn-undo" class="btn-undo" onclick="undo()">⚡ 撤銷 (<span id="t-undo">5</span>s)</button></div>
      <div id="next-area" style="display:none; margin-top:15px;"><button class="btn-next" onclick="nextCust()">🧹 服務下一位</button></div>
    </div>
  </div>
</div>

<script>
  const API = "https://script.google.com/macros/s/AKfycbyteRoiXgX3h9dpU325M0mg--jNEy1ayfpRPGmXebEEn3Q2Tq37yGNmXiShcrOQqyCm/exec";
  const evMap = { "嘉義門市":["父親節社群活動","中秋節活動"], "成功門市":["父親節社群活動","中秋節活動"], "安醫門市":["父親節社群活動","中秋節活動"], "三井門市":["父親節社群活動","中秋節活動"], "三多門市":["父親節社群活動","中秋節活動"], "台鋁門市":["父親節社群活動","中秋節活動"], "義享門市":["父親節社群活動","中秋節活動"], "左車門市":["父親節社群活動","中秋節活動"], "屏車門市":["父親節社群活動","中秋節活動"] };
  const $ = id => document.getElementById(id);
  let scanner, uTimer;

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function beep(t) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    if(t==='ok') { o.type='sine'; o.frequency.setValueAtTime(800, audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime+0.1); }
    if(t==='win') { o.type='triangle'; o.frequency.setValueAtTime(1046, audioCtx.currentTime); }
    if(t==='err') { o.type='sawtooth'; o.frequency.setValueAtTime(250, audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(130, audioCtx.currentTime+0.2); }
    g.gain.setValueAtTime(0.2, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+(t==='err'?0.3:0.15));
    o.start(); o.stop(audioCtx.currentTime+0.3);
  }

  window.onload = () => { if(localStorage.getItem('p_store')) { $('store').value = localStorage.getItem('p_store'); loadAct(); } };
  
  function loadAct() {
    const s = $('store').value; localStorage.setItem('p_store', s);
    $('act').innerHTML = s ? evMap[s].map(a=>`<option>${a}</option>`).join('') : '<option>選擇門市</option>';
  }

  function startScan() {
    $('reader-container').style.display = 'block';
    if(!scanner) scanner = new Html5Qrcode("reader");
    scanner.start({facingMode:"environment"}, {fps:10, qrbox:250}, txt => { $('phone').value=txt.replace(/\D/g,''); stopScan(); beep('ok'); check(); }, ()=>{}).catch(e=>alert("無相機權限"));
  }
  function stopScan() { if(scanner && scanner.isScanning) scanner.stop(); $('reader-container').style.display='none'; }

  function nextCust() {
    $('phone').value = ""; $('content').style.display = 'none'; $('phone').focus(); beep('ok');
  }

  async function check() {
    const ph=$('phone').value, st=$('store').value, ac=$('act').value;
    if(!st || !ac || !ph) return alert("⚠️ 資料未齊！");
    
    $('btn-search').disabled=true; $('btn-search').innerText="查詢中"; $('loading').style.display='block'; $('content').style.display='none';
    try {
      const r = await fetch(`${API}?action=check&id=${ph}&sheet=${ac}&t=${Date.now()}`).then(r=>r.json());
      $('loading').style.display='none'; $('btn-search').disabled=false; $('btn-search').innerText="查詢";
      if(!r.exists) {
        if(r.found_in_other_sheet && confirm(`此號碼登記在【${r.actual_sheet}】！\n是否自動切換？`)) { $('act').value = r.actual_sheet; return check(); }
        beep('err'); return alert("❌ 找不到號碼！");
      }
      beep('ok'); $('content').style.display='block'; $('id-text').innerText=ph; $('name-text').innerText=r.name;
      setUI(r); $('next-area').style.display='block';
    } catch(e) { beep('err'); alert("網路逾時！"); $('loading').style.display='none'; $('btn-search').disabled=false; $('btn-search').innerText="查詢"; }
  }

  function setUI(r) {
    if(r.status === "已兌換") {
      $('status').className="status-box claimed"; $('status').innerText="❌ 券已失效"; $('action-area').style.display='none';
    } else {
      $('status').className="status-box unclaimed"; $('status').innerText="✅ 有效優惠券"; $('action-area').style.display='block'; $('btn-redeem').disabled=false; $('btn-redeem').innerText="✔ 確認核銷";
    }
  }

  async function redeem() {
    if(!confirm("確定核銷？憑證將失效！")) return;
    $('btn-redeem').disabled=true; $('btn-redeem').innerText="⏳ 寫入中...";
    try {
      const r = await fetch(`${API}?action=redeem&id=${$('id-text').innerText}&store=${$('store').value}&sheet=${$('act').value}&t=${Date.now()}`).then(r=>r.json());
      if(r.status==="success" || r.status==="error_already_redeemed") {
        setUI({status:"已兌換"}); beep('win'); confetti();
        $('undo-area').style.display='block'; $('btn-undo').disabled=false; $('btn-undo').innerHTML='⚡ 撤銷 (<span id="t-undo">5</span>s)';
        let left=5; uTimer=setInterval(()=>{ if(--left<=0) {clearInterval(uTimer); $('undo-area').style.display='none';} else $('t-undo').innerText=left; }, 1000);
      } else { beep('err'); alert("失敗重試"); $('btn-redeem').disabled=false; $('btn-redeem').innerText="✔ 確認核銷"; }
    } catch(e) { beep('ok'); alert("網路延遲，請按查詢重整狀態！"); $('btn-redeem').disabled=false; $('btn-redeem').innerText="✔ 確認核銷"; }
  }

  async function undo() {
    clearInterval(uTimer); $('btn-undo').disabled=true; $('btn-undo').innerText="⏳ 撤銷中...";
    try {
      const r = await fetch(`${API}?action=undo&id=${$('id-text').innerText}&sheet=${$('act').value}&t=${Date.now()}`).then(r=>r.json());
      if(r.status==="success") { $('undo-area').style.display='none'; beep('ok'); alert("✅ 已撤銷！"); check(); }
      else throw "err";
    } catch(e) { beep('err'); alert("撤銷失敗，請重整！"); $('undo-area').style.display='none'; }
  }
</script>
</body>
</html>
