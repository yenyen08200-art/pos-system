<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>門市電子核銷系統</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="門市核銷">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- HTML5 條碼掃描套件 -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f3f4f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
    .container { width: 100%; max-width: 400px; }
    .store-header { background: #374151; color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
    h2 { color: #1f2937; margin-top: 0; margin-bottom: 16px; font-size: 22px; }
    .status-box { padding: 12px; border-radius: 8px; font-weight: bold; margin: 16px 0; font-size: 18px; }
    .unclaimed { background-color: #d1fae5; color: #065f46; border: 2px solid #34d399; }
    .claimed { background-color: #fee2e2; color: #991b1b; border: 2px solid #f87171; }
    .info { text-align: left; background: #f9fafb; padding: 12px; border-radius: 6px; font-size: 15px; color: #4b5563; margin-bottom: 20px; line-height: 1.6; border: 1px solid #e5e7eb; }
    select, button, input { width: 100%; padding: 14px; border-radius: 6px; border: 1px solid #d1d5db; font-size: 16px; margin-bottom: 12px; box-sizing: border-box; }
    select { background-color: white; }
    button { background-color: #2563eb; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:active { background-color: #1d4ed8; }
    button:disabled { background-color: #9ca3af; cursor: not-allowed; border: none; }
    
    .undo-btn { background-color: #f59e0b; color: white; margin-top: 10px; font-size: 15px; }
    .undo-btn:active { background-color: #d97706; }

    #reader-container { display: none; margin-bottom: 20px; border: 2px solid #3b82f6; border-radius: 8px; overflow: hidden; background: #000; }
    #reader { width: 100%; }
    .scan-cancel-btn { background-color: #ef4444; border-radius: 0; margin-bottom: 0; font-size: 14px; padding: 10px; }

    #ios-prompt { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background-color: white; padding: 16px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 85%; max-width: 350px; text-align: center; z-index: 1000; border: 2px solid #3b82f6; }
    .ios-prompt-text { font-size: 15px; color: #1f2937; margin-bottom: 10px; line-height: 1.5; }
    .ios-close-btn { background: #e5e7eb; color: #4b5563; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; width: auto; margin: 0;}
    .arrow-down { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 10px solid #3b82f6; }
  </style>
</head>
<body>

<div class="container">
  <div class="store-header">
    <label style="display:block; font-weight:bold; margin-bottom: 8px;">📍 今日值班門市設定：</label>
    <select id="global-store-select" onchange="updateActivities(); saveStore();" style="margin-bottom: 0; border: none;">
      <option value="">請選擇您所在的門市...</option>
      <option value="嘉義門市">嘉義門市</option>
      <option value="成功門市">成功門市</option>
      <option value="安醫門市">安醫門市</option>
      <option value="三井門市">三井門市</option>
      <option value="三多門市">三多門市</option>
      <option value="台鋁門市">台鋁門市</option>
      <option value="義享門市">義享門市</option>
      <option value="左車門市">左車門市</option>
      <option value="屏車門市">屏車門市</option>
    </select>
  </div>

  <div class="card">
    <h2>🎁 電子兌換券核銷</h2>
    
    <div style="text-align: left; margin-bottom: 15px;">
      <label style="font-weight: bold; color: #374151; font-size: 14px;">🎯 選擇顧客要兌換的活動：</label>
      <select id="activity-select" style="border: 2px solid #3b82f6; margin-top: 6px; background-color: #eff6ff;">
        <option value="">請先在上方選擇門市</option>
      </select>
    </div>

    <div style="display: flex; gap: 8px; margin-bottom: 20px;">
      <input type="tel" id="search-input" placeholder="請輸入顧客手機" style="flex: 1; margin-bottom: 0; border: 2px solid #d1d5db;">
      <button onclick="startScanner()" style="width: auto; background-color: #374151; padding: 0 16px; margin-bottom: 0; font-size: 18px;" title="開啟相機掃描">📷</button>
      <button onclick="searchCoupon()" style="width: auto; margin-bottom: 0; background-color: #10b981;">查詢</button>
    </div>

    <div id="reader-container">
      <div id="reader"></div>
      <button class="scan-cancel-btn" onclick="stopScanner()">取消掃描</button>
    </div>

    <div id="loading" style="color: #6b7280; display: none; margin-bottom: 20px;">資料連線中，請稍候...</div>
    
    <div id="content" style="display:none;">
      <div class="info">
        <strong>📱 兌換手機：</strong> <span id="id-text" style="color: #111827; font-weight: bold;"></span><br>
        <strong>👤 顧客姓名：</strong> <span id="name-text" style="color: #111827; font-weight: bold;"></span>
      </div>

      <div id="status-badge" class="status-box"></div>
      <div id="redeem-details" class="info" style="display:none; background: #fef2f2; border-color: #fecaca;"></div>

      <div id="action-area">
        <button id="redeem-btn" onclick="submitRedeem()">確認核銷 (點擊後即失效)</button>
      </div>
      
      <div id="undo-area" style="display:none;">
        <button id="undo-btn" class="undo-btn" onclick="undoRedeem()">
          Oops! 按錯了，撤銷核銷 (<span id="undo-timer">5</span>s)
        </button>
      </div>
    </div>
  </div>
</div>

<div id="ios-prompt">
  <div class="ios-prompt-text">
    💡 <strong>店員第一次使用請注意：</strong><br>
    請點擊螢幕下方的 <span style="font-size: 1.2em;">⬆️</span> (分享)<br>
    並選擇 <strong>「加入主畫面」</strong><br>
    即可變成全螢幕核銷 App 喔！
  </div>
  <button class="ios-close-btn" onclick="document.getElementById('ios-prompt').style.display='none'">我知道了</button>
  <div class="arrow-down"></div>
</div>

<script>
  // ⚠️ 請填入你自己的 API_URL 
  var API_URL = "https://script.google.com/macros/s/AKfycbyteRoiXgX3h9dpU325M0mg--jNEy1ayfpRPGmXebEEn3Q2Tq37yGNmXiShcrOQqyCm/exec"; 

  const storeEventMap = {
    "嘉義門市": ["父親節社群活動", "社群抽獎"],
    "成功門市": ["父親節社群活動", "社群抽獎", "百貨抽獎"],
    "安醫門市": ["父親節社群活動", "社群抽獎"],
    "三井門市": ["父親節社群活動", "社群抽獎", "百貨抽獎"],
    "三多門市": ["父親節社群活動", "社群抽獎", "百貨抽獎"],
    "台鋁門市": ["父親節社群活動", "社群抽獎", "百貨抽獎"],
    "義享門市": ["父親節社群活動", "社群抽獎", "百貨抽獎"],
    "左車門市": ["父親節社群活動", "社群抽獎", "百貨抽獎"],
    "屏車門市": ["父親節社群活動", "社群抽獎"]
  };

  var undoInterval = null; 
  let html5QrCode; 

  window.onload = function() {
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    var isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
    if (isIOS && !isStandalone) {
      document.getElementById('ios-prompt').style.display = 'block';
    }

    var savedStore = localStorage.getItem("pos_store");
    if(savedStore) {
      document.getElementById('global-store-select').value = savedStore;
    }
    updateActivities(); 
  };

  function updateActivities() {
    var store = document.getElementById('global-store-select').value;
    var activitySelect = document.getElementById('activity-select');
    activitySelect.innerHTML = ""; 
    
    if(!store || !storeEventMap[store]) {
      activitySelect.innerHTML = "<option value=''>請先在上方選擇門市</option>";
      return;
    }
    
    var activities = storeEventMap[store];
    activities.forEach(function(act) {
      var opt = document.createElement('option');
      opt.value = act;
      opt.innerHTML = act;
      activitySelect.appendChild(opt);
    });
  }

  function saveStore() {
    var store = document.getElementById('global-store-select').value;
    localStorage.setItem("pos_store", store);
  }

  function startScanner() {
    document.getElementById('reader-container').style.display = 'block';
    
    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("reader");
    }
    
    html5QrCode.start(
      { facingMode: "environment" }, 
      { fps: 10, qrbox: { width: 250, height: 250 } },
      (decodedText, decodedResult) => {
        // 🌟 核心防呆：不管掃到什麼，把 tel: 、空白鍵跟橫線通通拔掉
        var cleanPhone = decodedText.replace(/^tel:/i, '').replace(/[\s-]/g, '').trim();
        
        document.getElementById('search-input').value = cleanPhone;
        stopScanner();
        searchCoupon(); 
      },
      (errorMessage) => {}
    ).catch((err) => {
      alert("無法開啟相機！請確認手機是否已允許瀏覽器使用相機權限。");
      document.getElementById('reader-container').style.display = 'none';
    });
  }

  function stopScanner() {
    if (html5QrCode && html5QrCode.isScanning) {
      html5QrCode.stop().then(ignore => {
        document.getElementById('reader-container').style.display = 'none';
      }).catch(err => {
        console.log("關閉相機失敗", err);
      });
    } else {
      document.getElementById('reader-container').style.display = 'none';
    }
  }

  function searchCoupon() {
    var phone = document.getElementById('search-input').value.trim();
    var store = document.getElementById('global-store-select').value;
    var activity = document.getElementById('activity-select').value;

    if (!store) return alert("⚠️ 請先在最上方選擇「今日值班門市」！");
    if (!activity) return alert("⚠️ 請選擇要核銷的活動！");
    if (!phone) return alert("⚠️ 請輸入顧客手機號碼！");

    clearInterval(undoInterval);
    document.getElementById('undo-area').style.display = 'none';
    document.getElementById('content').style.display = 'none';
    document.getElementById('loading').style.display = 'block';

    var url = API_URL + "?action=check&id=" + phone + "&sheet=" + encodeURIComponent(activity);

    fetch(url)
      .then(response => response.json())
      .then(result => {
        document.getElementById('loading').style.display = 'none';
        if (!result.exists) {
          return alert(result.error || "❌ 在【" + activity + "】名單中找不到此手機號碼！");
        }
        
        document.getElementById('content').style.display = 'block';
        document.getElementById('id-text').innerText = phone;
        document.getElementById('name-text').innerText = result.name;
        updateUI(result);
      })
      .catch(error => {
        alert("資料庫連線失敗，請檢查網路狀態。");
        document.getElementById('loading').style.display = 'none';
      });
  }

  function updateUI(result) {
    var badge = document.getElementById('status-badge');
    var actionArea = document.getElementById('action-area');
    var details = document.getElementById('redeem-details');
    var btn = document.getElementById('redeem-btn');
    var currentStatus = result.status || "";

    if (currentStatus === "已兌換") {
      badge.className = "status-box claimed";
      badge.innerText = "❌ 此券已被兌換";
      actionArea.style.display = 'none'; 
      var timeStr = result.time ? new Date(result.time).toLocaleString('zh-TW') : "未知時間";
      details.style.display = 'block';
      details.innerHTML = "<strong>兌換紀錄：</strong><br>已於 " + timeStr + "<br>在 " + (result.store || "未知門市") + " 兌換完畢";
    } else {
      badge.className = "status-box unclaimed";
      badge.innerText = "✅ 有效兌換券（尚未兌換）";
      actionArea.style.display = 'block';
      details.style.display = 'none';
      btn.disabled = false;
      btn.innerText = "確認核銷 (點擊後即失效)";
    }
  }

  function submitRedeem() {
    var store = document.getElementById('global-store-select').value;
    var activity = document.getElementById('activity-select').value;
    var id = document.getElementById('id-text').innerText; 
    var btn = document.getElementById('redeem-btn');
    
    if(!confirm("確定要在「" + store + "」核銷【" + activity + "】的優惠嗎？")) return;
    
    btn.disabled = true;
    btn.innerText = "核銷處理中...";
    
    var url = API_URL + "?action=redeem&id=" + id + "&store=" + encodeURIComponent(store) + "&sheet=" + encodeURIComponent(activity);

    fetch(url)
      .then(response => response.json())
      .then(result => {
        if (result.status === "success") {
          updateUI({ status: "已兌換", time: new Date().getTime(), store: store });
          startUndoTimer(); 
        } else if (result.status === "error_already_redeemed") {
          alert("⚠️ 錯誤：這張券剛剛已被兌換過！");
          searchCoupon(); 
        } else {
          alert("核銷失敗，請重試。");
          btn.disabled = false;
          btn.innerText = "確認核銷 (點擊後即失效)";
        }
      })
      .catch(error => {
        alert("寫入失敗，請檢查網路狀態。");
        btn.disabled = false;
        btn.innerText = "確認核銷 (點擊後即失效)";
      });
  }

  function startUndoTimer() {
    var undoArea = document.getElementById('undo-area');
    var undoTimer = document.getElementById('undo-timer');
    var undoBtn = document.getElementById('undo-btn');
    
    undoArea.style.display = 'block';
    undoBtn.disabled = false;
    undoBtn.innerHTML = 'Oops! 按錯了，撤銷核銷 (<span id="undo-timer">5</span>s)';
    
    var timeLeft = 5;
    
    undoInterval = setInterval(function() {
      timeLeft--;
      document.getElementById('undo-timer').innerText = timeLeft;
      
      if (timeLeft <= 0) {
        clearInterval(undoInterval);
        undoArea.style.display = 'none'; 
      }
    }, 1000);
  }

  function undoRedeem() {
    var activity = document.getElementById('activity-select').value;
    var id = document.getElementById('id-text').innerText; 
    var undoBtn = document.getElementById('undo-btn');
    
    clearInterval(undoInterval); 
    undoBtn.disabled = true;
    undoBtn.innerText = "資料復原中...";

    var url = API_URL + "?action=undo&id=" + id + "&sheet=" + encodeURIComponent(activity);

    fetch(url)
      .then(response => response.json())
      .then(result => {
        if (result.status === "success") {
          document.getElementById('undo-area').style.display = 'none';
          alert("✅ 已成功撤銷核銷！");
          searchCoupon(); 
        } else {
          alert("撤銷失敗，請聯絡總部處理。");
          document.getElementById('undo-area').style.display = 'none';
        }
      })
      .catch(error => {
        alert("連線失敗，請檢查網路狀態。");
        document.getElementById('undo-area').style.display = 'none';
      });
  }
</script>
</body>
</html>
