<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>門市終端核銷系統</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="門市核銷">
  <link rel="apple-touch-icon" href="icon.png">

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    :root {
      --neon-blue: #00f2fe;
      --neon-indigo: #4facfe;
      --neon-green: #00ff87;
      --neon-emerald: #60efff;
      --neon-red: #ff0844;
      --neon-orange: #ffb199;
      --bg-dark: #0b0f19;
      --card-dark: #131b2e;
      --ticket-dark: #1c263f;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; 
      background-color: var(--bg-dark); 
      background-image: 
        radial-gradient(at 10% 10%, rgba(0, 242, 254, 0.08) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(0, 255, 135, 0.05) 0px, transparent 50%);
      color: var(--text-main);
      margin: 0; 
      padding: 16px; 
      display: flex; 
      justify-content: center; 
      align-items: flex-start; 
      min-height: 100vh; 
      box-sizing: border-box;
    }
    
    .container { width: 100%; max-width: 420px; }

    /* 🌌 頂部科幻導航列 (毛玻璃與呼吸燈) */
    .store-header { 
      background: rgba(19, 27, 46, 0.8);
      backdrop-filter: blur(12px);
      color: white; 
      padding: 16px 20px; 
      border-radius: 18px; 
      margin-bottom: 20px; 
      box-shadow: 0 10px 30px -10px rgba(0, 242, 254, 0.2);
      border: 1px solid rgba(0, 242, 254, 0.3);
      position: relative;
      overflow: hidden;
    }
    .store-header::before {
      content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
      background: linear-gradient(90deg, var(--neon-blue), var(--neon-green));
    }
    .store-header label { font-size: 13px; font-weight: 700; color: var(--neon-blue); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; letter-spacing: 1px; text-transform: uppercase; }
    .store-header label::before { content: "●"; color: var(--neon-green); animation: pulse 1.5s infinite; }
    
    .store-header select { 
      background-color: rgba(11, 15, 25, 0.8); 
      color: white; 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      font-weight: 800; 
      font-size: 16px;
      margin-bottom: 0;
      padding: 12px;
      border-radius: 10px;
    }
    .store-header select option { color: #0f172a; background: white; font-weight: bold; }

    /* 🛡️ 主卡片視覺 (科技深邃黑) */
    .card { 
      background: var(--card-dark); 
      padding: 24px 20px; 
      border-radius: 24px; 
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); 
      text-align: center; 
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    h2 { color: white; margin-top: 0; margin-bottom: 20px; font-size: 22px; font-weight: 900; letter-spacing: 0.5px; text-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }
    
    /* 🎯 活動選項區 */
    .section-label { font-weight: 700; color: var(--text-sub); font-size: 14px; display: block; margin-bottom: 8px; text-align: left; letter-spacing: 0.5px; }
    select, input, button { 
      width: 100%; 
      padding: 16px; 
      border-radius: 14px; 
      font-size: 16px; 
      box-sizing: border-box; 
      transition: all 0.25s ease; 
      outline: none;
    }
    
    #activity-select { 
      background: linear-gradient(135deg, rgba(0, 255, 135, 0.1), rgba(96, 239, 255, 0.1)); 
      border: 1px solid rgba(0, 255, 135, 0.4); 
      color: var(--neon-green); 
      font-weight: 800; 
    }
    #activity-select option { color: #0f172a; background: white; }

    /* 🔍 搜尋與輸入框 */
    input {
      background: rgba(11, 15, 25, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.1);
      color: white;
      font-weight: bold;
      letter-spacing: 1px;
    }
    input::placeholder { color: #475569; }
    input:focus { border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 242, 254, 0.2); }

    /* ⚡ 霓虹科技按鈕 */
    button { 
      border: none; 
      font-weight: 800; 
      cursor: pointer; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      gap: 8px;
      letter-spacing: 0.5px;
    }
    button:active { transform: scale(0.96); }
    button:disabled { background: #334155 !important; color: #64748b !important; cursor: not-allowed; transform: none; box-shadow: none !important; border: none !important; }
    
    .btn-green { 
      background: linear-gradient(135deg, #00b09b, #96c93d); 
      color: #000; 
      box-shadow: 0 0 20px rgba(0, 255, 135, 0.4); 
    }
    .btn-green:active { box-shadow: 0 0 10px rgba(0, 255, 135, 0.6); }
    
    .btn-dark { 
      background: #1e293b; 
      color: white; 
      border: 1px solid rgba(255,255,255,0.1); 
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
    }
    
    .btn-redeem {
      background: linear-gradient(135deg, var(--neon-blue), var(--neon-indigo));
      color: #000;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.5);
      font-size: 18px; 
      padding: 18px;
    }
    
    .undo-btn { 
      background: linear-gradient(135deg, #ff0844, #ffb199); 
      color: white; 
      margin-top: 14px; 
      font-size: 15px; 
      box-shadow: 0 0 20px rgba(255, 8, 68, 0.4); 
    }

    /* 📷 HUD 戰術掃描框 */
    #reader-container { display: none; margin: 15px 0; border: 2px solid var(--neon-blue); border-radius: 18px; overflow: hidden; background: #000; box-shadow: 0 0 20px rgba(0, 242, 254, 0.3); }
    #reader { width: 100%; }
    .scan-cancel-btn { border-radius: 0; margin-bottom: 0; padding: 14px; background: var(--neon-red); color: white; font-size: 15px; }

    /* 👷‍♂️ 核心亮點：Q版搬磚小男孩動畫專區 */
    #loading { display: none; margin: 25px 0; text-align: center; }
    .chibi-loader-box { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .chibi-svg { width: 130px; height: 100px; overflow: visible; margin-bottom: 10px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); }
    
    /* 身體跳躍動畫 */
    .chibi-boy { animation: chibi-bounce 0.45s infinite alternate cubic-bezier(0.4, 0, 0.6, 1); transform-origin: center bottom; }
    /* 地面陰影縮放 */
    .shadow { animation: shadow-scale 0.45s infinite alternate cubic-bezier(0.4, 0, 0.6, 1); transform-origin: center; }
    /* 磚頭奮力微晃 */
    .brick-holding { animation: brick-wobble 0.45s infinite alternate ease-in-out; transform-origin: center; }
    /* 飛濺的藍綠色汗珠 */
    .drop-1 { animation: sweat-fly-right 0.9s infinite linear; }
    .drop-2 { animation: sweat-fly-left 0.9s 0.45s infinite linear; }
    
    @keyframes chibi-bounce {
      0% { transform: translateY(0) scaleY(0.96); }
      100% { transform: translateY(-12px) scaleY(1.04); }
    }
    @keyframes shadow-scale {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(0.55); opacity: 0.2; }
    }
    @keyframes brick-wobble {
      0% { transform: rotate(-4deg) translateY(0); }
      100% { transform: rotate(4deg) translateY(-3px); }
    }
    @keyframes sweat-fly-right {
      0% { transform: translate(0, 0) scale(0.4); opacity: 0; }
      40% { opacity: 1; }
      100% { transform: translate(18px, -18px) scale(1.3); opacity: 0; }
    }
    @keyframes sweat-fly-left {
      0% { transform: translate(0, 0) scale(0.4); opacity: 0; }
      40% { opacity: 1; }
      100% { transform: translate(-18px, -12px) scale(1.3); opacity: 0; }
    }
    
    .loading-text {
      background: linear-gradient(90deg, var(--neon-blue), var(--neon-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0.5px;
      text-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* 💳 尊榮黑卡「霓虹電子憑證」設計 */
    .ticket-card {
      background: var(--ticket-dark); 
      border: 1px solid rgba(0, 242, 254, 0.3); 
      border-radius: 20px;
      padding: 22px 18px; 
      margin: 20px 0; 
      position: relative; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.4), inset 0 0 20px rgba(0, 242, 254, 0.05);
    }
    .ticket-card::before, .ticket-card::after {
      content: ""; position: absolute; top: 58%; width: 24px; height: 24px;
      background-color: var(--card-dark); border: 1px solid rgba(0, 242, 254, 0.3); border-radius: 50%;
    }
    .ticket-card::before { left: -14px; border-left-color: transparent; border-top-color: transparent; transform: rotate(45deg); }
    .ticket-card::after { right: -14px; border-right-color: transparent; border-bottom-color: transparent; transform: rotate(45deg); }

    /* 🛠️ 置中且垂直對齊的完美排版 */
    .ticket-info { 
      border-bottom: 2px dashed rgba(255, 255, 255, 0.15); 
      padding-bottom: 18px; 
      margin-bottom: 18px; 
      display: flex; 
      flex-direction: column; 
      gap: 14px;
    }
    .info-row { 
      display: flex; 
      justify-content: center;
      align-items: center; 
      font-size: 15px; 
    }
    .info-row strong { 
      color: var(--text-sub); 
      white-space: nowrap; 
      width: 95px; 
      text-align: left;
      font-weight: 600; 
    }
    .info-row span { 
      font-weight: 800; 
      color: white; 
      font-size: 17px; 
      text-align: left; 
      width: 145px; 
      padding-left: 10px; 
      word-break: break-all;
      letter-spacing: 0.5px;
    }
    
    #id-text { color: var(--neon-blue); font-family: monospace; font-size: 19px !important; text-shadow: 0 0 10px rgba(0, 242, 254, 0.4); }
    #social-text { color: var(--neon-green); }

    .status-box { padding: 15px; border-radius: 14px; font-weight: 900; font-size: 18px; text-align: center; letter-spacing: 1px; }
    .unclaimed { background: rgba(0, 255, 135, 0.1); color: var(--neon-green); border: 2px solid var(--neon-green); box-shadow: 0 0 20px rgba(0, 255, 135, 0.2); }
    .claimed { background: rgba(255, 8, 68, 0.1); color: #ff4b72; border: 2px solid #ff4b72; box-shadow: 0 0 20px rgba(255, 8, 68, 0.2); }
    
    .redeem-details { background: rgba(255, 8, 68, 0.05); border: 1px solid rgba(255, 8, 68, 0.3); padding: 14px; border-radius: 12px; font-size: 14px; color: #ff8f9c; margin-top: 14px; text-align: center; line-height: 1.6; }
    .redeem-details strong { color: white; }

    #ios-prompt { display: none; position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(11, 15, 25, 0.95); backdrop-filter: blur(15px); color: white; padding: 20px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); width: 85%; max-width: 350px; text-align: center; z-index: 1000; border: 1px solid var(--neon-blue); }
    .ios-prompt-text { font-size: 14px; margin-bottom: 15px; line-height: 1.6; color: var(--text-sub); }
    .ios-prompt-text strong { color: white; }
    .ios-close-btn { background: var(--neon-blue); color: #000; border: none; padding: 12px 20px; border-radius: 10px; font-size: 15px; font-weight: 900; width: 100%; box-shadow: 0 0 15px rgba(0, 242, 254, 0.4); }
  </style>
</head>
<body>

<div class="container">
  <!-- 📍 頂部科幻導航列：設定門市 -->
  <div class="store-header">
    <label>今日值班門市設定</label>
    <select id="global-store-select" onchange="updateActivities(); saveStore();">
      <option value="">請選擇您所在的門市...</option>
      <option value="嘉義門市">嘉義門市</option>
      <option value="成功門市">成功門市</option>
      <option value="安醫門市">安醫門市</option>
      <option value="三井門市">三井門市</option>
      <option value="三多門市">三多門市</option>
      <option value="台鋁門市">台鋁門市</option>
      <option value="義享門市">義享門市</option>
      <option value="左車門市">左車門市</option>
      <option value="屏車門市">屏車門市</option>
    </select>
  </div>

  <!-- 🎁 核心核銷卡片 -->
  <div class="card">
    <h2>⚡ 抽獎核銷系統</h2>
    
    <div style="margin-bottom: 20px;">
      <span class="section-label">🎯 顧客兌換活動項目</span>
      <select id="activity-select">
        <option value="">請先在上方選擇門市</option>
      </select>
    </div>

    <!-- 🔍 搜尋與相機按鈕區 -->
    <div style="display: flex; gap: 8px; margin-bottom: 12px;">
      <input type="tel" id="search-input" placeholder="輸入顧客手機" style="flex: 1; margin-bottom: 0;">
      <button onclick="startScanner()" class="btn-dark" style="width: 56px; padding: 0; font-size: 20px;" title="開啟相機掃描">📷</button>
      <button id="search-btn" onclick="searchCoupon()" class="btn-green" style="width: 95px; margin-bottom: 0;">查詢</button>
    </div>

    <!-- 📷 HUD 戰術掃描區 -->
    <div id="reader-container">
      <div id="reader"></div>
      <button class="scan-cancel-btn" onclick="stopScanner()">✖ 關閉掃描儀</button>
    </div>

    <!-- 👷‍♂️ Q版搬磚小男孩 動畫區 -->
    <div id="loading">
      <div class="chibi-loader-box">
        <svg viewBox="0 0 120 100" class="chibi-svg">
          <!-- 地面科技藍陰影 -->
          <ellipse cx="60" cy="92" rx="26" ry="5" fill="rgba(0, 242, 254, 0.3)" class="shadow"/>
          <!-- 飛濺的霓虹藍綠汗珠 -->
          <path d="M 86 42 Q 93 36 91 50 Z" fill="#00f2fe" class="drop-1"/>
          <path d="M 34 46 Q 27 40 29 54 Z" fill="#00ff87" class="drop-2"/>
          <!-- Q版搬磚小男孩 -->
          <g class="chibi-boy">
            <!-- 雙腳 -->
            <ellipse cx="50" cy="86" rx="6" ry="5" fill="#ffb199"/>
            <ellipse cx="70" cy="86" rx="6" ry="5" fill="#ffb199"/>
            <!-- 身體與工作服 (靛藍科技制服) -->
            <rect x="46" y="58" width="28" height="26" rx="8" fill="#1d4ed8"/>
            <rect x="50" y="68" width="20" height="16" rx="4" fill="#0b0f19"/>
            <!-- 大頭 -->
            <circle cx="60" cy="42" r="23" fill="#ffe0d2"/>
            <!-- 腮紅 -->
            <ellipse cx="43" cy="46" rx="5" ry="3.5" fill="#ff8f9c" opacity="0.75"/>
            <ellipse cx="77" cy="46" rx="5" ry="3.5" fill="#ff8f9c" opacity="0.75"/>
            <!-- 堅毅認真的眼神 (^ ^) -->
            <path d="M 45 40 Q 49 35 53 40" stroke="#0b0f19" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M 67 40 Q 71 35 75 40" stroke="#0b0f19" stroke-width="3" fill="none" stroke-linecap="round"/>
            <!-- 努力奮鬥的嘴巴 (w) -->
            <path d="M 56 50 Q 58.5 53 60 50 Q 61.5 53 64 50" stroke="#0b0f19" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <!-- 黃色工程安全帽 -->
            <path d="M 35 38 A 25 25 0 0 1 85 38 Z" fill="#ffdb4d"/>
            <rect x="33" y="36" width="54" height="6" rx="3" fill="#ffcc00"/>
            <circle cx="60" cy="24" r="5" fill="#ff9900"/>
            <!-- 雙手奮力搬著紅磚頭 -->
            <g class="brick-holding">
              <rect x="32" y="54" width="56" height="20" rx="4" fill="#ff0844" stroke="#ff8f9c" stroke-width="1.5"/>
              <!-- 磚頭縱橫紋路 -->
              <line x1="60" y1="54" x2="60" y2="74" stroke="#ffb199" stroke-width="1.5"/>
              <line x1="32" y1="64" x2="88" y2="64" stroke="#ffb199" stroke-width="1.5"/>
              <line x1="46" y1="54" x2="46" y2="64" stroke="#ffb199" stroke-width="1.5"/>
              <line x1="74" y1="64" x2="74" y2="74" stroke="#ffb199" stroke-width="1.5"/>
              <!-- 小手手扣在磚頭前方 -->
              <circle cx="42" cy="64" r="6" fill="#ffe0d2" stroke="#ffb199" stroke-width="1"/>
              <circle cx="78" cy="64" r="6" fill="#ffe0d2" stroke="#ffb199" stroke-width="1"/>
            </g>
          </g>
        </svg>
        <div class="loading-text">
          🧱 正在努力搬磚中，請稍候... 💦
        </div>
      </div>
    </div>
    
    <!-- 🎟️ 尊榮黑卡結果顯示區 -->
    <div id="content" style="display:none;">
      <div class="ticket-card">
        
        <!-- 🛠️ 置中完美排版區塊 -->
        <div class="ticket-info">
          <div class="info-row">
            <strong>📱 兌換手機</strong> 
            <span id="id-text"></span>
          </div>
          <div class="info-row">
            <strong>👤 顧客姓名</strong> 
            <span id="name-text"></span>
          </div>
          <div class="info-row">
            <strong>🔗 社群帳號</strong> 
            <span id="social-text"></span>
          </div>
        </div>

        <div id="status-badge" class="status-box"></div>
        <div id="redeem-details" class="redeem-details" style="display:none;"></div>
      </div>

      <div id="action-area" style="margin-top: 18px;">
        <button id="redeem-btn" class="btn-redeem" onclick="submitRedeem()">
          ✔ 確認核銷優惠 (點擊即失效)
        </button>
      </div>
      
      <div id="undo-area" style="display:none;">
        <button id="undo-btn" class="undo-btn" onclick="undoRedeem()">
          ⚡ Oops! 剛才按錯了，立即撤銷 (<span id="undo-timer">5</span>s)
        </button>
      </div>
    </div>
  </div>
</div>

<div id="ios-prompt">
  <div class="ios-prompt-text">
    💡 <strong>店員專屬 POS 下載教學：</strong><br>
    點擊 Safari 底部 <span style="font-size: 1.2em;">⬆️</span> (分享)<br>
    選擇 <strong>「加入主畫面」</strong><br>
    即可轉為全螢幕專櫃 POS 系統！
  </div>
  <button class="ios-close-btn" onclick="document.getElementById('ios-prompt').style.display='none'">我知道了</button>
</div>

<script>
  // ⚠️ 已經保留你專屬的 API 網址 
  var API_URL = "https://script.google.com/macros/s/AKfycbyteRoiXgX3h9dpU325M0mg--jNEy1ayfpRPGmXebEEn3Q2Tq37yGNmXiShcrOQqyCm/exec"; 

  const storeEventMap = {
    "嘉義門市": ["父親節社群活動", "社群抽獎"],
    "成功門市": ["父親節社群活動", "社群抽獎", "百貨抽獎"],
    "安醫門市": ["父親節社群活動", "社群抽獎"],
    "三井門市": ["父親節社群活動", "社群抽獎", "百貨抽獎"],
    "三多門市": ["父親節社群活動", "社群抽獎", "百貨抽獎"],
    "台鋁門市": ["父親節社群活動", "社群抽獎", "百貨抽獎"],
    "義享門市": ["父親節社群活動", "社群抽獎", "百貨抽獎"],
    "左車門市": ["父親節社群活動", "社群抽獎", "百貨抽獎"],
    "屏車門市": ["父親節社群活動", "社群抽獎"]
  };

  var undoInterval = null; 
  let html5QrCode; 

  window.onload = function() {
    var savedStore = localStorage.getItem("pos_store");
    if(savedStore) {
      document.getElementById('global-store-select').value = savedStore;
    }
    updateActivities(); 
  };

  function updateActivities() {
    var store = document.getElementById('global-store-select').value;
    var activitySelect = document.getElementById('activity-select');
    activitySelect.innerHTML = ""; 
    if(!store || !storeEventMap[store]) {
      activitySelect.innerHTML = "<option value=''>請先在上方選擇門市</option>";
      return;
    }
    var activities = storeEventMap[store];
    activities.forEach(function(act) {
      var opt = document.createElement('option');
      opt.value = act;
      opt.innerHTML = act;
      activitySelect.appendChild(opt);
    });
  }

  function saveStore() {
    var store = document.getElementById('global-store-select').value;
    localStorage.setItem("pos_store", store);
  }

  function startScanner() {
    document.getElementById('reader-container').style.display = 'block';
    if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" }, 
      { fps: 10, qrbox: { width: 250, height: 250 } },
      (decodedText, decodedResult) => {
        var cleanPhone = decodedText.replace(/\D/g, '');
        document.getElementById('search-input').value = cleanPhone;
        stopScanner();
        searchCoupon(); 
      },
      (errorMessage) => {}
    ).catch((err) => {
      alert("無法開啟相機！請確認手機相機權限是否已開啟。");
      document.getElementById('reader-container').style.display = 'none';
    });
  }

  function stopScanner() {
    if (html5QrCode && html5QrCode.isScanning) {
      html5QrCode.stop().then(ignore => { document.getElementById('reader-container').style.display = 'none'; });
    } else {
      document.getElementById('reader-container').style.display = 'none';
    }
  }

  function searchCoupon() {
    var phone = document.getElementById('search-input').value.trim();
    var store = document.getElementById('global-store-select').value;
    var activity = document.getElementById('activity-select').value;

    if (!store) return alert("⚠️ 請先在最上方選擇「今日值班門市」！");
    if (!activity) return alert("⚠️ 請選擇要核銷的活動！");
    if (!phone) return alert("⚠️ 請輸入顧客手機號碼！");

    // 🌟 防連點鎖
    var searchBtn = document.getElementById('search-btn');
    searchBtn.disabled = true;
    searchBtn.innerText = "查詢中";
    searchBtn.style.background = "#334155";

    clearInterval(undoInterval);
    document.getElementById('undo-area').style.display = 'none';
    document.getElementById('content').style.display = 'none';
    document.getElementById('loading').style.display = 'block';

    var url = API_URL + "?action=check&id=" + phone + "&sheet=" + encodeURIComponent(activity) + "&t=" + new Date().getTime();

    fetch(url, { method: 'GET', redirect: 'follow' })
      .then(response => response.json())
      .then(result => {
        // 解除按鈕鎖
        searchBtn.disabled = false;
        searchBtn.innerText = "查詢";
        searchBtn.style.background = "";
        
        document.getElementById('loading').style.display = 'none';
        if (!result.exists) return alert(result.error || "❌ 在活動名單中找不到此手機號碼！");
        
        document.getElementById('content').style.display = 'block';
        document.getElementById('id-text').innerText = phone;
        document.getElementById('name-text').innerText = result.name || "未提供";
        document.getElementById('social-text').innerText = result.social_id || "未提供";
        updateUI(result);
      })
      .catch(error => {
        searchBtn.disabled = false;
        searchBtn.innerText = "查詢";
        searchBtn.style.background = "";
        
        alert("查詢逾時！請確認網路狀態，或直接重整頁面試試。\n(錯誤描述：" + error.message + ")");
        document.getElementById('loading').style.display = 'none';
      });
  }

  function updateUI(result) {
    var badge = document.getElementById('status-badge');
    var actionArea = document.getElementById('action-area');
    var details = document.getElementById('redeem-details');
    var btn = document.getElementById('redeem-btn');

    if (result.status === "已兌換") {
      badge.className = "status-box claimed";
      badge.innerText = "❌ 此兌換券已失效 / 已領取";
      actionArea.style.display = 'none'; 
      var timeStr = result.time ? new Date(result.time).toLocaleString('zh-TW') : "未知時間";
      details.style.display = 'block';
      details.innerHTML = "<strong>⏱ 兌換紀錄追蹤：</strong><br>已於 " + timeStr + "<br>在 <strong>【" + (result.store || "未知門市") + "】</strong> 完成核銷";
    } else {
      badge.className = "status-box unclaimed";
      badge.innerText = "✅ 有效優惠券（尚未兌換）";
      actionArea.style.display = 'block';
      details.style.display = 'none';
      btn.disabled = false;
      btn.innerText = "✔ 確認核銷優惠 (點擊即失效)";
    }
  }

  function submitRedeem() {
    var store = document.getElementById('global-store-select').value;
    var activity = document.getElementById('activity-select').value;
    var id = document.getElementById('id-text').innerText; 
    var btn = document.getElementById('redeem-btn');
    
    if(!confirm("確定要在「" + store + "」核銷【" + activity + "】的優惠嗎？\n\n⚠️ 核銷後憑證立即失效！")) return;
    
    btn.disabled = true;
    btn.innerText = "⏳ 總部系統連線寫入中...";
    
    var url = API_URL + "?action=redeem&id=" + id + "&store=" + encodeURIComponent(store) + "&sheet=" + encodeURIComponent(activity) + "&t=" + new Date().getTime();

    fetch(url, { method: 'GET', redirect: 'follow' })
      .then(response => response.json())
      .then(result => {
        if (result.status === "success") {
          updateUI({ status: "已兌換", time: new Date().getTime(), store: store });
          startUndoTimer(); 
        } else if (result.status === "error_already_redeemed") {
          alert("⚠️ 錯誤：這張券剛剛已被兌換過！");
          searchCoupon(); 
        } else {
          alert("核銷失敗，請重試。");
          btn.disabled = false;
          btn.innerText = "✔ 確認核銷優惠 (點擊即失效)";
        }
      })
      .catch(error => {
        alert("⚠️ 網路回傳似乎卡住了，但資料可能已核銷成功！請點擊上方綠色「查詢」按鈕重新整理狀態。");
        btn.disabled = false;
        btn.innerText = "✔ 確認核銷優惠 (點擊即失效)";
      });
  }

  function startUndoTimer() {
    var undoArea = document.getElementById('undo-area');
    var undoTimer = document.getElementById('undo-timer');
    var undoBtn = document.getElementById('undo-btn');
    undoArea.style.display = 'block';
    undoBtn.disabled = false;
    undoBtn.innerHTML = '⚡ Oops! 剛才按錯了，立即撤銷 (<span id="undo-timer">5</span>s)';
    var timeLeft = 5;
    undoInterval = setInterval(function() {
      timeLeft--;
      document.getElementById('undo-timer').innerText = timeLeft;
      if (timeLeft <= 0) { clearInterval(undoInterval); undoArea.style.display = 'none'; }
    }, 1000);
  }

  function undoRedeem() {
    var activity = document.getElementById('activity-select').value;
    var id = document.getElementById('id-text').innerText; 
    var undoBtn = document.getElementById('undo-btn');
    clearInterval(undoInterval); 
    undoBtn.disabled = true;
    undoBtn.innerText = "⏳ 正在復原總部資料...";

    var url = API_URL + "?action=undo&id=" + id + "&sheet=" + encodeURIComponent(activity) + "&t=" + new Date().getTime();

    fetch(url, { method: 'GET', redirect: 'follow' })
      .then(response => response.json())
      .then(result => {
        if (result.status === "success") {
          document.getElementById('undo-area').style.display = 'none';
          alert("✅ 已成功撤銷核銷！");
          searchCoupon(); 
        } else {
          alert("撤銷失敗，請聯絡總部處理。");
          document.getElementById('undo-area').style.display = 'none';
        }
      })
      .catch(error => {
        alert("連線逾時，請按查詢重整狀態。");
        document.getElementById('undo-area').style.display = 'none';
      });
  }
</script>
</body>
</html>
