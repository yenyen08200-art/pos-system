<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>活動兌換登記</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #fef3c7; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
    .card { background: white; width: 100%; max-width: 400px; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; border-top: 8px solid #f59e0b; }
    h1 { color: #92400e; font-size: 24px; margin-top: 0; margin-bottom: 8px; }
    p { color: #6b7280; font-size: 15px; margin-bottom: 20px; line-height: 1.5; }
    label { display: block; text-align: left; font-weight: bold; color: #374151; margin-bottom: 6px; font-size: 15px; }
    input, select { width: 100%; padding: 14px; border-radius: 8px; border: 2px solid #d1d5db; font-size: 16px; margin-bottom: 16px; box-sizing: border-box; }
    input:focus { border-color: #f59e0b; outline: none; }
    .submit-btn { background-color: #f59e0b; color: white; border: none; padding: 16px; width: 100%; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(245, 158, 11, 0.3); }
    .submit-btn:active { background-color: #d97706; }
    .submit-btn:disabled { background-color: #9ca3af; box-shadow: none; }
    
    #ticket-card { display: none; background: #fffbeb; border: 2px dashed #f59e0b; padding: 20px; border-radius: 12px; margin-top: 10px; }
    .qr-img { width: 190px; height: 190px; margin: 10px 0; border: 8px solid white; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .highlight-text { font-size: 18px; font-weight: bold; color: #b45309; margin: 10px 0; }
    .info-box { text-align: left; background: white; padding: 12px; border-radius: 8px; margin-top: 15px; font-size: 15px; color: #374151; line-height: 1.8; border: 1px solid #fde68a; }
    .screenshot-notice { background: #ef4444; color: white; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 16px; margin-bottom: 15px; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
  </style>
</head>
<body>

<div class="card">
  <!-- 👉 步驟一：登記表單區塊 -->
  <div id="form-section">
    <h1>🎁 活動兌換登記</h1>
    <p>請填寫社群資訊與手機，立即生成「專屬領獎條碼」！</p>
    
    <label>🎯 選擇領取活動：</label>
    <select id="activity" style="background-color: #fffbeb; border-color: #f59e0b; font-weight: bold;">
      <option value="父親節社群活動">父親節社群活動</option>
    </select>

    <label>💬 社群名字 (IG/FB 暱稱)：</label>
    <input type="text" id="name" placeholder="例：小新 / Amy" required>

    <label>🔗 社群帳號 ID：</label>
    <input type="text" id="social_id" placeholder="例：@shin_123 / LINE ID" required>

    <label>📱 手機號碼 (核對與防重複)：</label>
    <input type="tel" id="phone" placeholder="例：0912345678" maxlength="10" required>

    <!-- 🌟 新增：鑰匙孔！讓客人填寫活動密語 -->
    <label>🔑 活動通關密語 (請見官方後台私訊)：</label>
    <input type="text" id="secret_code" placeholder="例：TFC55" required style="text-transform: uppercase;">

    <button id="btn" class="submit-btn" onclick="register()">立即生成領券條碼</button>
  </div>

  <!-- 👉 步驟二：秒速生成的「專屬憑證卡」區塊 -->
  <div id="ticket-card">
    <div class="screenshot-notice">📸 請立即「截圖」保存此畫面！</div>
    <div style="font-size: 18px; font-weight: bold; color: #92400e;">🎉 登記成功！您的領獎憑證</div>
    
    <img id="qr-code-img" class="qr-img" src="" alt="核銷條碼">
    
    <div class="highlight-text">憑此畫面至全台門市兌換</div>

    <div class="info-box">
      <strong>🎯 活動：</strong><span id="res-act"></span><br>
      <strong>💬 名字：</strong><span id="res-name"></span><br>
      <strong>🔗 帳號：</strong><span id="res-social"></span><br>
      <strong>📱 電話：</strong><span id="res-phone" style="color: #d97706; font-weight: bold;"></span>
    </div>
    
    <p style="font-size: 13px; color: #6b7280; margin-top: 15px; margin-bottom: 0;">
      💡 <strong>溫馨提醒：</strong>若不會截圖，直接至櫃檯向店員「報手機號碼」也能領取喔！
    </p>
  </div>
</div>

<script>
  // ⚠️ 已經幫你保留你的 API 網址
  var API_URL = "https://script.google.com/macros/s/AKfycbyteRoiXgX3h9dpU325M0mg--jNEy1ayfpRPGmXebEEn3Q2Tq37yGNmXiShcrOQqyCm/exec";

  // 🌟 F5 指紋鎖：網頁一打開，立刻檢查瀏覽器是否已經有領券紀錄！
  window.onload = function() {
    var savedPhone = localStorage.getItem("pos_saved_phone");
    var savedAct = localStorage.getItem("pos_saved_act");
    if (savedPhone && savedAct === document.getElementById('activity').value) {
      alert("💡 系統偵測到此瀏覽器已經領取過「" + savedAct + "」囉！為您顯示專屬憑證。");
      document.getElementById('form-section').style.display = 'none';
      document.getElementById('ticket-card').style.display = 'block';
      document.getElementById('res-act').innerText = savedAct;
      document.getElementById('res-name').innerText = localStorage.getItem("pos_saved_name") || "忠實顧客";
      document.getElementById('res-social').innerText = localStorage.getItem("pos_saved_social") || "";
      document.getElementById('res-phone').innerText = savedPhone;
      document.getElementById('qr-code-img').src = "https://quickchart.io/qr?text=" + savedPhone + "&size=200&margin=1&dark=92400e";
    }
  };

  // 🌟 主管點擊送出的核心大函數
  function register() {
    var act = document.getElementById('activity').value;
    var name = document.getElementById('name').value.trim();
    var socialId = document.getElementById('social_id').value.trim();
    var phone = document.getElementById('phone').value.trim();
    var secretCode = document.getElementById('secret_code').value.trim(); // 👉 你問的第一段：在這裡抓取密語！

    // 👉 你問的第一段：在這裡檢查密語有沒有填！
    if (!name) return alert("⚠️ 請輸入您的社群名字！");
    if (!socialId) return alert("⚠️ 請輸入您的社群帳號 ID！");
    if (!secretCode) return alert("⚠️ 請輸入活動通關密語！"); 
    if (!phone || phone.length < 8) return alert("⚠️ 請輸入正確的手機號碼！");
    
    phone = phone.replace(/\D/g, '');

    var btn = document.getElementById('btn');
    btn.disabled = true;
    btn.innerText = "資料寫入與生成條碼中...";

    var baseUrl = API_URL.split('?')[0]; 
    // 👉 你問的第二段：在這裡把 "code": secretCode 一起打包送出去！
    var params = new URLSearchParams({
      "action": "register",
      "id": phone,
      "name": name,
      "social_id": socialId, 
      "code": secretCode, 
      "sheet": act
    });
    var url = baseUrl + "?" + params.toString();

    fetch(url)
      .then(response => response.json())
      .then(result => {
        if (result.status === "success" || result.status === "already_registered") {
          if (result.status === "already_registered") {
            alert("💡 系統偵測到此手機號碼或社群帳號之前已經登記過囉！為您顯示原本的領券條碼。");
          }
          
          localStorage.setItem("pos_saved_phone", phone);
          localStorage.setItem("pos_saved_act", act);
          localStorage.setItem("pos_saved_name", result.name || name);
          localStorage.setItem("pos_saved_social", result.social_id || socialId);

          document.getElementById('form-section').style.display = 'none';
          document.getElementById('ticket-card').style.display = 'block';
          
          document.getElementById('res-act').innerText = act;
          document.getElementById('res-name').innerText = result.name || name;
          document.getElementById('res-social').innerText = result.social_id || socialId;
          document.getElementById('res-phone').innerText = phone;
          
          var qrUrl = "https://quickchart.io/qr?text=" + phone + "&size=200&margin=1&dark=92400e";
          document.getElementById('qr-code-img').src = qrUrl;
        } else {
          // 如果後端發現通關密語錯了，就會在這裡跳出警告提示！
          alert(result.error || "登記提示：系統回傳異常 (" + JSON.stringify(result) + ")");
          btn.disabled = false;
          btn.innerText = "立即生成領券條碼";
        }
      })
      .catch(error => {
        alert("連線發生問題，請檢查網路狀態！錯誤描述：" + error);
        btn.disabled = false;
        btn.innerText = "立即生成領券條碼";
      });
  }
</script>
</body>
</html>
