<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>電子領卷系統</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="活動領券">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- 引入慶祝彩帶引擎 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-parchment: #f4ece1;     /* 溫潤老羊皮紙背景 */
      --paper-cream: #fdfbf7;      /* 點餐單奶油紙色 */
      --paper-warm: #f7f2e8;       /* 表單填寫微深奶油色 */
      --cherry-red: #991b1b;       /* 復古波本櫻桃紅 */
      --mustard-gold: #d97706;     /* 溫潤炙烤芥末黃 */
      --ink-black: #27272a;        /* 經典打字機炭黑 */
      --ink-muted: #71717a;        /* 褪色鉛筆灰 */
      --border-ink: 1.5px solid #27272a; /* 藝術細致墨線 */
      --paper-texture: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.06'/%3E%3C/svg%3E");
    }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; 
      background-color: var(--bg-parchment); 
      background-image: var(--paper-texture), radial-gradient(rgba(153, 27, 27, 0.04) 1px, transparent 0), radial-gradient(rgba(39, 39, 42, 0.04) 1px, transparent 0);
      background-size: 150px 150px, 24px 24px, 24px 24px; background-position: 0 0, 0 0, 12px 12px;
      color: var(--ink-black); margin: 0; padding: 20px 16px; display: flex; justify-content: center; align-items: center; min-height: 95vh; box-sizing: border-box;
    }
    
    .container { width: 100%; max-width: 400px; }
    .guest-check { background-color: var(--paper-cream); background-image: var(--paper-texture); background-size: 150px 150px; border: var(--border-ink); border-radius: 4px; box-shadow: 0 15px 35px -5px rgba(39, 39, 42, 0.18), 0 5px 15px -5px rgba(0,0,0,0.1); position: relative; overflow: hidden; padding: 0; }
    .check-header { background-color: var(--paper-warm); background-image: var(--paper-texture); border-bottom: 2px double var(--ink-black); padding: 22px 22px 16px 22px; text-align: center; position: relative; }
    .check-no { font-family: "Courier New", monospace; font-size: 13px; font-weight: 800; color: var(--cherry-red); letter-spacing: 1px; margin-bottom: 8px; display: block; }
    h1 { font-size: 24px; font-weight: 900; color: var(--ink-black); margin: 0 0 6px 0; letter-spacing: 1.5px; }
    .subtitle { font-size: 13px; color: var(--ink-muted); margin: 0; font-weight: 700; letter-spacing: 0.5px; }
    .server-meta { display: flex; justify-content: space-between; border-bottom: var(--border-ink); background: var(--paper-cream); padding: 10px 22px; font-size: 13px; font-weight: 700; color: var(--ink-muted); letter-spacing: 0.5px; }
    .server-meta span strong { color: var(--ink-black); }
    .check-body { padding: 24px 22px 28px 22px; }
    label { display: block; text-align: left; font-weight: 800; color: var(--ink-black); margin-bottom: 8px; font-size: 14px; letter-spacing: 0.5px; }
    input, select { width: 100%; padding: 14px 16px; border-radius: 2px; border: var(--border-ink); background: var(--paper-warm); color: var(--ink-black); font-size: 16px; font-weight: 700; margin-bottom: 18px; box-sizing: border-box; transition: all 0.2s ease; outline: none; font-family: inherit; }
    input::placeholder { color: #a1a1aa; font-weight: 400; font-size: 15px; }
    input:focus, select:focus { background: #ffffff; border-color: var(--cherry-red); box-shadow: inset 3px 0 0 var(--cherry-red); }
    #activity { background-color: #fff9ed; border-color: var(--mustard-gold); color: var(--ink-black); cursor: pointer; }
    #activity option { background: white; color: var(--ink-black); font-weight: bold; }
    .secret-box { background: #fffdf9; padding: 14px 16px; border-radius: 2px; border: 1.5px dashed var(--cherry-red); margin-bottom: 24px; text-align: center; }
    .secret-box label { color: var(--cherry-red); text-align: center; margin-bottom: 8px; font-size: 15px; }
    #secret_code { border: 1px solid #fca5a5; background: #fffafa; margin-bottom: 0; text-transform: uppercase; letter-spacing: 4px; text-align: center; font-size: 20px; font-weight: 900; color: var(--cherry-red); }
    #secret_code:focus { box-shadow: none; border-color: var(--cherry-red); background: white; }
    .submit-btn { background: var(--cherry-red); color: white; border: 1.5px solid var(--cherry-red); padding: 16px; width: 100%; border-radius: 2px; font-size: 17px; font-weight: 800; cursor: pointer; letter-spacing: 1.5px; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(153, 27, 27, 0.25); font-family: inherit; }
    .submit-btn:hover { background: #7f1d1d; border-color: #7f1d1d; }
    .submit-btn:active { transform: translateY(2px); box-shadow: none; }
    .submit-btn:disabled { background: #e4e4e7 !important; color: #a1a1aa !important; border-color: #d4d4d8 !important; box-shadow: none !important; cursor: not-allowed; transform: none; }
    .switch-btn { background: transparent; color: var(--ink-black); border: 1.5px dashed var(--ink-black); padding: 14px; width: 100%; border-radius: 2px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 20px; transition: all 0.2s ease; letter-spacing: 0.5px; font-family: inherit; }
    .switch-btn:hover { background: var(--paper-warm); }
    .switch-btn:active { transform: translateY(1px); }
    #loading { display: none; padding: 40px 22px; text-align: center; }
    .chibi-loader-box { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .chibi-svg { width: 135px; height: 105px; overflow: visible; margin-bottom: 20px; filter: drop-shadow(0 8px 12px rgba(39, 39, 42, 0.12)); }
    .chibi-boy { animation: chibi-bounce 0.45s infinite alternate cubic-bezier(0.4, 0, 0.6, 1); transform-origin: center bottom; }
    .shadow { animation: shadow-scale 0.45s infinite alternate cubic-bezier(0.4, 0, 0.6, 1); transform-origin: center; }
    .burger-holding { animation: burger-wobble 0.45s infinite alternate ease-in-out; transform-origin: center; }
    .star-fly { animation: star-pop 0.8s infinite linear; }
    @keyframes chibi-bounce { 0% { transform: translateY(0) scaleY(0.96); } 100% { transform: translateY(-12px) scaleY(1.04); } }
    @keyframes shadow-scale { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(0.5); opacity: 0.2; } }
    @keyframes burger-wobble { 0% { transform: rotate(-5deg) translateY(0); } 100% { transform: rotate(5deg) translateY(-3px); } }
    @keyframes star-pop { 0% { transform: translate(0, 0) scale(0.3); opacity: 0; } 50% { opacity: 1; } 100% { transform: translate(22px, -18px) scale(1.3) rotate(180deg); opacity: 0; } }
    .loading-text { color: var(--cherry-red); font-weight: 800; font-size: 16px; letter-spacing: 1px; animation: pulse-text 1.5s infinite; }
    @keyframes pulse-text { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    #ticket-card { display: none; padding: 24px 22px 28px 22px; text-align: center; }
    .stamp-badge { display: inline-block; border: 2px solid var(--cherry-red); color: var(--cherry-red); font-size: 13px; font-weight: 900; letter-spacing: 2px; padding: 4px 14px; border-radius: 2px; transform: rotate(-4deg); margin-bottom: 14px; background: rgba(153, 27, 27, 0.03); transition: all 0.3s ease; }
    .qr-box { background: white; padding: 12px; border: var(--border-ink); border-radius: 2px; display: inline-block; margin: 10px 0; box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
    .qr-img { width: 180px; height: 180px; display: block; transition: opacity 0.3s ease; }
    .highlight-text { font-size: 16px; font-weight: 850; color: var(--ink-black); letter-spacing: 1px; margin: 12px 0 20px 0; border-bottom: 1px solid var(--ink-black); padding-bottom: 12px; display: block; transition: all 0.3s ease; }
    .info-list { text-align: left; display: flex; flex-direction: column; gap: 10px; font-size: 15px; }
    .info-row { display: flex; justify-content: space-between; border-bottom: 1px dotted #d4d4d8; padding-bottom: 8px; }
    .info-row strong { color: var(--ink-muted); font-weight: 700; }
    .info-row span { color: var(--ink-black); font-weight: 850; text-align: right; word-break: break-all; }
    #res-phone { color: var(--cherry-red); font-family: "Courier New", monospace; font-size: 18px !important; font-weight: 900; }
    .screenshot-notice { background: #fef2f2; border: 1.5px solid var(--cherry-red); color: var(--cherry-red); padding: 12px; border-radius: 2px; font-weight: 800; font-size: 15px; margin-bottom: 18px; letter-spacing: 0.5px; }
    .check-footer { height: 16px; background: var(--bg-parchment); position: relative; }
    .check-footer::before { content: ""; position: absolute; top: -8px; left: 0; width: 100%; height: 16px; background-image: radial-gradient(circle, var(--bg-parchment) 6px, transparent 7px); background-size: 18px 18px; }
  </style>
</head>
<body>

<div class="container">
  <div class="guest-check">
    <div class="check-header">
      <span class="check-no">【 德州小騎士 】</span>
      <h1>電子領卷系統</h1>
      <p class="subtitle">限時活動專屬兌換券</p>
    </div>

    <div class="server-meta">
      <span>服務生：<strong>小戰熊</strong></span>
      <span>桌號：<strong>VIP 貴賓席</strong></span>
      <span>人數：<strong>1 位</strong></span>
    </div>

    <div id="form-section" class="check-body">
      <label>🎯 選擇兌換活動項目 (切換自動確認權益)</label>
      <select id="activity" onchange="checkSavedTicket()">
        <option value="父親節社群活動">父親節社群活動</option>
        <option value="中秋節活動">中秋節活動</option>
      </select>

      <label>💬 社群暱稱 (IG/FB 顯示名稱)</label>
      <input type="text" id="name" placeholder="例：小戰熊" required>

      <label>🔗 社群帳號 (供核對使用)</label>
      <input type="text" id="social_id" placeholder="例：tfc.1986" required>

      <label>📱 手機號碼 (防重複驗證)</label>
      <input type="tel" id="phone" placeholder="例：0958585888" maxlength="10" required>

      <div class="secret-box">
        <label>🔑 活動通關密語</label>
        <input type="text" id="secret_code" placeholder="請填入官方提供密語" required>
      </div>

      <button id="btn" class="submit-btn" onclick="register()">🍔 領取專屬兌換卷</button>
    </div>

    <div id="loading">
      <div class="chibi-loader-box">
        <svg viewBox="0 0 130 110" class="chibi-svg">
          <ellipse cx="65" cy="100" rx="28" ry="6" fill="#27272a" class="shadow"/>
          <path d="M 100 40 L 103 48 L 111 50 L 105 56 L 107 64 L 100 59 L 93 64 L 95 56 L 89 50 L 97 48 Z" fill="#d97706" stroke="#27272a" stroke-width="1.5" class="star-fly"/>
          <g class="chibi-boy">
            <ellipse cx="53" cy="94" rx="7" ry="6" fill="#27272a"/>
            <ellipse cx="77" cy="94" rx="7" ry="6" fill="#27272a"/>
            <rect x="48" y="64" width="34" height="26" rx="8" fill="#fdfbf7" stroke="#27272a" stroke-width="2.5"/>
            <rect x="54" y="68" width="22" height="22" rx="4" fill="#991b1b"/>
            <circle cx="65" cy="45" r="25" fill="#fff5eb" stroke="#27272a" stroke-width="2.5"/>
            <ellipse cx="46" cy="50" rx="5" ry="3.5" fill="#e11d48" opacity="0.75"/>
            <ellipse cx="84" cy="50" rx="5" ry="3.5" fill="#e11d48" opacity="0.75"/>
            <path d="M 48 44 Q 52 38 56 44" stroke="#27272a" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M 74 44 Q 78 38 82 44" stroke="#27272a" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M 60 53 Q 65 60 70 53 Z" fill="#991b1b" stroke="#27272a" stroke-width="2"/>
            <path d="M 38 38 C 40 18, 90 18, 92 38 Z" fill="#fdfbf7" stroke="#27272a" stroke-width="2.5"/>
            <path d="M 45 26 L 55 38 M 60 22 L 65 38 M 75 24 L 75 38 M 85 28 L 82 38" stroke="#991b1b" stroke-width="3"/>
            <rect x="36" y="36" width="58" height="8" rx="4" fill="#991b1b" stroke="#27272a" stroke-width="2"/>
            <g class="burger-holding">
              <path d="M 36 78 Q 65 85 94 78 L 90 86 Q 65 90 40 86 Z" fill="#b45309" stroke="#27272a" stroke-width="2"/>
              <rect x="38" y="72" width="54" height="8" rx="4" fill="#451a03" stroke="#27272a" stroke-width="2"/>
              <path d="M 36 72 L 45 76 L 55 70 L 65 77 L 75 70 L 85 76 L 94 72 L 90 68 L 40 68 Z" fill="#d97706" stroke="#27272a" stroke-width="1.5"/>
              <path d="M 38 68 Q 48 64 58 68 Q 68 72 78 66 Q 88 64 92 68" stroke="#15803d" stroke-width="4" fill="none"/>
              <path d="M 36 66 C 38 52, 92 52, 94 66 Z" fill="#d97706" stroke="#27272a" stroke-width="2.5"/>
              <circle cx="50" cy="60" r="1.5" fill="#fdfbf7"/>
              <circle cx="65" cy="57" r="1.5" fill="#fdfbf7"/>
              <circle cx="80" cy="61" r="1.5" fill="#fdfbf7"/>
              <circle cx="42" cy="74" r="6" fill="#fff5eb" stroke="#27272a" stroke-width="2"/>
              <circle cx="88" cy="74" r="6" fill="#fff5eb" stroke="#27272a" stroke-width="2"/>
            </g>
          </g>
        </svg>
        <div class="loading-text">
          🍔 廚房正火速為您製作專屬兌換卷... 🍟
        </div>
      </div>
    </div>

    <div id="ticket-card">
      <div class="screenshot-notice">📸 溫馨提醒：請立即「截圖」保存此兌換券！</div>
      <div class="stamp-badge">【 小編已核銷確認 · 專屬兌換券 】</div>
      <div style="font-size: 19px; font-weight: 900; color: var(--ink-black); letter-spacing: 1px;">活動兌換卷</div>
      <div class="qr-box">
        <img id="qr-code-img" class="qr-img" src="" alt="核銷條碼">
      </div>
      <span class="highlight-text">至德州小騎士門市,出示此條碼即可核銷</span>
      <div class="info-list">
        <div class="info-row"><strong>兌換項目</strong> <span id="res-act" style="color: var(--cherry-red);"></span></div>
        <div class="info-row"><strong>顧客姓名</strong> <span id="res-name"></span></div>
        <div class="info-row"><strong>社群帳號</strong> <span id="res-social"></span></div>
        <div class="info-row"><strong>綁定手機</strong> <span id="res-phone"></span></div>
      </div>
      <button class="switch-btn" onclick="resetToForm()">🔄 我要切換／領取其他活動專區</button>
      <p style="font-size: 13px; color: var(--ink-muted); margin-top: 18px; margin-bottom: 0; line-height: 1.6; font-weight: 700;">
        💡 <strong>用餐須知：</strong>若不便截圖，直接至櫃檯向門市人員「報手機號碼」亦可完成核銷。
      </p>
    </div>

    <div class="check-footer"></div>
  </div>
</div>

<script>
  // ⚠️ 已經幫你保留你的 API 網址
  var API_URL = "https://script.google.com/macros/s/AKfycbyteRoiXgX3h9dpU325M0mg--jNEy1ayfpRPGmXebEEn3Q2Tq37yGNmXiShcrOQqyCm/exec";
  var syncTimer = null; 

  function triggerVibe(pattern) {
    if ("vibrate" in navigator) { try { navigator.vibrate(pattern); } catch(e) {} }
  }

  function triggerConfetti() {
    if (typeof confetti === 'function') {
      var vintageColors = ['#991b1b', '#d97706', '#27272a', '#fdfbf7', '#b45309'];
      confetti({ particleCount: 85, spread: 75, origin: { y: 0.6 }, colors: vintageColors });
      setTimeout(() => {
        confetti({ particleCount: 50, angle: 60, spread: 55, origin: { x: 0 }, colors: vintageColors });
        confetti({ particleCount: 50, angle: 120, spread: 55, origin: { x: 1 }, colors: vintageColors });
      }, 250);
    }
  }

  window.onload = function() {
    checkSavedTicket(true);
  };

  function checkSavedTicket(isFirstLoad) {
    var act = document.getElementById('activity').value;
    var savedPhone = localStorage.getItem("pos_" + act + "_phone");
    
    if (savedPhone) {
      if (!isFirstLoad) {
        triggerVibe([50, 50]);
        alert("💡 系統提示：您已經領過「" + act + "」的餐券囉！自動為您顯示條碼。");
      }
      showTicket(
        act, 
        localStorage.getItem("pos_" + act + "_name") || "VIP 顧客", 
        localStorage.getItem("pos_" + act + "_social") || "", 
        savedPhone
      );
    } else {
      if (syncTimer) clearInterval(syncTimer); 
      document.getElementById('ticket-card').style.display = 'none';
      document.getElementById('loading').style.display = 'none';
      document.getElementById('form-section').style.display = 'block';
    }
  }

  function resetToForm() {
    if (syncTimer) clearInterval(syncTimer); 
    var select = document.getElementById('activity');
    var nextUnclaimed = "";
    var allClaimed = true;

    for (var i = 0; i < select.options.length; i++) {
      var val = select.options[i].value;
      if (!localStorage.getItem("pos_" + val + "_phone")) {
        nextUnclaimed = val;
        allClaimed = false;
        break;
      }
    }

    if (allClaimed) {
      triggerVibe([80, 50, 80]);
      alert("💡 讚啦！您目前「所有開放的活動」都已經領取過專屬餐券囉！為您保留目前的憑證。");
      return;
    }

    select.value = nextUnclaimed;
    document.getElementById('ticket-card').style.display = 'none';
    document.getElementById('loading').style.display = 'none';
    document.getElementById('form-section').style.display = 'block';
    triggerVibe(30);
  }

  function register() {
    var act = document.getElementById('activity').value;
    var name = document.getElementById('name').value.trim();
    var socialId = document.getElementById('social_id').value.trim();
    var phone = document.getElementById('phone').value.trim();
    var secretCode = document.getElementById('secret_code').value.trim(); 

    if (!name) return alert("⚠️ 請輸入您的社群暱稱！");
    if (!socialId) return alert("⚠️ 請輸入您的社群帳號 ID！");
    if (!phone || phone.length < 8) return alert("⚠️ 請輸入正確的手機號碼！");
    if (!secretCode) return alert("⚠️ 請填入活動專屬通關密語！"); 
    
    phone = phone.replace(/\D/g, '');
    triggerVibe(40);

    document.getElementById('form-section').style.display = 'none';
    document.getElementById('loading').style.display = 'none';
    document.getElementById('loading').style.display = 'block';

    var baseUrl = API_URL.split('?')[0]; 
    var params = newSearchParams({
      "action": "register",
      "id": phone,
      "name": name,
      "social_id": socialId, 
      "code": secretCode, 
      "sheet": act,
      "t": new Date().getTime() 
    });
    var url = baseUrl + "?" + params.toString();

    fetch(url, { method: 'GET', redirect: 'follow' })
      .then(response => response.json())
      .then(result => {
        if (result.status === "success" || result.status === "already_registered") {
          if (result.status === "already_registered") {
            alert("💡 歡迎回來！系統偵測到您之前已經成功登記過此活動，自動為您載入專屬餐券！");
          } else {
            triggerVibe([80, 50, 80, 50, 150]);
            triggerConfetti();
          }
          
          localStorage.removeItem("pos_" + act + "_status");
          localStorage.setItem("pos_" + act + "_phone", phone);
          localStorage.setItem("pos_" + act + "_name", result.name || name);
          localStorage.setItem("pos_" + act + "_social", result.social_id || socialId);

          showTicket(act, result.name || name, result.social_id || socialId, phone);
        } else {
          triggerVibe([100, 50, 100]);
          alert(result.error || "驗證失敗：系統回傳異常 (" + JSON.stringify(result) + ")");
          document.getElementById('loading').style.display = 'none';
          document.getElementById('form-section').style.display = 'block';
        }
      })
      .catch(error => {
        var checkUrl = baseUrl + "?action=check&id=" + phone + "&sheet=" + encodeURIComponent(act) + "&t=" + new Date().getTime();
        fetch(checkUrl, { method: 'GET', redirect: 'follow' })
          .then(r => r.json())
          .then(checkRes => {
            if (checkRes.exists) {
              localStorage.setItem("pos_" + act + "_phone", phone);
              localStorage.setItem("pos_" + act + "_name", checkRes.name || name);
              localStorage.setItem("pos_" + act + "_social", checkRes.social_id || socialId);
              showTicket(act, checkRes.name || name, checkRes.social_id || socialId, phone);
            } else {
              triggerVibe([100, 50, 100]);
              alert("⚠️ 網路連線延遲，請檢查網路狀態或重新點擊領取！");
              document.getElementById('loading').style.display = 'none';
              document.getElementById('form-section').style.display = 'block';
            }
          })
          .catch(e => {
            triggerVibe([100, 50, 100]);
            alert("⚠️ 網路連線不穩，請重新點擊領取！");
            document.getElementById('loading').style.display = 'none';
            document.getElementById('form-section').style.display = 'block';
          });
      });
  }

  function showTicket(act, name, social, phone) {
    document.getElementById('form-section').style.display = 'none';
    document.getElementById('loading').style.display = 'none';
    document.getElementById('ticket-card').style.display = 'block';
    
    document.getElementById('res-act').innerText = act;
    document.getElementById('res-name').innerText = name;
    document.getElementById('res-social').innerText = social;
    document.getElementById('res-phone').innerText = phone;
    
    var qrUrl = "https://quickchart.io/qr?text=" + phone + "&size=250&margin=2&dark=27272a&light=ffffff";
    var qrImg = document.getElementById('qr-code-img');
    qrImg.src = qrUrl;

    var cachedStatus = localStorage.getItem("pos_" + act + "_status");
    if (cachedStatus === "已兌換") {
      renderRedeemedState("門市", false); 
      // 🌟🌟🌟 注意：這裡已經成功移除了 return; 讓背景雷達隨時為撤銷核銷做好監控準備！ 🌟🌟🌟
    } else {
      qrImg.style.opacity = "1"; 
    }

    checkStatusFromServer(act, phone, false);

    if (syncTimer) clearInterval(syncTimer);
    var pollCount = 0;

    syncTimer = setInterval(function() {
      pollCount++;
      if (document.hidden) return;
      if (pollCount > 30) { clearInterval(syncTimer); return; }
      checkStatusFromServer(act, phone, true);
    }, 10000);
  }

  function checkStatusFromServer(act, phone, isFromTimer) {
    var baseUrl = API_URL.split('?')[0];
    var url = baseUrl + "?action=check&id=" + phone + "&sheet=" + encodeURIComponent(act) + "&t=" + new Date().getTime();
    
    fetch(url, { method: 'GET', redirect: 'follow' })
      .then(response => response.json())
      .then(res => {
        // 解藥一：後台被刪除，立即自爆返回表單
        if (!res.exists) {
          if (syncTimer) clearInterval(syncTimer);
          localStorage.removeItem("pos_" + act + "_phone");
          localStorage.removeItem("pos_" + act + "_name");
          localStorage.removeItem("pos_" + act + "_social");
          localStorage.removeItem("pos_" + act + "_status");
          
          triggerVibe([100, 50, 100]);
          alert("💡 系統通知：您的【" + act + "】兌換紀錄已被總部重置或移除！畫面將自動返回輸入表單。");
          
          document.getElementById('ticket-card').style.display = 'none';
          document.getElementById('loading').style.display = 'none';
          document.getElementById('form-section').style.display = 'block';
          return;
        }

        // 解藥二：後台改名，即時校正同步
        if (res.exists) {
          var currentName = document.getElementById('res-name').innerText;
          var currentSocial = document.getElementById('res-social').innerText;
          
          if (res.name && res.name !== currentName) {
            document.getElementById('res-name').innerText = res.name;
            localStorage.setItem("pos_" + act + "_name", res.name);
          }
          if (res.social_id && res.social_id !== currentSocial) {
            document.getElementById('res-social').innerText = res.social_id;
            localStorage.setItem("pos_" + act + "_social", res.social_id);
          }
        }

        // 🌟🌟🌟 解藥三：雙向監控「已核銷」與「被店員撤銷 (Undo)」狀態！ 🌟🌟🌟
        if (res.exists) {
          var cachedStatus = localStorage.getItem("pos_" + act + "_status");

          if (res.status === "已兌換") {
            // 如果後台是已兌換，且手機目前的備忘錄還不是已兌換
            if (cachedStatus !== "已兌換") {
              localStorage.setItem("pos_" + act + "_status", "已兌換");
              renderRedeemedState(res.store || "門市", isFromTimer);
            }
          } else {
            // 🌟 奇蹟反轉：如果後台「不是已兌換」(被店員撤銷了！)，但手機備忘錄竟然還記著「已兌換」！
            if (cachedStatus === "已兌換") {
              localStorage.removeItem("pos_" + act + "_status"); // 1. 解除終身記憶鎖！
              renderValidState(isFromTimer); // 2. 瞬間把條碼跟郵戳變回有效狀態！
            }
          }
        }
      })
      .catch(e => {});
  }

  function renderRedeemedState(storeName, triggerSoundAndAlert) {
    var qrImg = document.getElementById('qr-code-img');
    qrImg.style.opacity = "0.15"; 
    
    var stamp = document.querySelector(".stamp-badge");
    stamp.innerHTML = "【 廚房已核銷確認 · 感謝完食 】";
    stamp.style.borderColor = "#71717a";
    stamp.style.color = "#71717a";
    
    var highlight = document.querySelector(".highlight-text");
    highlight.innerHTML = "★ 本餐券已使用完畢 · 期待您再次光臨 ★";
    highlight.style.color = "#71717a";
    
    if (triggerSoundAndAlert) {
      triggerVibe([100, 50, 100, 50, 200]);
      alert("🎉 恭喜！門市人員已於【" + storeName + "】完成核銷，您的餐券已成功兌換！");
    }
  }

  // 🌟 獨立抽出的「恢復有效狀態」專用 UI 函數
  function renderValidState(triggerSoundAndAlert) {
    var qrImg = document.getElementById('qr-code-img');
    qrImg.style.opacity = "1"; // 條碼恢復 100% 清晰
    
    var stamp = document.querySelector(".stamp-badge");
    stamp.innerHTML = "【 小編已核銷確認 · 專屬兌換券 】";
    stamp.style.borderColor = "var(--cherry-red)";
    stamp.style.color = "var(--cherry-red)";
    
    var highlight = document.querySelector(".highlight-text");
    highlight.innerHTML = "至德州小騎士門市,出示此條碼即可核銷";
    highlight.style.color = "var(--ink-black)";
    
    if (triggerSoundAndAlert) {
      triggerVibe([100, 50, 100]);
      alert("💡 系統通知：您的餐券已被門市人員「撤銷核銷」，已恢復為【有效狀態】，可再次使用！");
    }
  }
  
  function newSearchParams(obj) {
    var params = [];
    for (var key in obj) {
      params.push(encodeURIComponent(key) + "=" + encodeURIComponent(obj[key]));
    }
    return params.join("&");
  }
</script>
