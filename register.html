<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>電子領卷系統</title>
  <link rel="apple-touch-icon" href="icon.png">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    :root { --bg-parchment:#f4ece1; --paper-cream:#fdfbf7; --paper-warm:#f7f2e8; --cherry-red:#991b1b; --mustard-gold:#d97706; --ink-black:#27272a; --ink-muted:#71717a; --border-ink:1.5px solid #27272a; --paper-texture:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.06'/%3E%3C/svg%3E"); }
    body { font-family: system-ui, sans-serif; background: var(--bg-parchment) var(--paper-texture); background-size: 150px; color: var(--ink-black); margin: 0; padding: 20px 16px; display: flex; justify-content: center; min-height: 95vh; }
    .container { width: 100%; max-width: 400px; }
    .guest-check { background: var(--paper-cream) var(--paper-texture); border: var(--border-ink); border-radius: 4px; box-shadow: 0 15px 35px -5px rgba(0,0,0,0.15); overflow: hidden; }
    .check-header { background: var(--paper-warm) var(--paper-texture); border-bottom: 2px double var(--ink-black); padding: 22px; text-align: center; }
    .check-no { font-family: monospace; font-size: 13px; font-weight: 800; color: var(--cherry-red); letter-spacing: 1px; display: block; margin-bottom: 8px; }
    h1 { font-size: 24px; font-weight: 900; margin: 0 0 6px 0; }
    .subtitle { font-size: 13px; color: var(--ink-muted); margin: 0; font-weight: 700; }
    .server-meta { display: flex; justify-content: space-between; border-bottom: var(--border-ink); padding: 10px 22px; font-size: 13px; font-weight: 700; color: var(--ink-muted); }
    .server-meta strong { color: var(--ink-black); }
    .check-body, #ticket-card { padding: 24px 22px; }
    label { display: block; font-weight: 800; margin-bottom: 8px; font-size: 14px; }
    input, select, button { width: 100%; padding: 14px 16px; border-radius: 2px; border: var(--border-ink); background: var(--paper-warm); color: var(--ink-black); font-size: 16px; font-weight: 700; margin-bottom: 18px; box-sizing: border-box; outline: none; transition: 0.2s; }
    input:focus, select:focus { background: #fff; border-color: var(--cherry-red); box-shadow: inset 3px 0 0 var(--cherry-red); }
    .secret-box { background: #fffdf9; padding: 14px; border: 1.5px dashed var(--cherry-red); margin-bottom: 24px; text-align: center; }
    .secret-box label { color: var(--cherry-red); margin-bottom: 8px; }
    #secret_code { border-color: #fca5a5; background: #fffafa; text-align: center; font-size: 20px; font-weight: 900; color: var(--cherry-red); text-transform: uppercase; letter-spacing: 4px; margin-bottom:0;}
    .submit-btn { background: var(--cherry-red); color: #fff; border-color: var(--cherry-red); cursor: pointer; letter-spacing: 1.5px; }
    .switch-btn { background: transparent; border: 1.5px dashed var(--ink-black); cursor: pointer; margin-top: 20px; }
    #loading { display: none; padding: 40px 22px; text-align: center; }
    .chibi-svg { width: 135px; height: 105px; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.12)); margin-bottom: 20px;}
    .chibi-boy { animation: bounce 0.45s infinite alternate; transform-origin: center bottom; }
    @keyframes bounce { 0% { transform: translateY(0) scaleY(0.96); } 100% { transform: translateY(-12px) scaleY(1.04); } }
    .loading-text { color: var(--cherry-red); font-weight: 800; font-size: 16px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .stamp-badge { display: inline-block; border: 2px solid var(--cherry-red); color: var(--cherry-red); font-size: 13px; font-weight: 900; padding: 4px 14px; border-radius: 2px; transform: rotate(-4deg); margin-bottom: 14px; transition: 0.3s; }
    .qr-box { background: #fff; padding: 12px; border: var(--border-ink); display: inline-block; margin: 10px 0; }
    .qr-img { width: 180px; height: 180px; display: block; transition: 0.3s; }
    .highlight-text { font-size: 16px; font-weight: 850; border-bottom: 1px solid var(--ink-black); padding-bottom: 12px; display: block; margin: 12px 0 20px; }
    .info-list { text-align: left; display: flex; flex-direction: column; gap: 10px; font-size: 15px; }
    .info-row { display: flex; justify-content: space-between; border-bottom: 1px dotted #d4d4d8; padding-bottom: 8px; }
    .info-row strong { color: var(--ink-muted); }
    .info-row span { font-weight: 850; text-align: right; }
    #res-phone { color: var(--cherry-red); font-family: monospace; font-size: 18px; font-weight: 900; }
    .notice { background: #fef2f2; border: 1.5px solid var(--cherry-red); color: var(--cherry-red); padding: 12px; font-weight: 800; font-size: 15px; margin-bottom: 18px; }
  </style>
</head>
<body>

<div class="container">
  <div class="guest-check">
    <div class="check-header">
      <span class="check-no">【 德州小騎士 】</span>
      <h1>電子領卷系統</h1>
      <p class="subtitle">限時活動專屬兌換券</p>
    </div>
    <div class="server-meta">
      <span>服務生：<strong>小戰熊</strong></span>
      <span>桌號：<strong>VIP 貴賓席</strong></span>
      <span>人數：<strong>1 位</strong></span>
    </div>

    <!-- 表單 -->
    <div id="form-section" class="check-body">
      <label>🎯 兌換活動項目</label>
      <select id="activity" onchange="checkSaved()"><option value="父親節社群活動">父親節社群活動</option><option value="中秋節活動">中秋節活動</option></select>
      <label>💬 社群暱稱</label><input type="text" id="name" placeholder="例：小戰熊" required>
      <label>🔗 社群帳號</label><input type="text" id="social_id" placeholder="例：tfc.1986" required>
      <label>📱 手機號碼</label><input type="tel" id="phone" placeholder="例：0958585888" oninput="this.value=this.value.replace(/\D/g,'').slice(0,10)" required>
      <div class="secret-box"><label>🔑 通關密語</label><input type="text" id="secret_code" placeholder="請填入密語" required></div>
      <button class="submit-btn" onclick="register()">🍔 領取專屬兌換卷</button>
    </div>

    <!-- 載入中 -->
    <div id="loading">
      <svg viewBox="0 0 130 110" class="chibi-svg">
        <g class="chibi-boy"><rect x="48" y="64" width="34" height="26" rx="8" fill="#fdfbf7" stroke="#27272a" stroke-width="2.5"/><rect x="54" y="68" width="22" height="22" rx="4" fill="#991b1b"/><circle cx="65" cy="45" r="25" fill="#fff5eb" stroke="#27272a" stroke-width="2.5"/><path d="M 60 53 Q 65 60 70 53 Z" fill="#991b1b" stroke="#27272a" stroke-width="2"/><path d="M 38 38 C 40 18, 90 18, 92 38 Z" fill="#fdfbf7" stroke="#27272a" stroke-width="2.5"/><rect x="36" y="36" width="58" height="8" rx="4" fill="#991b1b" stroke="#27272a" stroke-width="2"/><g transform="translate(0, -6)"><path d="M 36 78 Q 65 85 94 78 L 90 86 Q 65 90 40 86 Z" fill="#b45309" stroke="#27272a" stroke-width="2"/><rect x="38" y="72" width="54" height="8" rx="4" fill="#451a03" stroke="#27272a" stroke-width="2"/><path d="M 36 66 C 38 52, 92 52, 94 66 Z" fill="#d97706" stroke="#27272a" stroke-width="2.5"/></g></g>
      </svg>
      <div class="loading-text">🍔 廚房正火速製作中... 🍟</div>
    </div>

    <!-- 餐券 -->
    <div id="ticket-card">
      <div class="notice">📸 請立即「截圖」保存此兌換券！</div>
      <div class="stamp-badge" id="stamp">【 小編已核銷確認 · 專屬兌換券 】</div>
      <h2 style="font-size:19px; margin:0">活動兌換卷</h2>
      <div class="qr-box"><img id="qr" class="qr-img" src=""></div>
      <span class="highlight-text" id="hl-text">至德州小騎士門市,出示此條碼即可核銷</span>
      <div class="info-list">
        <div class="info-row"><strong>項目</strong> <span id="r-act" style="color:var(--cherry-red);"></span></div>
        <div class="info-row"><strong>姓名</strong> <span id="r-name"></span></div>
        <div class="info-row"><strong>帳號</strong> <span id="r-social"></span></div>
        <div class="info-row"><strong>手機</strong> <span id="r-phone"></span></div>
      </div>
      <button class="switch-btn" onclick="switchAct()">🔄 我要切換／領取其他活動</button>
    </div>
  </div>
</div>

<script>
  const API = "https://script.google.com/macros/s/AKfycbyteRoiXgX3h9dpU325M0mg--jNEy1ayfpRPGmXebEEn3Q2Tq37yGNmXiShcrOQqyCm/exec";
  const $ = id => document.getElementById(id);
  let timer = null;

  const vibe = p => navigator.vibrate && navigator.vibrate(p);
  const show = (id, d='block') => $(id).style.display = d;
  const hide = id => $(id).style.display = 'none';

  window.onload = () => checkSaved(true);

  function checkSaved(isInit=false) {
    const act = $('activity').value;
    const phone = localStorage.getItem(`p_${act}_phone`);
    if(phone) {
      if(!isInit) { vibe([50,50]); alert(`💡 您已領過「${act}」！為您顯示憑證。`); }
      renderTicket(act, localStorage.getItem(`p_${act}_name`), localStorage.getItem(`p_${act}_social`), phone);
    } else {
      if(timer) clearInterval(timer);
      hide('ticket-card'); hide('loading'); show('form-section');
    }
  }

  function switchAct() {
    if(timer) clearInterval(timer);
    const sel = $('activity'), current = sel.value;
    const next = Array.from(sel.options).find(o => !localStorage.getItem(`p_${o.value}_phone`))?.value;
    
    if(next) {
      sel.value = next; hide('ticket-card'); hide('loading'); show('form-section'); vibe(30);
    } else {
      vibe([50,50]);
      sel.value = Array.from(sel.options).find(o => o.value !== current).value;
      checkSaved(true);
    }
  }

  async function register() {
    const act=$('activity').value, name=$('name').value.trim(), soc=$('social_id').value.trim(), ph=$('phone').value.replace(/\D/g,''), cd=$('secret_code').value.trim();
    if(!name || !soc || ph.length<8 || !cd) return alert("⚠️ 請完整填寫資料與密語！");
    
    hide('form-section'); show('loading'); vibe(40);
    
    try {
      const res = await fetch(`${API}?action=register&id=${ph}&name=${name}&social_id=${soc}&code=${cd}&sheet=${act}&t=${Date.now()}`).then(r=>r.json());
      if (res.status === "success" || res.status === "already_registered") {
        if(res.status==="success") confetti({particleCount:80, spread:70});
        localStorage.removeItem(`p_${act}_status`);
        localStorage.setItem(`p_${act}_phone`, ph); localStorage.setItem(`p_${act}_name`, res.name||name); localStorage.setItem(`p_${act}_social`, res.social_id||soc);
        renderTicket(act, res.name||name, res.social_id||soc, ph);
      } else {
        alert(res.error); hide('loading'); show('form-section');
      }
    } catch(e) {
      alert("網路不穩，系統將於背景重試！"); hide('loading'); show('form-section');
    }
  }

  function renderTicket(act, name, soc, ph) {
    hide('form-section'); hide('loading'); show('ticket-card');
    $('r-act').innerText=act; $('r-name').innerText=name; $('r-social').innerText=soc; $('r-phone').innerText=ph;
    $('qr').src = `https://quickchart.io/qr?text=${ph}&size=250&dark=27272a`;
    
    if(localStorage.getItem(`p_${act}_status`) === "已兌換") setUI(true);
    else setUI(false);

    if(timer) clearInterval(timer);
    let polls = 0;
    timer = setInterval(async () => {
      if(document.hidden || ++polls > 30) return (polls>30 && clearInterval(timer));
      try {
        const res = await fetch(`${API}?action=check&id=${ph}&sheet=${act}&t=${Date.now()}`).then(r=>r.json());
        if(!res.exists) {
          clearInterval(timer); ['phone','name','social','status'].forEach(k=>localStorage.removeItem(`p_${act}_${k}`));
          alert("💡 您的兌換紀錄已被總部重置！"); hide('ticket-card'); show('form-section'); return;
        }
        if(res.name && res.name!==$('r-name').innerText) { $('r-name').innerText=res.name; localStorage.setItem(`p_${act}_name`,res.name); }
        
        const cached = localStorage.getItem(`p_${act}_status`);
        if(res.status==="已兌換" && cached!=="已兌換") { localStorage.setItem(`p_${act}_status`,"已兌換"); setUI(true, true); }
        else if(res.status!=="已兌換" && cached==="已兌換") { localStorage.removeItem(`p_${act}_status`); setUI(false, true); }
      } catch(e){}
    }, 10000);
  }

  function setUI(isRedeemed, alertUser=false) {
    $('qr').style.opacity = isRedeemed ? "0.15" : "1";
    $('stamp').innerHTML = isRedeemed ? "【 已核銷確認 · 感謝完食 】" : "【 小編已核銷確認 · 專屬兌換券 】";
    $('stamp').style.borderColor = isRedeemed ? "#71717a" : "var(--cherry-red)";
    $('stamp').style.color = isRedeemed ? "#71717a" : "var(--cherry-red)";
    $('hl-text').innerHTML = isRedeemed ? "★ 本餐券已使用完畢 ★" : "至德州小騎士門市出示核銷";
    $('hl-text').style.color = isRedeemed ? "#71717a" : "var(--ink-black)";
    if(alertUser) { vibe([100,50,100]); alert(isRedeemed ? "🎉 您的餐券已成功核銷！" : "💡 餐券已恢復為有效狀態！"); }
  }
</script>
</body>
</html>
