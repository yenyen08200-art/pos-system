<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>VIP 輕奢專屬領券系統</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="活動領券">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- 引入慶祝彩帶引擎 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-main: #f5f0eb;       /* 溫柔燕麥奶茶底色 */
      --card-bg: #ffffff;       /* 溫潤純白厚卡質地 */
      --ticket-bg: #faf7f2;     /* 奶油米白憑證底色 */
      --text-main: #4a3b32;     /* 深焙濃縮咖啡黑 */
      --text-sub: #8c7a6b;      /* 溫柔伯爵茶灰 */
      --accent: #c48b71;        /* 玫瑰焦糖泰奶色 */
      --accent-dark: #a86f56;   /* 按壓深焦糖色 */
      --border-color: #e6dfd5;  /* 柔和邊框色 */
      --alert-red: #d9777f;     /* 溫柔玫瑰紅 */
    }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; 
      background-color: var(--bg-main); 
      background-image: 
        radial-gradient(at 10% 10%, rgba(196, 139, 113, 0.08) 0px, transparent 60%),
        radial-gradient(at 90% 90%, rgba(140, 122, 107, 0.08) 0px, transparent 60%);
      color: var(--text-main);
      margin: 0; 
      padding: 16px; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 95vh; 
      box-sizing: border-box;
    }
    
    .container { width: 100%; max-width: 420px; }

    /* 🌿 韓系簡約精品導航橫幅 */
    .header-banner {
      background: var(--card-bg);
      padding: 22px 18px;
      border-radius: 20px;
      text-align: center;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px -5px rgba(74, 59, 50, 0.05);
    }
    h1 { color: var(--text-main); font-size: 22px; margin: 0 0 6px 0; font-weight: 850; letter-spacing: 1px; }
    .subtitle { color: var(--text-sub); font-size: 14px; margin: 0; line-height: 1.5; font-weight: 500; }

    /* 🛡️ 主卡片視覺 */
    .card { 
      background: var(--card-bg); 
      padding: 26px 22px; 
      border-radius: 24px; 
      box-shadow: 0 20px 40px -10px rgba(74, 59, 50, 0.08); 
      border: 1px solid var(--border-color);
      position: relative;
    }

    label { display: block; text-align: left; font-weight: 750; color: var(--text-main); margin-bottom: 8px; font-size: 14px; letter-spacing: 0.5px; }
    
    input, select { 
      width: 100%; padding: 16px; border-radius: 14px; border: 2px solid var(--border-color); 
      background: #fcfbf9; color: var(--text-main); font-size: 16px; font-weight: 700;
      margin-bottom: 18px; box-sizing: border-box; transition: all 0.25s ease; outline: none;
    }
    input::placeholder { color: #bcaaa0; font-weight: 400; }
    input:focus, select:focus { border-color: var(--accent); background: #ffffff; box-shadow: 0 0 0 4px rgba(196, 139, 113, 0.15); }
    
    #activity { background-color: #faf7f2; border-color: #d8cca6; color: var(--text-main); cursor: pointer; }
    #activity option { background: white; color: var(--text-main); }

    /* 🔑 玫瑰焦糖通關密語框 */
    .secret-box { background: #faf7f2; padding: 14px; border-radius: 16px; border: 1.5px dashed #d8cca6; margin-bottom: 22px; }
    .secret-box label { color: var(--accent-dark); }
    #secret_code { border-color: #d8cca6; background: white; margin-bottom: 0; text-transform: uppercase; letter-spacing: 3px; text-align: center; font-size: 18px; color: var(--accent-dark); }

    /* 🧋 玫瑰焦糖送出按鈕 */
    .submit-btn { 
      background: linear-gradient(135deg, var(--accent), var(--accent-dark)); 
      color: white; border: none; padding: 18px; width: 100%; border-radius: 16px; 
      font-size: 17px; font-weight: 800; cursor: pointer; letter-spacing: 1px;
      box-shadow: 0 8px 20px -4px rgba(196, 139, 113, 0.4); transition: all 0.2s ease;
    }
    .submit-btn:active { transform: scale(0.98); box-shadow: 0 4px 10px -2px rgba(196, 139, 113, 0.3); }
    .submit-btn:disabled { background: #dcd5cd !important; color: #8c7a6b !important; box-shadow: none !important; cursor: not-allowed; transform: none; }
    
    /* 🔄 切換活動按鈕 (奶茶副按鈕風) */
    .switch-btn {
      background: #faf7f2; color: var(--accent-dark); border: 1.5px solid #d8cca6;
      padding: 14px; width: 100%; border-radius: 14px; font-size: 15px; font-weight: 750;
      cursor: pointer; margin-top: 14px; transition: all 0.2s ease;
    }
    .switch-btn:active { background: #f0eae1; transform: scale(0.98); }

    /* 🎟️ 輕奢精品「電子憑證卡」設計 */
    #ticket-card { display: none; text-align: center; }
    
    .ticket-box {
      background: var(--ticket-bg); border: 1.5px solid #e3d8c8; border-radius: 20px;
      padding: 26px 18px; margin: 15px 0; position: relative;
      box-shadow: 0 10px 25px -5px rgba(74, 59, 50, 0.06);
    }
    .ticket-box::before, .ticket-box::after {
      content: ""; position: absolute; top: 60%; width: 24px; height: 24px;
      background-color: var(--card-bg); border: 1.5px solid #e3d8c8; border-radius: 50%;
    }
    .ticket-box::before { left: -14px; border-left-color: transparent; border-top-color: transparent; transform: rotate(45deg); }
    .ticket-box::after { right: -14px; border-right-color: transparent; border-bottom-color: transparent; transform: rotate(45deg); }

    .qr-img { width: 190px; height: 190px; margin: 15px auto; border: 8px solid white; border-radius: 16px; box-shadow: 0 8px 20px rgba(74, 59, 50, 0.08); display: block; }
    .highlight-text { font-size: 16px; font-weight: 850; color: var(--accent-dark); letter-spacing: 1px; margin: 12px 0 18px 0; }
    
    .info-list { text-align: left; border-top: 1.5px dashed #d8cca6; padding-top: 18px; display: flex; flex-direction: column; gap: 12px; }
    .info-row { display: flex; justify-content: space-between; font-size: 15px; }
    .info-row strong { color: var(--text-sub); width: 90px; font-weight: 600; }
    .info-row span { color: var(--text-main); font-weight: 800; text-align: right; word-break: break-all; }
    #res-phone { color: var(--accent-dark); font-family: monospace; font-size: 18px !important; }

    .screenshot-notice { background: #fdf2f2; border: 1px solid var(--alert-red); color: var(--alert-red); padding: 12px; border-radius: 14px; font-weight: 800; font-size: 15px; margin-bottom: 18px; animation: pulse 2s infinite; letter-spacing: 0.5px; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  </style>
</head>
<body>

<div class="container">
  <!-- 👉 頂部橫幅 -->
  <div class="header-banner">
    <h1>✨ VIP 輕奢專屬禮遇</h1>
    <p class="subtitle">完成活動通關驗證，立即領取您的限時專屬憑證</p>
  </div>

  <div class="card">
    <!-- 👉 步驟一：登記表單區塊 -->
    <div id="form-section">
      <label>🎯 選擇兌換活動項目 (切換自動確認權益)</label>
      <!-- 🌟 關鍵優化：加上 onchange 一切換活動就自動檢查是否有該活動的憑證！ -->
      <select id="activity" onchange="checkSavedTicket()">
        <option value="父親節社群活動">父親節社群活動</option>
        <option value="中秋節活動">中秋節活動</option>
      </select>

      <label>💬 社群暱稱 (IG/FB 顯示名稱)</label>
      <input type="text" id="name" placeholder="例：小新 / Amy" required>

      <label>🔗 社群帳號 ID (供核對使用)</label>
      <input type="text" id="social_id" placeholder="例：@shin_123 / LINE ID" required>

      <label>📱 聯絡手機號碼 (防重複驗證)</label>
      <input type="tel" id="phone" placeholder="例：0912345678" maxlength="10" required>

      <!-- 🌟 專屬玫瑰焦糖鑰匙孔！ -->
      <div class="secret-box">
        <label>🔑 活動專屬通關密語</label>
        <input type="text" id="secret_code" placeholder="請填入官方公告密語" required>
      </div>

      <button id="btn" class="submit-btn" onclick="register()">✨ 立即驗證並生成憑證</button>
    </div>

    <!-- 👉 步驟二：輕奢厚卡紙憑證卡區塊 -->
    <div id="ticket-card">
      <div class="screenshot-notice">📸 溫馨提醒：請立即「截圖」保存此兌換憑證</div>
      
      <div class="ticket-box">
        <div style="font-size: 18px; font-weight: 850; color: var(--text-main); letter-spacing: 1px;">🎉 驗證通過！專屬憑證</div>
        
        <img id="qr-code-img" class="qr-img" src="" alt="核銷條碼">
        <div class="highlight-text">★ 憑此條碼至全台門市享專屬禮遇 ★</div>

        <div class="info-list">
          <div class="info-row"><strong>🎯 兌換項目</strong> <span id="res-act" style="color: var(--accent-dark);"></span></div>
          <div class="info-row"><strong>💬 顧客姓名</strong> <span id="res-name"></span></div>
          <div class="info-row"><strong>🔗 社群帳號</strong> <span id="res-social"></span></div>
          <div class="info-row"><strong>📱 綁定手機</strong> <span id="res-phone"></span></div>
        </div>
      </div>
      
      <!-- 🌟 終極解藥：讓客人一鍵切換回表單選其他活動！ -->
      <button class="switch-btn" onclick="resetToForm()">🔄 我要領取／切換其他活動</button>

      <p style="font-size: 13px; color: var(--text-sub); margin-top: 16px; margin-bottom: 0; line-height: 1.6; font-weight: 500;">
        💡 <strong>兌換須知：</strong>若無法截圖，直接至櫃檯向門市人員「報手機號碼」亦可完成連線核銷。
      </p>
    </div>
  </div>
</div>

<script>
  // ⚠️ 已經幫你保留你的 API 網址
  var API_URL = "https://script.google.com/macros/s/AKfycbyteRoiXgX3h9dpU325M0mg--jNEy1ayfpRPGmXebEEn3Q2Tq37yGNmXiShcrOQqyCm/exec";

  function triggerVibe(pattern) {
    if ("vibrate" in navigator) { try { navigator.vibrate(pattern); } catch(e) {} }
  }

  function triggerConfetti() {
    if (typeof confetti === 'function') {
      var morandiColors = ['#c48b71', '#a86f56', '#d8cca6', '#8c7a6b', '#f5f0eb'];
      confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 }, colors: morandiColors });
      setTimeout(() => {
        confetti({ particleCount: 50, angle: 60, spread: 55, origin: { x: 0 }, colors: morandiColors });
        confetti({ particleCount: 50, angle: 120, spread: 55, origin: { x: 1 }, colors: morandiColors });
      }, 250);
    }
  }

  // 🌟 網頁載入時，立即檢查「預設選取的活動」是否有紀錄
  window.onload = function() {
    checkSavedTicket(true);
  };

  // 🌟🌟🌟 核心解藥：檢查指定活動的獨立置物櫃！ 🌟🌟🌟
  function checkSavedTicket(isFirstLoad) {
    var act = document.getElementById('activity').value;
    // 使用 binding 活動名稱的專屬 Key！
    var savedPhone = localStorage.getItem("pos_" + act + "_phone");
    
    if (savedPhone) {
      if (!isFirstLoad) alert("💡 系統偵測：您之前已經領取過「" + act + "」的憑證囉！為您載入條碼。");
      showTicket(
        act, 
        localStorage.getItem("pos_" + act + "_name") || "VIP 顧客", 
        localStorage.getItem("pos_" + act + "_social") || "", 
        savedPhone
      );
    } else {
      // 該活動如果沒領過，乾乾淨淨還原成填表單狀態！
      document.getElementById('ticket-card').style.display = 'none';
      document.getElementById('form-section').style.display = 'block';
    }
  }

  // 🌟 按下「切換其他活動」按鈕，回到表單畫面
  function resetToForm() {
    document.getElementById('ticket-card').style.display = 'none';
    document.getElementById('form-section').style.display = 'block';
    triggerVibe(30);
  }

  // 🌟 主管點擊送出的核心大函數
  function register() {
    var act = document.getElementById('activity').value;
    var name = document.getElementById('name').value.trim();
    var socialId = document.getElementById('social_id').value.trim();
    var phone = document.getElementById('phone').value.trim();
    var secretCode = document.getElementById('secret_code').value.trim(); 

    if (!name) return alert("⚠️ 請輸入您的社群暱稱！");
    if (!socialId) return alert("⚠️ 請輸入您的社群帳號 ID！");
    if (!phone || phone.length < 8) return alert("⚠️ 請輸入正確的手機號碼！");
    if (!secretCode) return alert("⚠️ 請填入活動專屬通關密語！"); 
    
    phone = phone.replace(/\D/g, '');
    triggerVibe(40);

    var btn = document.getElementById('btn');
    btn.disabled = true;
    btn.innerText = "⏳ 系統連線驗證中...";

    var baseUrl = API_URL.split('?')[0]; 
    var params = new URLSearchParams({
      "action": "register",
      "id": phone,
      "name": name,
      "social_id": socialId, 
      "code": secretCode, 
      "sheet": act
    });
    var url = baseUrl + "?" + params.toString();

    fetch(url)
      .then(response => response.json())
      .then(result => {
        if (result.status === "success" || result.status === "already_registered") {
          if (result.status === "already_registered") {
            alert("💡 系統偵測到此手機號碼或社群帳號之前已經登記過囉！為您顯示原本的專屬憑證。");
          } else {
            triggerVibe([80, 50, 80, 50, 150]);
            triggerConfetti();
          }
          
          // 🌟 寫入專屬該活動的置物櫃！不會再互相覆蓋或卡死了！
          localStorage.setItem("pos_" + act + "_phone", phone);
          localStorage.setItem("pos_" + act + "_name", result.name || name);
          localStorage.setItem("pos_" + act + "_social", result.social_id || socialId);

          showTicket(act, result.name || name, result.social_id || socialId, phone);
        } else {
          triggerVibe([100, 50, 100]);
          alert(result.error || "驗證失敗：系統回傳異常 (" + JSON.stringify(result) + ")");
          btn.disabled = false;
          btn.innerText = "✨ 立即驗證並生成憑證";
        }
      })
      .catch(error => {
        triggerVibe([100, 50, 100]);
        alert("連線發生問題，請檢查網路狀態！錯誤描述：" + error);
        btn.disabled = false;
        btn.innerText = "✨ 立即驗證並生成憑證";
      });
  }

  function showTicket(act, name, social, phone) {
    document.getElementById('form-section').style.display = 'none';
    document.getElementById('ticket-card').style.display = 'block';
    
    document.getElementById('res-act').innerText = act;
    document.getElementById('res-name').innerText = name;
    document.getElementById('res-social').innerText = social;
    document.getElementById('res-phone').innerText = phone;
    
    var qrUrl = "https://quickchart.io/qr?text=" + phone + "&size=250&margin=2&dark=4a3b32&light=ffffff";
    document.getElementById('qr-code-img').src = qrUrl;
  }
</script>
</body>
</html>
