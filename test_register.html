<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- 🔥 新增：Apple PWA 專用 Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>電子領卷系統</title>
  
  <!-- 🔥 新增：PWA Manifest 確保外掛瀏覽器有 App 體驗 -->
  <link rel="manifest" href='data:application/manifest+json;base64,eyJuYW1lIjoi5b635bee5bCP6aiO5aOrIFZJUCIsInNob3J0X25hbWUiOiLlsI_poI7lo6sgVklQIiwic3RhcnRfdXJsIjoiLiIsImRpc3BsYXkiOiJzdGFuZGFsb25lIiwiYmFja2dyb3VuZF9jb2xvciI6IiNGRkRGNTAiLCJ0aGVtZV9jb2xvciI6IiNiOTkxNWEifQ=='>
  <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Square_logo.svg/512px-Square_logo.svg.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <!-- LIFF SDK：用 LINE 帳號當身分，取代簡訊 OTP -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root{
      --sage-deep:#5c6a5c; --sage:#8b9a86; --sage-light:#b9c3b1;
      --brass:#b9915a; --brass-light:#dcbb84; --brass-deep:#8d6c3c;
      --ink:#2c302c; --ink-soft:#6f766e;
      --glass:rgba(255,255,255,.45); --glass-soft:rgba(255,255,255,.25);
      --stroke:rgba(255,255,255,.6); --radius:28px;
      --shadow:0 30px 70px -28px rgba(35,42,35,.25);
      --accent-member: #F2A900; /* 新增會員專屬金黃色 */
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
    html,body{max-width:100%;overflow-x:hidden}
    html{height:100%}
    body{
      margin:0;padding:28px 16px 60px;
      font-family:"Inter","Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(120% 80% at 20% 0%, rgba(166, 193, 238, 0.7) 0%, transparent 60%),
        radial-gradient(110% 90% at 80% 100%, rgba(246, 211, 101, 0.5) 0%, transparent 70%),
        linear-gradient(160deg, #dce7f3 0%, #fdf2dc 100%);
      background-attachment:fixed;
      min-height:100vh;position:relative;
      display:flex;justify-content:center;align-items:flex-start;
      font-weight:400;letter-spacing:.01em;
    }
    
    body::before{
      content:"";position:fixed;inset:-50%;z-index:0;pointer-events:none;opacity:.4;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.5'/></svg>");
      animation:grain 8s steps(6) infinite;
    }
    @keyframes grain{
      0%,100%{transform:translate3d(0,0,0)}20%{transform:translate3d(-6px,4px,0)}
      40%{transform:translate3d(5px,-6px,0)}60%{transform:translate3d(-4px,-3px,0)}80%{transform:translate3d(6px,5px,0)}
    }
    
    body::after{
      content:"";position:fixed;width:500px;height:500px;top:-100px;right:-100px;z-index:0;
      border-radius:50%;filter:blur(90px);pointer-events:none;
      background:radial-gradient(circle, rgba(246, 211, 101, 0.65), transparent 70%);
      animation:breathe-gold 5s ease-in-out infinite alternate;
    }
    .blue-glow {
      position:fixed;width:550px;height:550px;bottom:-150px;left:-150px;z-index:0;
      border-radius:50%;filter:blur(100px);pointer-events:none;
      background:radial-gradient(circle, rgba(166, 193, 238, 0.75), transparent 70%);
      animation:breathe-blue 6s ease-in-out infinite alternate;
    }
    @keyframes breathe-gold { 0% { opacity: 0.3; transform: scale(0.85); } 100% { opacity: 0.85; transform: scale(1.15); } }
    @keyframes breathe-blue { 0% { opacity: 0.85; transform: scale(1.15); } 100% { opacity: 0.3; transform: scale(0.85); } }

    .shell{width:100%;max-width:420px;position:relative;z-index:1;display:flex;flex-direction:column;gap:18px}
    .glass{
      position:relative;overflow:hidden;background:var(--glass);
      backdrop-filter:blur(35px) saturate(160%);-webkit-backdrop-filter:blur(35px) saturate(160%);
      border:1px solid var(--stroke);border-radius:var(--radius);
      box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.85),inset 0 -1px 0 rgba(255,255,255,.2);
    }
    .glass::before{
      content:"";position:absolute;inset:0;pointer-events:none;opacity:.4;mix-blend-mode:overlay;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4'/></filter><rect width='200' height='200' filter='url(%23f)'/></svg>");
    }
    .glass::after{
      content:"";position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(115deg,transparent 36%,rgba(255,255,255,.5) 48%,transparent 60%);
      transform:translateX(-130%);animation:sheen 8s ease-in-out infinite;
    }
    @keyframes sheen{0%,72%{transform:translateX(-130%)}100%{transform:translateX(130%)}}

    .brand{text-align:center;padding:34px 24px 28px;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
    .brand .mark{
      display:inline-flex;align-items:center;gap:10px;margin-bottom:16px;
      font-size:10.5px;letter-spacing:.4em;text-transform:uppercase;color:var(--brass-deep);font-weight:600;
    }
    .brand .mark::before,.brand .mark::after{content:"";width:26px;height:1px;background:linear-gradient(90deg,transparent,var(--brass))}
    
    h1 {
      font-family: "Noto Sans TC", sans-serif;
      font-size: 32px;
      font-weight: 800;
      margin: 0 0 8px;
      letter-spacing: .15em;
      background: linear-gradient(135deg, var(--brass-light), var(--brass-deep));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 4px 8px rgba(185, 145, 90, 0.25));
      -webkit-text-stroke: 0;
    }
    
    .subtitle{font-size:11.5px;color:var(--ink-soft);margin:0;letter-spacing:.32em;text-transform:uppercase}
    .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.4);margin-top:22px;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.5)}
    .meta div{padding:12px 6px;background:rgba(255,255,255,.35);text-align:center}
    .meta span{display:block;font-size:9.5px;letter-spacing:.24em;color:var(--ink-soft);margin-bottom:5px}
    .meta strong{font-size:12.5px;font-weight:600;color:var(--ink);letter-spacing:.04em}

    section.card{padding:30px 22px 32px;animation:rise .9s .08s cubic-bezier(.2,.8,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

    .field{margin-bottom:20px;position:relative;z-index:2}
    label{display:block;font-size:11px;letter-spacing:.22em;color:var(--ink-soft);margin-bottom:8px;font-weight:600;text-transform:uppercase}
    input,select{
      width:100%;max-width:100%;padding:16px 16px;border-radius:16px;
      border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.45);
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      color:var(--ink);font-size:16px;font-weight:500;font-family:inherit;
      outline:none;transition:all .35s cubic-bezier(.2,.8,.2,1);
      appearance:none;-webkit-appearance:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
    }
    select{background-image:linear-gradient(45deg,transparent 50%,var(--brass-deep) 50%),linear-gradient(135deg,var(--brass-deep) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
    input:focus,select:focus{
      background-color:rgba(255,255,255,.7);border-color:rgba(185,145,90,.75);
      box-shadow:0 0 0 4px rgba(185,145,90,.15),0 0 18px rgba(220,187,132,.35),inset 0 1px 0 rgba(255,255,255,.9);
      transform:translateY(-1px);
    }
    input::placeholder{color:rgba(90,96,88,.6);font-weight:400}

    /* LINE 身分列：讓顧客看得到「系統認得我是誰」，減少填單時的不安全感 */
    .line-identity {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; margin-bottom: 18px; border-radius: 16px;
      background: linear-gradient(160deg, rgba(6,199,85,.12), rgba(255,255,255,.25));
      border: 1px solid rgba(6,199,85,.35);
      position: relative; z-index: 2;
    }
    .line-identity img {
      width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
      background: rgba(0,0,0,.06);
    }
    .line-identity .li-text { min-width: 0; flex: 1; }
    .line-identity .li-label {
      font-size: 11px; font-weight: 700; letter-spacing: .1em;
      color: #068a3d; text-transform: uppercase;
    }
    .line-identity .li-name {
      font-size: 15px; font-weight: 700; color: var(--brass-deep);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* 開場的身分驗證遮罩 */
    #liff-gate {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 32px; text-align: center;
      background: rgba(250, 247, 240, .96); backdrop-filter: blur(8px);
    }
    #liff-gate.hidden { display: none; }
    #liff-gate .gate-title { font-size: 17px; font-weight: 700; color: var(--brass-deep); }
    #liff-gate .gate-desc { font-size: 13px; color: rgba(90,96,88,.85); line-height: 1.7; max-width: 320px; }
    .gate-spinner {
      width: 38px; height: 38px; border-radius: 50%;
      border: 3px solid rgba(185,145,90,.25); border-top-color: var(--brass-deep);
      animation: gate-spin .9s linear infinite;
    }
    @keyframes gate-spin { to { transform: rotate(360deg); } }
    #liff-gate .gate-retry {
      margin-top: 4px; padding: 12px 24px; border-radius: 14px; cursor: pointer;
      font-size: 14px; font-weight: 700; border: 1px solid rgba(185,145,90,.5);
      background: rgba(185,145,90,.15); color: var(--brass-deep);
    }

    .secret{
      margin:26px 0 20px;padding:22px 18px;border-radius:22px;text-align:center;
      background:linear-gradient(160deg,rgba(255,255,255,.45),rgba(255,255,255,.2));
      border:1px solid rgba(220,187,132,.6);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 0 24px -12px rgba(185,145,90,.6);
      backdrop-filter:blur(16px);position:relative;z-index:2;
    }
    .secret label{color:var(--brass-deep);letter-spacing:.3em}
    #secret_code{
      text-align:center;font-size:20px;font-weight:600;letter-spacing:.42em;
      text-transform:uppercase;color:var(--brass-deep);background:rgba(255,255,255,.5);
    }
    
    .warning-text {
      position: relative; z-index: 2;
      font-size: 11px; color: #d64545; text-align: center; font-weight: 700;
      margin-bottom: 20px; padding: 10px; border-radius: 10px;
      background: rgba(214, 69, 69, 0.1); border: 1px solid rgba(214, 69, 69, 0.2);
      letter-spacing: 0.05em;
    }

    button{
      width:100%;padding:18px;border-radius:18px;font-size:14px;font-weight:600;
      letter-spacing:.18em;cursor:pointer;font-family:inherit;outline:none;position:relative;overflow:hidden;
      transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease,background .35s ease;z-index:2;
    }
    .submit-btn{
      color:#fffdf8;border:1px solid rgba(255,255,255,.55);
      background:linear-gradient(135deg,#d3ab72,#b9915a 45%,#8d6c3c);
      box-shadow:0 18px 38px -16px rgba(141,108,60,.85),inset 0 1px 0 rgba(255,255,255,.5);
    }
    .submit-btn::after{
      content:"";position:absolute;inset:0;
      background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);
      transform:translateX(-130%);animation:sheen 5s ease-in-out infinite;
    }
    .submit-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 24px 46px -16px rgba(141,108,60,1)}
    .submit-btn:active:not(:disabled){transform:scale(.975)}
    .submit-btn:disabled{filter:grayscale(60%);opacity:0.7;cursor:not-allowed;}

    .switch-btn{
      margin-top:20px;color:var(--ink);background:rgba(255,255,255,.4);
      border:1px solid rgba(255,255,255,.65);backdrop-filter:blur(14px);font-weight:500;
      box-shadow:0 12px 28px -20px rgba(35,42,35,.6),inset 0 1px 0 rgba(255,255,255,.8);
    }
    .switch-btn:hover{background:rgba(255,255,255,.55);transform:translateY(-2px)}
    .switch-btn:active{transform:scale(.975)}

    .family-btn {
      margin-top:12px; color: var(--brass-deep); background: rgba(185,145,90,.1);
      border: 1px dashed rgba(185,145,90,.5); backdrop-filter: blur(10px);
    }
    .family-btn:hover { background: rgba(185,145,90,.2); border: 1px solid rgba(185,145,90,.6); }

    /* 🔥 總開關連動的會員中心入口按鈕 */
    #btn-goto-member {
      display: none; /* 預設隱藏，由系統設定決定是否顯示 */
      margin-top: 15px; background: linear-gradient(135deg, var(--accent-member), #FFC72C);
      color: #1E293B; border: none; font-weight: 800; font-size: 15px; letter-spacing: 0.1em;
      box-shadow: 0 10px 25px rgba(242,169,0,0.4); text-decoration: none; text-align: center;
    }
    #btn-goto-member:hover { filter: brightness(1.1); transform: translateY(-2px); }

    #ticket-card{text-align:center}
    .notice{
      background:rgba(185,145,90,.16);border:1px solid rgba(185,145,90,.42);
      color:var(--brass-deep);padding:13px 14px;border-radius:15px;
      font-weight:600;font-size:13px;letter-spacing:.06em;margin-bottom:22px;
      backdrop-filter:blur(10px);position:relative;z-index:2;
    }
    .stamp-badge{
      display:inline-block;font-size:11px;font-weight:600;letter-spacing:.2em;
      padding:9px 18px;border-radius:999px;margin-bottom:20px;
      border:1px solid rgba(185,145,90,.55);color:var(--brass-deep);
      background:rgba(255,255,255,.4);backdrop-filter:blur(10px);transition:.4s;position:relative;z-index:2;
      max-width:100%;
    }
    .qr-box{
      background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.85);
      padding:16px;border-radius:24px;display:inline-block;margin:6px 0 22px;position:relative;z-index:2;
      box-shadow:0 24px 50px -24px rgba(35,42,35,.5),inset 0 1px 0 #ffffff;
      transition:transform .4s cubic-bezier(.2,.8,.2,1);max-width:100%;
    }
    .qr-box:hover{transform:translateY(-3px) scale(1.01)}
    .qr-img{display:block;margin:0 auto;max-width:100%;height:auto;transition:opacity .4s ease;border-radius:8px}

    .highlight-text{
      display:block;font-size:13.5px;font-weight:600;letter-spacing:.18em;color:var(--ink);
      margin:0 0 24px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,.5);
      transition:.4s;position:relative;z-index:2;
    }
    .info-list{
      text-align:left;display:flex;flex-direction:column;gap:12px;position:relative;z-index:2;
      background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.6);
      padding:18px;border-radius:20px;backdrop-filter:blur(16px);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
    }
    .info-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:11px;border-bottom:1px solid rgba(255,255,255,.45)}
    .info-row:last-child{border-bottom:none;padding-bottom:0}
    .info-row strong{color:var(--ink-soft);font-weight:500;font-size:11px;letter-spacing:.16em;white-space:nowrap}
    .info-row span{font-weight:600;font-size:14.5px;text-align:right;word-break:break-all;min-width:0}
    .gift-text { color: #8d6c3c !important; font-weight: 800 !important; }
    #r-phone{color:var(--brass-deep);font-size:16px;letter-spacing:.08em}
    .footnote{text-align:center;font-size:10px;letter-spacing:.3em;color:rgba(111,118,110,.75);text-transform:uppercase;padding-bottom:4px}

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

    @media (max-width:380px){
      body{padding:20px 12px 44px}
      .brand{padding:28px 18px 22px}
      section.card{padding:24px 16px 26px}
      h1{font-size:28px}
      .meta strong{font-size:11px}
    }
  
    /* ================= 🔽 自訂下拉選單 ================= */
    .cs{position:relative;width:100%}
    /* .field 自己有 z-index:2，會形成堆疊脈絡；不把展開中的那一個提上來，
       選單會被「下一個欄位」蓋住（後面的同層元素本來就畫在上面）。 */
    .field:has(.cs.open){z-index:60}
    /* 原生 select 留著（仍是唯一的真實狀態），只是視覺上藏起來 */
    .cs-native{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none}
    .cs-trigger{
      width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:16px 16px;border-radius:16px;
      border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.45);
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      color:var(--ink);font-size:16px;font-weight:500;font-family:inherit;text-align:left;
      outline:none;cursor:pointer;transition:all .35s cubic-bezier(.2,.8,.2,1);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
    }
    .cs.open .cs-trigger{
      background-color:rgba(255,255,255,.7);border-color:rgba(185,145,90,.75);
      box-shadow:0 0 0 4px rgba(185,145,90,.15),0 0 18px rgba(220,187,132,.35),inset 0 1px 0 rgba(255,255,255,.9);
      transform:translateY(-1px);
    }
    .cs-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .cs-caret{font-size:12px;color:var(--brass-deep);flex:0 0 auto;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
    .cs.open .cs-caret{transform:rotate(180deg)}

    .cs-panel{
      position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:60;
      background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
      border:1px solid rgba(185,145,90,.28);border-radius:18px;
      box-shadow:0 20px 46px rgba(90,70,40,.22);padding:7px;
      max-height:270px;overflow-y:auto;
      opacity:0;transform:translateY(-10px) scale(.97);transform-origin:top center;
      pointer-events:none;transition:opacity .22s ease,transform .32s cubic-bezier(.2,.8,.2,1);
    }
    .cs.open .cs-panel{opacity:1;transform:none;pointer-events:auto}
    .cs-opt{
      padding:14px 14px;border-radius:12px;font-size:15px;font-weight:500;color:var(--ink);
      cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      opacity:0;transform:translateY(-6px);
      transition:background .18s,color .18s,opacity .28s ease,transform .28s cubic-bezier(.2,.8,.2,1);
    }
    .cs.open .cs-opt{opacity:1;transform:none}
    .cs-opt:hover{background:rgba(185,145,90,.1)}
    .cs-opt.selected{background:linear-gradient(135deg,rgba(220,187,132,.28),rgba(185,145,90,.18));color:var(--brass-deep);font-weight:700}

    /* 動效會讓部分使用者不適，系統設定要求減少動態時全部關掉 */
    @media (prefers-reduced-motion: reduce){
      .cs-panel,.cs-opt,.cs-caret,.cs-trigger{transition:none !important}
    }
</style>
</head>
<body>
  <div class="blue-glow"></div>

  <main class="shell">
    <header class="glass brand">
      <div class="mark">德州小騎士</div>
      <h1>電子領卷系統</h1>
      <p class="subtitle">Exclusive Voucher</p>
      <div class="meta">
        <div><span>服務生</span><strong>小戰熊</strong></div>
        <div><span>桌號</span><strong>VIP 席</strong></div>
        <div><span>人數</span><strong>1 位</strong></div>
      </div>
    </header>

    <section class="glass card" id="form-section">
      <div class="line-identity" id="line-identity" style="display:none">
        <img id="li-avatar" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
        <div class="li-text">
          <div class="li-label">LINE 帳號已驗證</div>
          <div class="li-name" id="li-name">—</div>
        </div>
      </div>

      <div class="field">
        <label for="activity">兌換活動項目</label>
        <select id="activity" onchange="checkSaved()">

        <input id="phone" type="tel" inputmode="numeric" placeholder="例：0912345678" oninput="
          let v = this.value.replace(/\D/g,'');
          if(v.length > 0 && v[0] !== '0') v = '';

      <div style="color:var(--brass-deep); font-weight:700; font-size:13px; margin-bottom:12px; animation: blink 2s infinite; letter-spacing: 0.05em; position:relative; z-index:2;">💡 請將手機螢幕調至最亮，以便門市人員核銷</div>

      <div class="qr-box">
        <canvas id="qr" class="qr-img"></canvas>

      <span class="highlight-text" id="hl-text">至德州小騎士門市出示核銷</span>

      <div class="info-list">
        <div class="info-row"><strong>兌換活動項目</strong><span id="r-act"></span></div>
        <div class="info-row"><strong>🎁 兌換餐點</strong><span id="r-gift" class="gift-text"></span></div>
        <div class="info-row"><strong>⏳ 使用期限</strong><span id="r-expire"></span></div>
        <div class="info-row"><strong>社群暱稱</strong><span id="r-name"></span></div>
        <div class="info-row"><strong>社群帳號</strong><span id="r-social"></span></div>
        <div class="info-row"><strong>手機號碼</strong><span id="r-phone"></span></div>
      </div>
      
      <button class="switch-btn" onclick="switchAct()">🔄 切換 / 領取其他活動</button>

      <!-- 🔥 隱藏開關：引導前往會員中心 -->
      <a href="member.html" class="submit-btn" id="btn-goto-member" style="display: flex; align-items: center; justify-content: center; margin-top: 20px;">👑 前往我的會員中心</a>
    </section>

    <div id="liff-gate">
      <div class="gate-spinner" id="gate-spinner"></div>
      <div class="gate-title" id="gate-title">正在驗證 LINE 身分…</div>
      <div class="gate-desc" id="gate-desc">第一次使用會跳出 LINE 授權畫面，同意後就會自動回到這裡。</div>
      <button class="gate-retry" id="gate-retry" style="display:none" onclick="location.reload()">🔄 重新載入</button>
    </div>

    <p class="footnote">Texas Chick · Since 1987</p>
  </main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBINQuYtYZA8RLfwm51AfGLTYj1TX_UcFo",
    authDomain: "texas-chick-event.firebaseapp.com",
    projectId: "texas-chick-event",
    storageBucket: "texas-chick-event.firebasestorage.app",
    messagingSenderId: "281248037440",
    appId: "1:281248037440:web:20c32ba4136ea7c57ffda5",
    measurementId: "G-HZ6334WB3B"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const functions = getFunctions(app, "asia-east1"); // 要跟 Cloud Functions 的 region 一致

  const auth = getAuth(app);
  auth.languageCode = 'zh-TW';

  /* ============================================================
   * LIFF 設定 —— 這一行一定要填，不然整頁不會動
   * ------------------------------------------------------------
   * 去哪拿：LINE Developers Console → 你的 Provider
   *        → 建立（或選擇）一個「LINE Login」channel
   *        → LIFF 分頁 → Add
   *            Endpoint URL：這一頁的完整網址
   *              例 https://yenyen08200-art.github.io/你的repo/test_register.html
   *            Size：Full
   *            Scope：勾 profile、openid（openid 一定要勾，不然拿不到 ID Token）
   *        → 建立完會給你一組 LIFF ID，格式像 1234567890-abcdEFGh
   *
   * ⚠️ LIFF ID 前面那串數字就是 Channel ID，要跟 functions/index.js 裡的
   *    LINE_LOGIN_CHANNEL_ID 填成同一組，否則後端會驗不過。
   * ============================================================*/
  const LIFF_ID = "2011218116-PrF1MXQ3";

  const $ = id => document.getElementById(id);
  let unsubscribe = null;
  // 🔥 通關密語不再存在前端變數裡了——正確答案只存在雲端的 system/secrets，
  //    驗證與發券整段都在 Cloud Function claimTicket 裡做，開發者工具挖不到答案。
  let POS_CONFIG = {};
  let isMemberSystemActive = true; // 🔥 新增：全域開關變數

  /* LINE 身分狀態 */
  let lineProfile = null;   // { lineUserId, displayName, pictureUrl }
  let myClaims = {};        // { 活動名稱: { phone, claimedAt } } —— 這個 LINE 帳號已領過的活動
  let ticketCache = {};     // { 活動名稱: 票券資料 } —— 領完/查回來的券，切換活動時直接重畫

  const urlParams = new URLSearchParams(window.location.search);
  const customGift = urlParams.get('gift') || "";
  if (window.location.search) { window.history.replaceState({}, document.title, window.location.pathname); }

  /* 🔥 前端雙重判斷：就算雲端排程掛掉，前台也會自己依上下架時間過濾活動
     支援 "2026-09-01T10:00" / "2026/09/01"，一律當台灣時間解讀 */
  function parseScheduleTime(str, endOfDayIfNoTime) {
    if (!str || typeof str !== 'string') return null;
    const m = str.trim().match(/(\d{4})[/-](\d{1,2})[/-](\d{1,2})(?:[T\s](\d{1,2}):(\d{2}))?/);
    if (!m) return null;
    const h  = m[4] !== undefined ? Number(m[4]) : (endOfDayIfNoTime ? 23 : 0);
    const mi = m[5] !== undefined ? Number(m[5]) : (endOfDayIfNoTime ? 59 : 0);
    return Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]), h, mi, 0) - 8 * 3600 * 1000;
  }

  function isEventOnShelf(cfg) {
    if (!cfg) return false;
    const now = Date.now();
    const s = parseScheduleTime(cfg.startAt, false);
    const e = parseScheduleTime(cfg.endAt, true);
    const hasSchedule = s !== null || e !== null;

    // 🔥 有排程 → 一律以「時間」為準，不看 active。
    //    因為 active 是雲端排程每小時整點才同步的結果，如果這裡跟它做 AND，
    //    在「時間已到、但還沒到下一個整點」的空窗期，活動會該上架卻上不了。
    if (hasSchedule) {
      if (s !== null && now < s) return false;
      if (e !== null && now > e) return false;
      return true;
    }

    // 沒排程 → 完全由後台的手動開關決定
    return cfg.active !== false;
  }

  window.checkSaved = checkSaved;
  window.switchAct = switchAct;
  window.register = register;

  /* ============================================================
   * 開場流程：先確認「你是誰」，再讓你看到表單
   *
   *   liff.init()
   *     → 沒登入就 liff.login()（在 LINE 裡是無感的，外部瀏覽器會跳 LINE 登入頁）
   *     → liff.getIDToken() 拿到一段有 LINE 簽章的憑證
   *     → 送給 Cloud Function lineSignIn 驗證
   *         回傳：Firebase custom token + 這個帳號已領過哪些活動
   *     → signInWithCustomToken() 登入 Firebase Auth（uid = LINE userId）
   *
   * 為什麼要多繞一圈 Firebase Auth？
   *   因為票券的即時狀態是用 onSnapshot 監聽的，要有 Firebase 的登入身分才讀得到；
   *   而且之後會員系統要做權限判斷時，request.auth.uid 就直接是 LINE 帳號，很好用。
   * ============================================================*/
  function gateFail(title, desc) {
    $('gate-spinner').style.display = 'none';
    $('gate-title').innerText = title;
    $('gate-desc').innerHTML = desc;
    $('gate-retry').style.display = 'block';
  }

  async function bootstrap() {
    if (!LIFF_ID) {
      return gateFail("⚠️ 系統尚未設定完成",
        "開發者請先在 <b>test_register.html</b> 填入 LIFF_ID，<br>並在 <b>functions/index.js</b> 填入 LINE_LOGIN_CHANNEL_ID。");
    }

    try {
      await liff.init({ liffId: LIFF_ID });
    } catch (e) {
      console.error("LIFF 初始化失敗:", e);
      return gateFail("😢 無法啟動 LINE 驗證", "請確認網址是否正確，或稍後再試一次。");
    }

    if (!liff.isLoggedIn()) {
      // 這行會把頁面導去 LINE 授權，同意後自動回到本頁，然後 bootstrap 會再跑一次
      liff.login({ redirectUri: window.location.href });
      return;
    }

    const idToken = liff.getIDToken();
    if (!idToken) {
      return gateFail("😢 取不到 LINE 憑證",
        "請確認這個 LIFF 應用程式的 Scope 有勾選 <b>openid</b>，然後重新開啟頁面。");
    }

    try {
      const signIn = httpsCallable(functions, 'lineSignIn');
      const res = await signIn({ idToken });
      const d = res.data;

      await signInWithCustomToken(auth, d.firebaseToken);

      lineProfile = { lineUserId: d.lineUserId, displayName: d.displayName, pictureUrl: d.pictureUrl };
      myClaims = {};
      (d.claimed || []).forEach(c => { myClaims[c.act] = { phone: c.phone, claimedAt: c.claimedAt }; });

      // 顯示身分列
      $('li-name').innerText = d.displayName || "LINE 使用者";
      if (d.pictureUrl) $('li-avatar').src = d.pictureUrl;
      $('line-identity').style.display = 'flex';

      // 暱稱欄位先幫他帶入 LINE 名稱，少打一點字
      if (!$('name').value && d.displayName) $('name').value = d.displayName;

    } catch (e) {
      console.error("LINE 身分驗證失敗:", e);
      const msg = (e && e.message) ? e.message : "請稍後再試。";
      return gateFail("😢 身分驗證失敗", msg);
    }

    $('liff-gate').classList.add('hidden');
    await initSystem();
  }

  async function initSystem() {
    try {
      const configSnap = await getDoc(doc(db, "system", "config"));
      if (configSnap.exists()) {
        const data = configSnap.data();
        POS_CONFIG = data.POS_CONFIG || {};

        // 🔥 讀取總開關狀態
        isMemberSystemActive = data.MEMBER_SYSTEM_ACTIVE !== undefined ? data.MEMBER_SYSTEM_ACTIVE : true;

        // 通關密語已經搬到 system/secrets（前端讀不到），這裡直接信任
        // EVENT_ORDER——後台新增/刪除活動時本來就會同步維護這份清單。
        let EVENT_ORDER = data.EVENT_ORDER || [];

        const actSelect = $('activity');
        actSelect.innerHTML = "";
        
        EVENT_ORDER.forEach(actName => {
          if (POS_CONFIG[actName] && !isEventOnShelf(POS_CONFIG[actName])) return; // 🔥 含手動下架 + 排程時間判斷
          if (actName.includes('【實體】') || actName.includes('實體券')) return;

          const opt = document.createElement('option');
          opt.value = actName;
          opt.text = actName;
          actSelect.appendChild(opt);
        });

        // 🔥 排程時間內沒有任何活動時，給顧客明確訊息而不是空白下拉選單
        if (actSelect.options.length === 0) {
          actSelect.innerHTML = '<option value="">😴 目前沒有進行中的活動</option>';
          $('btn-submit').disabled = true;
          $('btn-submit').innerText = "目前無可領取的活動";
        }

        checkSaved(true);
      } else {
        $('activity').innerHTML = '<option value="">⚠️ 系統設定讀取失敗</option>';
      }
    } catch (e) {
      console.error("讀取系統設定失敗:", e);
      alert("系統連線異常，請重新整理頁面！");
    }
  }

  bootstrap();

  /** 從雲端把「這個活動我領過的那張券」抓回來顯示 */
  async function showClaimedTicket(act, notify) {
    const claim = myClaims[act];
    if (!claim) return false;

    if (ticketCache[act]) {
      if (notify) alert(`💡 您已經領取過「${act}」，已為您載入原本的憑證。`);
      renderTicket(act, ticketCache[act]);
      return true;
    }

    try {
      const snap = await getDoc(doc(db, act, claim.phone));
      if (snap.exists()) {
        ticketCache[act] = { ...snap.data(), phone: claim.phone };
        if (notify) alert(`💡 您已經領取過「${act}」，已為您載入原本的憑證。`);
        renderTicket(act, ticketCache[act]);
        return true;
      }
    } catch (e) {
      console.error("讀取既有票券失敗:", e);
    }
    return false;
  }

  async function checkSaved(isInit = false) {
    const act = $('activity').value;
    if (!act) return;

    if (myClaims[act]) {
      const ok = await showClaimedTicket(act, !isInit);
      if (ok) return;
    }

    if (unsubscribe) { unsubscribe(); unsubscribe = null; }
    $('ticket-card').style.display = 'none';
    $('form-section').style.display = 'block';
  }

  function switchAct() {
    if (unsubscribe) { unsubscribe(); unsubscribe = null; }
    const sel = $('activity');
    const current = sel.value;

    // 優先跳到「還沒領過」的活動
    const next = Array.from(sel.options).find(o => o.value && !myClaims[o.value])?.value;
    if (next) {
      sel.value = next;
      $('ticket-card').style.display = 'none';
      $('form-section').style.display = 'block';
      return;
    }

    // 全部都領過了 → 就切到下一個活動看那張券
    const others = Array.from(sel.options).filter(o => o.value && o.value !== current);
    if (others.length === 0) {
      return alert("🎉 目前所有活動您都已經領取過囉！");
    }
    sel.value = others[0].value;
    checkSaved(true);
  }

  async function register() {
    const act = $('activity').value;
    const name = $('name').value.trim();
    const soc  = $('social_id').value.trim();
    const ph   = $('phone').value.replace(/\D/g, '');
    const cd   = $('secret_code').value.trim();

    if (!act) return alert("⚠️ 系統載入中，請稍候！");
    if (!lineProfile) return alert("⚠️ LINE 身分尚未驗證完成，請重新整理頁面。");
    if (ph.length !== 10 || !ph.startsWith('09')) return alert("⚠️ 手機號碼必須為「09 開頭且滿 10 碼數字」！");
    if (!name || !soc) return alert("⚠️ 請完整填寫社群暱稱與社群帳號！");

    const btn = $('btn-submit');
    btn.disabled = true;
    btn.innerText = "領取中…";

    try {
      /* 🔥 密語驗證、活動上架判斷、防重複領取、寫入資料庫——
         全部在 Cloud Function claimTicket 裡一次做完。
         前端只負責把資料送過去、把結果畫出來，改 JS 也繞不過去。 */
      const claim = httpsCallable(functions, 'claimTicket');
      const res = await claim({
        idToken: liff.getIDToken(),
        act, name, social: soc, phone: ph, code: cd,
      });
      const d = res.data || {};

      if (d.ok) {
        confetti({ particleCount: 80, spread: 70 });
        myClaims[act] = { phone: ph, claimedAt: d.ticket.timestamp || "" };
        ticketCache[act] = d.ticket;
        renderTicket(act, d.ticket);
      } else if (d.reason === "already-claimed") {
        alert("💡 " + (d.message || "您已經領過這個活動了。"));
        if (d.ticket) {
          myClaims[act] = { phone: d.ticket.phone, claimedAt: d.ticket.timestamp || "" };
          ticketCache[act] = d.ticket;
          renderTicket(act, d.ticket);
        }
      } else {
        alert("⚠️ " + (d.message || "領取失敗，請稍後再試。"));
      }
    } catch (e) {
      console.error("領券失敗:", e);
      // Cloud Function 丟出的 HttpsError，訊息會在 e.message 裡（例如「通關密語錯誤。」）
      alert("⚠️ " + (e && e.message ? e.message : "領取失敗，請稍後再試。"));
    } finally {
      btn.disabled = false;
      btn.innerText = "領取專屬兌換卷";
    }
  }

  /** t = 票券資料物件（後端回傳的，或從 Firestore 讀回來的） */
  function renderTicket(act, t) {
    $('form-section').style.display = 'none';
    $('ticket-card').style.display = 'block';

    // 🔥 依據開關設定，決定是否顯示會員中心按鈕
    $('btn-goto-member').style.display = isMemberSystemActive ? 'flex' : 'none';

    const ph = t.phone;
    $('r-act').innerText = act;
    $('r-name').innerText = t.name || "";
    $('r-social').innerText = t.social_id || "";
    $('r-phone').innerText = ph;
    $('r-gift').innerText = t.gift || customGift || (POS_CONFIG[act] ? POS_CONFIG[act].gift : "") || "專屬活動贈品";
    $('r-expire').innerText = t.expireDate || (POS_CONFIG[act] && POS_CONFIG[act].expireDate) || "無特別限制";

    new QRious({
      element: $('qr'),
      value: ph,
      size: 200,
      foreground: '#5c6a5c'
    });

    setUI(t.status === "已兌換");

    if (unsubscribe) { unsubscribe(); unsubscribe = null; }
    unsubscribe = onSnapshot(doc(db, act, ph), (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        setUI(data.status === "已兌換");
        if (data.gift) $('r-gift').innerText = data.gift;
        if (data.expireDate) $('r-expire').innerText = data.expireDate;
      }
    });
  }

  function setUI(isRedeemed) {
    $('qr').style.opacity = isRedeemed ? "0.15" : "1";
    $('stamp').innerHTML = isRedeemed ? "【 廚房已核銷確認 · 感謝完食 】" : "【 小編已核銷確認 · 專屬兌換券 】";
    $('stamp').style.borderColor = isRedeemed ? "rgba(111,118,110,.45)" : "rgba(185,145,90,.55)";
    $('stamp').style.color = isRedeemed ? "#6f766e" : "#8d6c3c";
    $('hl-text').innerHTML = isRedeemed ? "★ 本餐券已使用完畢 ★" : "至德州小騎士門市出示核銷";
    $('hl-text').style.color = isRedeemed ? "#6f766e" : "#2c302c";
  }
</script>
<!-- ============================================================
     自訂下拉選單：把原生 <select> 包一層，做出可以動畫的展開效果
     ------------------------------------------------------------
     為什麼不直接拿掉 <select> 自己刻一個？
       原生 select 彈出來的清單是「瀏覽器自己畫」的，網頁 CSS 完全碰不到，
       所以想要滑順展開只能自己做一份。但整組換掉風險很高——現有程式碼
       到處都在讀寫 select.value、直接塞 innerHTML 換選項、綁 onchange。

     所以這裡採「包一層」而不是「換掉」：
       · 原生 select 留在 DOM 裡（只是視覺上藏起來），仍然是唯一的真實狀態
       · 所有 .value 讀寫、innerHTML 換選項、onchange 全部照舊運作
       · 額外攔截 value 的 setter 跟選項變動，讓外觀跟著同步
     這樣就算動畫層有問題，底下的資料流也不會受影響。
     ============================================================ -->
<script>
(function () {
  var OPEN = 'open';
  var opened = null;
  var nativeValue = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');

  function sync(cs, sel) {
    var lab = cs.querySelector('.cs-label');
    var o = sel.options[sel.selectedIndex];
    if (lab) lab.textContent = o ? o.textContent : '';
  }

  function build(cs, sel) {
    var panel = cs.querySelector('.cs-panel');
    panel.innerHTML = '';
    Array.prototype.forEach.call(sel.options, function (opt, i) {
      var d = document.createElement('div');
      d.className = 'cs-opt' + (opt.value === sel.value ? ' selected' : '');
      d.textContent = opt.textContent;
      // 依序滑出；超過 12 項就不再累加，免得長清單要等很久才展開完
      d.style.transitionDelay = Math.min(i, 12) * 22 + 'ms';
      d.addEventListener('click', function (e) {
        e.stopPropagation();
        if (sel.value !== opt.value) {
          sel.value = opt.value;
          sel.dispatchEvent(new Event('change', { bubbles: true }));
        }
        sync(cs, sel);
        close(cs);
      });
      panel.appendChild(d);
    });
  }

  function open(cs, sel) {
    if (opened && opened !== cs) close(opened);
    build(cs, sel);          // 每次展開都重建，確保選項永遠是最新的
    sync(cs, sel);
    cs.classList.add(OPEN);
    opened = cs;
  }

  function close(cs) {
    // 收合時把 delay 清掉，否則會反過來一項一項慢慢消失，看起來拖泥帶水
    cs.querySelectorAll('.cs-opt').forEach(function (d) { d.style.transitionDelay = '0ms'; });
    cs.classList.remove(OPEN);
    if (opened === cs) opened = null;
  }

  function enhance(sel) {
    if (!sel || sel.getAttribute('data-cs') === '1') return;
    sel.setAttribute('data-cs', '1');

    var cls = sel.className;                       // 原本的 class 給觸發鈕沿用，外觀才不會跑掉
    var cs = document.createElement('div');
    cs.className = 'cs';
    sel.parentNode.insertBefore(cs, sel);
    cs.appendChild(sel);
    sel.classList.add('cs-native');

    var trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'cs-trigger ' + cls;
    trigger.innerHTML = '<span class="cs-label"></span><span class="cs-caret">▾</span>';
    cs.appendChild(trigger);

    var panel = document.createElement('div');
    panel.className = 'cs-panel';
    cs.appendChild(panel);

    trigger.addEventListener('click', function (e) {
      e.stopPropagation();
      if (sel.disabled) return;
      if (cs.classList.contains(OPEN)) { close(cs); } else { open(cs, sel); }
    });

    /* 程式碼用 sel.value = 'x' 直接指定時，原生不會發 change 事件，
       這裡攔下 setter 補一次同步，否則畫面上的文字會停在舊的值。 */
    Object.defineProperty(sel, 'value', {
      configurable: true,
      get: function () { return nativeValue.get.call(this); },
      set: function (v) { nativeValue.set.call(this, v); sync(cs, sel); }
    });

    // 選項被整批換掉（innerHTML = ...）時，顯示的文字也要跟著更新
    new MutationObserver(function () { sync(cs, sel); }).observe(sel, { childList: true });

    sel.addEventListener('change', function () { sync(cs, sel); });
    sync(cs, sel);
  }

  function enhanceAll() {
    document.querySelectorAll('select:not([data-cs])').forEach(enhance);
  }
  window.enhanceAllSelects = enhanceAll;   // 之後動態長出來的 select 可以手動再呼叫一次

  document.addEventListener('click', function () { if (opened) close(opened); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && opened) close(opened); });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', enhanceAll);
  else enhanceAll();
})();
</script>

</body>
</html>
