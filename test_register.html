<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>電子領卷系統</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- 🔥 引入本地 QR-Code 生成套件 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <style>
    :root{
      /* 參考圖片的莫蘭迪灰綠色調與黃銅點綴 */
      --sage-light: #d8e0d9;
      --sage-mid: #9cb0a4;
      --sage-dark: #68796f;
      --brass-gold: #b38b59;
      --brass-dark: #8a6c42;
      
      --glass-bg: rgba(235, 245, 240, 0.25);
      --glass-border: rgba(255, 255, 255, 0.4);
      --ink: #2a332d;
      --ink-soft: #5b6b61;
      --radius: 26px;
      
      /* 🔥 靈魂核心：SVG 噪點，製造實體霧面玻璃的磨砂與水氣顆粒感 */
      --frosted-texture: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
    }
    
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%}
    
    body{
      margin:0;padding:32px 18px 56px;
      font-family:"Inter","Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      /* 模擬圖片中，左上角有自然光源打進來的灰綠色空間背景 */
      background: radial-gradient(circle at 15% 15%, var(--sage-light) 0%, var(--sage-mid) 50%, var(--sage-dark) 100%);
      display:flex;justify-content:center;align-items:flex-start;
      min-height:100vh;position:relative;overflow-x:hidden;
      font-weight:400;letter-spacing:.01em;
    }

    .container{width:100%;max-width:430px;position:relative;z-index:1}

    .guest-check{
      background-color: var(--glass-bg);
      background-image: var(--frosted-texture); /* 疊加磨砂紋理 */
      backdrop-filter: blur(28px) saturate(110%);
      -webkit-backdrop-filter: blur(28px) saturate(110%);
      border: 1px solid var(--glass-border);
      /* 模擬玻璃邊緣的高光 */
      border-top: 1.5px solid rgba(255, 255, 255, 0.7);
      border-left: 1.5px solid rgba(255, 255, 255, 0.6);
      border-radius: var(--radius);
      box-shadow: 0 30px 60px -15px rgba(0,0,0,0.25);
      overflow:hidden;position:relative;
      animation:rise .8s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

    .check-header{padding:38px 28px 26px;text-align:center;border-bottom:1px solid rgba(42,51,45,.1)}
    .check-no{
      font-size:11px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;
      color:var(--brass-dark);display:block;margin-bottom:14px;
    }
    h1{font-size:27px;font-weight:700;margin:0 0 10px;letter-spacing:.06em}
    .subtitle{font-size:12.5px;color:var(--ink-soft);margin:0;font-weight:400;letter-spacing:.2em}

    .server-meta{
      display:flex;justify-content:space-between;gap:8px;
      padding:14px 28px;font-size:12px;color:var(--ink-soft);
      border-bottom:1px solid rgba(42,51,45,.1);
      background:rgba(255,255,255,.15);
    }
    .server-meta strong{color:var(--ink);font-weight:500}

    .check-body,#ticket-card{padding:32px 28px 36px;text-align:center}

    label{display:block;font-weight:500;font-size:12.5px;letter-spacing:.12em;color:var(--ink-soft);margin-bottom:9px;text-align:left}
    
    input,select{
      width:100%;padding:15px 16px;border-radius:16px;
      border:1px solid rgba(255,255,255,0.4);
      background:rgba(255,255,255,.35);
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.03);
      color:var(--ink);font-size:16px;font-weight:500;font-family:inherit;
      margin-bottom:22px;outline:none;transition:all .35s cubic-bezier(.2,.8,.2,1);
      appearance:none;-webkit-appearance:none;
    }
    select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
    input:focus,select:focus{
      background-color:rgba(255,255,255,.7);
      border-color:var(--sage-mid);
      box-shadow:0 0 0 4px rgba(156,176,164,.25);
      transform:translateY(-1px);
    }
    input::placeholder{color:rgba(91,107,97,.5);font-weight:400}

    .secret-box{
      background:rgba(255,255,255,.2);
      border:1px solid rgba(255,255,255,0.3);
      border-radius:20px;padding:20px 18px;margin-bottom:26px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.4);
    }
    .secret-box label{text-align:center;color:var(--brass-dark);letter-spacing:.2em}
    #secret_code{
      text-align:center;font-size:21px;font-weight:600;letter-spacing:.4em;
      text-transform:uppercase;color:var(--brass-dark);margin-bottom:0;
      background:rgba(255,255,255,.5);
    }

    button{
      width:100%;padding:17px;border-radius:18px;font-size:15px;font-weight:600;
      letter-spacing:.14em;cursor:pointer;font-family:inherit;outline:none;
      transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease,background .35s ease;
    }
    
    /* 模擬圖片中黃銅水龍頭顏色的按鈕 */
    .submit-btn{
      color:#fff;border:none;
      background:linear-gradient(135deg, var(--brass-gold), var(--brass-dark));
      box-shadow:0 12px 25px -10px rgba(138,108,66,.6),inset 0 1px 0 rgba(255,255,255,.3);
    }
    .submit-btn:hover{transform:translateY(-2px);box-shadow:0 18px 35px -10px rgba(138,108,66,.8)}
    .submit-btn:active{transform:scale(.975)}
    
    .switch-btn{
      margin-top:26px;color:var(--ink);
      background:rgba(255,255,255,.3);
      border:1px solid rgba(255,255,255,.4);
      box-shadow:0 10px 20px -15px rgba(0,0,0,.2);
      font-weight:500;
    }
    .switch-btn:hover{background:rgba(255,255,255,.5);transform:translateY(-2px)}
    .switch-btn:active{transform:scale(.975)}

    .notice{
      background:rgba(179,139,89,.15);
      border:1px solid rgba(179,139,89,.3);
      color:var(--brass-dark);padding:14px 16px;border-radius:16px;
      font-weight:500;font-size:13.5px;letter-spacing:.06em;margin-bottom:24px;
    }
    .stamp-badge{
      display:inline-block;font-size:11.5px;font-weight:500;letter-spacing:.18em;
      padding:8px 18px;border-radius:999px;margin-bottom:22px;
      border:1px solid rgba(179,139,89,.4);color:var(--brass-dark);
      background:rgba(255,255,255,.3);transition:.4s;
    }
    .qr-box{
      background:rgba(255,255,255,.6);
      border:1px solid rgba(255,255,255,.8);
      padding:18px;border-radius:24px;display:inline-block;margin:8px 0 24px;
      box-shadow:0 15px 35px -15px rgba(0,0,0,.15);
      transition:transform .4s cubic-bezier(.2,.8,.2,1);
    }
    .qr-box:hover{transform:translateY(-3px) scale(1.01)}
    .qr-img{display:block;margin:0 auto;transition:opacity .4s ease;border-radius:10px}

    .highlight-text{
      display:block;font-size:14px;font-weight:500;letter-spacing:.16em;
      color:var(--ink);margin:0 0 26px;padding-bottom:20px;
      border-bottom:1px solid rgba(42,51,45,.1);transition:.4s;
    }
    .info-list{
      text-align:left;display:flex;flex-direction:column;gap:14px;
      background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.4);
      padding:20px;border-radius:20px;
    }
    .info-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid rgba(42,51,45,.08)}
    .info-row:last-child{border-bottom:none;padding-bottom:0}
    .info-row strong{color:var(--ink-soft);font-weight:400;font-size:12.5px;letter-spacing:.1em;white-space:nowrap}
    .info-row span{font-weight:600;font-size:15px;text-align:right;word-break:break-all}
    #r-phone{color:var(--brass-dark);font-size:16px;letter-spacing:.08em}

    @media (max-width:400px){
      body{padding:20px 12px 40px}
      .check-header{padding:30px 20px 22px}
      .check-body,#ticket-card{padding:26px 20px 30px}
      h1{font-size:23px}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="guest-check">
      <div class="check-header">
        <span class="check-no">【 德州小騎士 】</span>
        <h1>電子領卷系統</h1>
        <p class="subtitle">專屬兌換憑證</p>
      </div>

      <div class="server-meta">
        <span>服務生：<strong>小戰熊</strong></span>
        <span>桌號：<strong>VIP 貴賓席</strong></span>
        <span>人數：<strong>1 位</strong></span>
      </div>

      <div class="check-body" id="form-section">
        <label for="activity">🎯 兌換活動項目</label>
        <select id="activity" onchange="checkSaved()">
          <option value="父親節社群活動">父親節社群活動</option>
          <option value="中秋節活動">中秋節活動</option>
        </select>

        <label for="name">💬 社群暱稱</label>
        <input id="name" type="text" placeholder="請輸入您的社群暱稱">

        <label for="social_id">🔗 社群帳號</label>
        <input id="social_id" type="text" placeholder="IG / FB 帳號">

        <label for="phone">📱 手機號碼</label>
        <input id="phone" type="tel" inputmode="numeric" placeholder="09xxxxxxxx">

        <div class="secret-box">
          <label for="secret_code">🔑 通關密語</label>
          <input id="secret_code" type="text" placeholder="＊＊＊＊＊">
        </div>

        <button class="submit-btn" onclick="register()">⚡ 領取專屬兌換卷</button>
      </div>

      <div id="ticket-card" style="display:none">
        <div class="notice">📸 請立即「截圖」保存此兌換券！</div>
        <div class="stamp-badge" id="stamp">【 小編已核銷確認 · 專屬兌換券 】</div>
        <p class="subtitle" style="margin-bottom:6px">活動兌換卷</p>

        <div class="qr-box">
          <canvas id="qr" class="qr-img"></canvas>
        </div>

        <span class="highlight-text" id="hl-text">至德州小騎士門市出示核銷</span>

        <div class="info-list">
          <div class="info-row"><strong>🎯 兌換活動項目</strong><span id="r-act"></span></div>
          <div class="info-row"><strong>💬 社群暱稱</strong><span id="r-name"></span></div>
          <div class="info-row"><strong>🔗 社群帳號</strong><span id="r-social"></span></div>
          <div class="info-row"><strong>📱 手機號碼</strong><span id="r-phone"></span></div>
        </div>

        <button class="switch-btn" onclick="switchAct()">🔄 我要切換／領取其他活動</button>
      </div>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBINQuYtYZA8RLfwm51AfGLTYj1TX_UcFo",
    authDomain: "texas-chick-event.firebaseapp.com",
    projectId: "texas-chick-event",
    storageBucket: "texas-chick-event.firebasestorage.app",
    messagingSenderId: "281248037440",
    appId: "1:281248037440:web:20c32ba4136ea7c57ffda5",
    measurementId: "G-HZ6334WB3B"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const EVENT_SECRETS = { "父親節社群活動": "DAD88", "中秋節活動": "MOON99" };
  const $ = id => document.getElementById(id);
  let unsubscribe = null;

  window.checkSaved = checkSaved;
  window.switchAct = switchAct;
  window.register = register;

  if (window.location.search) { window.history.replaceState({}, document.title, window.location.pathname); }
  window.onload = () => checkSaved(true);

  function checkSaved(isInit=false) {
    const act = $('activity').value;
    const phone = localStorage.getItem(`p_${act}_phone`);
    if(phone) {
      if(!isInit) alert(`💡 您已領過「${act}」！為您顯示憑證。`);
      renderTicket(act, localStorage.getItem(`p_${act}_name`), localStorage.getItem(`p_${act}_social`), phone);
    } else {
      if(unsubscribe) unsubscribe();
      $('ticket-card').style.display = 'none';
      $('form-section').style.display = 'block';
    }
  }

  function switchAct() {
    if(unsubscribe) unsubscribe();
    const sel = $('activity'), current = sel.value;
    const next = Array.from(sel.options).find(o => !localStorage.getItem(`p_${o.value}_phone`))?.value;
    if(next) { sel.value = next; $('ticket-card').style.display = 'none'; $('form-section').style.display = 'block'; }
    else { sel.value = Array.from(sel.options).find(o => o.value !== current).value; checkSaved(true); }
  }

  async function register() {
    const act=$('activity').value, name=$('name').value.trim(), soc=$('social_id').value.trim(), ph=$('phone').value.replace(/\D/g,''), cd=$('secret_code').value.trim();
    if(!name || !soc || ph.length<8 || !cd) return alert("⚠️ 請完整填寫資料與密語！");
    if(!ph.startsWith('09')) return alert("⚠️ 請輸入 09 開頭的手機號碼！");
    if(cd.toUpperCase() !== EVENT_SECRETS[act]) return alert("⚠️ 通關密語錯誤！");

    const docRef = doc(db, act, ph);
    const docSnap = await getDoc(docRef);

    if(!docSnap.exists()) {
      await setDoc(docRef, {
        name, social_id: soc, phone: ph, status: "", store: "", redeemTime: "", timestamp: new Date().toLocaleString()
      });
      confetti({particleCount:80, spread:70});

      localStorage.setItem(`p_${act}_phone`, ph);
      localStorage.setItem(`p_${act}_name`, name);
      localStorage.setItem(`p_${act}_social`, soc);
      renderTicket(act, name, soc, ph);

    } else {
      const data = docSnap.data();
      alert("💡 此號碼已領取過活動憑證！為您載入原始資料。");

      localStorage.setItem(`p_${act}_phone`, ph);
      localStorage.setItem(`p_${act}_name`, data.name);
      localStorage.setItem(`p_${act}_social`, data.social_id);
      renderTicket(act, data.name, data.social_id, ph);
    }
  }

  function renderTicket(act, name, soc, ph) {
    $('form-section').style.display = 'none';
    $('ticket-card').style.display = 'block';
    $('r-act').innerText=act; $('r-name').innerText=name; $('r-social').innerText=soc; $('r-phone').innerText=ph;

    // 🔥 使用本地端立刻生成 QR Code (不再依賴外部網站)
    new QRious({
      element: $('qr'),
      value: ph,
      size: 200,
      foreground: '#8a6c42'
    });

    if(unsubscribe) unsubscribe();
    unsubscribe = onSnapshot(doc(db, act, ph), (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        setUI(data.status === "已兌換");
      }
    });
  }

  function setUI(isRedeemed) {
    $('qr').style.opacity = isRedeemed ? "0.15" : "1";
    $('stamp').innerHTML = isRedeemed ? "【 門市已核銷確認 · 感謝完食 】" : "【 憑此券至門市核銷兌換 】";
    $('stamp').style.borderColor = isRedeemed ? "rgba(42,51,45,.4)" : "rgba(179,139,89,.4)";
    $('stamp').style.color = isRedeemed ? "#5b6b61" : "#8a6c42";
    $('hl-text').innerHTML = isRedeemed ? "★ 本兌換券已使用完畢 ★" : "至德州小騎士門市出示核銷";
    $('hl-text').style.color = isRedeemed ? "#5b6b61" : "#2a332d";
  }
</script>
</body>
</html>
