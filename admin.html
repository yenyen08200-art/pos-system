<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>總部戰情室 - 數據報表</title>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f7f6; color: #333; padding: 0; margin: 0; min-height: 100vh;}
    
    /* 🔒 密碼鎖畫面 (支援 Google 登入版) */
    #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f4f7f6; display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 320px; }
    .login-card h2 { margin-top: 0; color: #2c3e50; }
    .login-card input { width: 100%; padding: 14px; font-size: 16px; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 15px; text-align: left; outline: none; box-sizing: border-box; }
    .login-card input:focus { border-color: #27ae60; }
    .login-card button { background: #2c3e50; color: white; border: none; padding: 14px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
    .login-card button:hover { background: #1a252f; }
    
    /* Google 登入按鈕特殊樣式 */
    .btn-google { background: #fff !important; color: #7f8c8d !important; border: 2px solid #ecf0f1 !important; margin-top: 5px; }
    .btn-google:hover { background: #f8f9fa !important; border-color: #ddd !important; }

    /* 主要內容區 */
    #main-app { padding: 20px; display: none; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1 { margin: 0; color: #2c3e50; font-size: 24px; }
    .controls { display: flex; gap: 10px; }
    .controls select, .controls button { padding: 12px 18px; font-size: 16px; border-radius: 8px; border: 1px solid #ddd; outline: none; font-weight: bold; }
    .controls select { background: #f8f9fa; cursor: pointer; }
    .btn-export { background: #27ae60; color: white; border: none; cursor: pointer; transition: 0.2s; }
    .btn-export:hover { background: #219653; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3); }
    .btn-logout { background: #e74c3c; color: white; border: none; cursor: pointer; transition: 0.2s; }
    .btn-logout:hover { background: #c0392b; }
    
    .dashboard { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat-card { background: white; padding: 25px 20px; border-radius: 12px; flex: 1; min-width: 150px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; border-bottom: 4px solid #bdc3c7; }
    .stat-card.c-redeemed { border-bottom-color: #27ae60; }
    .stat-card.c-unredeemed { border-bottom-color: #e74c3c; }
    .stat-card h3 { margin: 0 0 10px; color: #7f8c8d; font-size: 14px; letter-spacing: 1px; }
    .stat-card .num { font-size: 34px; font-weight: 900; color: #2c3e50; }

    /* 📈 圖表區 */
    .charts-wrapper { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
    .chart-box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); flex: 1; min-width: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .chart-box h3 { margin: 0 0 15px 0; color: #2c3e50; font-size: 16px; width: 100%; text-align: left; }

    /* 表格控制與搜尋 */
    .table-toolbar { display: flex; justify-content: space-between; margin-bottom: 15px; align-items: center; background: white; padding: 15px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .search-box { padding: 10px 15px; border-radius: 8px; border: 1px solid #ddd; font-size: 15px; width: 300px; outline: none; transition: 0.3s; }
    .search-box:focus { border-color: #3498db; box-shadow: 0 0 8px rgba(52, 152, 219, 0.2); }
    
    .table-container { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow-x: auto; height: 50vh; }
    table { width: 100%; border-collapse: collapse; min-width: 850px; }
    th, td { padding: 16px 20px; text-align: left; border-bottom: 1px solid #f1f2f6; }
    
    /* 🔼 標題自動排序 */
    th { background: #f8f9fa; color: #2c3e50; font-weight: 800; font-size: 15px; position: sticky; top: 0; cursor: pointer; user-select: none; transition: 0.2s; white-space: nowrap; }
    th:hover { background: #e9ecef; }
    th .sort-icon { color: #bdc3c7; margin-left: 5px; font-size: 12px; }
    th.active .sort-icon { color: #3498db; }
    
    tr:hover { background: #fdfdfd; }
    .status-yes { color: #27ae60; font-weight: 900; background: rgba(39, 174, 96, 0.1); padding: 4px 10px; border-radius: 20px; font-size: 13px; }
    .status-no { color: #e74c3c; font-weight: 900; background: rgba(231, 76, 60, 0.1); padding: 4px 10px; border-radius: 20px; font-size: 13px; }
    .time-text { font-size: 13px; color: #95a5a6; }
  </style>
</head>
<body>

  <!-- 🔒 密碼鎖畫面 -->
  <div id="login-screen">
    <div class="login-card">
      <h2>🔒 總部戰情室</h2>
      <p style="color:#7f8c8d; margin-bottom: 20px; font-size: 14px;">請登入最高權限帳號</p>
      
      <input type="email" id="email" placeholder="總部帳號 (Email)">
      <input type="password" id="pwd" placeholder="登入密碼" onkeypress="if(event.key==='Enter') login()">
      <button onclick="login()" id="login-btn">安全登入</button>
      
      <div style="margin: 15px 0; color: #bdc3c7; font-size: 13px;">── 或 ──</div>
      
      <!-- 🔥 新增的 Google 登入按鈕 -->
      <button onclick="loginWithGoogle()" id="google-btn" class="btn-google">
        🌐 使用 Google 帳號登入
      </button>
    </div>
  </div>

  <!-- 主要內容區 -->
  <div id="main-app">
    <div class="container">
      <div class="header">
        <h1>📊 總部戰情室</h1>
        <div class="controls">
          <select id="act-select" onchange="fetchData()">
            <option value="父親節社群活動">父親節社群活動</option>
            <option value="中秋節活動">中秋節活動</option>
          </select>
          <button class="btn-export" onclick="exportExcel()">📥 匯出 Excel</button>
          <button class="btn-logout" onclick="logout()">登出</button>
        </div>
      </div>

      <div class="dashboard">
        <div class="stat-card">
          <h3>總發行張數</h3>
          <div class="num" id="total-count">0</div>
        </div>
        <div class="stat-card c-redeemed">
          <h3>已核銷數量</h3>
          <div class="num" id="redeemed-count" style="color:#27ae60;">0</div>
        </div>
        <div class="stat-card c-unredeemed">
          <h3>未核銷數量</h3>
          <div class="num" id="unredeemed-count" style="color:#e74c3c;">0</div>
        </div>
      </div>

      <!-- 📈 圖表區 -->
      <div class="charts-wrapper">
        <div class="chart-box" style="flex: 2;">
          <h3>🏆 各門市核銷戰力圖</h3>
          <canvas id="storeChart" style="max-height: 250px;"></canvas>
        </div>
        <div class="chart-box" style="flex: 1;">
          <h3>⚡ 總體兌換率</h3>
          <canvas id="statusChart" style="max-height: 250px;"></canvas>
        </div>
      </div>

      <!-- 搜尋與表格區 -->
      <div class="table-toolbar">
        <input type="text" id="search-box" class="search-box" placeholder="🔍 輸入手機號碼或姓名快速搜尋..." onkeyup="renderTable()">
        <span style="color:#95a5a6; font-size: 13px; font-weight: bold;" id="result-count"></span>
      </div>

      <div class="table-container">
        <table id="data-table">
          <thead>
            <tr>
              <th onclick="setSort('phone')">📱 手機號碼 <span class="sort-icon" id="sort-phone">▼</span></th>
              <th onclick="setSort('name')">👤 顧客姓名 <span class="sort-icon" id="sort-name">▼</span></th>
              <th onclick="setSort('social_id')">🔗 社群帳號 <span class="sort-icon" id="sort-social_id">▼</span></th>
              <th onclick="setSort('status')">⚡ 狀態 <span class="sort-icon" id="sort-status">▼</span></th>
              <th onclick="setSort('store')">📌 核銷門市 <span class="sort-icon" id="sort-store">▼</span></th>
              <th onclick="setSort('redeemTime')">🕒 核銷時間 <span class="sort-icon" id="sort-redeemTime">▼</span></th>
              <th onclick="setSort('timestamp')" class="active">📅 領券時間 <span class="sort-icon" id="sort-timestamp">▼</span></th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- 資料會塞在這裡 -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    // 🔥 引入 Google 登入需要的套件
    import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBINQuYtYZA8RLfwm51AfGLTYj1TX_UcFo",
      authDomain: "texas-chick-event.firebaseapp.com",
      projectId: "texas-chick-event",
      storageBucket: "texas-chick-event.firebasestorage.app",
      messagingSenderId: "281248037440",
      appId: "1:281248037440:web:20c32ba4136ea7c57ffda5",
      measurementId: "G-HZ6334WB3B"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app); 
    const googleProvider = new GoogleAuthProvider(); // 🔥 初始化 Google 登入供應器
    
    let allData = []; 
    let sortCol = 'timestamp'; 
    let sortAsc = false; 
    let storeChartInstance = null;
    let statusChartInstance = null;

    // 🔒 監聽使用者的登入狀態
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        fetchData(); 
      } else {
        document.getElementById('main-app').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
      }
    });

   // 🔑 執行 Email 登入 (抓蟲升級版)
    window.login = function() {
      const email = document.getElementById('email').value;
      const pwd = document.getElementById('pwd').value;
      const btn = document.getElementById('login-btn');
      
      if(!email || !pwd) return alert("⚠️ 請輸入帳號與密碼！");
      
      btn.innerText = "驗證中...";
      btn.disabled = true;

      signInWithEmailAndPassword(auth, email, pwd)
        .then(() => {
          btn.innerText = "安全登入";
          btn.disabled = false;
        })
        .catch((error) => {
          console.error(error);
          // 🔥 讓系統印出真實的錯誤代碼，方便我們抓問題
          alert("❌ 帳號密碼登入失敗！\n系統錯誤代碼：" + error.code); 
          btn.innerText = "安全登入";
          btn.disabled = false;
        });
    };

    // 🔑 執行 Google 登入 (新功能)
    window.loginWithGoogle = function() {
      const btn = document.getElementById('google-btn');
      btn.innerText = "驗證中...";
      btn.disabled = true;

      signInWithPopup(auth, googleProvider)
        .then(() => {
          btn.innerText = "🌐 使用 Google 帳號登入";
          btn.disabled = false;
        })
        .catch((error) => {
          console.error(error.code);
          alert("❌ Google 登入失敗！");
          btn.innerText = "🌐 使用 Google 帳號登入";
          btn.disabled = false;
        });
    };

    // 🚪 執行登出
    window.logout = function() {
      signOut(auth).then(() => {
        document.getElementById('email').value = "";
        document.getElementById('pwd').value = "";
      }).catch((error) => {
        alert("登出失敗：" + error.message);
      });
    };

    // 📥 抓取資料
    window.fetchData = async function() {
      const act = document.getElementById('act-select').value;
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 40px; color: #7f8c8d;">資料載入中... 🚀</td></tr>';
      
      try {
        const querySnapshot = await getDocs(collection(db, act));
        allData = [];
        let redeemedCount = 0;
        let storeStats = {}; 

        querySnapshot.forEach((doc) => {
          const d = doc.data();
          allData.push(d);
          if (d.status === "已兌換") {
            redeemedCount++;
            if (d.store) {
              storeStats[d.store] = (storeStats[d.store] || 0) + 1;
            }
          }
        });

        const unredeemedCount = allData.length - redeemedCount;
        document.getElementById('total-count').innerText = allData.length;
        document.getElementById('redeemed-count').innerText = redeemedCount;
        document.getElementById('unredeemed-count').innerText = unredeemedCount;

        drawCharts(storeStats, redeemedCount, unredeemedCount);
        renderTable(); 
      } catch (e) {
        console.error(e);
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 40px; color: red;">讀取資料失敗，請確認網路連線。</td></tr>';
      }
    };

    // 🎨 繪製圖表
    function drawCharts(storeStats, redeemed, unredeemed) {
      if (storeChartInstance) storeChartInstance.destroy();
      if (statusChartInstance) statusChartInstance.destroy();

      const sortedStores = Object.entries(storeStats).sort((a, b) => b[1] - a[1]);
      const storeLabels = sortedStores.map(s => s[0]);
      const storeData = sortedStores.map(s => s[1]);

      const ctxStore = document.getElementById('storeChart').getContext('2d');
      storeChartInstance = new Chart(ctxStore, {
        type: 'bar',
        data: {
          labels: storeLabels.length > 0 ? storeLabels : ['尚無資料'],
          datasets: [{
            label: '核銷數量',
            data: storeData.length > 0 ? storeData : [0],
            backgroundColor: 'rgba(142, 68, 173, 0.7)',
            borderColor: 'rgba(142, 68, 173, 1)',
            borderWidth: 1,
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
        }
      });

      const ctxStatus = document.getElementById('statusChart').getContext('2d');
      statusChartInstance = new Chart(ctxStatus, {
        type: 'doughnut',
        data: {
          labels: ['已核銷', '未核銷'],
          datasets: [{
            data: (redeemed === 0 && unredeemed === 0) ? [0, 1] : [redeemed, unredeemed],
            backgroundColor: ['#27ae60', '#e74c3c'],
            borderWidth: 0,
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '70%',
          plugins: {
            legend: { position: 'bottom' }
          }
        }
      });
    }

    // 🔼 設定排序
    window.setSort = function(col) {
      if (sortCol === col) sortAsc = !sortAsc;
      else { sortCol = col; sortAsc = true; }
      
      document.querySelectorAll('th').forEach(th => th.classList.remove('active'));
      document.querySelectorAll('.sort-icon').forEach(icon => icon.innerText = '▼');
      event.currentTarget.classList.add('active');
      document.getElementById(`sort-${col}`).innerText = sortAsc ? '▲' : '▼';
      renderTable();
    };

    // 🔍 畫出表格
    window.renderTable = function() {
      const tbody = document.getElementById('table-body');
      const searchTerm = document.getElementById('search-box').value.trim().toLowerCase();

      let filteredData = allData.filter(d => {
        return (d.phone || '').toLowerCase().includes(searchTerm) ||
               (d.name || '').toLowerCase().includes(searchTerm);
      });

      filteredData.sort((a, b) => {
        let valA = a[sortCol] || '';
        let valB = b[sortCol] || '';
        if (valA < valB) return sortAsc ? -1 : 1;
        if (valA > valB) return sortAsc ? 1 : -1;
        return 0;
      });

      document.getElementById('result-count').innerText = `顯示 ${filteredData.length} 筆結果`;

      if (filteredData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 40px; color: #e74c3c; font-weight: bold;">找不到符合的資料 🥲</td></tr>';
        return;
      }

      tbody.innerHTML = filteredData.map(d => `
        <tr>
          <td style="font-family:monospace; font-size:16px; font-weight:bold; color:#2c3e50;">${d.phone || ''}</td>
          <td style="font-weight:bold;">${d.name || ''}</td>
          <td style="color:#3498db;">${d.social_id || '未提供'}</td>
          <td><span class="${d.status === '已兌換' ? 'status-yes' : 'status-no'}">${d.status || '未兌換'}</span></td>
          <td style="font-weight:bold; color:#8e44ad;">${d.store || '-'}</td>
          <td class="time-text">${d.redeemTime || '-'}</td>
          <td class="time-text">${d.timestamp || '-'}</td>
        </tr>
      `).join('');
    };

    // 📥 匯出 Excel
    window.exportExcel = function() {
      if (allData.length === 0) return alert('⚠️ 目前沒有資料可以匯出喔！');
      const act = document.getElementById('act-select').value;
      const exportArr = allData.map(d => ({
        "手機號碼": d.phone,
        "顧客姓名": d.name,
        "社群帳號": d.social_id || '未提供',
        "兌換狀態": d.status || '未兌換',
        "核銷門市": d.store || '',
        "核銷時間": d.redeemTime || '',
        "領券時間": d.timestamp || ''
      }));
      const ws = XLSX.utils.json_to_sheet(exportArr);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "兌換名單");
      const dateStr = new Date().toISOString().slice(0,10);
      XLSX.writeFile(wb, `${act}_兌換報表_${dateStr}.xlsx`);
    };
  </script>
</body>
</html>
