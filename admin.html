<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>總部戰情室 - 德州小騎士</title>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg:#F4F6F8; --sidebar-bg:#1A1C24; --card-bg:#ffffff; --text-main:#1F2430; --text-sub:#8A93A5;
      --accent:#F07654; --accent-2:#F79070; --green:#3FBF8F; --gray:#B7BFCC;
      --radius:22px; --shadow:0 10px 30px rgba(24,28,40,.06);
    }
    *{box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text-main);margin:0;min-height:100vh;display:flex}

    /* 🔒 Login */
    #login-screen{position:fixed;inset:0;background:var(--bg);display:flex;justify-content:center;align-items:center;z-index:1000}
    .login-card{background:var(--card-bg);padding:40px;border-radius:24px;box-shadow:var(--shadow);text-align:center;width:340px}
    .login-card h2{margin:0 0 6px;font-size:22px}
    .login-card .sub{color:var(--text-sub);font-size:13px;margin:0 0 22px}
    .login-card input{width:100%;padding:14px 16px;font-size:15px;border:1px solid #E6EAF0;border-radius:14px;margin-bottom:12px;outline:none;background:#F7F9FB}
    .login-card input:focus{border-color:var(--accent);background:#fff}
    .login-card button{background:var(--accent);color:#fff;border:none;padding:14px;font-size:15px;border-radius:999px;cursor:pointer;font-weight:700;width:100%;transition:.2s}
    .login-card button:hover{filter:brightness(1.05)}
    .divider{color:var(--text-sub);font-size:12px;margin:16px 0}
    .btn-google{background:#fff !important;color:var(--text-main) !important;border:1px solid #E6EAF0 !important}
    .btn-google:hover{background:#F7F9FB !important}

    /* 🧭 Sidebar */
    .sidebar{width:260px;flex:0 0 260px;background:var(--sidebar-bg);color:#fff;padding:28px 20px;display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
    .sidebar-brand h2{margin:0 0 4px;font-size:20px;letter-spacing:.5px}
    .sidebar-brand p{margin:0;font-size:12px;color:#8E96A8}
    .sidebar-menu{margin-top:38px;display:flex;flex-direction:column;gap:8px}
    .sidebar-item{padding:13px 16px;border-radius:14px;color:#A9B1C2;font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:.2s}
    .sidebar-item:hover{background:rgba(255,255,255,.06);color:#fff}
    .sidebar-item.active{background:#F3F5F8;color:#1A1C24;font-weight:800}
    .sidebar-footer{margin-top:auto;padding-top:20px}
    .btn-logout{width:100%;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.12);padding:12px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;transition:.2s}
    .btn-logout:hover{background:var(--accent);border-color:var(--accent)}

    /* Main */
    #main-app{flex:1;padding:40px;display:none;overflow-y:auto;height:100vh}
    .container{max-width:1200px;margin:0 auto}

    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;gap:16px;flex-wrap:wrap}
    h1{margin:0;font-size:30px;font-weight:800;display:flex;align-items:center;gap:12px}
    .live-badge{background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:5px 10px;border-radius:999px;animation:pulse 1.5s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

    .controls{display:flex;gap:10px;align-items:center}
    .controls select,.controls button{padding:11px 20px;font-size:14px;border-radius:999px;border:none;outline:none;font-weight:700;cursor:pointer;transition:.2s}
    .controls select{background:#fff;color:var(--text-main);box-shadow:var(--shadow)}
    .btn-expire{background:#fff;color:var(--text-main);box-shadow:var(--shadow)}
    .btn-expire:hover{color:var(--accent)}
    .btn-export{background:var(--sidebar-bg);color:#fff}
    .btn-export:hover{background:#2A2D38}

    /* Stat cards */
    .dashboard{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:20px;margin-bottom:24px}
    .stat-card{background:var(--card-bg);padding:26px;border-radius:var(--radius);box-shadow:var(--shadow)}
    .stat-card h3{margin:0 0 10px;color:var(--text-sub);font-size:13px;font-weight:600}
    .stat-card .num{font-size:32px;font-weight:800;letter-spacing:-.5px}
    .stat-card.c-total{background:linear-gradient(140deg,var(--accent-2),var(--accent));color:#fff;box-shadow:0 16px 34px rgba(240,118,84,.28)}
    .stat-card.c-total h3{color:rgba(255,255,255,.85)}
    .stat-card.c-total .num{font-size:44px}
    .stat-card.c-redeemed .num{color:var(--green)}
    .stat-card.c-unredeemed .num{color:var(--accent)}
    .stat-card.c-expired .num{color:var(--gray)}

    /* Charts */
    .charts-wrapper{display:flex;gap:20px;margin-bottom:24px;flex-wrap:wrap}
    .chart-box{background:var(--card-bg);padding:26px;border-radius:var(--radius);box-shadow:var(--shadow);flex:1;min-width:320px}
    .chart-box h3{margin:0 0 18px;font-size:15px;font-weight:800}
    .chart-canvas{height:260px}

    /* Table */
    .table-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap}
    .table-toolbar #result-count{color:var(--text-sub);font-size:13px;font-weight:600}
    .search-box{padding:12px 18px;border-radius:999px;border:none;font-size:14px;width:300px;outline:none;background:#fff;box-shadow:var(--shadow);color:var(--text-main)}

    .table-container{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto;max-height:52vh;padding:8px}
    table{width:100%;border-collapse:separate;border-spacing:0 4px;min-width:880px}
    th,td{padding:14px 18px;text-align:left;border:none}
    th{background:#F5F7FA;color:var(--text-sub);font-weight:700;font-size:12.5px;position:sticky;top:0;cursor:pointer;user-select:none;white-space:nowrap;z-index:1}
    th:first-child{border-radius:12px 0 0 12px}
    th:last-child{border-radius:0 12px 12px 0}
    th .sort-icon{color:var(--gray);margin-left:6px;font-size:10px}
    th.active .sort-icon{color:var(--accent)}
    tbody tr{transition:.15s}
    tbody tr:hover{background:#FAFBFC}
    tbody td{border-bottom:1px solid #F1F3F7;font-size:14px}
    .status-yes{color:var(--green);font-weight:800;background:rgba(63,191,143,.12);padding:5px 12px;border-radius:999px;font-size:12px}
    .status-no{color:var(--accent);font-weight:800;background:rgba(240,118,84,.12);padding:5px 12px;border-radius:999px;font-size:12px}
    .status-expired{color:#8A93A5;font-weight:800;background:rgba(138,147,165,.12);padding:5px 12px;border-radius:999px;font-size:12px}
    .time-text{font-size:13px;color:var(--text-sub)}

    /* 🔥 新增：重設按鈕樣式 */
    .btn-reset { background: rgba(240,118,84,.1); border: 1px solid rgba(240,118,84,.3); color: var(--accent); font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .btn-reset:hover { background: var(--accent); color: #fff; }

    @media (max-width:900px){
      .dashboard{grid-template-columns:1fr 1fr}
    }
    @media (max-width:768px){
      body{flex-direction:column}
      .sidebar{width:100%;flex:none;height:auto;position:relative;flex-direction:row;align-items:center;justify-content:space-between;padding:14px 18px}
      .sidebar-brand p{display:none}
      .sidebar-menu{display:none}
      .sidebar-footer{margin:0;padding:0}
      .btn-logout{width:auto;padding:10px 18px}
      #main-app{padding:16px;height:auto}
      .header{align-items:flex-start}
      h1{font-size:22px}
      .controls{width:100%;flex-wrap:wrap}
      .controls select{flex-basis:100%}
      .controls button{flex:1}
      .dashboard{grid-template-columns:1fr 1fr;gap:12px}
      .stat-card{padding:18px}
      .stat-card.c-total .num{font-size:34px}
      .search-box{width:100%}
    }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-card">
      <h2>🔒 總部戰情室</h2>
      <p class="sub">德州小騎士授權登入</p>
      <input id="email" type="email" placeholder="管理員信箱">
      <input id="pwd" type="password" placeholder="密碼">
      <button id="login-btn" onclick="login()">安全登入</button>
      <div class="divider">── 或 ──</div>
      <button id="google-btn" class="btn-google" onclick="loginWithGoogle()">🌐 使用 Google 帳號登入</button>
    </div>
  </div>

  <aside class="sidebar" id="sidebar-nav" style="display:none;">
    <div class="sidebar-brand">
      <h2>德州小騎士</h2>
      <p>後台控制室</p>
    </div>
    <nav class="sidebar-menu">
      <div class="sidebar-item active">📊 電子兌換卷儀表板</div>
      <div class="sidebar-item" onclick="alert('分店管理與權限設定功能開發中...')">🏪 門市管理中心</div>
      <div class="sidebar-item" onclick="alert('行銷推播與名單分析功能開發中...')">🎯 行銷資產管理</div>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout" onclick="logout()">登出</button>
    </div>
  </aside>

  <main id="main-app">
    <div class="container">
      <div class="header">
        <div class="header-title-area">
          <h1>電子兌換卷儀表板 <span class="live-badge">LIVE 監控中</span></h1>
        </div>
        <div class="controls">
          <select id="act-select" onchange="fetchData()"></select>
          <button class="btn-expire" onclick="expireTickets()">🧹 結算過期</button>
          <button class="btn-export" onclick="exportExcel()">📥 匯出 Excel</button>
        </div>
      </div>

      <div class="dashboard">
        <div class="stat-card c-total">
          <h3>總發行張數 (近500筆)</h3>
          <div class="num" id="total-count">0</div>
        </div>
        <div class="stat-card c-redeemed">
          <h3>已核銷</h3>
          <div class="num" id="redeemed-count">0</div>
        </div>
        <div class="stat-card c-unredeemed">
          <h3>待核銷</h3>
          <div class="num" id="unredeemed-count">0</div>
        </div>
        <div class="stat-card c-expired">
          <h3>已過期</h3>
          <div class="num" id="expired-count">0</div>
        </div>
      </div>

      <div class="charts-wrapper">
        <div class="chart-box">
          <h3>🏆 各門市核銷分佈</h3>
          <div class="chart-canvas"><canvas id="storeChart"></canvas></div>
        </div>
        <div class="chart-box">
          <h3>⚡ 總體兌換狀態比例</h3>
          <div class="chart-canvas"><canvas id="statusChart"></canvas></div>
        </div>
      </div>

      <div class="table-toolbar">
        <span id="result-count">顯示 0 筆結果</span>
        <input id="search-box" class="search-box" type="text" placeholder="🔍 搜尋手機號碼或姓名..." oninput="debounceRenderTable()">
      </div>

      <div class="table-container">
        <table id="data-table">
          <thead>
            <tr>
              <th onclick="setSort('phone')">📱 手機號碼 <span class="sort-icon" id="sort-phone">▼</span></th>
              <th onclick="setSort('name')">👤 顧客姓名 <span class="sort-icon" id="sort-name">▼</span></th>
              <th onclick="setSort('social_id')">🔗 社群帳號 <span class="sort-icon" id="sort-social_id">▼</span></th>
              <th onclick="setSort('gift')">🎁 兌換品項 <span class="sort-icon" id="sort-gift">▼</span></th>
              <th onclick="setSort('status')">⚡ 狀態 <span class="sort-icon" id="sort-status">▼</span></th>
              <th onclick="setSort('store')">📌 核銷門市 <span class="sort-icon" id="sort-store">▼</span></th>
              <th onclick="setSort('redeemTime')">🕒 核銷時間 <span class="sort-icon" id="sort-redeemTime">▼</span></th>
              <th onclick="setSort('timestamp')">📅 領券時間 <span class="sort-icon" id="sort-timestamp">▼</span></th>
              <th>⚙️ 管理操作</th> <!-- 🔥 新增操作欄位 -->
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, query, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBINQuYtYZA8RLfwm51AfGLTYj1TX_UcFo",
      authDomain: "texas-chick-event.firebaseapp.com",
      projectId: "texas-chick-event",
      storageBucket: "texas-chick-event.firebasestorage.app",
      messagingSenderId: "281248037440",
      appId: "1:281248037440:web:20c32ba4136ea7c57ffda5",
      measurementId: "G-HZ6334WB3B"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app); 
    const googleProvider = new GoogleAuthProvider(); 
    
    let allData = []; 
    let sortCol = 'timestamp'; 
    let sortAsc = false; 
    let storeChartInstance = null;
    let statusChartInstance = null;
    let unsubscribeSnapshot = null; 
    const adminEmails = ["yenyen08200@gmail.com", "admin@gmail.com"];
    
    // 🔥 全域變數：用來存放從 config.js 抓出來的 POS 贈品資料
    let globalPosConfig = {};

    window.login = function() {
      const email = document.getElementById('email').value;
      const pwd = document.getElementById('pwd').value;
      const btn = document.getElementById('login-btn');
      if(!email || !pwd) return alert("⚠️ 請輸入帳號與密碼！");
      btn.innerText = "驗證中...";
      btn.disabled = true;
      signInWithEmailAndPassword(auth, email, pwd)
        .then(() => { btn.innerText = "安全登入"; btn.disabled = false; })
        .catch((error) => { alert("❌ 帳號密碼登入失敗！"); btn.innerText = "安全登入"; btn.disabled = false; });
    };

    window.loginWithGoogle = function() {
      const btn = document.getElementById('google-btn');
      btn.innerText = "驗證中...";
      btn.disabled = true;
      signInWithPopup(auth, googleProvider)
        .then(() => { btn.innerText = "🌐 使用 Google 帳號登入"; btn.disabled = false; })
        .catch((error) => { alert("❌ Google 登入失敗！"); btn.innerText = "🌐 使用 Google 帳號登入"; btn.disabled = false; });
    };

    window.logout = function() {
      signOut(auth).then(() => {
        document.getElementById('email').value = "";
        document.getElementById('pwd').value = "";
      });
    };

    let searchTimer = null;
    window.debounceRenderTable = function() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        window.renderTable();
      }, 300);
    };

    window.fetchData = function() {
      const actSelect = document.getElementById('act-select');
      if (!actSelect || !actSelect.value) return;
      const act = actSelect.value;
      const tbody = document.getElementById('table-body');
      
      if (unsubscribeSnapshot) unsubscribeSnapshot();
      tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding: 40px; color: #8A93A5;">📡 與資料庫即時連線中...</td></tr>';
      
      const q = query(collection(db, act), limit(500));

      unsubscribeSnapshot = onSnapshot(q, (querySnapshot) => {
        allData = [];
        let redeemedCount = 0;
        let expiredCount = 0; 
        let storeStats = {}; 

        querySnapshot.forEach((doc) => {
          const d = doc.data();
          d.id = doc.id; 
          allData.push(d);
          
          if (d.status === "已兌換") {
            redeemedCount++;
            if (d.store) {
              storeStats[d.store] = (storeStats[d.store] || 0) + 1;
            }
          } else if (d.status === "已過期") {
            expiredCount++; 
          }
        });

        const unredeemedCount = allData.length - redeemedCount - expiredCount; 
        
        document.getElementById('total-count').innerText = allData.length;
        document.getElementById('redeemed-count').innerText = redeemedCount;
        document.getElementById('unredeemed-count').innerText = unredeemedCount;
        document.getElementById('expired-count').innerText = expiredCount; 

        drawCharts(storeStats, redeemedCount, unredeemedCount, expiredCount); 
        window.renderTable(); 
      }, (error) => {
        console.error("即時監聽失敗:", error);
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding: 40px; color: red;">連線中斷，請確認網路連線。</td></tr>';
      });
    };

    // 🔥 新增：獨立重設單一客人的核銷狀態！
    window.resetSingleTicket = async function(phone) {
      const act = document.getElementById('act-select').value;
      if (!confirm(`⚠️ 確定要將手機號碼「${phone}」的憑證重設為【未兌換】嗎？\n(此操作將清空他的核銷門市與時間紀錄)`)) {
        return;
      }
      try {
        const docRef = doc(db, act, phone);
        await updateDoc(docRef, {
          status: "", 
          store: "", 
          redeemTime: ""
        });
        // 由於我們有 onSnapshot，資料庫改完畫面會瞬間自己更新，不用額外寫 alert
      } catch (error) {
        console.error("重設失敗:", error);
        alert("重設失敗，請檢查權限或連線。");
      }
    };

    window.expireTickets = async function() {
      const actSelect = document.getElementById('act-select');
      if (!actSelect || !actSelect.value) return;
      const act = actSelect.value;

      const confirmText = prompt(`⚠️ 警告：此操作不可逆！\n\n您確定要把「${act}」所有【未兌換】的票券強制設為【已過期】嗎？\n\n如果確定，請在下方輸入「結算」兩個字：`);
      if (confirmText !== "結算") {
        alert("操作已取消。");
        return;
      }

      try {
        const btn = document.querySelector('.btn-expire');
        btn.innerText = "處理中...";
        btn.disabled = true;

        const unredeemedDocs = allData.filter(d => !d.status || d.status === "未兌換");
        
        if (unredeemedDocs.length === 0) {
          alert("🎉 目前沒有任何【未兌換】的票券可以結算！");
        } else {
          let updated = 0;
          const updatePromises = [];
          
          unredeemedDocs.forEach((d) => {
            const docRef = doc(db, act, d.id);
            const p = updateDoc(docRef, {
              status: "已過期",
              redeemTime: "活動結束，逾期未換"
            });
            updatePromises.push(p);
            updated++;
          });

          await Promise.all(updatePromises);
          alert(`✅ 結算完成！\n總共將 ${updated} 筆票券設為已過期。`);
        }

        btn.innerText = "🧹 結算過期";
        btn.disabled = false;

      } catch (error) {
        console.error("結算失敗:", error);
        alert("結算失敗，請檢查網路連線或權限設定。");
        document.querySelector('.btn-expire').innerText = "🧹 結算過期";
        document.querySelector('.btn-expire').disabled = false;
      }
    };

    window.setSort = function(col) {
      if (sortCol === col) sortAsc = !sortAsc;
      else { sortCol = col; sortAsc = true; }
      
      document.querySelectorAll('th').forEach(th => th.classList.remove('active'));
      document.querySelectorAll('.sort-icon').forEach(icon => icon.innerText = '▼');
      event.currentTarget.classList.add('active');
      document.getElementById(`sort-${col}`).innerText = sortAsc ? '▲' : '▼';
      window.renderTable();
    };

    window.renderTable = function() {
      const tbody = document.getElementById('table-body');
      const searchTerm = document.getElementById('search-box').value.trim().toLowerCase();
      const currentAct = document.getElementById('act-select').value;
      
      // 🔥 抓取這個活動在 config.js 裡設定的「預設贈品」
      const defaultGift = globalPosConfig[currentAct]?.gift || '預設活動贈品';

      let filteredData = allData.filter(d => {
        return (d.phone || '').toLowerCase().includes(searchTerm) ||
               (d.name || '').toLowerCase().includes(searchTerm);
      });

      filteredData.sort((a, b) => {
        let valA = a[sortCol] || '';
        let valB = b[sortCol] || '';
        if (valA < valB) return sortAsc ? -1 : 1;
        if (valA > valB) return sortAsc ? 1 : -1;
        return 0;
      });

      document.getElementById('result-count').innerText = `顯示 ${filteredData.length} 筆結果`;

      if (filteredData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding: 40px; color: #F07654; font-weight: bold;">找不到符合的資料 🥲</td></tr>';
        return;
      }

      tbody.innerHTML = filteredData.map(d => {
        let statusBadge = `<span class="status-no">${d.status || '未兌換'}</span>`; 
        if (d.status === '已兌換') statusBadge = `<span class="status-yes">已兌換</span>`; 
        if (d.status === '已過期') statusBadge = `<span class="status-expired">已過期</span>`; 
        
        // 🔥 判斷顯示：如果有專屬贈品 (d.gift) 就顯示並標示(專屬)，沒有的話就顯示設定檔的預設贈品
        let displayGift = d.gift ? `${d.gift} <span style="font-size:10px; color:#F07654;">(專屬)</span>` : defaultGift;

        // 🔥 判斷按鈕：如果已兌換或已過期，就給他一個「重設」的按鈕，如果是未兌換就空著
        let actionBtn = (d.status === '已兌換' || d.status === '已過期') 
          ? `<button class="btn-reset" onclick="resetSingleTicket('${d.id}')">↻ 復原未兌換</button>` 
          : `-`;

        return `
          <tr>
            <td style="font-family:monospace; font-size:15px; font-weight:bold; color:var(--text-main);">${d.phone || ''}</td>
            <td style="font-weight:bold;">${d.name || ''}</td>
            <td style="color:#F07654;">${d.social_id || '未提供'}</td>
            <td style="font-weight:bold; color:#3FBF8F;">${displayGift}</td>
            <td>${statusBadge}</td>
            <td style="font-weight:bold; color:var(--sidebar-bg);">${d.store || '-'}</td>
            <td class="time-text">${d.redeemTime || '-'}</td>
            <td class="time-text">${d.timestamp || '-'}</td>
            <td>${actionBtn}</td>
          </tr>
        `;
      }).join('');
    };

    window.exportExcel = function() {
      if (allData.length === 0) return alert('⚠️ 目前沒有資料可以匯出喔！');
      const act = document.getElementById('act-select').value;
      const defaultGift = globalPosConfig[act]?.gift || '預設活動贈品';

      const exportArr = allData.map(d => ({
        "手機號碼": d.phone,
        "顧客姓名": d.name,
        "社群帳號": d.social_id || '未提供',
        // 🔥 讓 Excel 匯出也能顯示真正的預設或專屬贈品
        "兌換品項": d.gift || defaultGift,
        "兌換狀態": d.status || '未兌換',
        "核銷門市": d.store || '',
        "核銷時間": d.redeemTime || '',
        "領券時間": d.timestamp || ''
      }));
      const ws = XLSX.utils.json_to_sheet(exportArr);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "兌換名單");
      const dateStr = new Date().toISOString().slice(0,10);
      XLSX.writeFile(wb, `${act}_兌換報表_${dateStr}.xlsx`);
    };

    function drawCharts(storeStats, redeemed, unredeemed, expired) {
      if (storeChartInstance) storeChartInstance.destroy();
      if (statusChartInstance) statusChartInstance.destroy();

      const sortedStores = Object.entries(storeStats).sort((a, b) => b[1] - a[1]);
      const storeLabels = sortedStores.map(s => s[0]);
      const storeData = sortedStores.map(s => s[1]);

      const ctxStore = document.getElementById('storeChart').getContext('2d');
      storeChartInstance = new Chart(ctxStore, {
        type: 'bar',
        data: {
          labels: storeLabels.length > 0 ? storeLabels : ['尚無資料'],
          datasets: [{
            label: '核銷數量',
            data: storeData.length > 0 ? storeData : [0],
            backgroundColor: '#F07654',
            borderColor: '#F07654',
            borderWidth: 1,
            borderRadius: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
        }
      });

      const ctxStatus = document.getElementById('statusChart').getContext('2d');
      statusChartInstance = new Chart(ctxStatus, {
        type: 'doughnut',
        data: {
          labels: ['已核銷', '待核銷', '已過期'],
          datasets: [{
            data: (redeemed === 0 && unredeemed === 0 && expired === 0) ? [0, 1, 0] : [redeemed, unredeemed, expired],
            backgroundColor: ['#3FBF8F', '#F07654', '#B7BFCC'],
            borderWidth: 0,
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '70%',
          plugins: {
            legend: { position: 'bottom' },
            tooltip: {
              callbacks: {
                label: function(context) {
                  let label = context.label || '';
                  let value = context.raw || 0;
                  let total = context.chart._metasets[context.datasetIndex].total;
                  let percentage = total > 0 ? Math.round((value / total) * 100) + '%' : '0%';
                  return `${label}: ${value} 張 (${percentage})`;
                }
              }
            }
          }
        }
      });
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        if (adminEmails.includes(user.email)) {
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('sidebar-nav').style.display = 'flex'; 
          document.getElementById('main-app').style.display = 'block';
          
          import("./config.js?v=" + new Date().getTime()).then((module) => {
            const EVENT_CONFIG = module.EVENT_CONFIG;
            
            // 🔥 儲存 POS_CONFIG 給整個網頁使用
            globalPosConfig = module.POS_CONFIG; 
            
            const adminSelect = document.getElementById('act-select');
            adminSelect.innerHTML = '';
            for (const actName in EVENT_CONFIG) {
              const opt = document.createElement('option');
              opt.value = actName;
              opt.text = actName;
              adminSelect.appendChild(opt);
            }
            if (adminSelect.options.length > 0) {
              window.fetchData(); 
            }
          }).catch((error) => {
            console.error("無法載入 config.js", error);
            alert("⚠️ 系統警告：找不到 config.js 檔案！\n\n1. 請確認已將 config.js 上傳至 GitHub。\n2. 請確認大小寫全小寫。\n3. GitHub Pages 可能正在快取，請等 1 分鐘後重整頁面。");
          });

        } else {
          alert(`❌ 權限不足！\n信箱 ${user.email} 非總部管理員。`);
          signOut(auth); 
        }
      } else {
        document.getElementById('sidebar-nav').style.display = 'none';
        document.getElementById('main-app').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
        if (unsubscribeSnapshot) unsubscribeSnapshot();
      }
    });

  </script>
</body>
</html>
