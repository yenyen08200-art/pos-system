<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>總部戰情室 - 數據報表</title>
  <!-- 🔥 引入外部套件 SheetJS，用來一鍵生成 Excel 檔案 -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f7f6; color: #333; padding: 20px; margin: 0; }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1 { margin: 0; color: #2c3e50; font-size: 24px; }
    .controls { display: flex; gap: 10px; }
    .controls select, .controls button { padding: 12px 18px; font-size: 16px; border-radius: 8px; border: 1px solid #ddd; outline: none; font-weight: bold; }
    .controls select { background: #f8f9fa; cursor: pointer; }
    .btn-export { background: #27ae60; color: white; border: none; cursor: pointer; transition: 0.2s; }
    .btn-export:hover { background: #219653; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3); }
    .dashboard { display: flex; gap: 20px; margin-bottom: 25px; flex-wrap: wrap; }
    .stat-card { background: white; padding: 25px 20px; border-radius: 12px; flex: 1; min-width: 200px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; border-bottom: 4px solid #bdc3c7; }
    .stat-card.c-redeemed { border-bottom-color: #27ae60; }
    .stat-card.c-unredeemed { border-bottom-color: #e74c3c; }
    .stat-card h3 { margin: 0 0 10px; color: #7f8c8d; font-size: 15px; letter-spacing: 1px; }
    .stat-card .num { font-size: 38px; font-weight: 900; color: #2c3e50; }
    .table-container { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 800px; }
    th, td { padding: 16px 20px; text-align: left; border-bottom: 1px solid #f1f2f6; }
    th { background: #f8f9fa; color: #2c3e50; font-weight: 800; font-size: 15px; position: sticky; top: 0; }
    tr:hover { background: #fdfdfd; }
    .status-yes { color: #27ae60; font-weight: 900; background: rgba(39, 174, 96, 0.1); padding: 4px 10px; border-radius: 20px; font-size: 13px; }
    .status-no { color: #e74c3c; font-weight: 900; background: rgba(231, 76, 60, 0.1); padding: 4px 10px; border-radius: 20px; font-size: 13px; }
    .time-text { font-size: 13px; color: #95a5a6; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📊 總部戰情室</h1>
      <div class="controls">
        <select id="act-select" onchange="loadData()">
          <option value="父親節社群活動">父親節社群活動</option>
          <option value="中秋節活動">中秋節活動</option>
          <!-- 💡 如果以後有新活動，直接在這裡加 <option> 即可 -->
        </select>
        <button class="btn-export" onclick="exportExcel()">📥 匯出 Excel</button>
      </div>
    </div>

    <div class="dashboard">
      <div class="stat-card">
        <h3>總發行張數</h3>
        <div class="num" id="total-count">0</div>
      </div>
      <div class="stat-card c-redeemed">
        <h3>已核銷數量</h3>
        <div class="num" id="redeemed-count" style="color:#27ae60;">0</div>
      </div>
      <div class="stat-card c-unredeemed">
        <h3>未核銷數量</h3>
        <div class="num" id="unredeemed-count" style="color:#e74c3c;">0</div>
      </div>
    </div>

    <div class="table-container">
      <table id="data-table">
        <thead>
          <tr>
            <th>📱 手機號碼</th>
            <th>👤 顧客姓名</th>
            <th>🔗 社群帳號</th>
            <th>⚡ 狀態</th>
            <th>📌 核銷門市</th>
            <th>🕒 核銷時間</th>
            <th>📅 領券時間</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="7" style="text-align:center; padding: 40px; color: #7f8c8d;">資料載入中... 🚀</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 🌟 你的專屬 Firebase 金鑰
    const firebaseConfig = {
      apiKey: "AIzaSyBINQuYtYZA8RLfwm51AfGLTYj1TX_UcFo",
      authDomain: "texas-chick-event.firebaseapp.com",
      projectId: "texas-chick-event",
      storageBucket: "texas-chick-event.firebasestorage.app",
      messagingSenderId: "281248037440",
      appId: "1:281248037440:web:20c32ba4136ea7c57ffda5",
      measurementId: "G-HZ6334WB3B"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let currentData = [];

    // 抓取資料庫並顯示在網頁上
    window.loadData = async function() {
      const act = document.getElementById('act-select').value;
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 40px; color: #7f8c8d;">資料載入中... 🚀</td></tr>';
      
      try {
        const querySnapshot = await getDocs(collection(db, act));
        currentData = [];
        let redeemedCount = 0;

        querySnapshot.forEach((doc) => {
          const d = doc.data();
          currentData.push(d);
          if (d.status === "已兌換") redeemedCount++;
        });

        // 1. 更新上方儀表板數字
        document.getElementById('total-count').innerText = currentData.length;
        document.getElementById('redeemed-count').innerText = redeemedCount;
        document.getElementById('unredeemed-count').innerText = currentData.length - redeemedCount;

        // 2. 渲染下方表格
        if (currentData.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 40px; color: #e74c3c; font-weight: bold;">此活動目前尚無任何領券紀錄喔！</td></tr>';
          return;
        }

        // 將資料依照領券時間排序 (最新的在最上面)
        currentData.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        tbody.innerHTML = currentData.map(d => `
          <tr>
            <td style="font-family:monospace; font-size:16px; font-weight:bold; color:#2c3e50;">${d.phone || ''}</td>
            <td style="font-weight:bold;">${d.name || ''}</td>
            <td style="color:#3498db;">${d.social_id || '未提供'}</td>
            <td><span class="${d.status === '已兌換' ? 'status-yes' : 'status-no'}">${d.status || '未兌換'}</span></td>
            <td style="font-weight:bold; color:#8e44ad;">${d.store || '-'}</td>
            <td class="time-text">${d.redeemTime || '-'}</td>
            <td class="time-text">${d.timestamp || '-'}</td>
          </tr>
        `).join('');

      } catch (e) {
        console.error(e);
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 40px; color: red;">讀取資料失敗，請重新整理網頁。</td></tr>';
      }
    };

    // 匯出成 Excel 檔案的功能
    window.exportExcel = function() {
      if (currentData.length === 0) return alert('⚠️ 目前沒有資料可以匯出喔！');
      
      const act = document.getElementById('act-select').value;
      
      // 整理要匯出的中文字段
      const exportArr = currentData.map(d => ({
        "手機號碼": d.phone,
        "顧客姓名": d.name,
        "社群帳號": d.social_id || '未提供',
        "兌換狀態": d.status || '未兌換',
        "核銷門市": d.store || '',
        "核銷時間": d.redeemTime || '',
        "領券時間": d.timestamp || ''
      }));

      // 呼叫 SheetJS 套件打包下載
      const ws = XLSX.utils.json_to_sheet(exportArr);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "兌換名單");
      
      const dateStr = new Date().toISOString().slice(0,10);
      XLSX.writeFile(wb, `${act}_兌換報表_${dateStr}.xlsx`);
    };

    // 網頁一打開就自動載入預設活動的資料
    window.onload = loadData;
  </script>
</body>
</html>
