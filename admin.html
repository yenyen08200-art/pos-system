<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>總部戰情室 - 德州小騎士</title>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* 🎨 視覺風格基調：對應設計圖的暖色復古大地色系 */
    :root {
      --bg-cream: #f5f2eb;       /* 整體乳黃色背景 */
      --sidebar-bg: #8c7a5b;     /* 左側深橄欖棕側邊欄 */
      --card-bg: #ffffff;        /* 純白卡片背景 */
      --text-main: #3e382b;      /* 深咖啡色主文字 */
      --accent-orange: #d96b43;   /* 炸雞橘紅點綴色 */
      --accent-yellow: #d9a036;   /* 芥末黃點綴色 */
      --accent-green: #6b8c6e;    /* 柔和植栽綠 */
      --accent-gray: #8c8c8c;     /* 復古灰 */
    }

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-cream); color: var(--text-main); padding: 0; margin: 0; min-height: 100vh; display: flex; }
    
    /* 🔒 密碼鎖畫面 (風格同步) */
    #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-cream); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .login-card { background: var(--card-bg); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(62,56,43,0.08); text-align: center; width: 320px; border: 2px solid #e6dec5; }
    .login-card h2 { margin-top: 0; color: var(--text-main); }
    .login-card input { width: 100%; padding: 14px; font-size: 16px; border: 2px solid #e6dec5; border-radius: 12px; margin-bottom: 15px; text-align: left; outline: none; box-sizing: border-box; background: #faf8f5; }
    .login-card input:focus { border-color: var(--accent-orange); }
    .login-card button { background: var(--sidebar-bg); color: white; border: none; padding: 14px; font-size: 16px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
    .login-card button:hover { opacity: 0.9; }
    .btn-google { background: #fff !important; color: var(--text-main) !important; border: 2px solid #e6dec5 !important; margin-top: 5px; }
    .btn-google:hover { background: #faf8f5 !important; }

    /* 🧭 左側導覽列 (對應設計圖左側區塊) */
    .sidebar { width: 240px; background: var(--sidebar-bg); color: white; padding: 30px 20px; display: flex; flex-direction: column; justify-content: flex-start; box-shadow: 4px 0 20px rgba(0,0,0,0.05); }
    .sidebar-brand h2 { margin: 0 0 5px 0; font-size: 22px; letter-spacing: 1px; color: #fff; }
    .sidebar-brand p { margin: 0; font-size: 13px; opacity: 0.8; }
    .sidebar-menu { margin-top: 40px; display: flex; flex-direction: column; gap: 15px; }
    .sidebar-item { padding: 12px 16px; border-radius: 10px; background: rgba(255,255,255,0.1); font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.2s; }
    .sidebar-item.active, .sidebar-item:hover { background: rgba(255,255,255,0.25); }

    /* 主要內容區 */
    #main-app { flex: 1; padding: 30px; display: none; overflow-y: auto; height: 100vh; box-sizing: border-box; }
    .container { max-width: 1100px; margin: 0 auto; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: var(--card-bg); padding: 20px 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(62,56,43,0.03); border: 1px solid #e6dec5; }
    h1 { margin: 0; color: var(--text-main); font-size: 22px; display: flex; align-items: center; gap: 10px; }
    .live-badge { background: var(--accent-orange); color: white; font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 6px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    .controls { display: flex; gap: 10px; align-items: center; }
    .controls select, .controls button { padding: 10px 16px; font-size: 14px; border-radius: 10px; border: 2px solid #e6dec5; outline: none; font-weight: bold; }
    .controls select { background: #faf8f5; color: var(--text-main); cursor: pointer; }
    
    .btn-expire { background: var(--accent-orange); color: white; border: none; cursor: pointer; transition: 0.2s; }
    .btn-expire:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-export { background: var(--accent-green); color: white; border: none; cursor: pointer; transition: 0.2s; }
    .btn-export:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-logout { background: #d9534f; color: white; border: none; cursor: pointer; transition: 0.2s; }
    .btn-logout:hover { opacity: 0.9; }
    
    /* 📊 數據卡片區 */
    .dashboard { display: flex; gap: 20px; margin-bottom: 25px; flex-wrap: wrap; }
    .stat-card { background: var(--card-bg); padding: 22px; border-radius: 16px; flex: 1; min-width: 140px; box-shadow: 0 4px 15px rgba(62,56,43,0.03); text-align: center; border: 1px solid #e6dec5; position: relative; overflow: hidden; }
    .stat-card::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; }
    .stat-card.c-total::after { background: var(--sidebar-bg); }
    .stat-card.c-redeemed::after { background: var(--accent-green); }
    .stat-card.c-unredeemed::after { background: var(--accent-orange); }
    .stat-card.c-expired::after { background: var(--accent-gray); }
    
    .stat-card h3 { margin: 0 0 8px; color: #8c8270; font-size: 13px; letter-spacing: 1px; }
    .stat-card .num { font-size: 30px; font-weight: 900; color: var(--text-main); }

    /* 📈 圖表區 */
    .charts-wrapper { display: flex; gap: 20px; margin-bottom: 25px; flex-wrap: wrap; }
    .chart-box { background: var(--card-bg); padding: 22px; border-radius: 16px; box-shadow: 0 4px 15px rgba(62,56,43,0.03); flex: 1; min-width: 300px; border: 1px solid #e6dec5; display: flex; flex-direction: column; justify-content: center; }
    .chart-box h3 { margin: 0 0 15px 0; color: var(--text-main); font-size: 15px; font-weight: 800; }

    /* 表格控制與搜尋 */
    .table-toolbar { display: flex; justify-content: space-between; margin-bottom: 15px; align-items: center; background: var(--card-bg); padding: 15px 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(62,56,43,0.03); border: 1px solid #e6dec5; }
    .search-box { padding: 10px 15px; border-radius: 10px; border: 2px solid #e6dec5; font-size: 14px; width: 280px; outline: none; background: #faf8f5; color: var(--text-main); }
    .search-box:focus { border-color: var(--sidebar-bg); }
    
    .table-container { background: var(--card-bg); border-radius: 16px; box-shadow: 0 4px 15px rgba(62,56,43,0.03); overflow-x: auto; height: 45vh; border: 1px solid #e6dec5; }
    table { width: 100%; border-collapse: collapse; min-width: 850px; }
    th, td { padding: 16px 20px; text-align: left; border-bottom: 1px solid #f0eae1; }
    
    th { background: #faf8f5; color: var(--text-main); font-weight: 800; font-size: 14px; position: sticky; top: 0; cursor: pointer; user-select: none; transition: 0.2s; white-space: nowrap; }
    th:hover { background: #f0eae1; }
    th .sort-icon { color: #b5aba0; margin-left: 5px; font-size: 11px; }
    th.active .sort-icon { color: var(--accent-orange); }
    
    tr:hover { background: #fcfbfa; }
    .status-yes { color: var(--accent-green); font-weight: 900; background: rgba(107, 140, 110, 0.12); padding: 4px 10px; border-radius: 20px; font-size: 12px; }
    .status-no { color: var(--accent-orange); font-weight: 900; background: rgba(217, 107, 67, 0.12); padding: 4px 10px; border-radius: 20px; font-size: 12px; }
    .status-expired { color: var(--accent-gray); font-weight: 900; background: rgba(140, 140, 140, 0.12); padding: 4px 10px; border-radius: 20px; font-size: 12px; }
    .time-text { font-size: 13px; color: #8c8270; }

    /* 📱 RWD 手機響應完美修復版 */
    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; height: auto; flex-direction: row; align-items: center; justify-content: space-between; padding: 15px 20px; box-sizing: border-box; }
      .sidebar-brand p { display: none; } /* 手機版隱藏副標題省空間 */
      .sidebar-menu { display: none; }
      #main-app { padding: 10px; height: auto; overflow-x: hidden; box-sizing: border-box; }
      
      .header { flex-direction: column; align-items: stretch; gap: 15px; padding: 15px; }
      .header-title-area { flex-direction: column; align-items: flex-start; gap: 8px; }
      h1 { font-size: 20px; white-space: nowrap; } 
      
      .controls { flex-wrap: wrap; width: 100%; gap: 8px; justify-content: space-between; }
      .controls select { width: 100%; flex-basis: 100%; }
      .controls button { flex: 1; padding: 10px 5px; font-size: 13px; white-space: nowrap; }
      
      .dashboard { gap: 10px; }
      .stat-card { min-width: 45%; padding: 15px 10px; }
      .stat-card .num { font-size: 24px; }
      .charts-wrapper { flex-direction: column; }
      .chart-box { min-width: 100%; }
      .table-toolbar { flex-direction: column; align-items: flex-start; gap: 10px; }
      .search-box { width: 100%; box-sizing: border-box; }
    }
  </style>
</head>
<body>

  <!-- 🔒 密碼鎖畫面 -->
  <div id="login-screen">
    <div class="login-card">
      <h2>🔒 總部戰情室</h2>
      <p style="color:#8c8270; margin-bottom: 20px; font-size: 13px;">德州小騎士授權登入</p>
      
      <input type="email" id="email" placeholder="總部帳號 (Email)">
      <input type="password" id="pwd" placeholder="登入密碼" onkeypress="if(event.key==='Enter') login()">
      <button onclick="login()" id="login-btn">安全登入</button>
      
      <div style="margin: 15px 0; color: #b5aba0; font-size: 12px;">── 或 ──</div>
      
      <button onclick="loginWithGoogle()" id="google-btn" class="btn-google">
        🌐 使用 Google 帳號登入
      </button>
    </div>
  </div>

  <!-- 🧭 左側導覽列 -->
  <div class="sidebar" id="sidebar-nav" style="display: none;">
    <div class="sidebar-brand">
      <h2>德州小騎士</h2>
      <p>後台控制室</p>
    </div>
    <div class="sidebar-menu">
      <div class="sidebar-item active">📊 電子兌換卷儀表板</div>
      <div class="sidebar-item" onclick="alert('分店管理與權限設定功能開發中...')">🏪 門市管理中心</div>
      <div class="sidebar-item" onclick="alert('行銷推播與名單分析功能開發中...')">🎯 行銷資產管理</div>
    </div>
  </div>

  <!-- 主要內容區 -->
  <div id="main-app">
    <div class="container">
      <div class="header">
        <div class="header-title-area">
          <h1>📊 電子兌換卷儀表板 <span class="live-badge">LIVE 監控中</span></h1>
        </div>
        <div class="controls">
          <select id="act-select" onchange="fetchData()"></select>
          <button class="btn-expire" onclick="expireTickets()">🧹 結算過期</button>
          <button class="btn-export" onclick="exportExcel()">📥 匯出 Excel</button>
          <button class="btn-logout" onclick="logout()">登出</button>
        </div>
      </div>

      <div class="dashboard">
        <div class="stat-card c-total">
          <h3>總發行張數</h3>
          <div class="num" id="total-count">0</div>
        </div>
        <div class="stat-card c-redeemed">
          <h3>已核銷</h3>
          <div class="num" id="redeemed-count" style="color:var(--accent-green);">0</div>
        </div>
        <div class="stat-card c-unredeemed">
          <h3>待核銷</h3>
          <div class="num" id="unredeemed-count" style="color:var(--accent-orange);">0</div>
        </div>
        <div class="stat-card c-expired">
          <h3>已過期</h3>
          <div class="num" id="expired-count" style="color:var(--accent-gray);">0</div>
        </div>
      </div>

      <!-- 📈 圖表區 -->
      <div class="charts-wrapper">
        <div class="chart-box" style="flex: 2;">
          <h3>🏆 各門市核銷分佈</h3>
          <canvas id="storeChart" style="max-height: 240px;"></canvas>
        </div>
        <div class="chart-box" style="flex: 1;">
          <h3>⚡ 總體兌換狀態比例</h3>
          <canvas id="statusChart" style="max-height: 240px;"></canvas>
        </div>
      </div>

      <!-- 搜尋與表格區 -->
      <div class="table-toolbar">
        <input type="text" id="search-box" class="search-box" placeholder="🔍 輸入手機號碼或姓名快速搜尋..." onkeyup="renderTable()">
        <span style="color:#8c8270; font-size: 13px; font-weight: bold;" id="result-count"></span>
      </div>

      <div class="table-container">
        <table id="data-table">
          <thead>
            <tr>
              <th onclick="setSort('phone')">📱 手機號碼 <span class="sort-icon" id="sort-phone">▼</span></th>
              <th onclick="setSort('name')">👤 顧客姓名 <span class="sort-icon" id="sort-name">▼</span></th>
              <th onclick="setSort('social_id')">🔗 社群帳號 <span class="sort-icon" id="sort-social_id">▼</span></th>
              <th onclick="setSort('status')">⚡ 狀態 <span class="sort-icon" id="sort-status">▼</span></th>
              <th onclick="setSort('store')">📌 核銷門市 <span class="sort-icon" id="sort-store">▼</span></th>
              <th onclick="setSort('redeemTime')">🕒 核銷時間 <span class="sort-icon" id="sort-redeemTime">▼</span></th>
              <th onclick="setSort('timestamp')" class="active">📅 領券時間 <span class="sort-icon" id="sort-timestamp">▼</span></th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- 資料會塞在這裡 -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    // 🔥 防彈架構：取消最上方的直接 import，改用程式內動態載入
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, getDocs, updateDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBINQuYtYZA8RLfwm51AfGLTYj1TX_UcFo",
      authDomain: "texas-chick-event.firebaseapp.com",
      projectId: "texas-chick-event",
      storageBucket: "texas-chick-event.firebasestorage.app",
      messagingSenderId: "281248037440",
      appId: "1:281248037440:web:20c32ba4136ea7c57ffda5",
      measurementId: "G-HZ6334WB3B"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app); 
    const googleProvider = new GoogleAuthProvider(); 
    
    let allData = []; 
    let sortCol = 'timestamp'; 
    let sortAsc = false; 
    let storeChartInstance = null;
    let statusChartInstance = null;
    let unsubscribeSnapshot = null; 
    const adminEmails = ["yenyen08200@gmail.com", "admin@gmail.com"];

    // 🔥 確保所有按鈕的綁定函數一定會存在，即使設定檔還沒載入也不會壞掉！
    window.login = function() {
      const email = document.getElementById('email').value;
      const pwd = document.getElementById('pwd').value;
      const btn = document.getElementById('login-btn');
      if(!email || !pwd) return alert("⚠️ 請輸入帳號與密碼！");
      btn.innerText = "驗證中...";
      btn.disabled = true;
      signInWithEmailAndPassword(auth, email, pwd)
        .then(() => { btn.innerText = "安全登入"; btn.disabled = false; })
        .catch((error) => { alert("❌ 帳號密碼登入失敗！"); btn.innerText = "安全登入"; btn.disabled = false; });
    };

    window.loginWithGoogle = function() {
      const btn = document.getElementById('google-btn');
      btn.innerText = "驗證中...";
      btn.disabled = true;
      signInWithPopup(auth, googleProvider)
        .then(() => { btn.innerText = "🌐 使用 Google 帳號登入"; btn.disabled = false; })
        .catch((error) => { alert("❌ Google 登入失敗！"); btn.innerText = "🌐 使用 Google 帳號登入"; btn.disabled = false; });
    };

    window.logout = function() {
      signOut(auth).then(() => {
        document.getElementById('email').value = "";
        document.getElementById('pwd').value = "";
      });
    };

    window.fetchData = function() {
      const actSelect = document.getElementById('act-select');
      if (!actSelect || !actSelect.value) return; // 避免設定檔沒讀到時出錯
      const act = actSelect.value;
      const tbody = document.getElementById('table-body');
      
      if (unsubscribeSnapshot) unsubscribeSnapshot();
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 40px; color: #8c8270;">📡 與資料庫即時連線中...</td></tr>';
      
      unsubscribeSnapshot = onSnapshot(collection(db, act), (querySnapshot) => {
        allData = [];
        let redeemedCount = 0;
        let expiredCount = 0; 
        let storeStats = {}; 

        querySnapshot.forEach((doc) => {
          const d = doc.data();
          d.id = doc.id; 
          allData.push(d);
          
          if (d.status === "已兌換") {
            redeemedCount++;
            if (d.store) {
              storeStats[d.store] = (storeStats[d.store] || 0) + 1;
            }
          } else if (d.status === "已過期") {
            expiredCount++; 
          }
        });

        const unredeemedCount = allData.length - redeemedCount - expiredCount; 
        
        document.getElementById('total-count').innerText = allData.length;
        document.getElementById('redeemed-count').innerText = redeemedCount;
        document.getElementById('unredeemed-count').innerText = unredeemedCount;
        document.getElementById('expired-count').innerText = expiredCount; 

        drawCharts(storeStats, redeemedCount, unredeemedCount, expiredCount); 
        window.renderTable(); 
      }, (error) => {
        console.error("即時監聽失敗:", error);
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 40px; color: red;">連線中斷，請確認網路連線。</td></tr>';
      });
    };

    // 🔥 你剛才除錯成功的心血，這段一併保留！
    window.expireTickets = async function() {
      const actSelect = document.getElementById('act-select');
      if (!actSelect || !actSelect.value) return;
      const act = actSelect.value;

      const confirmText = prompt(`⚠️ 警告：此操作不可逆！\n\n您確定要把「${act}」所有【未兌換】的票券強制設為【已過期】嗎？\n\n如果確定，請在下方輸入「結算」兩個字：`);
      if (confirmText !== "結算") {
        alert("操作已取消。");
        return;
      }

      try {
        const btn = document.querySelector('.btn-expire');
        btn.innerText = "處理中...";
        btn.disabled = true;

        const unredeemedDocs = allData.filter(d => !d.status || d.status === "未兌換");
        
        if (unredeemedDocs.length === 0) {
          alert("🎉 目前沒有任何【未兌換】的票券可以結算！");
        } else {
          let updated = 0;
          const updatePromises = [];
          
          unredeemedDocs.forEach((d) => {
            const docRef = doc(db, act, d.id);
            const p = updateDoc(docRef, {
              status: "已過期",
              redeemTime: "活動結束，逾期未換"
            });
            updatePromises.push(p);
            updated++;
          });

          await Promise.all(updatePromises);
          alert(`✅ 結算完成！\n總共將 ${updated} 筆票券設為已過期。`);
        }

        btn.innerText = "🧹 結算過期";
        btn.disabled = false;

      } catch (error) {
        console.error("結算失敗:", error);
        alert("結算失敗，請檢查網路連線或權限設定。");
        document.querySelector('.btn-expire').innerText = "🧹 結算過期";
        document.querySelector('.btn-expire').disabled = false;
      }
    };

    window.setSort = function(col) {
      if (sortCol === col) sortAsc = !sortAsc;
      else { sortCol = col; sortAsc = true; }
      
      document.querySelectorAll('th').forEach(th => th.classList.remove('active'));
      document.querySelectorAll('.sort-icon').forEach(icon => icon.innerText = '▼');
      event.currentTarget.classList.add('active');
      document.getElementById(`sort-${col}`).innerText = sortAsc ? '▲' : '▼';
      window.renderTable();
    };

    window.renderTable = function() {
      const tbody = document.getElementById('table-body');
      const searchTerm = document.getElementById('search-box').value.trim().toLowerCase();

      let filteredData = allData.filter(d => {
        return (d.phone || '').toLowerCase().includes(searchTerm) ||
               (d.name || '').toLowerCase().includes(searchTerm);
      });

      filteredData.sort((a, b) => {
        let valA = a[sortCol] || '';
        let valB = b[sortCol] || '';
        if (valA < valB) return sortAsc ? -1 : 1;
        if (valA > valB) return sortAsc ? 1 : -1;
        return 0;
      });

      document.getElementById('result-count').innerText = `顯示 ${filteredData.length} 筆結果`;

      if (filteredData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 40px; color: #d96b43; font-weight: bold;">找不到符合的資料 🥲</td></tr>';
        return;
      }

      tbody.innerHTML = filteredData.map(d => {
        let statusBadge = `<span class="status-no">${d.status || '未兌換'}</span>`; 
        if (d.status === '已兌換') statusBadge = `<span class="status-yes">已兌換</span>`; 
        if (d.status === '已過期') statusBadge = `<span class="status-expired">已過期</span>`; 

        return `
          <tr>
            <td style="font-family:monospace; font-size:15px; font-weight:bold; color:var(--text-main);">${d.phone || ''}</td>
            <td style="font-weight:bold;">${d.name || ''}</td>
            <td style="color:#d96b43;">${d.social_id || '未提供'}</td>
            <td>${statusBadge}</td>
            <td style="font-weight:bold; color:var(--sidebar-bg);">${d.store || '-'}</td>
            <td class="time-text">${d.redeemTime || '-'}</td>
            <td class="time-text">${d.timestamp || '-'}</td>
          </tr>
        `;
      }).join('');
    };

    window.exportExcel = function() {
      if (allData.length === 0) return alert('⚠️ 目前沒有資料可以匯出喔！');
      const act = document.getElementById('act-select').value;
      const exportArr = allData.map(d => ({
        "手機號碼": d.phone,
        "顧客姓名": d.name,
        "社群帳號": d.social_id || '未提供',
        "兌換狀態": d.status || '未兌換',
        "核銷門市": d.store || '',
        "核銷時間": d.redeemTime || '',
        "領券時間": d.timestamp || ''
      }));
      const ws = XLSX.utils.json_to_sheet(exportArr);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "兌換名單");
      const dateStr = new Date().toISOString().slice(0,10);
      XLSX.writeFile(wb, `${act}_兌換報表_${dateStr}.xlsx`);
    };

    function drawCharts(storeStats, redeemed, unredeemed, expired) {
      if (storeChartInstance) storeChartInstance.destroy();
      if (statusChartInstance) statusChartInstance.destroy();

      const sortedStores = Object.entries(storeStats).sort((a, b) => b[1] - a[1]);
      const storeLabels = sortedStores.map(s => s[0]);
      const storeData = sortedStores.map(s => s[1]);

      const ctxStore = document.getElementById('storeChart').getContext('2d');
      storeChartInstance = new Chart(ctxStore, {
        type: 'bar',
        data: {
          labels: storeLabels.length > 0 ? storeLabels : ['尚無資料'],
          datasets: [{
            label: '核銷數量',
            data: storeData.length > 0 ? storeData : [0],
            backgroundColor: '#8c7a5b',
            borderColor: '#6e5f44',
            borderWidth: 1,
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
        }
      });

      const ctxStatus = document.getElementById('statusChart').getContext('2d');
      statusChartInstance = new Chart(ctxStatus, {
        type: 'doughnut',
        data: {
          labels: ['已核銷', '待核銷', '已過期'],
          datasets: [{
            data: (redeemed === 0 && unredeemed === 0 && expired === 0) ? [0, 1, 0] : [redeemed, unredeemed, expired],
            backgroundColor: ['#6b8c6e', '#d96b43', '#8c8c8c'],
            borderWidth: 0,
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '70%',
          plugins: {
            legend: { position: 'bottom' },
            tooltip: {
              callbacks: {
                label: function(context) {
                  let label = context.label || '';
                  let value = context.raw || 0;
                  let total = context.chart._metasets[context.datasetIndex].total;
                  let percentage = total > 0 ? Math.round((value / total) * 100) + '%' : '0%';
                  return `${label}: ${value} 張 (${percentage})`;
                }
              }
            }
          }
        }
      });
    }

    // 🔥 身份驗證與動態載入 config.js (保證不會卡死 UI)
    onAuthStateChanged(auth, (user) => {
      if (user) {
        if (adminEmails.includes(user.email)) {
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('sidebar-nav').style.display = 'flex'; 
          document.getElementById('main-app').style.display = 'block';
          
          // 登入成功後，安全載入 config.js
          import("./config.js?v=" + new Date().getTime()).then((module) => {
            const EVENT_CONFIG = module.EVENT_CONFIG;
            const adminSelect = document.getElementById('act-select');
            adminSelect.innerHTML = '';
            for (const actName in EVENT_CONFIG) {
              const opt = document.createElement('option');
              opt.value = actName;
              opt.text = actName;
              adminSelect.appendChild(opt);
            }
            if (adminSelect.options.length > 0) {
              window.fetchData(); 
            }
          }).catch((error) => {
            console.error("無法載入 config.js", error);
            alert("⚠️ 系統警告：找不到 config.js 檔案！\n\n1. 請確認已將 config.js 上傳至 GitHub。\n2. 請確認大小寫全小寫。\n3. GitHub Pages 可能正在快取，請等 1 分鐘後重整頁面。");
          });

        } else {
          alert(`❌ 權限不足！\n信箱 ${user.email} 非總部管理員。`);
          signOut(auth); 
        }
      } else {
        document.getElementById('sidebar-nav').style.display = 'none';
        document.getElementById('main-app').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
        if (unsubscribeSnapshot) unsubscribeSnapshot();
      }
    });

  </script>
</body>
</html>
